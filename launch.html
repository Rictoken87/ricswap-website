<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RicSwap Launch Pad</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
    <style>
        :root {
            --obsidian: #080808;
            --card: #121212;
            --gold: #ffd700;
            --magma: linear-gradient(135deg, #ff4d00, #ff8c00);
        }
        body { background: var(--obsidian); color: white; font-family: system-ui; margin:0; padding:0; }
        .nav { padding: 20px 40px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid rgba(255,215,0,0.1); }
        .logo { font-size:28px; font-weight:bold; color:var(--gold); }
        .card { background:var(--card); border-radius:20px; padding:40px; margin:30px auto; max-width:800px; border:1px solid #333; }
        input, select { width:100%; padding:14px; margin:12px 0; background:#1a1a1a; border:1px solid #444; border-radius:12px; color:white; }
        button { background:var(--magma); color:white; border:none; padding:18px; border-radius:12px; font-weight:bold; cursor:pointer; width:100%; margin-top:20px; font-size:1.1rem; }
        .info { font-size:0.9rem; opacity:0.8; margin:15px 0; }
    </style>
</head>
<body>
    <div class="nav">
        <div class="logo">RicSwap Launch Pad</div>
        <button onclick="connectWallet()" id="connectBtn">Connect Wallet</button>
    </div>

    <div class="card">
        <h2>🚀 Create Your Token</h2>
        <p class="info">Pay <strong>100 $RIC</strong> → 70% Burned • 30% to Development</p>

        <label>Token Name</label>
        <input type="text" id="name" placeholder="e.g. Golden Doge">

        <label>Token Symbol</label>
        <input type="text" id="symbol" placeholder="e.g. GDOGE">

        <label>Total Supply (max 1 Billion recommended)</label>
        <input type="number" id="supply" value="1000000000">

        <label>Initial Liquidity (% of supply)</label>
        <input type="number" id="liq" value="60">

        <button onclick="launchToken()">Pay 100 RIC & Launch Token</button>
    </div>

    <script>
        const RIC_ADDRESS = "0x12C94d3A30daa09f81Ea6c037004E6e99A4A3dfc";
        const FACTORY_ADDRESS = "YOUR_FACTORY_ADDRESS_HERE"; // Will be filled after deployment
        const MASTER_TREASURY = "0x5E5aE526D45d69991039901a29148029a4889102";
        const DEAD = "0x000000000000000000000000000000000000dEaD";

        let signer, userAddress;

        async function connectWallet() {
            if (!window.ethereum) return alert("Please install MetaMask or Rabby");
            const provider = new ethers.BrowserProvider(window.ethereum);
            signer = await provider.getSigner();
            userAddress = await signer.getAddress();
            document.getElementById("connectBtn").textContent = userAddress.slice(0,6) + "..." + userAddress.slice(-4);
        }

        async function launchToken() {
            if (!signer) return alert("Please connect wallet first");

            const name = document.getElementById("name").value.trim();
            const symbol = document.getElementById("symbol").value.trim();
            const supply = document.getElementById("supply").value;
            const liqPercent = document.getElementById("liq").value;

            if (!name || !symbol) return alert("Name and Symbol required");

            try {
                const ric = new ethers.Contract(RIC_ADDRESS, [
                    "function transfer(address to, uint256 amount) returns (bool)",
                    "function balanceOf(address) view returns (uint256)"
                ], signer);

                const fee = ethers.parseEther("100");

                // Check balance
                const balance = await ric.balanceOf(userAddress);
                if (balance < fee) return alert("Not enough $RIC (need 100 RIC)");

                // Step 1: Pay 100 RIC
                alert("Sending 100 RIC...\n70% will be burned, 30% to development.");
                const tx = await ric.transfer(FACTORY_ADDRESS, fee); // Factory will handle split
                await tx.wait();

                alert(`✅ Payment successful!\nToken creation starting...\n\nName: ${name}\nSymbol: ${symbol}`);
                // TODO: Call Factory after contract is deployed

            } catch (e) {
                console.error(e);
                alert("Transaction failed: " + (e.reason || e.message));
            }
        }
    </script>
</body>
</html>
