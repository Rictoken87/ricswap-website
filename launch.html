<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RicSwap Launch Pad</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
    <style>
        :root { --obsidian: #080808; --card: #121212; --gold: #ffd700; --magma: linear-gradient(135deg, #ff4d00, #ff8c00); }
        body { background: var(--obsidian); color: white; font-family: system-ui; margin:0; padding:0; }
        .nav { padding: 20px 40px; display:flex; align-items:center; border-bottom:1px solid rgba(255,215,0,0.1); }
        .logo { font-size:28px; font-weight:bold; color:var(--gold); }
        .hero { text-align:center; padding:100px 20px; background:radial-gradient(#1a0f00, var(--obsidian)); }
        .card { background:var(--card); border-radius:20px; padding:35px; margin:25px auto; max-width:900px; border:1px solid #333; }
        input, select, textarea { width:100%; padding:14px; margin:10px 0; background:#1a1a1a; border:1px solid #444; border-radius:12px; color:white; }
        button { background:var(--magma); color:white; border:none; padding:16px; border-radius:12px; font-weight:bold; cursor:pointer; width:100%; margin-top:15px; }
    </style>
</head>
<body>
    <div class="nav">
        <div class="logo">RicSwap</div>
        <div style="margin-left:auto;">
            <a href="index.html" style="color:white; margin-right:20px;">Home</a>
            <a href="reward.html" style="color:white;">Rewards</a>
        </div>
    </div>

    <div class="hero">
        <h1>RicSwap Launch Pad</h1>
        <p style="font-size:1.4rem;">Create Your Token • Fair Launch • Powered by $RIC</p>
    </div>

    <div class="card">
        <h2>Token Creation Form</h2>
        
        <label>Token Name</label>
        <input type="text" id="tokenName" placeholder="e.g. My Awesome Token">

        <label>Token Symbol</label>
        <input type="text" id="tokenSymbol" placeholder="e.g. MAT">

        <label>Total Supply</label>
        <input type="number" id="totalSupply" placeholder="1000000000" value="1000000000">

        <label>Initial Liquidity (%)</label>
        <input type="number" id="liquidityPercent" placeholder="50" value="50">

        <label>Launch Type</label>
        <select id="launchType">
            <option value="fair">Fair Launch (Recommended)</option>
            <option value="stealth">Stealth Launch</option>
        </select>

        <button onclick="createToken()">🚀 Create & Launch Token</button>
        <p style="margin-top:15px; font-size:0.9rem; opacity:0.8;">
            Fee: 21,000 $RIC (paid to RicSwap Treasury)
        </p>
    </div>

    <script>
        async function createToken() {
            const name = document.getElementById('tokenName').value;
            const symbol = document.getElementById('tokenSymbol').value;
            const supply = document.getElementById('totalSupply').value;
            const liqPercent = document.getElementById('liquidityPercent').value;

            if (!name || !symbol) return alert("Please fill token name and symbol");

            alert(`✅ Token Creation Started!\n\nName: ${name}\nSymbol: ${symbol}\nSupply: ${supply}\nLiquidity: ${liqPercent}%\n\nFee: 21,000 $RIC\n\n(Contract deployment simulation - ready for real backend)`);
        }
    </script>
</body>
</html>
