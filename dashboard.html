<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RicSwap | Transparency Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    
    <style>
        :root {
            --obsidian: #0a0a0a;
            --card: #121212;
            --gold: #ffd700;
            --accent: #ff4d00;
            --magma: linear-gradient(135deg, #ff4d00, #ff8c00);
        }
        
        * { box-sizing: border-box; }
        body {
            background: var(--obsidian);
            color: white;
            font-family: 'Inter', system-ui, sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        .nav {
            padding: 18px 40px;
            display: flex;
            align-items: center;
            background: rgba(10,10,10,0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255,215,0,0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .logo {
            font-size: 26px;
            font-weight: 900;
            color: var(--gold);
            letter-spacing: -1px;
            text-decoration: none;
        }
        .nav-links a {
            color: #aaa;
            text-decoration: none;
            margin-left: 32px;
            font-weight: 500;
            transition: 0.3s;
        }
        .nav-links a:hover, .nav-links a.active { color: var(--gold); }

        .connect-btn {
            margin-left: auto;
            background: transparent;
            color: white;
            border: 2px solid var(--gold);
            padding: 8px 20px;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .connect-btn:hover {
            background: var(--gold);
            color: black;
        }

        .hero {
            padding: 100px 20px 80px;
            text-align: center;
            background: radial-gradient(circle at center, #1f0f00 0%, var(--obsidian) 70%);
        }
        .hero h1 {
            font-size: 3.8rem;
            margin: 0 0 12px 0;
            background: linear-gradient(90deg, #ffd700, #ff8c00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero p { color: #aaa; font-size: 1.25rem; }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 28px;
            padding: 40px;
            max-width: 1480px;
            margin: 0 auto;
        }
        .stat-card {
            background: var(--card);
            border-radius: 24px;
            padding: 40px 30px;
            border: 1px solid #222;
            text-align: center;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }
        .stat-card:hover {
            transform: translateY(-12px);
            border-color: var(--gold);
            box-shadow: 0 20px 40px rgba(255, 215, 0, 0.08);
        }
        .stat-number {
            font-size: 3.4rem;
            font-weight: 900;
            color: var(--gold);
            margin: 16px 0 8px;
        }
        .stat-label {
            color: #888;
            font-size: 1.05rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        .burn-card {
            background: linear-gradient(135deg, #2a0000, #0f0000);
            border: 2px solid #ff5555;
        }
        .burn-card .stat-number { color: #ff7777; }

        .tx-link {
            color: #ffaaaa;
            text-decoration: none;
            font-size: 0.95rem;
            margin-top: 16px;
            display: inline-block;
        }
        .tx-link:hover { color: #ffffff; }

        .update-panel {
            display: none;
            background: #0f0f0f;
            border: 2px solid var(--gold);
            border-radius: 24px;
            padding: 40px;
            margin: 40px auto;
            max-width: 820px;
        }
        input {
            background: #1a1a1a;
            border: 1px solid #444;
            color: white;
            padding: 16px;
            border-radius: 12px;
            width: 100%;
            margin: 12px 0;
            font-size: 1.1rem;
        }
        button {
            background: var(--magma);
            color: black;
            border: none;
            padding: 18px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <nav class="nav">
        <a href="index.html" class="logo">RicSwap</a>
        <div class="nav-links">
            <a href="dashboard.html" class="active">Dashboard</a>
            <a href="swap.html">Swap</a>
            <a href="pools.html">Pools</a>
            <a href="liquidity.html">Add Liquidity</a>
            <a href="reward.html">Store</a>
            <a href="launch.html">Fair Launch</a>
        </div>
        <button id="connectBtn" class="connect-btn">Connect Wallet</button>
    </nav>

    <div class="hero">
        <h1>Permanent Transparency</h1>
        <p>Real-time Burn & Lock Statistics • Fully Verifiable on Shibarium</p>
    </div>

    <div class="dashboard-grid" id="dashboardGrid"></div>

    <!-- Master Update Panel -->
    <div class="update-panel" id="updatePanel">
        <h2 style="color:var(--gold); text-align:center;">🔥 Master Control Panel</h2>
        <label>RIC Tokens Burned So Far</label>
        <input type="number" id="ricBurnInput" value="4000000">
        <label>LP Pairs Permanently Locked</label>
        <input type="number" id="lpBurnInput" value="4">
        <label>RIC Tokens Locked in LPs</label>
        <input type="number" id="ricLockedInput" value="4300000">
        <button onclick="updateBurnStats()">Update Global Dashboard</button>
    </div>

    <script>
        const MASTER_OWNER = "0x5e5ae526d45d69991039901a29148029a4889102".toLowerCase();
        let userAddress = "";

        const firebaseConfig = { /* Your Firebase config */ };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        async function connectWallet() {
            if (!window.ethereum) return alert("Please install MetaMask or Rabby");
            const provider = new ethers.BrowserProvider(window.ethereum);
            const accounts = await provider.send("eth_requestAccounts", []);
            userAddress = accounts[0].toLowerCase();
            document.getElementById("connectBtn").textContent = userAddress.slice(0,6) + "..." + userAddress.slice(-4);
            
            if (userAddress === MASTER_OWNER) {
                document.getElementById("updatePanel").style.display = "block";
            }
        }

        function initDashboard() {
            const grid = document.getElementById('dashboardGrid');
            grid.innerHTML = `
                <div class="stat-card burn-card">
                    <div class="stat-number" id="ricBurned">4,000,000</div>
                    <div class="stat-label">RIC Burned So Far 🔥</div>
                    <a href="https://shibariumscan.io/tx/0x2d8b95cc831e5ef88275533c5de8578ce0940f748dab62c26eb966f076adf3d9" target="_blank" class="tx-link">Verify Transaction →</a>
                </div>

                <div class="stat-card burn-card">
                    <div class="stat-number" id="lpBurned">4</div>
                    <div class="stat-label">LP Pairs Permanently Locked</div>
                </div>

                <div class="stat-card burn-card">
                    <div class="stat-number" id="ricLocked">4,300,000</div>
                    <div class="stat-label">RIC Locked in Liquidity Pools</div>
                </div>

                <div class="stat-card">
                    <div class="stat-number" id="circulation">16,700,000</div>
                    <div class="stat-label">Current RIC Circulation</div>
                </div>
            `;

            db.ref('stats').on('value', (snap) => {
                const s = snap.val() || {};
                const burned = s.ricBurn || 4000000;
                document.getElementById('ricBurned').textContent = burned.toLocaleString();
                document.getElementById('lpBurned').textContent = (s.lpBurn || 4).toLocaleString();
                document.getElementById('ricLocked').textContent = (s.ricLocked || 4300000).toLocaleString();
                document.getElementById('circulation').textContent = (21000000 - burned).toLocaleString();
            });
        }

        function updateBurnStats() {
            db.ref('stats').update({
                ricBurn: parseInt(document.getElementById('ricBurnInput').value) || 4000000,
                lpBurn: parseInt(document.getElementById('lpBurnInput').value) || 4,
                ricLocked: parseInt(document.getElementById('ricLockedInput').value) || 4300000
            }).then(() => alert("✅ Dashboard updated successfully for everyone!"));
        }

        window.onload = initDashboard;
    </script>
</body>
</html>
