<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RicSwap | Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <style>
        :root { --obsidian: #080808; --card: #121212; --gold: #ffd700; --magma: linear-gradient(135deg, #ff4d00, #ff8c00); }
        body { background: var(--obsidian); color: white; font-family: system-ui, sans-serif; margin:0; padding:0; }
        
        .nav { padding: 15px 40px; display: flex; align-items: center; border-bottom: 1px solid rgba(255,215,0,0.1); background: rgba(8,8,8,0.95); position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 24px; font-weight: 800; color: var(--gold); text-decoration: none; }
        .nav-links { display: flex; gap: 25px; margin-left: 40px; }
        .nav-links a { color: #888; text-decoration: none; font-weight: 500; }
        .nav-links a:hover, .nav-links a.active { color: var(--gold); }

        .dropdown { position: relative; display: inline-block; }
        .dropbtn { color: #888; text-decoration: none; font-weight: 500; cursor: pointer; }
        .dropdown-content { display: none; position: absolute; background-color: #111; min-width: 180px; box-shadow: 0 8px 16px rgba(0,0,0,0.6); border-radius: 8px; z-index: 101; margin-top: 8px; }
        .dropdown-content a { color: white; padding: 12px 16px; text-decoration: none; display: block; }
        .dropdown-content a:hover { background-color: #222; color: var(--gold); }
        .dropdown:hover .dropdown-content { display: block; }
        .dropdown:hover .dropbtn { color: var(--gold); }

        .connect-btn { background: #1a1a1a; color: white; border: 1.5px solid #333; padding: 6px 16px; border-radius: 9999px; font-size: 13px; font-weight: 600; cursor: pointer; margin-left: auto; }

        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; padding: 40px; max-width: 1400px; margin: 0 auto; }
        .stat-card { background: var(--card); border-radius: 20px; padding: 35px; border: 1px solid #333; text-align: center; transition: 0.3s; }
        .stat-card:hover { transform: translateY(-8px); border-color: var(--gold); }
        .stat-number { font-size: 3rem; font-weight: 800; color: var(--gold); margin: 15px 0; }
        .stat-label { color: #aaa; font-size: 1.1rem; }
        .burn-card { background: linear-gradient(135deg, #4a0000, #220000); border: 1px solid #ff6666; }

        .update-panel { background: #1a1a1a; border: 2px solid var(--gold); border-radius: 20px; padding: 30px; margin: 40px auto; max-width: 800px; display: none; }
        input { background: #222; border: 1px solid #444; color: white; padding: 12px; border-radius: 8px; width: 100%; margin: 8px 0; font-size: 1.1rem; }
        button { background: var(--magma); color: white; border: none; padding: 14px 24px; border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 10px; width: 100%; }
    </style>
</head>
<body>
    <div class="nav">
        <div class="logo">RicSwap</div>
        <div class="nav-links">
            <div class="dropdown">
                <a href="index.html" class="dropbtn">Home ▾</a>
                <div class="dropdown-content">
                    <a href="dashboard.html" class="active">Dashboard</a>
                </div>
            </div>
            <a href="swap.html">Swap</a>
            <a href="pools.html">Pools</a>
            <a href="liquidity.html">Add Liquidity</a>
            <a href="reward.html">Rewards</a>
            <a href="launch.html">Fair Launch</a>
        </div>
        <button id="connectBtn" class="connect-btn" onclick="connectWallet()">Connect Wallet</button>
    </div>

    <div style="padding:100px 20px; text-align:center; background: radial-gradient(circle at center, #1a0f00 0%, var(--obsidian) 70%);">
        <h1 style="font-size: 3.2rem; margin:0;">RicSwap Dashboard</h1>
        <p style="color:#888; font-size: 1.3rem;">Real-time Stats & Burn Tracking</p>
    </div>

    <div class="dashboard-grid" id="dashboardGrid"></div>

    <!-- Master Only Update Panel -->
    <div class="update-panel" id="updatePanel">
        <h2 style="color:var(--gold); margin-top:0;">🔥 Update Burn & Lock Stats (Master Only)</h2>
        <input type="number" id="ricBurnInput" placeholder="Total RIC Burned (e.g. 4500000)" value="4000000">
        <input type="number" id="lpBurnInput" placeholder="Total LP Tokens Burned / Locked (e.g. 1250000)">
        <button onclick="updateBurnStats()">Save & Update Dashboard</button>
    </div>

    <script>
        const MASTER_OWNER = "0x5e5ae526d45d69991039901a29148029a4889102".toLowerCase();
        let userAddress = "";

        const firebaseConfig = { /* Your config here */ };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        async function connectWallet() {
            if (!window.ethereum) return alert("Please install MetaMask or Rabby");
            const provider = new ethers.BrowserProvider(window.ethereum);
            const accounts = await provider.send("eth_requestAccounts", []);
            userAddress = accounts[0].toLowerCase();
            document.getElementById("connectBtn").textContent = userAddress.slice(0,6) + "..." + userAddress.slice(-4);
            
            if (userAddress === MASTER_OWNER) {
                document.getElementById("updatePanel").style.display = "block";
            }
        }

        function loadDashboard() {
            const grid = document.getElementById('dashboardGrid');
            grid.innerHTML = `
                <div class="stat-card">
                    <div class="stat-number" id="totalProducts">0</div>
                    <div class="stat-label">Total Products</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="totalOrders">0</div>
                    <div class="stat-label">Total Orders</div>
                </div>
                <div class="stat-card burn-card">
                    <div class="stat-number" id="totalBurned">4,000,000</div>
                    <div class="stat-label">RIC Burned 🔥</div>
                    <a href="https://shibariumscan.io/tx/0x2d8b95cc831e5ef88275533c5de8578ce0940f748dab62c26eb966f076adf3d9" target="_blank" style="color:#ff8888; font-size:0.9rem; margin-top:10px; display:block;">View Tx →</a>
                </div>
                <div class="stat-card burn-card">
                    <div class="stat-number" id="totalLPBurned">0</div>
                    <div class="stat-label">LP Tokens Burned / Locked</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="totalStaff">0</div>
                    <div class="stat-label">Active Staff</div>
                </div>
            `;

            // Real-time listeners from Firebase
            db.ref('stats/totalBurnedRIC').on('value', (snap) => {
                document.getElementById('totalBurned').textContent = (snap.val() || 4000000).toLocaleString();
            });
            db.ref('stats/totalLPBurned').on('value', (snap) => {
                document.getElementById('totalLPBurned').textContent = (snap.val() || 0).toLocaleString();
            });
            // Add other counters (products, orders, staff) similarly...
        }

        function updateBurnStats() {
            const ric = parseInt(document.getElementById('ricBurnInput').value) || 4000000;
            const lp = parseInt(document.getElementById('lpBurnInput').value) || 0;

            db.ref('stats').update({
                totalBurnedRIC: ric,
                totalLPBurned: lp,
                lastUpdated: Date.now()
            });

            alert("✅ Burn & LP Lock stats updated successfully for everyone!");
        }

        window.onload = loadDashboard;
    </script>
</body>
</html>
