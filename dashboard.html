<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RicSwap | Transparency Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    
    <style>
        :root {
            --obsidian: #0a0a0a;
            --card: #111111;
            --gold: #ffd700;
        }
        
        * { box-sizing: border-box; }
        body {
            background: var(--obsidian);
            color: #e0e0e0;
            font-family: 'Inter', system-ui, sans-serif;
            margin: 0; padding: 0;
        }

        .nav {
            padding: 18px 5%;
            display: flex;
            align-items: center;
            background: rgba(10,10,10,0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,215,0,0.08);
            position: sticky; top: 0; z-index: 1000;
        }
        .logo {
            font-size: 28px;
            font-weight: 900;
            background: linear-gradient(90deg, #ffd700, #ffaa00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1.5px;
            text-decoration: none;
        }
        .nav-links a {
            color: #aaa;
            text-decoration: none;
            margin-left: 38px;
            font-weight: 500;
            transition: 0.3s;
        }
        .nav-links a:hover, .nav-links a.active { color: var(--gold); }

        .connect-btn {
            margin-left: auto;
            background: transparent;
            color: var(--gold);
            border: 2px solid var(--gold);
            padding: 9px 24px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .connect-btn:hover {
            background: var(--gold);
            color: black;
        }

        .hero {
            padding: 130px 20px 90px;
            text-align: center;
            background: radial-gradient(circle at 50% 20%, rgba(255,77,0,0.12) 0%, transparent 70%);
        }
        .hero h1 {
            font-size: 4.1rem;
            font-weight: 900;
            margin: 0 0 16px 0;
            background: linear-gradient(90deg, #ffd700, #ffaa00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero p { color: #888; font-size: 1.35rem; max-width: 680px; margin: 0 auto; }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
            gap: 32px;
            padding: 20px 5% 100px;
            max-width: 1480px;
            margin: 0 auto;
        }
        .stat-card {
            background: var(--card);
            border-radius: 28px;
            padding: 48px 36px;
            border: 1px solid rgba(255,215,0,0.1);
            text-align: center;
            transition: all 0.5s;
        }
        .stat-card:hover {
            transform: translateY(-16px);
            border-color: var(--gold);
        }
        .stat-number {
            font-size: 3.8rem;
            font-weight: 900;
            color: var(--gold);
            margin: 16px 0 10px;
        }
        .stat-label {
            color: #999;
            font-size: 1.05rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .burn-card .stat-number { color: #ff6666; }

        .tx-link {
            color: #ff9999;
            text-decoration: none;
            font-size: 0.95rem;
            margin-top: 18px;
            display: inline-block;
        }
        .tx-link:hover { color: white; }
    </style>
</head>
<body>
    <nav class="nav">
        <a href="index.html" class="logo">RicSwap</a>
        <div class="nav-links">
            <a href="dashboard.html" class="active">Dashboard</a>
            <a href="swap.html">Swap</a>
            <a href="pools.html">Pools</a>
            <a href="liquidity.html">Add Liquidity</a>
            <a href="reward.html">Store</a>
            <a href="launch.html">Fair Launch</a>
        </div>
        <button id="connectBtn" class="connect-btn" onclick="connectWallet()">Connect Wallet</button>
    </nav>

    <div class="hero">
        <h1>Permanent Transparency</h1>
        <p>Real-time burn & lock statistics • Fully verifiable on Shibariumscan</p>
    </div>

    <div class="dashboard-grid" id="dashboardGrid"></div>

    <!-- Master Update Panel -->
    <div class="update-panel" id="updatePanel" style="display:none; background:#0f0f0f; border:2px solid var(--gold); border-radius:28px; padding:50px; margin:60px auto; max-width:820px;">
        <h2 style="color:var(--gold); text-align:center;">🔥 Master Control</h2>
        <label>RIC Tokens Burned So Far</label>
        <input type="number" id="ricBurnInput" value="4000000">
        <label>LP Pairs Permanently Locked</label>
        <input type="number" id="lpBurnInput" value="4">
        <label>RIC Tokens Locked in LPs</label>
        <input type="number" id="ricLockedInput" value="4300000">
        <button onclick="updateBurnStats()" style="margin-top:30px; background:var(--gold); color:black; padding:18px; width:100%; border:none; border-radius:12px; font-weight:700;">Update Global Dashboard</button>
    </div>

    <script>
        const MASTER_OWNER = "0x5e5ae526d45d69991039901a29148029a4889102".toLowerCase();
        let userAddress = "";

        const firebaseConfig = {
            apiKey: "AIzaSyDoBXIlLCd0AXKU0pPtueTOnxUENqF1lmU",
            authDomain: "ricswap-bdc61.firebaseapp.com",
            databaseURL: "https://ricswap-bdc61-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "ricswap-bdc61",
            storageBucket: "ricswap-bdc61.firebasestorage.app",
            messagingSenderId: "923007784555",
            appId: "1:923007784555:web:115c1a2d2871555918832e"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        async function connectWallet() {
            if (!window.ethereum) return alert("Please install MetaMask or Rabby");
            const provider = new ethers.BrowserProvider(window.ethereum);
            const accounts = await provider.send("eth_requestAccounts", []);
            userAddress = accounts[0].toLowerCase();
            document.getElementById("connectBtn").textContent = userAddress.slice(0,6) + "..." + userAddress.slice(-4);
            
            if (userAddress === MASTER_OWNER) {
                document.getElementById("updatePanel").style.display = "block";
            }
        }

        function initDashboard() {
            const grid = document.getElementById('dashboardGrid');
            grid.innerHTML = `
                <div class="stat-card burn-card">
                    <div class="stat-number" id="ricBurned">4,000,000</div>
                    <div class="stat-label">RIC Tokens Burned So Far 🔥</div>
                    <a href="https://shibariumscan.io/tx/0x2d8b95cc831e5ef88275533c5de8578ce0940f748dab62c26eb966f076adf3d9" target="_blank" class="tx-link">Verify Burn Tx →</a>
                </div>

                <div class="stat-card burn-card">
                    <div class="stat-number" id="lpBurned">4</div>
                    <div class="stat-label">LP Pairs Permanently Locked</div>
                </div>

                <div class="stat-card burn-card">
                    <div class="stat-number" id="ricLocked">4,300,000</div>
                    <div class="stat-label">RIC Tokens Locked in LPs</div>
                </div>
            `;

            // Real-time sync from Firebase (this makes it worldwide)
            db.ref('stats').on('value', (snap) => {
                const s = snap.val() || {};
                document.getElementById('ricBurned').textContent = (s.ricBurn || 4000000).toLocaleString();
                document.getElementById('lpBurned').textContent = (s.lpBurn || 4).toLocaleString();
                document.getElementById('ricLocked').textContent = (s.ricLocked || 4300000).toLocaleString();
            });
        }

        function updateBurnStats() {
            db.ref('stats').update({
                ricBurn: parseInt(document.getElementById('ricBurnInput').value) || 4000000,
                lpBurn: parseInt(document.getElementById('lpBurnInput').value) || 4,
                ricLocked: parseInt(document.getElementById('ricLockedInput').value) || 4300000
            }).then(() => alert("✅ Updated for the whole world!"));
        }

        window.onload = initDashboard;
    </script>
</body>
</html>
