<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RicSwap | Transparency Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    
    <style>
        :root { --obsidian: #080808; --card: #121212; --gold: #ffd700; --magma: linear-gradient(135deg, #ff4d00, #ff8c00); }
        body { background: var(--obsidian); color: white; font-family: system-ui, sans-serif; margin:0; padding:0; }
        
        .nav { padding: 15px 40px; display: flex; align-items: center; border-bottom: 1px solid rgba(255,215,0,0.1); background: rgba(8,8,8,0.95); position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 24px; font-weight: 800; color: var(--gold); text-decoration: none; }
        .nav-links { display: flex; gap: 25px; margin-left: 40px; }
        .nav-links a { color: #888; text-decoration: none; font-weight: 500; }
        .nav-links a:hover, .nav-links a.active { color: var(--gold); }
        .connect-btn { background: #1a1a1a; color: white; border: 1.5px solid #333; padding: 6px 16px; border-radius: 9999px; font-size: 13px; font-weight: 600; cursor: pointer; margin-left: auto; }

        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 25px; padding: 40px; max-width: 1400px; margin: 0 auto; }
        .stat-card { background: var(--card); border-radius: 20px; padding: 35px; border: 1px solid #333; text-align: center; transition: 0.3s; }
        .stat-card:hover { transform: translateY(-8px); border-color: var(--gold); }
        .stat-number { font-size: 3rem; font-weight: 900; color: var(--gold); margin: 12px 0; }
        .stat-label { color: #aaa; font-size: 1rem; text-transform: uppercase; letter-spacing: 1px; }
        
        .burn-card { background: linear-gradient(135deg, #2a0000, #110000); border: 2px solid #ff5555; }
        .burn-card .stat-number { color: #ff7777; }
        .tx-link { color: #ffaaaa; text-decoration: none; font-size: 0.9rem; margin-top: 12px; display: inline-block; }
        .tx-link:hover { color: white; }
    </style>
</head>
<body>
    <nav class="nav">
        <a href="index.html" class="logo">RicSwap</a>
        <div class="nav-links">
            <a href="dashboard.html" class="active">Dashboard</a>
            <a href="swap.html">Swap</a>
            <a href="pools.html">Pools</a>
            <a href="liquidity.html">Add Liquidity</a>
            <a href="reward.html">Store</a>
            <a href="launch.html">Fair Launch</a>
        </div>
        <button id="connectBtn" class="connect-btn" onclick="connectWallet()">Connect Wallet</button>
    </nav>

    <div style="padding:80px 20px; text-align:center; background: radial-gradient(circle at center, #1a0f00 0%, var(--obsidian) 70%);">
        <h1 style="font-size: 3.5rem; margin:0;">Permanent Burn & Lock Transparency</h1>
        <p style="color:#888; font-size: 1.2rem;">Fully verifiable on Shibariumscan</p>
    </div>

    <div class="dashboard-grid" id="dashboardGrid"></div>

    <!-- Master Update Panel -->
    <div class="update-panel" id="updatePanel" style="display:none; background:#111; border:2px solid var(--gold); border-radius:20px; padding:40px; margin:40px auto; max-width:800px;">
        <h2 style="color:var(--gold);">🔥 Master Control - Update Stats</h2>
        <label>RIC Tokens Burned So Far</label>
        <input type="number" id="ricBurnInput" value="4000000">
        <label>LP Pairs Permanently Locked</label>
        <input type="number" id="lpBurnInput" value="4">
        <label>RIC Tokens Locked in LPs</label>
        <input type="number" id="ricLockedInput" value="4300000">
        <button onclick="updateBurnStats()" style="background:var(--magma); color:black; padding:16px; width:100%; border:none; border-radius:12px; font-weight:bold; margin-top:20px;">Save & Update for the World</button>
    </div>

    <script>
        const MASTER_OWNER = "0x5e5ae526d45d69991039901a29148029a4889102".toLowerCase();
        let userAddress = "";

        const firebaseConfig = { /* Your Firebase config */ };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        async function connectWallet() {
            if (!window.ethereum) return alert("Please install MetaMask or Rabby");
            const provider = new ethers.BrowserProvider(window.ethereum);
            const accounts = await provider.send("eth_requestAccounts", []);
            userAddress = accounts[0].toLowerCase();
            document.getElementById("connectBtn").textContent = userAddress.slice(0,6) + "..." + userAddress.slice(-4);
            
            if (userAddress === MASTER_OWNER) {
                document.getElementById("updatePanel").style.display = "block";
            }
        }

        function initDashboard() {
            const grid = document.getElementById('dashboardGrid');
            grid.innerHTML = `
                <div class="stat-card burn-card">
                    <div class="stat-number" id="ricBurned">4,000,000</div>
                    <div class="stat-label">RIC Tokens Burned So Far 🔥</div>
                    <a href="https://shibariumscan.io/tx/0x2d8b95cc831e5ef88275533c5de8578ce0940f748dab62c26eb966f076adf3d9" target="_blank" class="tx-link">View Tx →</a>
                </div>

                <div class="stat-card burn-card">
                    <div class="stat-number" id="lpBurned">4</div>
                    <div class="stat-label">LP Pairs Permanently Locked</div>
                </div>

                <div class="stat-card burn-card">
                    <div class="stat-number" id="ricLocked">4,300,000</div>
                    <div class="stat-label">RIC Tokens Locked in LPs</div>
                </div>
            `;

            db.ref('stats').on('value', (snap) => {
                const s = snap.val() || {};
                document.getElementById('ricBurned').textContent = (s.ricBurn || 4000000).toLocaleString();
                document.getElementById('lpBurned').textContent = (s.lpBurn || 4).toLocaleString();
                document.getElementById('ricLocked').textContent = (s.ricLocked || 4300000).toLocaleString();
            });
        }

        function updateBurnStats() {
            db.ref('stats').update({
                ricBurn: parseInt(document.getElementById('ricBurnInput').value) || 4000000,
                lpBurn: parseInt(document.getElementById('lpBurnInput').value) || 4,
                ricLocked: parseInt(document.getElementById('ricLockedInput').value) || 4300000
            }).then(() => alert("✅ Updated transparently for the whole world!"));
        }

        window.onload = initDashboard;
    </script>
</body>
</html>
