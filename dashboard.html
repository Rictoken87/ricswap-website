<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RicSwap | Transparency Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    
    <style>
        :root {
            --obsidian: #0a0a0a;
            --card: #111111;
            --gold: #ffd700;
            --accent: #ff4d00;
            --text: #e0e0e0;
        }
        
        * { box-sizing: border-box; }
        body {
            background: var(--obsidian);
            color: var(--text);
            font-family: 'Inter', system-ui, sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        .nav {
            padding: 18px 5%;
            display: flex;
            align-items: center;
            background: rgba(10,10,10,0.98);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255,215,0,0.08);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .logo {
            font-size: 28px;
            font-weight: 900;
            background: linear-gradient(90deg, #ffd700, #ffaa00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1.5px;
        }
        .nav-links a {
            color: #aaa;
            text-decoration: none;
            margin-left: 36px;
            font-weight: 500;
            transition: 0.3s;
        }
        .nav-links a:hover, .nav-links a.active { color: var(--gold); }

        .connect-btn {
            margin-left: auto;
            background: transparent;
            color: var(--gold);
            border: 2px solid var(--gold);
            padding: 9px 22px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .connect-btn:hover {
            background: var(--gold);
            color: black;
            transform: scale(1.05);
        }

        .hero {
            padding: 120px 20px 90px;
            text-align: center;
            background: radial-gradient(circle at 50% 30%, rgba(255,77,0,0.15) 0%, transparent 60%);
        }
        .hero h1 {
            font-size: 4.2rem;
            font-weight: 900;
            margin: 0 0 16px 0;
            background: linear-gradient(90deg, #ffd700, #ffaa00, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero p {
            color: #888;
            font-size: 1.35rem;
            max-width: 620px;
            margin: 0 auto;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 28px;
            padding: 20px 5% 80px;
            max-width: 1480px;
            margin: 0 auto;
        }
        .stat-card {
            background: var(--card);
            border-radius: 28px;
            padding: 42px 32px;
            border: 1px solid rgba(255,215,0,0.1);
            text-align: center;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        .stat-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 60%;
            height: 60%;
            background: radial-gradient(circle, rgba(255,215,0,0.08) 0%, transparent 70%);
            opacity: 0;
            transition: 0.6s;
        }
        .stat-card:hover::before { opacity: 1; top: 0; left: 0; }
        .stat-card:hover {
            transform: translateY(-14px) scale(1.02);
            border-color: var(--gold);
            box-shadow: 0 25px 50px rgba(255, 215, 0, 0.12);
        }
        .stat-number {
            font-size: 3.8rem;
            font-weight: 900;
            color: var(--gold);
            margin: 12px 0 8px;
            letter-spacing: -2px;
        }
        .stat-label {
            color: #999;
            font-size: 1.05rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 500;
        }

        .burn-card .stat-number { color: #ff6666; }

        .tx-link {
            color: #ff9999;
            text-decoration: none;
            font-size: 0.95rem;
            margin-top: 16px;
            display: inline-block;
        }
        .tx-link:hover { color: #ffffff; }

        .update-panel {
            display: none;
            background: #0f0f0f;
            border: 2px solid var(--gold);
            border-radius: 28px;
            padding: 50px;
            margin: 60px auto;
            max-width: 820px;
            box-shadow: 0 20px 60px rgba(255,215,0,0.1);
        }
    </style>
</head>
<body>
    <nav class="nav">
        <a href="index.html" class="logo">RicSwap</a>
        <div class="nav-links">
            <a href="dashboard.html" class="active">Dashboard</a>
            <a href="swap.html">Swap</a>
            <a href="pools.html">Pools</a>
            <a href="liquidity.html">Add Liquidity</a>
            <a href="reward.html">Store</a>
            <a href="launch.html">Fair Launch</a>
        </div>
        <button id="connectBtn" class="connect-btn" onclick="connectWallet()">Connect Wallet</button>
    </nav>

    <div class="hero">
        <h1>Permanent Transparency</h1>
        <p>Real-time on-chain burn & lock statistics. Everything verifiable.</p>
    </div>

    <div class="dashboard-grid" id="dashboardGrid"></div>

    <!-- Master Update Panel -->
    <div class="update-panel" id="updatePanel">
        <h2 style="color:var(--gold); text-align:center; margin-bottom:30px;">🔥 Master Control Panel</h2>
        <label>RIC Tokens Burned So Far</label>
        <input type="number" id="ricBurnInput" value="4000000">
        <label>LP Pairs Permanently Locked</label>
        <input type="number" id="lpBurnInput" value="4">
        <label>RIC Tokens Locked in LPs</label>
        <input type="number" id="ricLockedInput" value="4300000">
        <button onclick="updateBurnStats()" style="margin-top:30px;">Update Global Dashboard</button>
    </div>

    <script>
        const MASTER_OWNER = "0x5e5ae526d45d69991039901a29148029a4889102".toLowerCase();
        let userAddress = "";

        const firebaseConfig = { /* Your config */ };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        async function connectWallet() {
            if (!window.ethereum) return alert("Please install MetaMask or Rabby");
            const provider = new ethers.BrowserProvider(window.ethereum);
            const accounts = await provider.send("eth_requestAccounts", []);
            userAddress = accounts[0].toLowerCase();
            document.getElementById("connectBtn").textContent = userAddress.slice(0,6) + "..." + userAddress.slice(-4);
            
            if (userAddress === MASTER_OWNER) {
                document.getElementById("updatePanel").style.display = "block";
            }
        }

        function initDashboard() {
            const grid = document.getElementById('dashboardGrid');
            grid.innerHTML = `
                <div class="stat-card burn-card">
                    <div class="stat-number" id="ricBurned">4,000,000</div>
                    <div class="stat-label">RIC Burned So Far</div>
                    <a href="https://shibariumscan.io/tx/0x2d8b95cc831e5ef88275533c5de8578ce0940f748dab62c26eb966f076adf3d9" target="_blank" class="tx-link">Verify on Shibariumscan →</a>
                </div>

                <div class="stat-card burn-card">
                    <div class="stat-number" id="lpBurned">4</div>
                    <div class="stat-label">LP Pairs Permanently Locked</div>
                </div>

                <div class="stat-card burn-card">
                    <div class="stat-number" id="ricLocked">4,300,000</div>
                    <div class="stat-label">RIC Locked in Liquidity</div>
                </div>
            `;

            db.ref('stats').on('value', (snap) => {
                const s = snap.val() || {};
                document.getElementById('ricBurned').textContent = (s.ricBurn || 4000000).toLocaleString();
                document.getElementById('lpBurned').textContent = (s.lpBurn || 4).toLocaleString();
                document.getElementById('ricLocked').textContent = (s.ricLocked || 4300000).toLocaleString();
            });
        }

        function updateBurnStats() {
            db.ref('stats').update({
                ricBurn: parseInt(document.getElementById('ricBurnInput').value) || 4000000,
                lpBurn: parseInt(document.getElementById('lpBurnInput').value) || 4,
                ricLocked: parseInt(document.getElementById('ricLockedInput').value) || 4300000
            }).then(() => alert("✅ Dashboard updated for everyone!"));
        }

        window.onload = initDashboard;
    </script>
</body>
</html>
