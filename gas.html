<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RicSwap | Gas Station</title>
    
    <!-- PRIMARY CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.1/ethers.umd.min.js"></script>
    
    <style>
        :root { --gold: #ffd700; --accent: #ff4d00; --bg: #0a0a0a; --card: #111; --border: #333; }
        body { background: var(--bg); color: #e0e0e0; font-family: system-ui, -apple-system, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        
        .container { width: 100%; max-width: 480px; padding: 20px; box-sizing: border-box; }
        .card { background: var(--card); border-radius: 24px; padding: 30px; border: 1px solid var(--border); box-shadow: 0 0 40px rgba(0,0,0,0.5); text-align: center; }
        
        h2 { color: var(--gold); margin: 0 0 10px 0; text-transform: uppercase; letter-spacing: -1px; }
        p.subtitle { color: #888; font-size: 0.9rem; margin-bottom: 25px; line-height: 1.5; }
        
        .input-box { background: #1a1a1a; padding: 15px 20px; border-radius: 16px; border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        
        input { background: transparent; border: none; color: white; font-size: 1.5rem; font-weight: bold; width: 100%; outline: none; }
        .badge { color: var(--gold); font-weight: bold; background: rgba(255, 215, 0, 0.1); padding: 5px 10px; border-radius: 6px; }

        .btn-action {
            background: linear-gradient(135deg, var(--accent), #cc3d00);
            color: white; border: none; padding: 18px; border-radius: 14px;
            font-weight: 800; font-size: 1.1rem; cursor: pointer; width: 100%;
            text-transform: uppercase; letter-spacing: 1px; transition: 0.2s;
        }
        .btn-action:active { transform: scale(0.98); }
        .btn-action:disabled { opacity: 0.5; cursor: not-allowed; filter: grayscale(1); }

        #console-log { 
            margin-top: 20px; font-family: monospace; font-size: 0.85rem; 
            color: #666; background: #000; padding: 10px; border-radius: 8px; 
            border: 1px solid #222; min-height: 40px; display: flex; 
            align-items: center; justify-content: center; flex-direction: column;
        }
        
        a { color: var(--gold); text-decoration: none; border-bottom: 1px dotted var(--gold); }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <h2>⛽ RicGas Station</h2>
            <p class="subtitle">Stuck with 0 BONE? Swap RIC for Gas instantly.</p>
            
            <div class="input-box">
                <input type="number" id="ricAmount" placeholder="1000" value="1000">
                <span class="badge">RIC</span>
            </div>
            
            <button class="btn-action" id="mainBtn" onclick="runGasSequence()">
                CONNECT WALLET
            </button>
            
            <!-- Visual Log for Debugging -->
            <div id="console-log">Waiting for action...</div>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        // 1. RIC Token Address
        const RIC_ADDRESS = "0x12C94d3A30daa09f81Ea6c037004E6e99A4A3dfc"; 
        
        // 2. YOUR RICGAS CONTRACT (Verify this!)
        const RICGAS_ADDRESS = "0x054Fcc4B7cd11f01735aE4e79131908E3Ff61B59"; 

        let provider, signer, userAddress;

        // --- UTILITY: LOGGING TO SCREEN ---
        function log(msg, isError = false) {
            const el = document.getElementById("console-log");
            el.innerHTML = msg;
            el.style.color = isError ? "#ff4444" : "#888";
            console.log(msg);
        }

        // --- MAIN SEQUENCE ---
        async function runGasSequence() {
            const btn = document.getElementById("mainBtn");
            
            // 1. Initialize Ethers
            if (typeof ethers === 'undefined') {
                return log("⚠️ Error: Ethers.js failed to load. Check internet.", true);
            }

            if (!window.ethereum) {
                return log("⚠️ MetaMask not found. Please install it.", true);
            }

            try {
                // 2. Connect Wallet (If not already)
                if (!signer) {
                    btn.innerText = "CONNECTING...";
                    provider = new ethers.BrowserProvider(window.ethereum);
                    await provider.send("eth_requestAccounts", []);
                    signer = await provider.getSigner();
                    userAddress = await signer.getAddress();
                    log(`✅ Connected: ${userAddress.substring(0,6)}...`);
                }

                // 3. Validate Input
                const amountVal = document.getElementById("ricAmount").value;
                if (!amountVal || amountVal <= 0) {
                    btn.innerText = "PAY GAS WITH RIC";
                    return log("⚠️ Please enter a valid RIC amount", true);
                }

                // 4. Setup Contracts
                const ricWei = ethers.parseUnits(amountVal, 18);
                const ricContract = new ethers.Contract(RIC_ADDRESS, [
                    "function approve(address, uint256) public returns (bool)",
                    "function allowance(address, address) view returns (uint256)"
                ], signer);

                const gasContract = new ethers.Contract(RICGAS_ADDRESS, [
                    "function payGasWithRIC(uint256, uint256) external"
                ], signer);

                // 5. Check Allowance
                log("⏳ Checking RIC Allowance...");
                const allowed = await ricContract.allowance(userAddress, RICGAS_ADDRESS);

                if (allowed < ricWei) {
                    btn.innerText = "APPROVING...";
                    btn.disabled = true;
                    log("📝 Please Confirm Approval in Wallet...");
                    
                    const txApprove = await ricContract.approve(RICGAS_ADDRESS, ricWei);
                    log(`⏳ Approving... <a href='https://shibariumscan.io/tx/${txApprove.hash}' target='_blank'>View TX</a>`);
                    
                    await txApprove.wait();
                    log("✅ Approved! Preparing to Swap...");
                }

                // 6. Execute Swap
                btn.innerText = "SWAPPING...";
                btn.disabled = true;
                log("⛽ Please Confirm Swap in Wallet...");

                // minBoneOut = 1 to prevent revert
                const txSwap = await gasContract.payGasWithRIC(ricWei, 1);
                
                // INSTANT LINK DISPLAY
                log(`🚀 <b>Tx Sent!</b> <a href='https://shibariumscan.io/tx/${txSwap.hash}' target='_blank'>View on Explorer</a>`);
                
                await txSwap.wait();
                
                // 7. Success
                btn.innerText = "SUCCESS!";
                btn.style.background = "#00ff88";
                btn.style.color = "black";
                log(`✅ <b>Refuel Complete!</b> check your BONE balance.`);
                
                // Reset UI after 4 seconds
                setTimeout(() => {
                    btn.disabled = false;
                    btn.innerText = "PAY GAS WITH RIC";
                    btn.style.background = ""; // Reset gradient
                    btn.style.color = "white";
                }, 4000);

            } catch (e) {
                console.error(e);
                btn.disabled = false;
                btn.innerText = "TRY AGAIN";
                
                // Friendly Error Messages
                if (e.code === "ACTION_REJECTED") {
                    log("❌ Transaction Rejected by User", true);
                } else if (e.code === "TRANSACTION_REPLACED") {
                    log("⚠️ Transaction Speed-Up Detected. Check Wallet.", true);
                } else {
                    log("⚠️ " + (e.reason || e.message || "Transaction Error"), true);
                }
            }
        }
    </script>
</body>
</html>
