<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RicSwap - Gas Station</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
    <style>
        :root { --gold: #ffd700; --accent: #ff4d00; --bg: #0a0a0a; --card: #111; }
        body { background: var(--bg); color: #e0e0e0; font-family: 'Inter', sans-serif; display:flex; justify-content:center; align-items:center; height:100vh; margin:0; }
        
        .container { width: 100%; max-width: 480px; padding: 20px; }
        .card { background: var(--card); border-radius: 20px; padding: 30px; border: 1px solid #222; box-shadow: 0 0 30px rgba(0,0,0,0.5); }
        
        h2 { color: var(--gold); margin-top: 0; }
        h3 { color: var(--accent); margin: 0 0 10px 0; display:flex; align-items:center; gap:10px; }
        
        input { 
            width: 100%; padding: 16px; background: #000; 
            border: 1px solid #333; border-radius: 12px; 
            color: white; font-size: 1.2rem; outline: none; 
            box-sizing: border-box; margin-bottom: 15px;
        }
        input:focus { border-color: var(--gold); }

        .btn-action {
            background: linear-gradient(135deg, var(--accent), #cc3d00);
            color: white; border: none; padding: 16px;
            border-radius: 12px; font-weight: 800; font-size: 1rem;
            cursor: pointer; width: 100%; transition: 0.2s;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .btn-action:hover { transform: scale(1.02); box-shadow: 0 0 20px rgba(255, 77, 0, 0.3); }
        .btn-action:disabled { opacity: 0.5; cursor: not-allowed; }

        .status-txt { margin-top: 15px; font-size: 0.9rem; color: #666; text-align: center; min-height: 20px; }
        .link { color: var(--gold); text-decoration: none; }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <h2>⛽ RicGas Station</h2>
            <p style="color:#888; font-size:0.9rem; margin-bottom:25px;">
                Stuck with 0 BONE? Swap RIC for Gas instantly.
            </p>
            
            <div style="background:#1a1a1a; padding:20px; border-radius:16px; border:1px solid #333;">
                <label style="font-size:0.8rem; color:#888;">AMOUNT TO SWAP</label>
                <div style="display:flex; align-items:center; margin-top:5px;">
                    <input type="number" id="ricAmount" placeholder="1000" value="1000">
                    <span style="font-weight:bold; color:var(--gold); margin-left:-50px; padding-right:20px;">RIC</span>
                </div>
                
                <button class="btn-action" id="mainBtn" onclick="handleInteraction()">
                    Connect Wallet
                </button>
            </div>
            
            <div id="status" class="status-txt"></div>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        // 1. The Token Address
        const RIC_ADDRESS = "0x12C94d3A30daa09f81Ea6c037004E6e99A4A3dfc"; 
        // 2. Your Deployed RicGas Contract
        const RICGAS_ADDRESS = "0x054Fcc4B7cd11f01735aE4e79131908E3Ff61B59"; 

        let provider, signer, userAddress;

        // Initialize on Load
        window.onload = async () => {
            if(window.ethereum) {
                provider = new ethers.BrowserProvider(window.ethereum);
                const accounts = await provider.listAccounts();
                if(accounts.length > 0) connectWallet();
            }
        };

        async function connectWallet() {
            if(!window.ethereum) return alert("Please install MetaMask");
            provider = new ethers.BrowserProvider(window.ethereum);
            signer = await provider.getSigner();
            userAddress = await signer.getAddress();
            
            document.getElementById("mainBtn").innerText = "PAY GAS WITH RIC";
            document.getElementById("status").innerText = "✅ Wallet Connected";
        }

        async function handleInteraction() {
            if (!signer) {
                await provider.send("eth_requestAccounts", []);
                await connectWallet();
                return;
            }

            const btn = document.getElementById("mainBtn");
            const status = document.getElementById("status");
            const inputVal = document.getElementById("ricAmount").value;

            if (!inputVal || inputVal <= 0) return alert("Enter a valid amount");

            try {
                const ricWei = ethers.parseUnits(inputVal, 18); // 18 Decimals
                
                // 1. Define Contracts
                const ricContract = new ethers.Contract(RIC_ADDRESS, [
                    "function approve(address spender, uint256 amount) public returns (bool)",
                    "function allowance(address owner, address spender) view returns (uint256)"
                ], signer);

                const gasContract = new ethers.Contract(RICGAS_ADDRESS, [
                    "function payGasWithRIC(uint256 ricAmount, uint256 minBoneOut) external"
                ], signer);

                // 2. Check Allowance
                status.innerText = "⏳ Checking allowance...";
                const currentAllowance = await ricContract.allowance(userAddress, RICGAS_ADDRESS);

                if (currentAllowance < ricWei) {
                    // --- STEP A: APPROVE ---
                    btn.innerText = "APPROVING RIC...";
                    btn.disabled = true;
                    status.innerText = "📝 Please confirm approval in wallet...";
                    
                    const txApprove = await ricContract.approve(RICGAS_ADDRESS, ricWei);
                    status.innerHTML = `⏳ Approving... <a href="https://shibariumscan.io/tx/${txApprove.hash}" target="_blank" class="link">View Tx</a>`;
                    await txApprove.wait();
                }

                // --- STEP B: SWAP ---
                btn.innerText = "REFUELING...";
                btn.disabled = true;
                status.innerText = "⛽ Swapping RIC for BONE...";

                // minBoneOut set to 1 wei to prevent failure but allow trade
                const txSwap = await gasContract.payGasWithRIC(ricWei, 1);
                
                status.innerHTML = `🚀 Refueling... <a href="https://shibariumscan.io/tx/${txSwap.hash}" target="_blank" class="link">View Tx</a>`;
                await txSwap.wait();

                // --- SUCCESS ---
                btn.innerText = "SUCCESS!";
                status.innerHTML = "✅ Gas Received! Check your balance.";
                setTimeout(() => { 
                    btn.disabled = false; 
                    btn.innerText = "PAY GAS WITH RIC"; 
                }, 3000);

            } catch (error) {
                console.error(error);
                btn.innerText = "TRY AGAIN";
                btn.disabled = false;
                // Extract clean error message if possible
                status.innerText = "❌ Error: " + (error.reason || "Transaction Failed");
            }
        }
    </script>
</body>
</html>
