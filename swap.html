<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RicSwap | Swap Debug</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
    <style>
        :root { --obsidian: #080808; --card-bg: #121212; --magma: linear-gradient(135deg, #ff4d00 0%, #ff8c00 100%); --gold: #ffd700; }
        body { background: var(--obsidian); color: white; font-family: system-ui, sans-serif; margin: 0; padding: 0; }
        .nav { padding: 20px 40px; display: flex; align-items: center; border-bottom: 1px solid rgba(255,215,0,0.1); }
        .logo { font-size: 26px; font-weight: 800; color: var(--gold); }
        .connect-btn { background: rgba(255,215,0,0.1); color: var(--gold); border: 1px solid var(--gold); padding: 8px 22px; border-radius: 9999px; font-weight: 600; cursor: pointer; margin-left: auto; }
        .card { max-width: 460px; margin: 40px auto; background: var(--card-bg); border-radius: 24px; padding: 32px; box-shadow: 0 20px 60px rgba(0,0,0,0.7); border: 1px solid #222; }
        input { background: transparent; border: none; color: white; font-size: 32px; width: 100%; outline: none; font-weight: 700; }
        button { background: var(--magma); color: white; border: none; padding: 18px; border-radius: 16px; font-weight: 800; width: 100%; margin-top: 20px; cursor: pointer; }
        .status { margin-top: 20px; text-align: left; font-size: 13px; background: #1a1a1a; padding: 12px; border-radius: 8px; min-height: 120px; white-space: pre-wrap; word-break: break-all; }
    </style>
</head>
<body>
    <nav class="nav">
        <div class="logo">RicSwap Debug</div>
        <button id="connectBtn" class="connect-btn">Connect Wallet</button>
    </nav>

    <div class="card">
        <h2>Test Swap (0.05 BONE)</h2>
        
        <div style="margin-bottom:16px;">
            <span>You Pay</span><br>
            <input type="number" id="fromAmount" value="0.05" readonly>
            <span style="color:#888">BONE</span>
        </div>

        <div style="margin-bottom:16px;">
            <span>You Receive (est.)</span><br>
            <input type="number" id="toAmount" readonly>
            <span style="color:#888">RIC</span>
        </div>

        <button id="swapBtn">TRY SWAP 0.05 BONE</button>
        <div class="status" id="status">Waiting...</div>
    </div>

    <script>
        const RPC = "https://rpc.shibarium.shib.io";
        const ROUTER = "0x1b44f3b678EA3051f7874641bd2F962102e2e683";
        const WBONE = "0xC76F4c819D820369Fb2d7C1531aB3Bb18e6fE8d8";
        const RIC = "0x12C94d3A30daa09f81Ea6c037004E6e99A4A3dfc";

        let provider, signer, userAddress;

        const ROUTER_ABI = ["function swapExactETHForTokens(uint amountOutMin, address[] calldata path, address to, uint deadline) external payable returns (uint[] memory amounts)"];

        async function connectWallet() {
            provider = new ethers.JsonRpcProvider(RPC);
            const browserProvider = new ethers.BrowserProvider(window.ethereum);
            signer = await browserProvider.getSigner();
            userAddress = await signer.getAddress();
            
            document.getElementById("connectBtn").textContent = userAddress.slice(0,6)+"..." + userAddress.slice(-4);
            document.getElementById("status").textContent = "Connected. Ready to test.";
        }

        async function executeSwap() {
            if (!signer) return connectWallet();
            const status = document.getElementById("status");
            const btn = document.getElementById("swapBtn");

            try {
                btn.disabled = true;
                btn.textContent = "SENDING...";
                status.textContent = "Building tx with high gas...";

                const router = new ethers.Contract(ROUTER, ROUTER_ABI, signer);
                const amountInWei = ethers.parseEther("0.05");

                const tx = await router.swapExactETHForTokens(
                    0, 
                    [WBONE, RIC],
                    userAddress,
                    Math.floor(Date.now() / 1000) + 600,
                    { 
                        value: amountInWei, 
                        gasLimit: 2000000   // Very high
                    }
                );

                status.innerHTML = `Tx Sent!\n<a href="https://shibariumscan.io/tx/${tx.hash}" target="_blank">View on Explorer</a>`;
                await tx.wait();
                status.innerHTML += "\n✅ Confirmed!";
            } catch (e) {
                console.error(e);
                status.textContent = "REVERTED:\n" + (e.reason || e.shortMessage || e.message || JSON.stringify(e));
            } finally {
                btn.disabled = false;
                btn.textContent = "TRY SWAP 0.05 BONE";
            }
        }

        document.getElementById("connectBtn").addEventListener("click", connectWallet);
        document.getElementById("swapBtn").addEventListener("click", executeSwap);
    </script>
</body>
</html>
