<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RicSwap | Debug</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
    <style>
        body { background: #080808; color: white; font-family: system-ui; padding: 20px; }
        .card { background: #121212; padding: 25px; border-radius: 16px; max-width: 500px; margin: 0 auto; border: 1px solid #333; }
        button { padding: 12px 24px; margin: 10px 5px; background: #ff4d00; border: none; border-radius: 8px; color: white; cursor: pointer; }
        .status { margin-top: 15px; background: #1a1a1a; padding: 15px; border-radius: 8px; font-size: 14px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <div class="card">
        <h2>LP Debug Tool</h2>
        <p>Pair Address: 0x941abcb1A4278Ff33B50F6Cf9F5A4C8a0888BdeE</p>
        <button onclick="checkPair()">Check Liquidity Pool</button>
        <div class="status" id="status">Click button to test...</div>
    </div>

    <script>
        const PAIR_ADDRESS = "0x941abcb1A4278Ff33B50F6Cf9F5A4C8a0888BdeE";
        const WBONE = "0xC76F4c819D820369Fb2d7C1531aB3Bb18e6fE8d8";
        const RIC = "0x12C94d3A30daa09f81Ea6c037004E6e99A4A3dfc";

        async function checkPair() {
            const status = document.getElementById("status");
            status.textContent = "Connecting to Shibarium...";

            try {
                const provider = new ethers.JsonRpcProvider("https://rpc.shibarium.shib.io");
                const pair = new ethers.Contract(PAIR_ADDRESS, [
                    "function getReserves() view returns (uint112 reserve0, uint112 reserve1, uint32 blockTimestampLast)",
                    "function token0() view returns (address)"
                ], provider);

                const token0 = await pair.token0();
                const [r0, r1] = await pair.getReserves();

                const boneRes = token0 === WBONE ? r0 : r1;
                const ricRes = token0 === WBONE ? r1 : r0;

                status.innerHTML = `✅ Pair Found!<br>
                Token0: ${token0 === WBONE ? "BONE" : "RIC"}<br>
                BONE Reserve: ${ethers.formatEther(boneRes)}<br>
                RIC Reserve: ${ethers.formatEther(ricRes)}<br>
                Price: 1 BONE ≈ ${(Number(ricRes) / Number(boneRes)).toFixed(2)} RIC`;
            } catch (e) {
                console.error(e);
                status.innerHTML = `❌ Error reading pair:<br>${e.message || e}`;
            }
        }
    </script>
</body>
</html>
