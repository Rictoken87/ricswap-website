<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RicSwap | Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
    <style>
        :root {
            --obsidian: #050505;
            --card-bg: #0a0a0a;
            --input-bg: #111;
            --gold: #ffd700;
            --gold-dim: rgba(255, 215, 0, 0.1);
            --magma: linear-gradient(135deg, #ff4d00 0%, #ff8c00 100%);
            --border: #222;
            --text: #e0e0e0;
            --text-mute: #666;
        }
        body { background: var(--obsidian); color: var(--text); font-family: 'Inter', system-ui, sans-serif; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
       
        .main-card { width: 100%; max-width: 460px; background: var(--card-bg); border-radius: 24px; padding: 24px; border: 1px solid var(--border); box-shadow: 0 0 100px rgba(255, 77, 0, 0.1); position: relative; overflow: hidden; }
       
        /* Header */
        .nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .logo { font-size: 22px; font-weight: 900; color: var(--gold); letter-spacing: -0.5px; }
        .connect-btn { background: var(--gold-dim); color: var(--gold); border: 1px solid var(--gold); padding: 8px 18px; border-radius: 99px; font-weight: 600; cursor: pointer; font-size: 13px; transition: 0.2s; }
        .connect-btn:hover { background: var(--gold); color: black; }
        /* Input Containers */
        .swap-box { background: var(--input-bg); border: 1px solid var(--border); border-radius: 18px; padding: 16px; position: relative; transition: 0.2s; }
        .swap-box:focus-within { border-color: var(--gold); }
       
        .box-header { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-mute); margin-bottom: 8px; }
        .balance { color: var(--gold); cursor: pointer; }
        .input-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        input { background: transparent; border: none; color: white; font-size: 28px; width: 100%; outline: none; font-weight: 600; font-family: monospace; padding: 0; }
       
        /* Token Selector */
        .token-pill { background: #222; padding: 6px 12px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; gap: 8px; min-width: 90px; justify-content: center; border: 1px solid #333; transition: 0.2s; }
        .token-pill:hover { border-color: #555; background: #2a2a2a; }
        .token-name { font-weight: 700; font-size: 15px; }
        /* Address Input (Hidden by default) */
        .custom-addr { display: none; width: 100%; background: #000; border: 1px solid #333; color: #888; padding: 8px; border-radius: 8px; margin-top: 10px; font-size: 11px; font-family: monospace; }
        .custom-addr.show { display: block; }
        /* Middle Arrow */
        .switch-btn { display: flex; justify-content: center; margin: -12px 0; position: relative; z-index: 10; }
        .switch-btn div { background: #222; border: 4px solid var(--card-bg); padding: 8px; border-radius: 50%; cursor: pointer; color: #aaa; transition: 0.2s; }
        .switch-btn div:hover { color: var(--gold); transform: rotate(180deg); }
        /* Settings (Slippage) */
        .settings { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; padding: 0 4px; }
        .slip-label { font-size: 12px; color: var(--text-mute); }
        .slip-opts { display: flex; gap: 6px; }
        .slip-btn { background: #1a1a1a; border: 1px solid #333; color: #666; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 11px; transition: 0.2s; }
        .slip-btn.active { background: var(--gold); color: black; border-color: var(--gold); font-weight: 800; }
        /* Main Action Button */
        #mainBtn { background: var(--magma); color: white; border: none; width: 100%; padding: 18px; border-radius: 16px; font-size: 16px; font-weight: 800; margin-top: 20px; cursor: pointer; transition: transform 0.1s; box-shadow: 0 4px 15px rgba(255, 77, 0, 0.3); }
        #mainBtn:disabled { background: #222; color: #555; cursor: not-allowed; box-shadow: none; }
        #mainBtn:active { transform: scale(0.98); }
        /* Info/Status */
        .info-row { display: flex; justify-content: space-between; font-size: 12px; color: #666; margin-top: 12px; padding: 0 4px; }
        .status-msg { text-align: center; margin-top: 15px; font-size: 13px; height: 20px; color: #888; }
        a { color: var(--gold); text-decoration: none; }
    </style>
</head>
<body>
<div class="main-card">
    <!-- Nav -->
    <div class="nav">
        <div class="logo">RicSwap</div>
        <button id="connectBtn" class="connect-btn">Connect Wallet</button>
    </div>
    <!-- FROM -->
    <div class="swap-box">
        <div class="box-header">
            <span>You Pay</span>
            <span onclick="setMax()" class="balance">Bal: <span id="balIn">0.00</span></span>
        </div>
        <div class="input-row">
            <input type="number" id="amountIn" placeholder="0.0" value="1">
            <div class="token-pill" onclick="toggleAddr('in')">
                <span class="token-name" id="symIn">BONE</span> ▾
            </div>
        </div>
        <div onclick="selectBoneInPay()" style="margin-top:8px; color:var(--gold); font-size:13px; cursor:pointer;">Quick: BONE</div>
        <input type="text" id="addrIn" class="custom-addr" placeholder="Paste Token Address (0x...)" onchange="importToken('in')">
    </div>
    <!-- Switcher -->
    <div class="switch-btn">
        <div onclick="switchSides()">⬇</div>
    </div>
    <!-- TO -->
    <div class="swap-box">
        <div class="box-header">
            <span>You Receive</span>
            <span class="balance">Bal: <span id="balOut">0.00</span></span>
        </div>
        <div class="input-row">
            <input type="number" id="amountOut" placeholder="0.0" readonly style="color:var(--gold)">
            <div class="token-pill" onclick="toggleAddr('out')">
                <span class="token-name" id="symOut">RIC</span> ▾
            </div>
        </div>
        <input type="text" id="addrOut" class="custom-addr" placeholder="Paste Token Address (0x...)" onchange="importToken('out')">
    </div>
    <!-- Settings -->
    <div class="settings">
        <span class="slip-label">Slippage Tolerance</span>
        <div class="slip-opts">
            <button class="slip-btn" onclick="setSlippage(0.5)">0.5%</button>
            <button class="slip-btn active" onclick="setSlippage(1.0)">1.0%</button>
            <button class="slip-btn" onclick="setSlippage(2.0)">2.0%</button>
        </div>
    </div>
    <!-- Quote Info -->
    <div class="info-row">
        <span>Min Received:</span>
        <span id="minOutVal">0.00</span>
    </div>
    <!-- Action -->
    <button id="mainBtn">Connect Wallet</button>
    <div id="status" class="status-msg"></div>
</div>

<script>
    // === YOUR ORIGINAL WORKING CODE + QUICK BONE FIX ===
    const CONFIG = {
        RPC: "https://rpc.shibarium.shib.io",
        ROUTER: "0xcfBF0917F2fCDC4F5170aC991fa26F2Bc3da9Fd4",
        WBONE: "0xC76F4c819D820369Fb2d7C1531aB3Bb18e6fE8d8",
        RIC: "0x12C94d3A30daa09f81Ea6c037004E6e99A4A3dfc"
    };

    let state = {
        provider: null,
        signer: null,
        userAddr: null,
        slippage: 1.0,
        tokens: {
            in: { symbol: "BONE", address: CONFIG.WBONE, decimals: 18, isNative: true },
            out: { symbol: "RIC", address: CONFIG.RIC, decimals: 18, isNative: false }
        }
    };

    // ... (rest of your original script remains the same) ...

    // NEW: Quick return to BONE in "You Pay"
    function selectBoneInPay() {
        state.tokens.in = { symbol: "BONE", address: CONFIG.WBONE, decimals: 18, isNative: true };
        document.getElementById("symIn").textContent = "BONE";
        refreshBalances();
        updateQuote();
    }

    // Initialize
    window.onload = () => {
        if (window.ethereum) {
            window.ethereum.request({ method: 'eth_accounts' }).then(accounts => {
                if (accounts.length > 0) connect();
            });
        }
    };
</script>
</body>
</html>
