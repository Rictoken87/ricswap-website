<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RicSwap | Swap</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.0/umd/ethers.min.js"></script>
    <style>
        :root { --obsidian: #080808; --card-bg: #121212; --magma: linear-gradient(135deg, #ff4d00 0%, #ff8c00 100%); }
        body { background: var(--obsidian); color: white; font-family: system-ui, sans-serif; margin: 0; padding: 0; }
        .nav { padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,215,0,0.1); }
        .swap-card { max-width: 420px; margin: 60px auto; background: var(--card-bg); border-radius: 24px; padding: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.8); }
        .swap-input-group { background: #1a1a1a; border-radius: 16px; padding: 16px; margin-bottom: 12px; }
        .swap-input { background: transparent; border: none; color: white; font-size: 28px; width: 100%; outline: none; }
        button { background: var(--magma); color: white; border: none; padding: 14px 28px; border-radius: 9999px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 20px; font-size: 18px; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="nav">
        <h2>RicSwap</h2>
        <button id="connectBtn">CONNECT WALLET</button>
    </div>

    <div class="swap-card">
        <h3 style="text-align:center; margin-bottom:20px;">Swap BONE → RIC</h3>

        <div class="swap-input-group">
            <div>You Pay</div>
            <input type="number" id="fromAmount" class="swap-input" placeholder="0.0" value="1">
        </div>

        <div style="text-align:center; font-size:24px; margin:10px 0;">↓</div>

        <div class="swap-input-group">
            <div>You Receive</div>
            <input type="number" id="toAmount" class="swap-input" placeholder="0.0" readonly>
        </div>

        <button id="swapBtn">SWAP NOW</button>
    </div>

    <script>
        // Safety check - make sure ethers loaded
        if (typeof ethers === "undefined") {
            alert("❌ ethers.js failed to load. Please refresh the page or disable any ad-blocker.");
            console.error("ethers is not defined - CDN failed to load");
        }

        const ROUTER_ADDRESS = "0x21c38fA2c2EA3D835CCd41733E35636E75022A53";
        const WBONE = "0xC76F4c819D820369Fb2d7C1531aB3Bb18e6fE8d8";
        const RIC = "0x12C94d3A30daa09f81Ea6c037004E6e99A4A3dfc";
        const SHIBARIUM_CHAIN_ID = 109;

        const ROUTER_ABI = [
            "function getAmountsOut(uint256 amountIn, address[] memory path) public view returns (uint256[] memory amounts)",
            "function swapExactBONEForTokens(uint256 amountOutMin, address[] calldata path, address to, uint256 deadline) external payable returns (uint256[] memory amounts)"
        ];

        let provider, signer, userAddress;

        const fromAmountInput = document.getElementById("fromAmount");
        const toAmountInput = document.getElementById("toAmount");
        const swapBtn = document.getElementById("swapBtn");
        const connectBtn = document.getElementById("connectBtn");

        async function switchToShibarium() {
            try {
                await window.ethereum.request({
                    method: 'wallet_switchEthereumChain',
                    params: [{ chainId: '0x' + SHIBARIUM_CHAIN_ID.toString(16) }]
                });
            } catch (switchError) {
                if (switchError.code === 4902) {
                    await window.ethereum.request({
                        method: 'wallet_addEthereumChain',
                        params: [{
                            chainId: '0x' + SHIBARIUM_CHAIN_ID.toString(16),
                            chainName: 'Shibarium',
                            nativeCurrency: { name: 'BONE', symbol: 'BONE', decimals: 18 },
                            rpcUrls: ['https://rpc.shibarium.shib.io'],
                            blockExplorerUrls: ['https://shibariumscan.io']
                        }]
                    });
                } else {
                    throw switchError;
                }
            }
        }

        async function connectWallet() {
            if (!window.ethereum) return alert("Please install MetaMask or another wallet");

            try {
                connectBtn.disabled = true;
                connectBtn.textContent = "CONNECTING...";

                await switchToShibarium();

                provider = new ethers.BrowserProvider(window.ethereum);
                signer = await provider.getSigner();
                userAddress = await signer.getAddress();

                connectBtn.textContent = userAddress.slice(0,6) + "..." + userAddress.slice(-4);
                updateQuote();
            } catch (e) {
                console.error(e);
                alert("Connection failed: " + e.message);
                connectBtn.textContent = "CONNECT WALLET";
            } finally {
                connectBtn.disabled = false;
            }
        }

        async function updateQuote() {
            const amountIn = fromAmountInput.value.trim();
            if (!amountIn || isNaN(amountIn) || Number(amountIn) <= 0) {
                toAmountInput.value = "";
                return;
            }
            try {
                const activeProvider = provider || new ethers.JsonRpcProvider("https://rpc.shibarium.shib.io");
                const router = new ethers.Contract(ROUTER_ADDRESS, ROUTER_ABI, activeProvider);
                const path = [WBONE, RIC];
                const amountInWei = ethers.parseEther(amountIn);
                const amounts = await router.getAmountsOut(amountInWei, path);
                toAmountInput.value = ethers.formatEther(amounts[1]);
            } catch (e) {
                console.error("Quote error:", e);
                toAmountInput.value = "No Liquidity";
            }
        }

        async function executeSwap() {
            if (!signer) return connectWallet();

            try {
                swapBtn.disabled = true;
                swapBtn.textContent = "PENDING...";

                const router = new ethers.Contract(ROUTER_ADDRESS, ROUTER_ABI, signer);
                const amountInWei = ethers.parseEther(fromAmountInput.value);
                const path = [WBONE, RIC];
                const amountsOut = await router.getAmountsOut(amountInWei, path);
                const amountOutMin = (amountsOut[1] * 995n) / 1000n;
                const deadline = Math.floor(Date.now() / 1000) + 1200;

                const tx = await router.swapExactBONEForTokens(
                    amountOutMin,
                    path,
                    userAddress,
                    deadline,
                    { value: amountInWei }
                );

                await tx.wait();
                alert("✅ Swap Successful!");
                fromAmountInput.value = "";
                toAmountInput.value = "";
            } catch (e) {
                console.error("Swap error:", e);
                alert("Swap failed: " + (e.reason || e.message || "Check console"));
            } finally {
                swapBtn.disabled = false;
                swapBtn.textContent = "SWAP NOW";
            }
        }

        fromAmountInput.addEventListener("input", updateQuote);
        swapBtn.addEventListener("click", executeSwap);
        connectBtn.addEventListener("click", connectWallet);

        window.addEventListener("load", () => {
            updateQuote();
        });
    </script>
</body>
</html>
