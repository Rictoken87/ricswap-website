<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RicSwap | Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
    <style>
        :root {
            --obsidian: #050505;
            --card-bg: #0a0a0a;
            --input-bg: #111;
            --gold: #ffd700;
            --gold-dim: rgba(255, 215, 0, 0.1);
            --magma: linear-gradient(135deg, #ff4d00 0%, #ff8c00 100%);
            --border: #222;
            --text: #e0e0e0;
            --text-mute: #666;
        }
        body { background: var(--obsidian); color: var(--text); font-family: 'Inter', system-ui, sans-serif; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        
        .main-card { width: 100%; max-width: 460px; background: var(--card-bg); border-radius: 24px; padding: 24px; border: 1px solid var(--border); box-shadow: 0 0 100px rgba(255, 77, 0, 0.1); position: relative; overflow: hidden; }
        
        /* Header */
        .nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .logo { font-size: 22px; font-weight: 900; color: var(--gold); letter-spacing: -0.5px; }
        .connect-btn { background: var(--gold-dim); color: var(--gold); border: 1px solid var(--gold); padding: 8px 18px; border-radius: 99px; font-weight: 600; cursor: pointer; font-size: 13px; transition: 0.2s; }
        .connect-btn:hover { background: var(--gold); color: black; }

        /* Input Containers */
        .swap-box { background: var(--input-bg); border: 1px solid var(--border); border-radius: 18px; padding: 16px; position: relative; transition: 0.2s; }
        .swap-box:focus-within { border-color: var(--gold); }
        
        .box-header { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-mute); margin-bottom: 8px; }
        .balance { color: var(--gold); cursor: pointer; }

        .input-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        input { background: transparent; border: none; color: white; font-size: 28px; width: 100%; outline: none; font-weight: 600; font-family: monospace; padding: 0; }
        
        /* Token Selector */
        .token-pill { background: #222; padding: 6px 12px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; gap: 8px; min-width: 90px; justify-content: center; border: 1px solid #333; transition: 0.2s; }
        .token-pill:hover { border-color: #555; background: #2a2a2a; }
        .token-pill img { width: 20px; height: 20px; border-radius: 50%; background: #444; }
        .token-name { font-weight: 700; font-size: 15px; }

        /* Address Input (Hidden by default) */
        .custom-addr { display: none; width: 100%; background: #000; border: 1px solid #333; color: #888; padding: 8px; border-radius: 8px; margin-top: 10px; font-size: 11px; font-family: monospace; }
        .custom-addr.show { display: block; }

        /* Middle Arrow */
        .switch-btn { display: flex; justify-content: center; margin: -12px 0; position: relative; z-index: 10; }
        .switch-btn div { background: #222; border: 4px solid var(--card-bg); padding: 8px; border-radius: 50%; cursor: pointer; color: #aaa; transition: 0.2s; }
        .switch-btn div:hover { color: var(--gold); transform: rotate(180deg); }

        /* Settings (Slippage) */
        .settings { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; padding: 0 4px; }
        .slip-label { font-size: 12px; color: var(--text-mute); }
        .slip-opts { display: flex; gap: 6px; }
        .slip-btn { background: #1a1a1a; border: 1px solid #333; color: #666; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 11px; transition: 0.2s; }
        .slip-btn.active { background: var(--gold); color: black; border-color: var(--gold); font-weight: 800; }

        /* Main Action Button */
        #mainBtn { background: var(--magma); color: white; border: none; width: 100%; padding: 18px; border-radius: 16px; font-size: 16px; font-weight: 800; margin-top: 20px; cursor: pointer; transition: transform 0.1s; box-shadow: 0 4px 15px rgba(255, 77, 0, 0.3); }
        #mainBtn:disabled { background: #222; color: #555; cursor: not-allowed; box-shadow: none; }
        #mainBtn:active { transform: scale(0.98); }

        /* Info/Status */
        .info-row { display: flex; justify-content: space-between; font-size: 12px; color: #666; margin-top: 12px; padding: 0 4px; }
        .status-msg { text-align: center; margin-top: 15px; font-size: 13px; height: 20px; color: #888; }
        a { color: var(--gold); text-decoration: none; }
    </style>
</head>
<body>

<div class="main-card">
    <!-- Nav -->
    <div class="nav">
        <div class="logo">RicSwap</div>
        <button id="connectBtn" class="connect-btn">Connect Wallet</button>
    </div>

    <!-- FROM -->
    <div class="swap-box">
        <div class="box-header">
            <span>You Pay</span>
            <span onclick="setMax()" class="balance">Bal: <span id="balIn">0.00</span></span>
        </div>
        <div class="input-row">
            <input type="number" id="amountIn" placeholder="0.0" value="1">
            <div class="token-pill" onclick="toggleAddr('in')">
                <span class="token-name" id="symIn">BONE</span> ▾
            </div>
        </div>
        <input type="text" id="addrIn" class="custom-addr" placeholder="Paste Token Address (0x...)" onchange="importToken('in')">
    </div>

    <!-- Switcher -->
    <div class="switch-btn">
        <div onclick="switchSides()">⬇</div>
    </div>

    <!-- TO -->
    <div class="swap-box">
        <div class="box-header">
            <span>You Receive</span>
            <span class="balance">Bal: <span id="balOut">0.00</span></span>
        </div>
        <div class="input-row">
            <input type="number" id="amountOut" placeholder="0.0" readonly style="color:var(--gold)">
            <div class="token-pill" onclick="toggleAddr('out')">
                <span class="token-name" id="symOut">RIC</span> ▾
            </div>
        </div>
        <input type="text" id="addrOut" class="custom-addr" placeholder="Paste Token Address (0x...)" onchange="importToken('out')">
    </div>

    <!-- Settings -->
    <div class="settings">
        <span class="slip-label">Slippage Tolerance</span>
        <div class="slip-opts">
            <button class="slip-btn" onclick="setSlippage(0.5)">0.5%</button>
            <button class="slip-btn active" onclick="setSlippage(1.0)">1.0%</button>
            <button class="slip-btn" onclick="setSlippage(2.0)">2.0%</button>
        </div>
    </div>

    <!-- Quote Info -->
    <div class="info-row">
        <span>Min Received:</span>
        <span id="minOutVal">0.00</span>
    </div>

    <!-- Action -->
    <button id="mainBtn">Connect Wallet</button>
    <div id="status" class="status-msg"></div>
</div>

<script>
    // --- 1. CORE CONFIGURATION ---
    const CONFIG = {
        RPC: "https://rpc.shibarium.shib.io",
        CHAIN_ID: 109, 
        ROUTER: "0xcfBF0917F2fCDC4F5170aC991fa26F2Bc3da9Fd4", // <--- YOUR NEW V1 ROUTER
        WBONE: "0xC76F4c819D820369Fb2d7C1531aB3Bb18e6fE8d8",
        RIC: "0x12C94d3A30daa09f81Ea6c037004E6e99A4A3dfc"
    };

    // --- 2. STATE MANAGEMENT ---
    let state = {
        provider: null,
        signer: null,
        userAddr: null,
        slippage: 1.0,
        isApproving: false,
        isSwapping: false,
        tokens: {
            in: { symbol: "BONE", address: "NATIVE", decimals: 18, isNative: true },
            out: { symbol: "RIC", address: CONFIG.RIC, decimals: 18, isNative: false }
        }
    };

    // --- 3. ABIS ---
    const ERC20_ABI = [
        "function balanceOf(address) view returns (uint)",
        "function decimals() view returns (uint8)",
        "function symbol() view returns (string)",
        "function allowance(address, address) view returns (uint)",
        "function approve(address, uint) returns (bool)"
    ];
    const ROUTER_ABI = [
        "function getAmountsOut(uint amountIn, address[] memory path) view returns (uint[] memory amounts)",
        "function swapExactETHForTokens(uint amountOutMin, address[] calldata path, address to, uint deadline) payable returns (uint[] memory)",
        "function swapExactTokensForETH(uint amountIn, uint amountOutMin, address[] calldata path, address to, uint deadline) returns (uint[] memory)",
        "function swapExactTokensForTokens(uint amountIn, uint amountOutMin, address[] calldata path, address to, uint deadline) returns (uint[] memory)"
    ];

    // --- 4. CORE FUNCTIONS ---

    async function init() {
        if(window.ethereum) {
            state.provider = new ethers.BrowserProvider(window.ethereum);
            // Auto connect if previously trusted
            const accounts = await state.provider.listAccounts();
            if(accounts.length > 0) connect();
        }
    }

    async function connect() {
        if(!window.ethereum) return alert("Install Metamask!");
        try {
            state.provider = new ethers.BrowserProvider(window.ethereum);
            state.signer = await state.provider.getSigner();
            state.userAddr = await state.signer.getAddress();
            
            document.getElementById("connectBtn").textContent = state.userAddr.slice(0,6) + "..." + state.userAddr.slice(-4);
            document.getElementById("mainBtn").textContent = "Enter Amount";
            
            refreshBalances();
        } catch(e) { console.error(e); }
    }

    // Import Token by Address
    async function importToken(side) {
        const inputId = side === 'in' ? 'addrIn' : 'addrOut';
        const rawAddr = document.getElementById(inputId).value.trim();
        
        if(!ethers.isAddress(rawAddr)) return alert("Invalid Address");

        // Check if NATIVE
        if(rawAddr.toLowerCase() === CONFIG.WBONE.toLowerCase()) {
            state.tokens[side] = { symbol: "BONE", address: "NATIVE", decimals: 18, isNative: true };
        } else {
            try {
                const c = new ethers.Contract(rawAddr, ERC20_ABI, state.provider);
                const sym = await c.symbol();
                const dec = await c.decimals();
                state.tokens[side] = { symbol: sym, address: rawAddr, decimals: dec, isNative: false };
            } catch(e) {
                return alert("Could not fetch token data. Is this an ERC20?");
            }
        }

        // UI Update
        document.getElementById(side === 'in' ? 'symIn' : 'symOut').textContent = state.tokens[side].symbol;
        document.getElementById(inputId).classList.remove('show');
        document.getElementById(inputId).value = "";
        refreshBalances();
        updateQuote();
    }

    async function refreshBalances() {
        if(!state.userAddr) return;
        
        // Helper to get bal
        const getBal = async (t) => {
            if(t.isNative) {
                const b = await state.provider.getBalance(state.userAddr);
                return ethers.formatEther(b);
            } else {
                const c = new ethers.Contract(t.address, ERC20_ABI, state.provider);
                return ethers.formatUnits(await c.balanceOf(state.userAddr), t.decimals);
            }
        };

        const bIn = await getBal(state.tokens.in);
        const bOut = await getBal(state.tokens.out);
        
        document.getElementById("balIn").textContent = parseFloat(bIn).toFixed(4);
        document.getElementById("balOut").textContent = parseFloat(bOut).toFixed(4);
    }

    async function updateQuote() {
        const btn = document.getElementById("mainBtn");
        const val = document.getElementById("amountIn").value;
        
        // Reset
        if(!val || parseFloat(val) === 0) {
            document.getElementById("amountOut").value = "";
            document.getElementById("minOutVal").textContent = "0.00";
            if(state.userAddr) btn.textContent = "Enter Amount";
            return;
        }

        if(!state.userAddr) { btn.textContent = "Connect Wallet"; return; }

        btn.textContent = "Loading...";
        btn.disabled = true;

        try {
            // 1. Get Quote from Router
            const router = new ethers.Contract(CONFIG.ROUTER, ROUTER_ABI, state.provider); // Use provider for read
            const amountInWei = ethers.parseUnits(val, state.tokens.in.decimals);
            
            const path = [
                state.tokens.in.isNative ? CONFIG.WBONE : state.tokens.in.address,
                state.tokens.out.isNative ? CONFIG.WBONE : state.tokens.out.address
            ];

            const amounts = await router.getAmountsOut(amountInWei, path);
            const amountOutWei = amounts[1];
            const amountOutFmt = ethers.formatUnits(amountOutWei, state.tokens.out.decimals);
            
            document.getElementById("amountOut").value = parseFloat(amountOutFmt).toFixed(6);

            // 2. Calc Min Received (Slippage)
            const slipFactor = 10000n - BigInt(state.slippage * 100);
            const minOutWei = (amountOutWei * slipFactor) / 10000n;
            document.getElementById("minOutVal").textContent = parseFloat(ethers.formatUnits(minOutWei, state.tokens.out.decimals)).toFixed(6);

            // 3. Check Allowance (If selling Token)
            if(!state.tokens.in.isNative) {
                const token = new ethers.Contract(state.tokens.in.address, ERC20_ABI, state.provider);
                const allowed = await token.allowance(state.userAddr, CONFIG.ROUTER);
                
                if(allowed < amountInWei) {
                    btn.textContent = `Approve ${state.tokens.in.symbol}`;
                    btn.onclick = executeApprove;
                    btn.disabled = false;
                    return;
                }
            }

            btn.textContent = "SWAP";
            btn.onclick = executeSwap;
            btn.disabled = false;

        } catch(e) {
            console.error(e);
            document.getElementById("amountOut").value = "0";
            btn.textContent = "Insufficient Liquidity";
            btn.disabled = true;
        }
    }

    // --- 5. ACTION FUNCTIONS ---

    async function executeApprove() {
        const btn = document.getElementById("mainBtn");
        const status = document.getElementById("status");
        
        try {
            btn.disabled = true;
            btn.textContent = "Approving...";
            
            const token = new ethers.Contract(state.tokens.in.address, ERC20_ABI, state.signer);
            const tx = await token.approve(CONFIG.ROUTER, ethers.MaxUint256);
            
            status.innerHTML = `Approving... <a href="https://shibariumscan.io/tx/${tx.hash}" target="_blank">View Tx</a>`;
            await tx.wait();
            
            status.textContent = "✅ Approved!";
            updateQuote(); // Re-run logic to switch button to "Swap"
            
        } catch(e) {
            status.textContent = "❌ Approve Failed";
            btn.disabled = false;
            btn.textContent = `Approve ${state.tokens.in.symbol}`;
        }
    }

    async function executeSwap() {
        const btn = document.getElementById("mainBtn");
        const status = document.getElementById("status");
        const val = document.getElementById("amountIn").value;

        try {
            btn.disabled = true;
            btn.textContent = "Confirm in Wallet...";
            status.textContent = "";

            const router = new ethers.Contract(CONFIG.ROUTER, ROUTER_ABI, state.signer);
            const amountInWei = ethers.parseUnits(val, state.tokens.in.decimals);
            
            // Recalculate Min Out just before tx
            const path = [
                state.tokens.in.isNative ? CONFIG.WBONE : state.tokens.in.address,
                state.tokens.out.isNative ? CONFIG.WBONE : state.tokens.out.address
            ];
            // We trust the quote we just got, or re-fetch. Let's re-fetch for safety
            const amounts = await router.getAmountsOut(amountInWei, path);
            const slipFactor = 10000n - BigInt(state.slippage * 100);
            const minOutWei = (amounts[1] * slipFactor) / 10000n;
            
            const deadline = Math.floor(Date.now()/1000) + 1200; // 20 mins

            let tx;
            if(state.tokens.in.isNative) {
                // ETH -> Token
                tx = await router.swapExactETHForTokens(minOutWei, path, state.userAddr, deadline, { value: amountInWei });
            } else if(state.tokens.out.isNative) {
                // Token -> ETH
                tx = await router.swapExactTokensForETH(amountInWei, minOutWei, path, state.userAddr, deadline);
            } else {
                // Token -> Token
                tx = await router.swapExactTokensForTokens(amountInWei, minOutWei, path, state.userAddr, deadline);
            }

            status.innerHTML = `🚀 Swap Sent! <a href="https://shibariumscan.io/tx/${tx.hash}" target="_blank">View Tx</a>`;
            btn.textContent = "Swapping...";
            
            await tx.wait();
            
            status.textContent = "🎉 Swap Complete!";
            btn.textContent = "Swap Again";
            refreshBalances();
            document.getElementById("amountIn").value = "";
            document.getElementById("amountOut").value = "";

        } catch(e) {
            console.error(e);
            let msg = "Swap Failed";
            if(e.message.includes("INSUFFICIENT_OUTPUT")) msg = "Slippage Error: Price moved too fast";
            status.textContent = "❌ " + msg;
        } finally {
            btn.disabled = false;
            if(btn.textContent === "Swapping...") btn.textContent = "SWAP";
        }
    }

    // --- 6. UI HELPERS ---
    function toggleAddr(side) {
        document.getElementById(side === 'in' ? 'addrIn' : 'addrOut').classList.toggle('show');
    }

    function switchSides() {
        const temp = state.tokens.in;
        state.tokens.in = state.tokens.out;
        state.tokens.out = temp;

        document.getElementById("symIn").textContent = state.tokens.in.symbol;
        document.getElementById("symOut").textContent = state.tokens.out.symbol;
        
        refreshBalances();
        updateQuote();
    }

    function setSlippage(val) {
        state.slippage = val;
        document.querySelectorAll('.slip-btn').forEach(b => {
            b.classList.toggle('active', b.textContent.includes(val));
        });
        updateQuote();
    }
    
    function setMax() {
        if(state.tokens.in.isNative) {
             // Leave dust for gas
             const bal = document.getElementById("balIn").textContent;
             const max = parseFloat(bal) - 0.5;
             document.getElementById("amountIn").value = max > 0 ? max : 0;
        } else {
            document.getElementById("amountIn").value = document.getElementById("balIn").textContent;
        }
        updateQuote();
    }

    // Listeners
    document.getElementById("connectBtn").addEventListener("click", connect);
    document.getElementById("mainBtn").addEventListener("click", connect); // Default action
    document.getElementById("amountIn").addEventListener("input", updateQuote);

    // Auto-Init
    init();

</script>
</body>
</html>
