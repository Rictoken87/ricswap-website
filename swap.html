<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RicSwap | Swap</title>
    <script src="https://cloudflare.com"></script>
    <style>
        :root { --obsidian: #080808; --card-bg: #121212; --magma: linear-gradient(135deg, #ff4d00 0%, #ff8c00 100%); --gold: #ffd700; }
        body { background: var(--obsidian); color: white; font-family: system-ui, sans-serif; margin: 0; padding: 0; }
        .nav { padding: 20px 40px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; border-bottom: 1px solid rgba(255,215,0,0.1); }
        .logo { font-size: 28px; font-weight: bold; color: var(--gold); }
        .nav-links { display: flex; gap: 30px; justify-content: center; }
        .nav-links a { color: #888; text-decoration: none; font-weight: 500; }
        .nav-links a:hover, .nav-links a.active { color: var(--gold); }
        .connect-btn { justify-self: end; background: #222; color: white; border: 1px solid #444; padding: 10px 0; width: 160px; border-radius: 9999px; font-size: 14px; font-weight: 600; cursor: pointer; text-align: center; }
        .card { max-width: 420px; margin: 40px auto; background: var(--card-bg); border-radius: 24px; padding: 32px; box-shadow: 0 20px 40px rgba(0,0,0,0.8); border: 1px solid #222; }
        .input-group { background: #1a1a1a; border-radius: 16px; padding: 16px; margin-bottom: 16px; border: 1px solid #333; }
        .input-group:focus-within { border-color: var(--gold); }
        label { display: block; color: #888; font-size: 12px; margin-bottom: 8px; text-transform: uppercase; }
        input { background: transparent; border: none; color: white; font-size: 28px; width: 100%; outline: none; }
        button#swapBtn { background: var(--magma); color: white; border: none; padding: 18px; border-radius: 16px; font-weight: bold; width: 100%; font-size: 18px; cursor: pointer; margin-top: 20px; transition: 0.2s; }
        button#swapBtn:disabled { opacity: 0.5; cursor: not-allowed; }
        .status { margin-top: 15px; text-align: center; font-size: 13px; min-height: 24px; font-family: monospace; line-height: 1.5; }
        .tx-link { color: var(--gold); text-decoration: underline; }
    </style>
</head>
<body>
    <div class="nav">
        <div class="logo">RicSwap</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="swap.html" class="active">Swap</a>
            <a href="pools.html">Pools</a>
            <a href="liquidity.html">Add Liquidity</a>
        </div>
        <button id="connectBtn" class="connect-btn">Connect Wallet</button>
    </div>
    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
            <span style="font-weight:bold; font-size:18px;">Swap</span>
            <span style="color:var(--gold); font-size:12px; font-weight:600;">SHIBARIUM</span>
        </div>
        <div class="input-group">
            <div style="display:flex; justify-content:space-between;">
                <label>You Pay</label>
                <span id="fromBalance" style="font-size:11px; color:#888;">Balance: --</span>
            </div>
            <input type="number" id="fromAmount" placeholder="0.0" value="1">
            <div style="margin-top:8px; font-size:14px; font-weight:600; color:var(--gold);">BONE</div>
        </div>
        <div style="text-align:center; margin: -10px 0; color:#444; font-size:24px;">↓</div>
        <div class="input-group">
            <div style="display:flex; justify-content:space-between;">
                <label>You Receive</label>
                <span id="toBalance" style="font-size:11px; color:#888;">Balance: --</span>
            </div>
            <input type="number" id="toAmount" placeholder="0.0" disabled style="color: #666;">
            <div style="margin-top:8px; font-size:14px; font-weight:600;">RIC</div>
        </div>
        <div id="priceInfo" style="font-size:11px; color:#555; text-align:right; padding: 4px;">Slippage: 0.5%</div>
        <button id="swapBtn">Swap Now</button>
        <div class="status" id="status">Ready</div>
    </div>

<script>
    const ROUTER_ADDRESS = "0xA809a9060D36f5324061EF93192ad5DA12Afc62e";
    const WBONE = "0xC76F4c819D820369Fb2d7C1531aB3Bb18e6fE8d8";
    const RIC = "0x12C94d3A30daa09f81Ea6c037004E6e99A4A3dfc";
    
    let provider, signer, userAddress, quoteTimeout;

    async function connectWallet() {
        if (!window.ethereum) return alert("Install MetaMask");
        try {
            provider = new ethers.BrowserProvider(window.ethereum);
            const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
            userAddress = accounts[0];
            signer = await provider.getSigner();
            document.getElementById("connectBtn").textContent = userAddress.slice(0,6) + "..." + userAddress.slice(-4);
            loadBalances();
            updateQuote();
        } catch (e) { console.error(e); }
    }

    async function loadBalances() {
        if (!userAddress) return;
        try {
            const boneBal = await provider.getBalance(userAddress);
            document.getElementById("fromBalance").textContent = `Balance: ${Number(ethers.formatEther(boneBal)).toFixed(4)}`;
            
            const ricContract = new ethers.Contract(RIC, ["function balanceOf(address) view returns (uint256)"], provider);
            const ricBal = await ricContract.balanceOf(userAddress);
            document.getElementById("toBalance").textContent = `Balance: ${Number(ethers.formatEther(ricBal)).toFixed(2)}`;
        } catch (e) { console.warn(e); }
    }

    async function updateQuote() {
        const val = document.getElementById("fromAmount").value;
        const toInput = document.getElementById("toAmount");
        if (!val || val <= 0) { toInput.value = ""; return; }
        try {
            const router = new ethers.Contract(ROUTER_ADDRESS, [
                "function getAmountsOut(uint amountIn, address[] memory path) public view returns (uint[] memory amounts)"
            ], provider);
            const amounts = await router.getAmountsOut(ethers.parseEther(val), [WBONE, RIC]);
            toInput.value = Number(ethers.formatEther(amounts[1])).toFixed(6);
        } catch (e) { toInput.value = "No Liquidity"; }
    }

    async function executeSwap() {
        if (!signer) return connectWallet();
        const status = document.getElementById("status");
        const btn = document.getElementById("swapBtn");
        const val = document.getElementById("fromAmount").value;
        
        try {
            btn.disabled = true;
            status.style.color = "orange";
            status.textContent = "Estimating Quote...";
            
            const router = new ethers.Contract(ROUTER_ADDRESS, [
                "function getAmountsOut(uint amountIn, address[] memory path) public view returns (uint[] memory amounts)",
                "function swapExactBONEForTokens(uint amountOutMin, address[] calldata path, address to, uint deadline) external payable returns (uint[] memory amounts)",
                "function swapExactETHForTokens(uint amountOutMin, address[] calldata path, address to, uint deadline) external payable returns (uint[] memory amounts)"
            ], signer);

            const amtIn = ethers.parseEther(val);
            const path = [WBONE, RIC];
            const deadline = Math.floor(Date.now()/1000) + 1200;
            
            const amounts = await router.getAmountsOut(amtIn, path);
            const minOut = (amounts[1] * 995n) / 1000n; // 0.5% slippage

            status.textContent = "Confirm in Wallet...";
            
            // EXPERT FIX: Hardcoded gas limit to prevent 'Check Balance' estimation failure
            const overrides = { value: amtIn, gasLimit: 300000 };

            let tx;
            try {
                tx = await router.swapExactBONEForTokens(minOut, path, userAddress, deadline, overrides);
            } catch (err) {
                console.log("Retrying with standard ETH method...");
                tx = await router.swapExactETHForTokens(minOut, path, userAddress, deadline, overrides);
            }

            status.textContent = "Processing Swap...";
            await tx.wait();
            status.style.color = "#0f0";
            status.innerHTML = `✅ Swap Success! 🔥<br><a href="https://shibariumscan.io{tx.hash}" target="_blank" class="tx-link">View Receipt</a>`;
            loadBalances();
        } catch (e) {
            console.error(e);
            status.style.color = "red";
            status.textContent = e.reason || "Swap Failed: Not enough BONE for Gas";
        } finally { btn.disabled = false; }
    }

    document.getElementById("fromAmount").oninput = () => {
        clearTimeout(quoteTimeout);
        quoteTimeout = setTimeout(updateQuote, 500);
    };

    document.getElementById("connectBtn").onclick = connectWallet;
    document.getElementById("swapBtn").onclick = executeSwap;
    window.onload = () => { if(window.ethereum?.selectedAddress) connectWallet(); }
</script>
</body>
</html>
