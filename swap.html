<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RicSwap | Swap</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
    <style>
        :root { --obsidian: #080808; --card-bg: #121212; --magma: linear-gradient(135deg, #ff4d00 0%, #ff8c00 100%); --gold: #ffd700; }
        body { background: var(--obsidian); color: white; font-family: system-ui, sans-serif; margin: 0; padding: 0; }
        .nav { padding: 20px 40px; display: flex; align-items: center; border-bottom: 1px solid rgba(255,215,0,0.1); }
        .logo { font-size: 28px; font-weight: bold; color: var(--gold); }
        .nav-links { display: flex; gap: 30px; margin-left: 40px; }
        .nav-links a { color: white; text-decoration: none; font-weight: 500; }
        .nav-links a:hover, .nav-links a.active { color: var(--gold); }
        .connect-btn { background: #222; color: white; border: 1px solid #444; padding: 8px 18px; border-radius: 9999px; font-size: 14px; font-weight: 500; cursor: pointer; white-space: nowrap; margin-left: auto; flex-shrink: 0; }
        .connect-btn:hover { background: #333; border-color: var(--gold); }
        .card { max-width: 420px; margin: 40px auto; background: var(--card-bg); border-radius: 24px; padding: 32px; box-shadow: 0 20px 40px rgba(0,0,0,0.8); border: 1px solid #222; }
        .input-group { background: #1a1a1a; border-radius: 16px; padding: 16px; margin-bottom: 8px; border: 1px solid #333; }
        .input-group:focus-within { border-color: var(--gold); }
        label { display: block; color: #888; font-size: 12px; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        input { background: transparent; border: none; color: white; font-size: 28px; width: 100%; outline: none; }
        button { background: var(--magma); color: white; border: none; padding: 18px; border-radius: 16px; font-weight: bold; width: 100%; font-size: 18px; cursor: pointer; margin-top: 20px; transition: 0.2s; }
        .status { margin-top: 15px; text-align: center; font-size: 13px; min-height: 24px; font-family: monospace; }
        .tx-link { color: var(--gold); text-decoration: underline; font-size: 13px; }
        .swap-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    </style>
</head>
<body>
    <div class="nav">
        <div class="logo">RicSwap</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="swap.html" class="active">Swap</a>
            <a href="pools.html">Pools</a>
            <a href="liquidity.html">Add Liquidity</a>
        </div>
        <button id="connectBtn" class="connect-btn">Connect Wallet</button>
    </div>

    <div class="card">
        <div class="swap-header">
            <span style="font-weight:bold; font-size:18px;">Swap</span>
            <span style="color:#888; font-size:11px;">SHIBARIUM</span>
        </div>

        <div class="input-group">
            <div style="display:flex; justify-content:space-between;">
                <label>You Pay</label>
                <span id="fromBalance" style="font-size:11px; color:#666;">Balance: --</span>
            </div>
            <input type="number" id="fromAmount" placeholder="0.0" value="1">
            <div style="margin-top:8px; font-size:14px; font-weight:600; color:var(--gold);">BONE</div>
        </div>

        <div style="text-align:center; margin: -10px 0; color:#444; font-size:24px;">↓</div>

        <div class="input-group">
            <div style="display:flex; justify-content:space-between;">
                <label>You Receive</label>
                <span id="toBalance" style="font-size:11px; color:#666;">Balance: --</span>
            </div>
            <input type="text" id="toAmount" placeholder="0.0" readonly style="color: #888;">
            <div style="margin-top:8px; font-size:14px; font-weight:600;">RIC</div>
        </div>

        <button id="swapBtn">Swap Now</button>
        <div class="status" id="status"></div>
    </div>

<script>
    const ROUTER_ADDRESS = "0xA809a9060D36f5324061EF93192ad5DA12Afc62e";
    const WBONE = "0xC76F4c819D820369Fb2d7C1531aB3Bb18e6fE8d8";
    const RIC = "0x12C94d3A30daa09f81Ea6c037004E6e99A4A3dfc";
    
    let provider, signer, userAddress, quoteTimeout;

    async function connectWallet() {
        if (!window.ethereum) return alert("Install MetaMask");
        try {
            provider = new ethers.BrowserProvider(window.ethereum);
            const accounts = await provider.send("eth_requestAccounts", []);
            userAddress = accounts;
            signer = await provider.getSigner();
            document.getElementById("connectBtn").textContent = userAddress.slice(0,6) + "..." + userAddress.slice(-4);
            
            // Expert Addition: Fetch live balances on connect
            loadBalances();
            updateQuote();
        } catch (e) { console.error(e); }
    }

    async function loadBalances() {
        if (!userAddress) return;
        try {
            const bBal = await provider.getBalance(userAddress);
            document.getElementById("fromBalance").textContent = `Bal: ${Number(ethers.formatEther(bBal)).toFixed(4)}`;
            
            const ricContract = new ethers.Contract(RIC, ["function balanceOf(address) view returns (uint256)"], provider);
            const rBal = await ricContract.balanceOf(userAddress);
            document.getElementById("toBalance").textContent = `Bal: ${Number(ethers.formatEther(rBal)).toFixed(2)}`;
        } catch (e) { console.warn("Balance error", e); }
    }

    async function updateQuote() {
        const val = document.getElementById("fromAmount").value;
        const toInput = document.getElementById("toAmount");
        if (!val || val <= 0 || !provider) { toInput.value = ""; return; }
        try {
            const router = new ethers.Contract(ROUTER_ADDRESS, ["function getAmountsOut(uint amountIn, address[] memory path) public view returns (uint[] memory amounts)"], provider);
            const amounts = await router.getAmountsOut(ethers.parseEther(val), [WBONE, RIC]);
            toInput.value = Number(ethers.formatEther(amounts)).toFixed(6);
        } catch (e) { toInput.value = "No Liquidity"; }
    }

    async function executeSwap() {
        if (!signer) return connectWallet();
        const status = document.getElementById("status");
        const val = document.getElementById("fromAmount").value;
        try {
            status.style.color = "orange";
            status.textContent = "Estimating Quote...";
            const router = new ethers.Contract(ROUTER_ADDRESS, [
                "function getAmountsOut(uint amountIn, address[] memory path) public view returns (uint[] memory amounts)",
                "function swapExactBONEForTokens(uint amountOutMin, address[] calldata path, address to, uint deadline) external payable returns (uint[] memory amounts)"
            ], signer);

            const amtIn = ethers.parseEther(val);
            const amounts = await router.getAmountsOut(amtIn, [WBONE, RIC]);
            const minOut = (amounts * 995n) / 1000n; // 0.5% slippage safety

            status.textContent = "Confirm in Wallet...";
            const tx = await router.swapExactBONEForTokens(
                minOut, [WBONE, RIC], userAddress, Math.floor(Date.now()/1000) + 1200, 
                { value: amtIn, gasLimit: 500000 }
            );
            
            status.textContent = "Processing Swap...";
            await tx.wait();
            status.style.color = "#0f0";
            status.innerHTML = `✅ Success! 🔥<br><a href="https://shibariumscan.io/tx/${tx.hash}" target="_blank" class="tx-link">View Receipt</a>`;
            loadBalances();
        } catch (e) {
            status.style.color = "red";
            status.textContent = "Check Balance or Slippage";
        }
    }

    document.getElementById("connectBtn").onclick = connectWallet;
    document.getElementById("swapBtn").onclick = executeSwap;
    document.getElementById("fromAmount").oninput = () => {
        clearTimeout(quoteTimeout);
        quoteTimeout = setTimeout(updateQuote, 500);
    };

    // Auto-connect if already authorized
    window.onload = () => { if (window.ethereum?.selectedAddress) connectWallet(); }
</script>
</body>
</html>
