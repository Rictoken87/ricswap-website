<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RicSwap - Swap</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
    
    <style>
        :root { --gold: #ffd700; --accent: #ff4d00; --bg: #0a0a0a; --card: #111; }
        body { background: var(--bg); color: #e0e0e0; font-family: 'Inter', sans-serif; margin:0; padding:0; }
        .nav { padding: 18px 5%; background: rgba(10,10,10,0.95); backdrop-filter: blur(16px); display:flex; align-items:center; border-bottom:1px solid rgba(255,215,0,0.1); position:sticky; top:0; z-index:1000; }
        .logo { font-size:28px; font-weight:900; background:linear-gradient(90deg,#ffd700,#ffaa00); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .nav-links a { color:#aaa; margin-left:36px; text-decoration:none; font-weight:500; }
        .nav-links a:hover, .nav-links a.active { color:var(--gold); }
        .connect-btn { margin-left:auto; background:transparent; color:var(--gold); border:2px solid var(--gold); padding:8px 22px; border-radius:50px; font-size:14px; font-weight:600; cursor:pointer; }

        .container { max-width:620px; margin:40px auto; padding:20px; }
        .card { background:var(--card); border-radius:24px; padding:32px; border:1px solid #222; }
        h2 { color:var(--gold); margin:0 0 20px 0; }

        .tab { display:flex; background:#1a1a1a; border-radius:12px; padding:4px; margin-bottom:25px; }
        .tab-btn { flex:1; padding:12px; border-radius:10px; text-align:center; font-weight:600; cursor:pointer; transition:0.3s; }
        .tab-btn.active { background:var(--gold); color:black; }

        input { width:100%; padding:16px; background:#1a1a1a; border:1px solid #333; border-radius:12px; color:white; font-size:1.1rem; margin-bottom:15px; outline:none; }
        input:focus { border-color: var(--gold); }

        .btn-action { background:linear-gradient(135deg, var(--accent), #cc3d00); color:white; border:none; padding:16px; border-radius:12px; font-weight:700; width:100%; cursor:pointer; margin-top:10px; }
        .btn-action:hover { transform:scale(1.02); }
        .btn-action:disabled { opacity:0.5; cursor:not-allowed; }

        .status { margin-top:15px; font-size:0.95rem; min-height:24px; color:#aaa; }
    </style>
</head>
<body>
    <nav class="nav">
        <a href="index.html" class="logo">RicSwap</a>
        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="swap.html" class="active">Swap</a>
            <a href="pools.html">Pools</a>
            <a href="liquidity.html">Liquidity</a>
        </div>
        <button id="connectBtn" class="connect-btn" onclick="connectWallet()">Connect Wallet</button>
    </nav>

    <div class="container">
        <div class="card">
            <h2>Swap Tokens</h2>

            <!-- Tab Navigation -->
            <div class="tab">
                <div class="tab-btn active" onclick="switchTab(0)" id="tab0">Normal Swap</div>
                <div class="tab-btn" onclick="switchTab(1)" id="tab1">Pay Gas with RIC</div>
            </div>

            <!-- Normal Swap -->
            <div id="normalSwapTab">
                <p style="color:#888; text-align:center; padding:40px 20px;">
                    Normal Swap UI will be added here.<br>
                    (You can put your existing swap form in this section)
                </p>
                <button class="btn-action" onclick="alert('Normal Swap - Coming Soon')">Swap with BONE</button>
            </div>

            <!-- RicGas Tab -->
            <div id="ricGasTab" style="display:none;">
                <h3 style="color:var(--accent);">⛽ Pay Gas with RIC</h3>
                <p style="color:#888; font-size:0.9rem; margin-bottom:20px;">
                    No BONE? Swap RIC directly for gas in one click.
                </p>
                
                <input type="number" id="ricAmount" placeholder="Enter RIC amount" value="1000">
                
                <button id="ricGasBtn" class="btn-action" onclick="payWithRIC()">
                    Pay Gas with RIC
                </button>
                
                <div id="status" class="status"></div>
            </div>
        </div>
    </div>

    <script>
        let signer, userAddress;
        const RIC_ADDRESS = "0x12C94d3A30daa09f81Ea6c037004E6e99A4A3dfc";
        const RICGAS_ADDRESS = "0x054Fcc4B7cd11f01735aE4e79131908E3Ff61B59";

        async function connectWallet() {
            if (!window.ethereum) return alert("Please install MetaMask or Rabby");
            const provider = new ethers.BrowserProvider(window.ethereum);
            await provider.send("eth_requestAccounts", []);
            signer = await provider.getSigner();
            userAddress = await signer.getAddress();
            document.getElementById("connectBtn").textContent = userAddress.slice(0,6) + "..." + userAddress.slice(-4);
        }

        function switchTab(tab) {
            document.getElementById("normalSwapTab").style.display = tab === 0 ? "block" : "none";
            document.getElementById("ricGasTab").style.display = tab === 1 ? "block" : "none";
            
            document.getElementById("tab0").classList.toggle("active", tab === 0);
            document.getElementById("tab1").classList.toggle("active", tab === 1);
        }

        async function payWithRIC() {
            const btn = document.getElementById("ricGasBtn");
            const status = document.getElementById("status");
            
            if (!signer) {
                await connectWallet();
                return;
            }

            const ricAmountStr = document.getElementById("ricAmount").value;
            if (!ricAmountStr || parseFloat(ricAmountStr) <= 0) {
                return alert("Please enter a valid RIC amount");
            }

            try {
                btn.disabled = true;
                btn.innerText = "Processing...";
                status.innerHTML = "⏳ Checking...";

                const ricWei = ethers.parseUnits(ricAmountStr, 18);

                const ricContract = new ethers.Contract(RIC_ADDRESS, [
                    "function approve(address, uint256) public returns (bool)",
                    "function allowance(address, address) view returns (uint256)"
                ], signer);

                const gasContract = new ethers.Contract(RICGAS_ADDRESS, [
                    "function payGasWithRIC(uint256, uint256) external"
                ], signer);

                // Approve if needed
                const allowance = await ricContract.allowance(userAddress, RICGAS_ADDRESS);
                if (allowance < ricWei) {
                    status.innerHTML = "📝 Approving RIC...";
                    const approveTx = await ricContract.approve(RICGAS_ADDRESS, ricWei);
                    await approveTx.wait();
                }

                // Execute RicGas
                status.innerHTML = "⛽ Confirm in wallet...";
                const tx = await gasContract.payGasWithRIC(ricWei, ethers.parseUnits("0.01", 18));

                status.innerHTML = `🚀 Sent! <a href="https://shibariumscan.io/tx/${tx.hash}" target="_blank" style="color:#ffaa00">View Tx</a>`;

                const receipt = await tx.wait();
                if (receipt.status === 1) {
                    btn.innerText = "✅ SUCCESS!";
                    status.innerHTML = `🎉 Gas received successfully!`;
                }
            } catch (error) {
                console.error(error);
                btn.innerText = "Try Again";
                status.innerText = "❌ " + (error.shortMessage || error.message);
            } finally {
                btn.disabled = false;
            }
        }

        // Auto connect
        window.onload = () => {
            if (window.ethereum) connectWallet();
        };
    </script>
</body>
</html>
