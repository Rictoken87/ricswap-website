<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RicSwap - Swap</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
    
    <style>
        :root { --gold: #ffd700; --accent: #ff4d00; --bg: #0a0a0a; --card: #111; }
        body { background: var(--bg); color: #e0e0e0; font-family: 'Inter', sans-serif; margin:0; padding:0; }
        .nav { padding: 18px 5%; background: rgba(10,10,10,0.95); backdrop-filter: blur(16px); display:flex; align-items:center; border-bottom:1px solid rgba(255,215,0,0.1); position:sticky; top:0; z-index:1000; }
        .logo { font-size:28px; font-weight:900; background:linear-gradient(90deg,#ffd700,#ffaa00); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .nav-links a { color:#aaa; margin-left:36px; text-decoration:none; font-weight:500; }
        .nav-links a:hover, .nav-links a.active { color:var(--gold); }
        .connect-btn { margin-left:auto; background:transparent; color:var(--gold); border:2px solid var(--gold); padding:8px 22px; border-radius:50px; font-size:14px; font-weight:600; cursor:pointer; }

        .container { max-width:620px; margin:40px auto; padding:20px; }
        .card { background:var(--card); border-radius:24px; padding:32px; border:1px solid #222; }
        h2 { color:var(--gold); margin:0 0 20px 0; }

        .swap-box { background:#1a1a1a; padding:20px; border-radius:16px; margin-bottom:15px; }
        .balance { font-size:0.85rem; color:#888; text-align:right; margin-bottom:6px; }
        input { width:100%; background:transparent; border:none; color:white; font-size:1.8rem; font-weight:600; outline:none; }
        .token-row { display:flex; justify-content:space-between; align-items:center; gap:10px; }
        input.token-address { font-size:0.95rem; padding:8px; background:#222; border:1px solid #444; border-radius:8px; flex:1; }

        .btn-action { background:linear-gradient(135deg, var(--accent), #cc3d00); color:white; border:none; padding:16px; border-radius:12px; font-weight:700; width:100%; cursor:pointer; margin-top:10px; }
        .status { margin-top:15px; font-size:0.95rem; min-height:24px; color:#aaa; text-align:center; }
    </style>
</head>
<body>
    <nav class="nav">
        <a href="index.html" class="logo">RicSwap</a>
        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="swap.html" class="active">Swap</a>
            <a href="pools.html">Pools</a>
            <a href="liquidity.html">Liquidity</a>
        </div>
        <button id="connectBtn" class="connect-btn" onclick="connectWallet()">Connect Wallet</button>
    </nav>

    <div class="container">
        <div class="card">
            <h2>Swap Tokens</h2>

            <div class="swap-box">
                <div class="balance">From Balance: <span id="fromBalance">0.0000</span></div>
                <div class="token-row">
                    <input type="number" id="fromAmount" placeholder="0.0" oninput="updateQuote()">
                    <input type="text" id="fromToken" value="0xC76F4c819D820369Fb2d7C1531aB3Bb18e6fE8d8" class="token-address" onblur="loadTokenInfo('from')">
                </div>
            </div>

            <div class="swap-box">
                <div class="balance">To Balance: <span id="toBalance">0.0000</span></div>
                <div class="token-row">
                    <input type="number" id="toAmount" placeholder="0.0" readonly>
                    <input type="text" id="toToken" value="0x12C94d3A30daa09f81Ea6c037004E6e99A4A3dfc" class="token-address" onblur="loadTokenInfo('to')">
                </div>
            </div>

            <button class="btn-action" onclick="performSwap()">Swap Now</button>
            <div id="status" class="status"></div>
        </div>
    </div>

    <script>
        let signer, userAddress, provider;
        const ROUTER = "0x8BC26741c4B381cF1a8392318133c1cCABb78775";
        const PAIR = "0x941abcb1A4278Ff33B50F6Cf9F5A4C8a0888BdeE";

        async function connectWallet() {
            if (!window.ethereum) return alert("Please install MetaMask or Rabby");
            provider = new ethers.BrowserProvider(window.ethereum);
            await provider.send("eth_requestAccounts", []);
            signer = await provider.getSigner();
            userAddress = await signer.getAddress();
            document.getElementById("connectBtn").textContent = userAddress.slice(0,6) + "..." + userAddress.slice(-4);
            
            await loadTokenInfo('from');
            await loadTokenInfo('to');
        }

        async function loadTokenInfo(side) {
            const addr = document.getElementById(side + "Token").value.trim();
            if (!ethers.isAddress(addr)) return;

            try {
                const token = new ethers.Contract(addr, [
                    "function balanceOf(address) view returns (uint256)",
                    "function symbol() view returns (string)"
                ], provider);

                const bal = await token.balanceOf(userAddress);
                document.getElementById(side + "Balance").textContent = parseFloat(ethers.formatUnits(bal, 18)).toFixed(4);
            } catch (e) {
                console.error(e);
            }
        }

        async function updateQuote() {
            const amtStr = document.getElementById("fromAmount").value;
            if (!amtStr || parseFloat(amtStr) <= 0) {
                document.getElementById("toAmount").value = "";
                return;
            }

            try {
                const pair = new ethers.Contract(PAIR, [
                    "function getReserves() view returns (uint112 r0, uint112 r1, uint32 ts)",
                    "function token0() view returns (address)"
                ], provider);

                const [r0, r1] = await pair.getReserves();
                const token0 = await pair.token0();

                // Determine correct reserves
                const fromAddr = document.getElementById("fromToken").value;
                const reserveIn = (token0 === fromAddr) ? r0 : r1;
                const reserveOut = (token0 === fromAddr) ? r1 : r0;

                const amountIn = ethers.parseEther(amtStr);
                const amountOut = (amountIn * reserveOut * 997n) / (reserveIn * 1000n);

                document.getElementById("toAmount").value = parseFloat(ethers.formatEther(amountOut)).toFixed(4);
            } catch (e) {
                console.error(e);
            }
        }

        async function performSwap() {
            const status = document.getElementById("status");
            const amountStr = document.getElementById("fromAmount").value;
            if (!amountStr) return alert("Enter amount");

            if (!signer) return await connectWallet();

            status.innerHTML = "Approving token...";

            try {
                const fromTokenAddr = document.getElementById("fromToken").value;
                const amountIn = ethers.parseEther(amountStr);

                // Approve
                const token = new ethers.Contract(fromTokenAddr, ["function approve(address,uint256)"], signer);
                const allowance = await token.allowance(userAddress, ROUTER);
                if (allowance < amountIn) {
                    await (await token.approve(ROUTER, amountIn)).wait();
                }

                status.innerHTML = "Swapping...";

                const router = new ethers.Contract(ROUTER, [
                    "function swapExactTokensForTokens(uint256 amountIn, uint256 amountOutMin, address[] path, address to, uint256 deadline)"
                ], signer);

                const path = [fromTokenAddr, document.getElementById("toToken").value];
                const tx = await router.swapExactTokensForTokens(
                    amountIn,
                    0,
                    path,
                    userAddress,
                    Math.floor(Date.now() / 1000) + 600
                );

                status.innerHTML = `✅ Success! <a href="https://shibariumscan.io/tx/${tx.hash}" target="_blank">View Tx</a>`;
                await tx.wait();
                await loadTokenInfo('from');
                await loadTokenInfo('to');
            } catch (e) {
                console.error(e);
                status.innerHTML = "❌ " + (e.shortMessage || e.message);
            }
        }

        window.onload = () => { if (window.ethereum) connectWallet(); };
    </script>
</body>
</html>
