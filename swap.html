<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RicSwap | Swap</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
    <style>
        :root {
            --obsidian: #080808;
            --card-bg: #121212;
            --magma: linear-gradient(135deg, #ff4d00 0%, #ff8c00 100%);
            --gold: #ffd700;
        }
        body { background: var(--obsidian); color: white; font-family: system-ui, sans-serif; margin: 0; padding: 0; }
        
        .nav { padding: 15px 40px; display: flex; align-items: center; border-bottom: 1px solid rgba(255,215,0,0.1); }
        .logo { font-size: 24px; font-weight: bold; color: var(--gold); }
        .nav-links { display: flex; gap: 25px; margin-left: 40px; }
        .nav-links a { color: white; text-decoration: none; font-weight: 500; font-size: 14px; }
        .nav-links a:hover, .nav-links a.active { color: var(--gold); }
        
        .connect-btn { 
            background: #1a1a1a; color: var(--gold); border: 1.5px solid var(--gold);
            padding: 6px 16px; border-radius: 6px; font-size: 12px; font-weight: 700;
            cursor: pointer; white-space: nowrap; margin-left: auto;
        }
        .connect-btn:hover { background: var(--gold); color: black; }

        .card { max-width: 420px; margin: 40px auto; background: var(--card-bg); border-radius: 24px; padding: 32px; box-shadow: 0 20px 40px rgba(0,0,0,0.8); border: 1px solid #222; }
        .input-group { background: #1a1a1a; border-radius: 16px; padding: 16px; margin-bottom: 8px; border: 1px solid #333; }
        .input-group:focus-within { border-color: var(--gold); }
        label { display: block; color: #888; font-size: 12px; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        input { background: transparent; border: none; color: white; font-size: 28px; width: 100%; outline: none; }
        .main-btn { background: var(--magma); color: white; border: none; padding: 18px; border-radius: 16px; font-weight: bold; width: 100%; font-size: 18px; cursor: pointer; margin-top: 20px; }
        .status { margin-top: 15px; text-align: center; font-size: 13px; min-height: 24px; }
        .tx-link { color: var(--gold); text-decoration: underline; }
        
        .tab { display: flex; background: #1a1a1a; border-radius: 12px; padding: 4px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 10px; border-radius: 10px; text-align: center; font-weight: 600; cursor: pointer; }
        .tab-btn.active { background: var(--gold); color: black; }
    </style>
</head>
<body>
    <div class="nav">
        <div class="logo">RicSwap</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="swap.html" class="active">Swap</a>
            <a href="pools.html">Pools</a>
            <a href="liquidity.html">Add Liquidity</a>
        </div>
        <button id="connectBtn" class="connect-btn">Connect Wallet</button>
    </div>

    <div class="card">
        <div class="tab">
            <div class="tab-btn active" onclick="switchTab(0)" id="tabNormal">Normal Swap</div>
            <div class="tab-btn" onclick="switchTab(1)" id="tabGas">Pay Gas with RIC</div>
        </div>

        <!-- Normal Swap -->
        <div id="normalTab">
            <div class="input-group">
                <div style="display:flex; justify-content:space-between;">
                    <label>You Pay</label>
                    <span id="fromBalance" style="font-size:12px; color:#888;">Balance: --</span>
                </div>
                <input type="number" id="fromAmount" placeholder="0.0" value="1" oninput="updateQuote()">
                <div style="margin-top:8px; font-size:14px; font-weight:600;">BONE</div>
            </div>

            <div style="text-align:center; margin: -10px 0; color:#666; font-size:24px;">↓</div>

            <div class="input-group">
                <div style="display:flex; justify-content:space-between;">
                    <label>You Receive</label>
                    <span id="toBalance" style="font-size:12px; color:#888;">Balance: --</span>
                </div>
                <input type="number" id="toAmount" placeholder="0.0" disabled>
                <div style="margin-top:8px; font-size:14px; font-weight:600;">RIC</div>
            </div>

            <button id="swapBtn" class="main-btn">Swap Now</button>
        </div>

        <!-- Pay Gas with RIC -->
        <div id="gasTab" style="display:none;">
            <div class="input-group">
                <label>Pay with RIC for Gas</label>
                <input type="number" id="ricGasAmount" placeholder="1000" value="1000">
            </div>
            <button onclick="payGasWithRIC()" class="main-btn">Pay Gas with RIC</button>
        </div>

        <div class="status" id="status"></div>
    </div>

    <script>
        const ROUTER_ADDRESS = "0x8BC26741c4B381cF1a8392318133c1cCABb78775";
        const RICGAS_ADDRESS = "0x054Fcc4B7cd11f01735aE4e79131908E3Ff61B59";
        const WBONE = "0xC76F4c819D820369Fb2d7C1531aB3Bb18e6fE8d8";
        const RIC = "0x12C94d3A30daa09f81Ea6c037004E6e99A4A3dfc";

        let provider, signer, userAddress;

        async function connectWallet() {
            if (!window.ethereum) return alert("Please install MetaMask or Rabby");
            provider = new ethers.BrowserProvider(window.ethereum);
            await provider.send("eth_requestAccounts", []);
            signer = await provider.getSigner();
            userAddress = await signer.getAddress();
            document.getElementById("connectBtn").textContent = userAddress.slice(0,6) + "..." + userAddress.slice(-4);
            updateQuote();
        }

        async function updateQuote() {
            const amountIn = document.getElementById("fromAmount").value;
            if (!amountIn || isNaN(amountIn) || amountIn <= 0) return;

            try {
                const router = new ethers.Contract(ROUTER_ADDRESS, [
                    "function getAmountsOut(uint256 amountIn, address[] memory path) public view returns (uint256[] memory amounts)"
                ], provider);
                const path = [WBONE, RIC];
                const amountInWei = ethers.parseEther(amountIn);
                const amounts = await router.getAmountsOut(amountInWei, path);
                document.getElementById("toAmount").value = parseFloat(ethers.formatEther(amounts[1])).toFixed(4);
            } catch (e) {
                document.getElementById("toAmount").value = "No Liquidity";
            }
        }

        async function executeSwap() {
            if (!signer) return connectWallet();
            const status = document.getElementById("status");
            const amountIn = document.getElementById("fromAmount").value;

            try {
                status.style.color = "#ff0";
                status.textContent = "Approving BONE...";

                const router = new ethers.Contract(ROUTER_ADDRESS, [
                    "function swapExactTokensForTokens(uint256 amountIn, uint256 amountOutMin, address[] calldata path, address to, uint256 deadline)"
                ], signer);

                const amountInWei = ethers.parseEther(amountIn);
                const path = [WBONE, RIC];
                const deadline = Math.floor(Date.now() / 1000) + 1200;

                const tx = await router.swapExactTokensForTokens(
                    amountInWei,
                    0,
                    path,
                    userAddress,
                    deadline,
                    { gasLimit: 700000 }
                );

                status.style.color = "#0f0";
                status.innerHTML = `✅ Successful! <a href="https://shibariumscan.io/tx/${tx.hash}" target="_blank" class="tx-link">View Tx</a>`;
                await tx.wait();
            } catch (e) {
                status.style.color = "#f00";
                status.textContent = "Error: " + (e.shortMessage || e.message || "Transaction failed");
            }
        }

        async function payGasWithRIC() {
            if (!signer) return connectWallet();
            const status = document.getElementById("status");
            const amount = document.getElementById("ricGasAmount").value;

            try {
                status.style.color = "#ff0";
                status.textContent = "Approving RIC...";

                const gasContract = new ethers.Contract(RICGAS_ADDRESS, [
                    "function payGasWithRIC(uint256 ricAmount, uint256 minBoneOut) external"
                ], signer);

                const ricWei = ethers.parseEther(amount);
                const tx = await gasContract.payGasWithRIC(ricWei, 1);

                status.style.color = "#0f0";
                status.innerHTML = `✅ Gas Paid! <a href="https://shibariumscan.io/tx/${tx.hash}" target="_blank" class="tx-link">View Tx</a>`;
                await tx.wait();
            } catch (e) {
                status.style.color = "#f00";
                status.textContent = "Error: " + (e.shortMessage || e.message);
            }
        }

        function switchTab(n) {
            document.getElementById("normalTab").style.display = n === 0 ? "block" : "none";
            document.getElementById("gasTab").style.display = n === 1 ? "block" : "none";
            document.getElementById("tabNormal").classList.toggle("active", n === 0);
            document.getElementById("tabGas").classList.toggle("active", n === 1);
        }

        document.getElementById("connectBtn").addEventListener("click", connectWallet);
        document.getElementById("swapBtn").addEventListener("click", executeSwap);
        document.getElementById("fromAmount").addEventListener("input", () => {
            clearTimeout(window.quoteTimeout);
            window.quoteTimeout = setTimeout(updateQuote, 500);
        });
    </script>
</body>
</html>
