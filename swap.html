<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RicSwap | Swap</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
    <style>
        :root {
            --bg: #0a0a0a;
            --card: #111111;
            --gold: #ffd700;
            --accent: #ff4d00;
        }
        body { background: var(--bg); color: white; font-family: 'Inter', system-ui, sans-serif; margin: 0; min-height: 100vh; }
        .nav { padding: 18px 5%; display: flex; align-items: center; background: rgba(10,10,10,0.95); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,215,0,0.1); position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 26px; font-weight: 900; color: var(--gold); }
        .connect-btn { margin-left: auto; background: rgba(255,215,0,0.1); color: var(--gold); border: 1px solid var(--gold); padding: 9px 22px; border-radius: 999px; font-weight: 600; cursor: pointer; }

        .main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
        .card { width: 100%; max-width: 480px; background: var(--card); border-radius: 28px; padding: 32px; border: 1px solid #222; box-shadow: 0 30px 80px rgba(0,0,0,0.7); }

        .input-box { background: #1a1a1a; border-radius: 20px; padding: 20px; margin-bottom: 12px; border: 1px solid #333; }
        .label { display: flex; justify-content: space-between; font-size: 14px; color: #aaa; margin-bottom: 10px; }
        input { background: transparent; border: none; color: white; font-size: 32px; width: 100%; outline: none; font-weight: 600; }
        .token-btn { background: #222; padding: 8px 16px; border-radius: 12px; display: flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 700; }

        .swap-arrow { text-align: center; margin: -10px 0; font-size: 28px; cursor: pointer; color: #666; }
        .swap-arrow:hover { color: var(--gold); }

        #swapBtn { background: var(--accent); color: white; border: none; width: 100%; padding: 18px; border-radius: 16px; font-size: 18px; font-weight: 800; margin-top: 20px; cursor: pointer; }
        .status { margin-top: 16px; text-align: center; font-size: 14px; min-height: 28px; }
    </style>
</head>
<body>
    <nav class="nav">
        <div class="logo">RicSwap</div>
        <button id="connectBtn" class="connect-btn">Connect Wallet</button>
    </nav>

    <div class="main">
        <div class="card">
            <h2 style="margin:0 0 24px 0; text-align:center;">Swap</h2>

            <!-- FROM -->
            <div class="input-box">
                <div class="label">
                    <span>You Pay</span>
                    <span id="fromBalance">0.0000</span>
                </div>
                <div style="display:flex; gap:12px; align-items:center;">
                    <input type="number" id="fromAmount" value="1" step="0.0001">
                    <div onclick="openTokenModal('from')" class="token-btn" id="fromToken">
                        BONE
                    </div>
                </div>
            </div>

            <div class="swap-arrow" onclick="switchTokens()">↔</div>

            <!-- TO -->
            <div class="input-box">
                <div class="label">
                    <span>You Receive</span>
                    <span id="toBalance">0.0000</span>
                </div>
                <div style="display:flex; gap:12px; align-items:center;">
                    <input type="number" id="toAmount" readonly>
                    <div onclick="openTokenModal('to')" class="token-btn" id="toToken">
                        RIC
                    </div>
                </div>
            </div>

            <button id="swapBtn">SWAP NOW</button>
            <div id="status" class="status"></div>
        </div>
    </div>

    <script>
        // ================== CONFIG ==================
        const CONFIG = {
            RPC: "https://rpc.shibarium.shib.io",
            ROUTER: "0xcfBF0917F2fCDC4F5170aC991fa26F2Bc3da9Fd4",
            WBONE: "0xC76F4c819D820369Fb2d7C1531aB3Bb18e6fE8d8",
            FACTORY: "0x78ae5cCD2f13D10aE3fF47F8418A79D99B4569d0"
        };

        let provider, signer, userAddr;
        let fromToken = {symbol: "BONE", address: CONFIG.WBONE, decimals: 18, isNative: true};
        let toToken   = {symbol: "RIC", address: "0x12C94d3A30daa09f81Ea6c037004E6e99A4A3dfc", decimals: 18, isNative: false};

        let supportedTokens = [fromToken, toToken];

        const ROUTER_ABI = [
            "function swapExactETHForTokens(uint amountOutMin, address[] calldata path, address to, uint deadline) external payable",
            "function swapExactTokensForTokens(uint amountIn, uint amountOutMin, address[] calldata path, address to, uint deadline) external"
        ];

        const ERC20_ABI = [
            "function balanceOf(address) view returns (uint256)",
            "function decimals() view returns (uint8)",
            "function symbol() view returns (string)",
            "function approve(address,uint256) returns (bool)"
        ];

        async function connect() {
            provider = new ethers.JsonRpcProvider(CONFIG.RPC);
            const bp = new ethers.BrowserProvider(window.ethereum);
            signer = await bp.getSigner();
            userAddr = await signer.getAddress();

            document.getElementById("connectBtn").textContent = userAddr.slice(0,6)+"..." + userAddr.slice(-4);
            updateBalances();
        }

        async function updateBalances() {
            // Update From & To balances (simplified)
            if (fromToken.isNative) {
                const bal = await provider.getBalance(userAddr);
                document.getElementById("fromBalance").textContent = parseFloat(ethers.formatEther(bal)).toFixed(4);
            }
            // Similar for toToken...
        }

        function openTokenModal(side) {
            let html = `<h3 style="padding:15px;">Select Token</h3>`;
            supportedTokens.forEach(t => {
                html += `<div onclick="selectToken('${side}', '${t.symbol}', '${t.address}', ${t.decimals}, ${t.isNative}); window.close()" style="padding:15px; cursor:pointer; border-bottom:1px solid #333;">
                    ${t.symbol}
                </div>`;
            });
            const win = window.open("", "_blank", "width=400,height=600");
            win.document.write(html);
        }

        function selectToken(side, symbol, address, decimals, isNative) {
            if (side === 'from') {
                fromToken = {symbol, address, decimals, isNative};
                document.getElementById("fromToken").textContent = symbol;
            } else {
                toToken = {symbol, address, decimals, isNative};
                document.getElementById("toToken").textContent = symbol;
            }
            updateBalances();
        }

        function switchTokens() {
            [fromToken, toToken] = [toToken, fromToken];
            document.getElementById("fromToken").textContent = fromToken.symbol;
            document.getElementById("toToken").textContent = toToken.symbol;
            updateBalances();
        }

        // Add Custom Token
        // ... (you can add input box for custom token address + LP check)

        document.getElementById("connectBtn").addEventListener("click", connect);
    </script>
</body>
</html>
