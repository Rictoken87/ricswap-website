<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RicSwap - Swap</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
    
    <style>
        :root { --gold: #ffd700; --accent: #ff4d00; --bg: #0a0a0a; --card: #111; }
        body { background: var(--bg); color: #e0e0e0; font-family: 'Inter', sans-serif; margin:0; padding:0; }
        .nav { padding: 18px 5%; background: rgba(10,10,10,0.95); backdrop-filter: blur(16px); display:flex; align-items:center; border-bottom:1px solid rgba(255,215,0,0.1); position:sticky; top:0; z-index:1000; }
        .logo { font-size:28px; font-weight:900; background:linear-gradient(90deg,#ffd700,#ffaa00); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .nav-links a { color:#aaa; margin-left:36px; text-decoration:none; font-weight:500; }
        .nav-links a:hover, .nav-links a.active { color:var(--gold); }
        .connect-btn { margin-left:auto; background:transparent; color:var(--gold); border:2px solid var(--gold); padding:8px 22px; border-radius:50px; font-size:14px; font-weight:600; cursor:pointer; }

        .container { max-width:620px; margin:40px auto; padding:20px; }
        .card { background:var(--card); border-radius:24px; padding:32px; border:1px solid #222; }
        h2 { color:var(--gold); margin:0 0 20px 0; }

        .tab { display:flex; background:#1a1a1a; border-radius:12px; padding:4px; margin-bottom:25px; }
        .tab-btn { flex:1; padding:12px; border-radius:10px; text-align:center; font-weight:600; cursor:pointer; transition:0.3s; }
        .tab-btn.active { background:var(--gold); color:black; }

        .swap-box { background:#1a1a1a; padding:20px; border-radius:16px; margin-bottom:15px; }
        .balance { font-size:0.85rem; color:#888; text-align:right; margin-bottom:6px; }
        input { width:100%; background:transparent; border:none; color:white; font-size:1.8rem; font-weight:600; outline:none; }
        .token-row { display:flex; justify-content:space-between; align-items:center; }
        select { padding:10px; background:#222; border:1px solid #444; border-radius:12px; color:white; }

        .btn-action { background:linear-gradient(135deg, var(--accent), #cc3d00); color:white; border:none; padding:16px; border-radius:12px; font-weight:700; width:100%; cursor:pointer; margin-top:10px; }
        .btn-action:hover { transform:scale(1.02); }
        .status { margin-top:15px; font-size:0.95rem; min-height:24px; color:#aaa; text-align:center; }
    </style>
</head>
<body>
    <nav class="nav">
        <a href="index.html" class="logo">RicSwap</a>
        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="swap.html" class="active">Swap</a>
            <a href="pools.html">Pools</a>
            <a href="liquidity.html">Liquidity</a>
        </div>
        <button id="connectBtn" class="connect-btn" onclick="connectWallet()">Connect Wallet</button>
    </nav>

    <div class="container">
        <div class="card">
            <h2>Swap Tokens</h2>

            <div class="tab">
                <div class="tab-btn active" onclick="switchTab(0)" id="tab0">Normal Swap</div>
                <div class="tab-btn" onclick="switchTab(1)" id="tab1">Pay Gas with RIC</div>
            </div>

            <!-- Normal Swap -->
            <div id="normalSwapTab">
                <div class="swap-box">
                    <div class="balance">BONE Balance: <span id="boneBalance">0.00</span></div>
                    <div class="token-row">
                        <input type="number" id="fromAmount" placeholder="0.0" oninput="updateQuote()">
                        <select id="fromToken">
                            <option value="0xC76F4c819D820369Fb2d7C1531aB3Bb18e6fE8d8">BONE</option>
                        </select>
                    </div>
                </div>

                <div class="swap-box">
                    <div class="balance">RIC Balance: <span id="ricBalance">0.00</span></div>
                    <div class="token-row">
                        <input type="number" id="toAmount" placeholder="0.0" readonly>
                        <select id="toToken">
                            <option value="0x12C94d3A30daa09f81Ea6c037004E6e99A4A3dfc">RIC</option>
                        </select>
                    </div>
                </div>

                <button class="btn-action" onclick="performSwap()">Swap BONE → RIC</button>
                <div id="normalStatus" class="status"></div>
            </div>

            <!-- RicGas Tab (unchanged) -->
            <div id="ricGasTab" style="display:none;">
                <!-- ... your existing RicGas tab code ... -->
            </div>
        </div>
    </div>

    <script>
        let signer, userAddress;
        const ROUTER_ADDRESS = "0x8BC26741c4B381cF1a8392318133c1cCABb78775";
        const RIC_ADDRESS = "0x12C94d3A30daa09f81Ea6c037004E6e99A4A3dfc";
        const BONE_ADDRESS = "0xC76F4c819D820369Fb2d7C1531aB3Bb18e6fE8d8";
        const PAIR_ADDRESS = "0x941abcb1A4278Ff33B50F6Cf9F5A4C8a0888BdeE"; // Your BONE/RIC pool

        async function connectWallet() {
            if (!window.ethereum) return alert("Please install MetaMask or Rabby");
            const provider = new ethers.BrowserProvider(window.ethereum);
            await provider.send("eth_requestAccounts", []);
            signer = await provider.getSigner();
            userAddress = await signer.getAddress();
            document.getElementById("connectBtn").textContent = userAddress.slice(0,6) + "..." + userAddress.slice(-4);
            await loadBalances();
        }

        async function loadBalances() {
            if (!signer) return;
            const bone = new ethers.Contract(BONE_ADDRESS, ["function balanceOf(address) view returns (uint256)"], signer);
            const ric = new ethers.Contract(RIC_ADDRESS, ["function balanceOf(address) view returns (uint256)"], signer);
            
            const boneBal = await bone.balanceOf(userAddress);
            const ricBal = await ric.balanceOf(userAddress);
            
            document.getElementById("boneBalance").textContent = ethers.formatEther(boneBal).slice(0,8);
            document.getElementById("ricBalance").textContent = ethers.formatEther(ricBal).slice(0,8);
        }

        async function updateQuote() {
            const amountIn = document.getElementById("fromAmount").value;
            if (!amountIn || parseFloat(amountIn) <= 0) return;
            
            const pair = new ethers.Contract(PAIR_ADDRESS, [
                "function getReserves() view returns (uint112 reserve0, uint112 reserve1, uint32 blockTimestampLast)"
            ], signer.provider);
            
            const [r0, r1] = await pair.getReserves();
            const boneReserve = r0; // Assuming BONE is token0
            const ricReserve = r1;
            
            const amountInWei = ethers.parseEther(amountIn);
            const amountOut = (amountInWei * ricReserve * 997n) / (boneReserve * 1000n);
            
            document.getElementById("toAmount").value = ethers.formatEther(amountOut);
        }

        async function performSwap() {
            if (!signer) return await connectWallet();
            
            const status = document.getElementById("normalStatus");
            const amountIn = document.getElementById("fromAmount").value;
            if (!amountIn) return alert("Enter amount");
            
            status.innerHTML = "Confirm in wallet...";
            
            try {
                const router = new ethers.Contract(ROUTER_ADDRESS, [
                    "function swapExactTokensForTokens(uint amountIn, uint amountOutMin, address[] calldata path, address to, uint deadline) external returns (uint[] memory amounts)"
                ], signer);
                
                const amountInWei = ethers.parseEther(amountIn);
                const path = [BONE_ADDRESS, RIC_ADDRESS];
                const deadline = Math.floor(Date.now() / 1000) + 300;
                
                const tx = await router.swapExactTokensForTokens(
                    amountInWei,
                    0, // Min out (you can add slippage later)
                    path,
                    userAddress,
                    deadline
                );
                
                status.innerHTML = `✅ Swapped! <a href="https://shibariumscan.io/tx/${tx.hash}" target="_blank">View Tx</a>`;
                await tx.wait();
                await loadBalances();
            } catch (e) {
                console.error(e);
                status.innerHTML = "❌ " + (e.shortMessage || e.message);
            }
        }

        function switchTab(tab) {
            document.getElementById("normalSwapTab").style.display = tab === 0 ? "block" : "none";
            document.getElementById("ricGasTab").style.display = tab === 1 ? "block" : "none";
            document.getElementById("tab0").classList.toggle("active", tab === 0);
            document.getElementById("tab1").classList.toggle("active", tab === 1);
        }

        window.onload = () => {
            if (window.ethereum) connectWallet();
        };
    </script>
</body>
</html>
