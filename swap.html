<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RicSwap | Swap</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
    <style>
        :root {
            --obsidian: #0a0a0a;
            --card: #111111;
            --gold: #ffd700;
            --accent: #ff4d00;
            --text: #e0e0e0;
        }
        body {
            background: var(--obsidian);
            color: var(--text);
            font-family: 'Inter', system-ui, sans-serif;
            margin: 0;
            padding: 0;
        }
        .nav {
            padding: 18px 5%;
            display: flex;
            align-items: center;
            background: rgba(10,10,10,0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255,215,0,0.08);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .logo {
            font-size: 28px;
            font-weight: 900;
            background: linear-gradient(90deg, var(--gold), #ffaa00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .nav-links {
            display: flex;
            gap: 28px;
            margin-left: 50px;
        }
        .nav-links a {
            color: #aaa;
            text-decoration: none;
            font-weight: 500;
            transition: 0.2s;
        }
        .nav-links a:hover,
        .nav-links a.active { color: var(--gold); }

        .connect-btn {
            margin-left: auto;
            background: rgba(255,215,0,0.1);
            color: var(--gold);
            border: 1px solid var(--gold);
            padding: 8px 20px;
            border-radius: 9999px;
            font-weight: 600;
            cursor: pointer;
        }

        .card {
            max-width: 460px;
            margin: 80px auto;
            background: var(--card);
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            border: 1px solid #222;
        }

        .input-group {
            background: #1a1a1a;
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 12px;
            border: 1px solid #333;
        }
        .row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 13px;
            color: #888;
        }
        input {
            background: transparent;
            border: none;
            color: white;
            font-size: 32px;
            width: 100%;
            outline: none;
            font-weight: 700;
        }
        button {
            background: var(--magma);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 16px;
            font-weight: 800;
            width: 100%;
            margin-top: 20px;
            cursor: pointer;
            font-size: 17px;
            transition: 0.2s;
        }
        button:hover { transform: translateY(-2px); }
        .status {
            margin-top: 16px;
            text-align: center;
            font-size: 14px;
            min-height: 28px;
        }
    </style>
</head>
<body>
    <nav class="nav">
        <div class="logo">RicSwap</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="swap.html" class="active">Swap</a>
            <a href="pools.html">Pools</a>
            <a href="reward.html">Rewards</a>
            <a href="launch.html">Launch Token</a>
            <a href="liquidity.html">Liquidity</a>
        </div>
        <button id="connectBtn" class="connect-btn">Connect Wallet</button>
    </nav>

    <div class="card">
        <h2 style="margin:0 0 20px 0; color:#ddd;">Swap</h2>
        
        <!-- From -->
        <div class="input-group">
            <div class="row">
                <span>You Pay</span>
                <span>Balance: <span id="boneBalance">0.0000</span> BONE</span>
            </div>
            <input type="number" id="fromAmount" placeholder="0.0" value="1" step="0.01">
        </div>

        <!-- To -->
        <div class="input-group">
            <div class="row">
                <span>You Receive</span>
                <span>Balance: <span id="ricBalance">0.0000</span> RIC</span>
            </div>
            <input type="number" id="toAmount" placeholder="0.0" readonly>
        </div>

        <button id="swapBtn">SWAP NOW</button>
        <div class="status" id="status"></div>
    </div>

    <script>
        // ==================== CONFIG ====================
        const RPC = "https://rpc.shibarium.shib.io";
        const ROUTER_ADDRESS = "0xcfBF0917F2fCDC4F5170aC991fa26F2Bc3da9Fd4";
        const WBONE = "0xC76F4c819D820369Fb2d7C1531aB3Bb18e6fE8d8";
        const RIC = "0x12C94d3A30daa09f81Ea6c037004E6e99A4A3dfc";
        const PAIR_ADDRESS = "0x941abcb1A4278Ff33B50F6Cf9F5A4C8a0888BdeE";

        let provider, signer, userAddress;

        const ROUTER_ABI = ["function swapExactETHForTokens(uint amountOutMin, address[] calldata path, address to, uint deadline) external payable returns (uint[] memory amounts)"];
        const PAIR_ABI = ["function getReserves() view returns (uint112, uint112, uint32)", "function token0() view returns (address)"];

        async function connectWallet() {
            provider = new ethers.JsonRpcProvider(RPC);
            const browserProvider = new ethers.BrowserProvider(window.ethereum);
            signer = await browserProvider.getSigner();
            userAddress = await signer.getAddress();
            
            document.getElementById("connectBtn").textContent = userAddress.slice(0,6) + "..." + userAddress.slice(-4);
            loadBalances();
            updateQuote();
        }

        async function loadBalances() {
            const boneBal = await provider.getBalance(userAddress);
            document.getElementById("boneBalance").textContent = parseFloat(ethers.formatEther(boneBal)).toFixed(4);
        }

        async function updateQuote() {
            const amountIn = parseFloat(document.getElementById("fromAmount").value || 0);
            if (amountIn <= 0) return;

            try {
                const pair = new ethers.Contract(PAIR_ADDRESS, PAIR_ABI, provider);
                const [r0, r1] = await pair.getReserves();
                const token0 = await pair.token0();

                const boneRes = token0 === WBONE ? Number(r0) : Number(r1);
                const ricRes  = token0 === WBONE ? Number(r1) : Number(r0);

                const outAmount = (amountIn * ricRes * 997) / (boneRes * 1000);
                document.getElementById("toAmount").value = outAmount.toFixed(4);
            } catch (e) {
                document.getElementById("toAmount").value = "—";
            }
        }

        async function executeSwap() {
            if (!signer) return connectWallet();
            const status = document.getElementById("status");
            const btn = document.getElementById("swapBtn");
            const amountInStr = document.getElementById("fromAmount").value;

            try {
                btn.disabled = true;
                btn.textContent = "SWAPPING...";
                status.textContent = "Confirm in wallet...";

                const router = new ethers.Contract(ROUTER_ADDRESS, ROUTER_ABI, signer);
                const amountInWei = ethers.parseEther(amountInStr);
                const path = [WBONE, RIC];

                const tx = await router.swapExactETHForTokens(
                    0,
                    path,
                    userAddress,
                    Math.floor(Date.now() / 1000) + 600,
                    { value: amountInWei, gasLimit: 1800000 }
                );

                status.innerHTML = `✅ Tx Sent! <a href="https://shibariumscan.io/tx/${tx.hash}" target="_blank" style="color:#ffd700">View Tx</a>`;
                await tx.wait();
                status.innerHTML = "🎉 Swap Successful!";
                status.style.color = "#00ff88";
                loadBalances();
            } catch (e) {
                console.error(e);
                status.textContent = "❌ " + (e.reason || e.shortMessage || "Transaction Failed");
            } finally {
                btn.disabled = false;
                btn.textContent = "SWAP NOW";
            }
        }

        document.getElementById("connectBtn").addEventListener("click", connectWallet);
        document.getElementById("fromAmount").addEventListener("input", updateQuote);
        document.getElementById("swapBtn").addEventListener("click", executeSwap);
    </script>
</body>
</html>
