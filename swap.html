<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RicSwap | Swap</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
    <style>
        :root {
            --obsidian: #050505;
            --card-bg: #0f0f0f;
            --gold: #ffd700;
            --magma: linear-gradient(135deg, #ff4d00 0%, #ff8c00 100%);
            --border: #222;
        }
        body { background: var(--obsidian); color: white; font-family: 'Inter', system-ui, sans-serif; margin: 0; min-height: 100vh; }
        .nav { padding: 20px 5%; display: flex; align-items: center; border-bottom: 1px solid rgba(255,215,0,0.1); background: rgba(5,5,5,0.95); backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 26px; font-weight: 900; color: var(--gold); }
        .connect-btn { margin-left: auto; background: rgba(255,215,0,0.1); color: var(--gold); border: 1px solid var(--gold); padding: 10px 24px; border-radius: 999px; font-weight: 600; cursor: pointer; }

        .container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { width: 100%; max-width: 480px; background: var(--card-bg); border-radius: 24px; padding: 32px; border: 1px solid var(--border); box-shadow: 0 25px 80px rgba(0,0,0,0.8); }

        .input-box { background: #161616; border: 1px solid #333; border-radius: 20px; padding: 20px; margin-bottom: 16px; }
        .label-row { display: flex; justify-content: space-between; font-size: 14px; color: #aaa; margin-bottom: 10px; }
        input { background: transparent; border: none; color: white; font-size: 32px; width: 100%; outline: none; font-weight: 600; }
        .token-selector { background: #222; padding: 10px 16px; border-radius: 12px; font-weight: 700; cursor: pointer; }

        .add-token { margin: 8px 0; display: flex; gap: 8px; }
        .add-token input { flex: 1; padding: 12px; background: #1a1a1a; border: 1px solid #444; border-radius: 12px; color: white; font-size: 14px; }
        .add-token button { background: var(--gold); color: black; border: none; padding: 12px 20px; border-radius: 12px; font-weight: 700; cursor: pointer; white-space: nowrap; }

        .arrow-container { text-align: center; margin: -8px 0 8px 0; cursor: pointer; font-size: 28px; color: #666; }
        .arrow-container:hover { color: var(--gold); }

        #swapBtn { background: var(--magma); color: white; border: none; width: 100%; padding: 18px; border-radius: 16px; font-size: 18px; font-weight: 800; margin-top: 10px; cursor: pointer; }
        .status { margin-top: 16px; text-align: center; font-size: 14px; min-height: 28px; }
    </style>
</head>
<body>
    <nav class="nav">
        <div class="logo">RicSwap</div>
        <button id="connectBtn" class="connect-btn">Connect Wallet</button>
    </nav>

    <div class="container">
        <div class="card">
            <h2>Swap Any Token</h2>

            <!-- FROM -->
            <div class="input-box">
                <div class="label-row">
                    <span>You Pay</span>
                    <span>Balance: <span id="fromBalance">0.0000</span></span>
                </div>
                <div style="display:flex; gap:12px;">
                    <input type="number" id="fromAmount" placeholder="0.0" value="1" step="0.0001">
                    <div onclick="openTokenModal('from')" class="token-selector" id="fromTokenDisplay">BONE</div>
                </div>
                <div class="add-token">
                    <input type="text" id="fromCustom" placeholder="Or paste token address">
                    <button onclick="addCustomToken('from')">Add</button>
                </div>
            </div>

            <div class="arrow-container" onclick="switchTokens()">↔</div>

            <!-- TO -->
            <div class="input-box">
                <div class="label-row">
                    <span>You Receive</span>
                    <span>Balance: <span id="toBalance">0.0000</span></span>
                </div>
                <div style="display:flex; gap:12px;">
                    <input type="number" id="toAmount" placeholder="0.0" readonly>
                    <div onclick="openTokenModal('to')" class="token-selector" id="toTokenDisplay">RIC</div>
                </div>
                <div class="add-token">
                    <input type="text" id="toCustom" placeholder="Or paste token address">
                    <button onclick="addCustomToken('to')">Add</button>
                </div>
            </div>

            <button id="swapBtn">SWAP NOW</button>
            <div id="status" class="status"></div>
        </div>
    </div>

    <script>
        const CONFIG = {
            RPC: "https://rpc.shibarium.shib.io",
            ROUTER: "0xcfBF0917F2fCDC4F5170aC991fa26F2Bc3da9Fd4",
            WBONE: "0xC76F4c819D820369Fb2d7C1531aB3Bb18e6fE8d8",
            FACTORY: "0x78ae5cCD2f13D10aE3fF47F8418A79D99B4569d0"
        };

        let provider, signer, userAddr;
        let fromToken = { symbol: "BONE", address: CONFIG.WBONE, decimals: 18, isNative: true };
        let toToken   = { symbol: "RIC",  address: "0x12C94d3A30daa09f81Ea6c037004E6e99A4A3dfc", decimals: 18, isNative: false };

        const ROUTER_ABI = [
            "function swapExactETHForTokens(uint amountOutMin, address[] calldata path, address to, uint deadline) external payable",
            "function swapExactTokensForTokens(uint amountIn, uint amountOutMin, address[] calldata path, address to, uint deadline) external"
        ];

        const ERC20_ABI = [
            "function balanceOf(address) view returns (uint256)",
            "function decimals() view returns (uint8)",
            "function symbol() view returns (string)",
            "function approve(address,uint256) returns (bool)"
        ];

        async function connect() {
            provider = new ethers.JsonRpcProvider(CONFIG.RPC);
            const bp = new ethers.BrowserProvider(window.ethereum);
            signer = await bp.getSigner();
            userAddr = await signer.getAddress();

            document.getElementById("connectBtn").textContent = userAddr.slice(0,6) + "..." + userAddr.slice(-4);
            updateBalances();
        }

        async function addCustomToken(side) {
            const inputId = side === 'from' ? 'fromCustom' : 'toCustom';
            const address = document.getElementById(inputId).value.trim();

            if (!address || address.length !== 42) return alert("Invalid token address");

            const status = document.getElementById("status");
            status.textContent = "Checking LP...";

            try {
                const factory = new ethers.Contract(CONFIG.FACTORY, ["function getPair(address,address) view returns (address)"], provider);
                const pair = await factory.getPair(CONFIG.WBONE, address);

                if (pair === "0x0000000000000000000000000000000000000000") {
                    alert("No liquidity pool found with BONE for this token.");
                    return;
                }

                const tokenContract = new ethers.Contract(address, ERC20_ABI, provider);
                const symbol = await tokenContract.symbol();
                const decimals = await tokenContract.decimals();

                const newToken = { symbol, address, decimals, isNative: false };

                if (side === 'from') {
                    fromToken = newToken;
                    document.getElementById("fromTokenDisplay").textContent = symbol;
                } else {
                    toToken = newToken;
                    document.getElementById("toTokenDisplay").textContent = symbol;
                }

                alert(`✅ ${symbol} added successfully!`);
                document.getElementById(inputId).value = "";
                updateBalances();

            } catch (e) {
                alert("Failed to add token. Make sure the address is correct and LP exists.");
            }
        }

        function openTokenModal(side) {
            alert("Token list coming soon.\n\nUse the box below to paste any token address and click 'Add'.");
        }

        function switchTokens() {
            [fromToken, toToken] = [toToken, fromToken];
            document.getElementById("fromTokenDisplay").textContent = fromToken.symbol;
            document.getElementById("toTokenDisplay").textContent = toToken.symbol;
            updateBalances();
        }

        async function updateBalances() { /* implement later */ }
        async function updateQuote() { /* implement later */ }
        async function executeSwap() { /* implement later */ }

        document.getElementById("connectBtn").addEventListener("click", connect);
    </script>
</body>
</html>
