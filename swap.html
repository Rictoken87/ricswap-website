<script>
    const ROUTER_ADDRESS = "0x92b3ACBEEAF17abf3bD73eA06724b752840A5c3D";
    const WBONE = "0xC76F4c819D820369Fb2d7C1531aB3Bb18e6fE8d8";
    const RIC = "0x12C94d3A30daa09f81Ea6c037004E6e99A4A3dfc";

    const ROUTER_ABI = [
        "function getAmountsOut(uint256 amountIn, address[] memory path) public view returns (uint256[] memory amounts)",
        "function swapExactBONEForTokens(uint256 amountOutMin, address[] calldata path, address to, uint256 deadline) external payable returns (uint256[] memory amounts)"
    ];

    let provider, signer, userAddress;
    const readOnlyProvider = new ethers.JsonRpcProvider("https://rpc.shibarium.shib.io");

    const fromAmountInput = document.getElementById("fromAmount");
    const toAmountInput = document.getElementById("toAmount");
    const swapBtn = document.getElementById("swapBtn");

    // Live quote
    async function updateQuote() {
        const amountIn = fromAmountInput.value.trim();
        if (!amountIn || isNaN(amountIn) || Number(amountIn) <= 0) {
            toAmountInput.value = "";
            return;
        }

        try {
            const activeProvider = provider || readOnlyProvider;
            const router = new ethers.Contract(ROUTER_ADDRESS, ROUTER_ABI, activeProvider);
            const path = [WBONE, RIC];
            const amountInWei = ethers.parseEther(amountIn);

            const amounts = await router.getAmountsOut(amountInWei, path);
            const received = Number(ethers.formatEther(amounts[1]));

            toAmountInput.value = received.toFixed(6);
        } catch (e) {
            toAmountInput.value = "No Liquidity";
        }
    }

    // Execute swap with proper protection
    async function executeSwap() {
        if (!signer) return await connectWallet();

        const amountInStr = fromAmountInput.value.trim();
        if (!amountInStr || isNaN(amountInStr) || Number(amountInStr) <= 0) {
            return alert("Please enter a valid amount");
        }

        try {
            swapBtn.disabled = true;
            swapBtn.textContent = "CONFIRMING...";

            const router = new ethers.Contract(ROUTER_ADDRESS, ROUTER_ABI, signer);
            const path = [WBONE, RIC];
            const amountInWei = ethers.parseEther(amountInStr);

            const amountsOut = await router.getAmountsOut(amountInWei, path);
            const amountOutMin = (amountsOut[1] * 995n) / 1000n;   // 0.5% slippage

            const deadline = Math.floor(Date.now() / 1000) + 1200; // 20 minutes

            const tx = await router.swapExactBONEForTokens(
                amountOutMin,
                path,
                userAddress,
                deadline,
                { value: amountInWei }
            );

            swapBtn.textContent = "MINING...";
            await tx.wait();

            alert("✅ Swap Successful!");
            fromAmountInput.value = "";
            toAmountInput.value = "";

        } catch (e) {
            console.error(e);
            alert(e.shortMessage || e.message || "Swap failed");
        } finally {
            swapBtn.disabled = false;
            swapBtn.textContent = "SWAP NOW";
        }
    }

    // Connect wallet
    async function connectWallet() {
        if (!window.ethereum) return alert("Please install MetaMask!");
        try {
            provider = new ethers.BrowserProvider(window.ethereum);
            signer = await provider.getSigner();
            userAddress = await signer.getAddress();

            const short = userAddress.slice(0,6) + "..." + userAddress.slice(-4);
            document.getElementById("connectBtn").textContent = short;
            document.getElementById("connectBtn").style.background = "linear-gradient(135deg, #00E5FF, #FFD700)";

            swapBtn.textContent = "SWAP NOW";
            updateQuote();
        } catch (e) {
            console.error(e);
        }
    }

    // Event listeners
    fromAmountInput.addEventListener("input", updateQuote);
    swapBtn.addEventListener("click", executeSwap);

    window.addEventListener("load", () => {
        updateQuote(); // Show price immediately
    });
</script>
