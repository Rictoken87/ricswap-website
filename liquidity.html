<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RicSwap | Liquidity Pro (Auto-Fix)</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
    <style>
        :root { --bg: #080808; --card: #121212; --border: #222; --accent: #ff5500; --text: #e0e0e0; --green: #00d26a; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        
        .card { width: 100%; max-width: 480px; background: var(--card); padding: 24px; border-radius: 24px; border: 1px solid var(--border); box-shadow: 0 0 40px rgba(0,0,0,0.5); }
        
        h2 { text-align: center; color: var(--accent); font-size: 18px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 24px; }
        
        /* Mode Toggle */
        .mode-switch { display: flex; background: #000; padding: 4px; border-radius: 12px; margin-bottom: 20px; border: 1px solid var(--border); }
        .mode-opt { flex: 1; text-align: center; padding: 10px; font-size: 12px; cursor: pointer; border-radius: 8px; transition: 0.2s; color: #666; font-weight: bold; }
        .mode-opt.active { background: #222; color: #fff; }
        
        /* Input Areas */
        .token-box { background: #1a1a1a; padding: 16px; border-radius: 16px; border: 1px solid var(--border); margin-bottom: 8px; transition: 0.3s; }
        .token-header { display: flex; justify-content: space-between; font-size: 11px; color: #888; margin-bottom: 8px; font-weight: bold; text-transform: uppercase; }
        
        input.addr { width: 100%; background: transparent; border: none; color: #888; font-size: 11px; font-family: monospace; margin-bottom: 10px; outline: none; }
        input.amount { width: 100%; background: transparent; border: none; color: white; font-size: 24px; font-weight: bold; outline: none; }
        
        /* Action Button */
        .action-btn { width: 100%; padding: 18px; border-radius: 14px; border: none; font-weight: 800; font-size: 14px; text-transform: uppercase; cursor: pointer; margin-top: 16px; transition: 0.2s; }
        
        /* States */
        .btn-connect { background: #2a2a2a; color: #fff; }
        .btn-approve { background: #333; color: var(--accent); border: 1px solid var(--accent); }
        .btn-supply { background: var(--accent); color: white; box-shadow: 0 0 30px rgba(255, 85, 0, 0.2); }
        .btn-disabled { background: #222; color: #555; cursor: not-allowed; box-shadow: none; }

        .info-row { display: flex; justify-content: space-between; padding: 12px 4px; font-size: 12px; color: #666; border-top: 1px solid #222; margin-top: 16px; }
        .status-txt { color: var(--green); }
        
        #debug { font-size: 10px; color: #444; margin-top: 10px; text-align: center; font-family: monospace; }
    </style>
</head>
<body>

<div class="card">
    <h2>Liquidity Pro</h2>

    <!-- Mode Switcher -->
    <div class="mode-switch">
        <div id="modeNative" class="mode-opt active" onclick="setMode('native')">Native BONE</div>
        <div id="modeToken" class="mode-opt" onclick="setMode('token')">Token + Token</div>
    </div>

    <!-- Token A -->
    <div class="token-box" id="boxA">
        <div class="token-header">
            <span id="labelA">BONE (Native)</span>
            <span id="balA">Bal: -</span>
        </div>
        <input id="addrA" class="addr" value="NATIVE_BONE" disabled>
        <input id="amtA" class="amount" type="number" placeholder="0.0" oninput="updateQuote()">
    </div>

    <div style="text-align:center; font-size:18px; color:#333;">+</div>

    <!-- Token B -->
    <div class="token-box" id="boxB">
        <div class="token-header">
            <span>Token B</span>
            <span id="balB">Bal: -</span>
        </div>
        <input id="addrB" class="addr" placeholder="Paste 0x..." onchange="handleInputB()">
        <input id="amtB" class="amount" type="number" placeholder="0.0" oninput="checkState()">
    </div>

    <!-- Dynamic Main Button -->
    <button id="mainBtn" class="action-btn btn-connect" onclick="handleAction()">Connect Wallet</button>

    <div class="info-row">
        <span>Status:</span>
        <span id="poolStatus">Waiting for inputs...</span>
    </div>
    <div id="debug"></div>
</div>

<script>
    // --- CONFIGURATION ---
    const ROUTER_ADDR = "0xcfBF0917F2fCDC4F5170aC991fa26F2Bc3da9Fd4";
    const FACTORY_ADDR = "0x78ae5cCD2f13D10aE3fF47F8418A79D99B4569d0"; 
    const WBONE_ADDR = "0xC76F4c819D820369Fb2d7C1531aB3Bb18e6fE8d8"; // The Real WBONE
    const SYSTEM_BONE = "0x0000000000000000000000000000000000001010"; // The "Trap" Address
    const SHIBARIUM_ID = "0x6d";

    const ERC20_ABI = [
        "function approve(address,uint) returns (bool)",
        "function allowance(address,address) view returns (uint)",
        "function balanceOf(address) view returns (uint)",
        "function decimals() view returns (uint8)"
    ];
    const FACTORY_ABI = ["function getPair(address,address) view returns (address)"];
    const PAIR_ABI = ["function getReserves() view returns (uint112,uint112,uint32)", "function token0() view returns (address)"];
    
    // Manual Interface for encoding
    const ROUTER_IFACE = new ethers.Interface([
        "function addLiquidity(address tokenA, address tokenB, uint amountADesired, uint amountBDesired, uint amountAMin, uint amountBMin, address to, uint deadline)",
        "function addLiquidityETH(address token, uint amountTokenDesired, uint amountTokenMin, uint amountETHMin, address to, uint deadline) payable"
    ]);

    let provider, signer, userAddr;
    let state = { 
        isNative: true, 
        pairExists: false,
        resA: 0n, resB: 0n,
        decA: 18, decB: 18
    };

    // --- 1. UI MODES ---
    function setMode(mode) {
        state.isNative = (mode === 'native');
        document.getElementById("modeNative").className = state.isNative ? "mode-opt active" : "mode-opt";
        document.getElementById("modeToken").className = !state.isNative ? "mode-opt active" : "mode-opt";
        
        const addrA = document.getElementById("addrA");
        const labelA = document.getElementById("labelA");
        
        if(state.isNative) {
            addrA.value = "NATIVE_BONE";
            addrA.disabled = true;
            labelA.innerText = "BONE (Native)";
        } else {
            addrA.value = "";
            addrA.disabled = false;
            addrA.placeholder = "Paste Token A (e.g. WBONE)";
            labelA.innerText = "Token A";
            // Auto-fill WBONE for convenience if empty
            if(addrA.value === "") addrA.value = WBONE_ADDR;
        }
        
        // Reset and scan
        scanPair();
    }

    function handleInputB() {
        // Auto-Correction: If user pasted System BONE, swap to WBONE
        const box = document.getElementById("addrB");
        if(box.value.toLowerCase() === SYSTEM_BONE.toLowerCase()) {
            alert("⚠️ Notice: You pasted the System BONE address. Swapping to WBONE for compatibility.");
            box.value = WBONE_ADDR;
        }
        scanPair();
    }

    async function connect() {
        if(!window.ethereum) return alert("No Wallet");
        try {
            await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: SHIBARIUM_ID }] });
            provider = new ethers.BrowserProvider(window.ethereum);
            signer = await provider.getSigner();
            userAddr = await signer.getAddress();
            document.getElementById("mainBtn").onclick = null; // Clear connect handler
            scanPair();
        } catch(e) { console.error(e); }
    }

    // --- 2. SCANNER ---
    async function scanPair() {
        if(!signer) return document.getElementById("mainBtn").onclick = connect;
        
        let addrA = state.isNative ? WBONE_ADDR : document.getElementById("addrA").value;
        let addrB = document.getElementById("addrB").value;
        
        // Sanitize inputs
        if(!ethers.isAddress(addrA) || !ethers.isAddress(addrB)) return;

        // fetch info
        try {
            // Token A
            if(state.isNative) {
                const balNative = await provider.getBalance(userAddr);
                document.getElementById("balA").innerText = "Bal: " + parseFloat(ethers.formatEther(balNative)).toFixed(4);
                state.decA = 18;
            } else {
                const conA = new ethers.Contract(addrA, ERC20_ABI, provider);
                state.decA = await conA.decimals().catch(()=>18);
                const balA = await conA.balanceOf(userAddr);
                document.getElementById("balA").innerText = "Bal: " + parseFloat(ethers.formatUnits(balA, state.decA)).toFixed(4);
            }

            // Token B
            const conB = new ethers.Contract(addrB, ERC20_ABI, provider);
            state.decB = await conB.decimals().catch(()=>18);
            const balB = await conB.balanceOf(userAddr);
            document.getElementById("balB").innerText = "Bal: " + parseFloat(ethers.formatUnits(balB, state.decB)).toFixed(4);

            // Pair
            const factory = new ethers.Contract(FACTORY_ADDR, FACTORY_ABI, provider);
            const pairAddr = await factory.getPair(addrA, addrB);

            if(pairAddr === "0x0000000000000000000000000000000000000000") {
                state.pairExists = false;
                document.getElementById("poolStatus").innerText = "🆕 New Pool (You determine price)";
                document.getElementById("poolStatus").className = "status-txt";
            } else {
                state.pairExists = true;
                document.getElementById("poolStatus").innerText = "✅ Pool Found (Auto-Sync)";
                
                const pair = new ethers.Contract(pairAddr, PAIR_ABI, provider);
                const res = await pair.getReserves();
                const t0 = await pair.token0();
                
                if(t0.toLowerCase() === addrA.toLowerCase()) {
                    state.resA = res[0]; state.resB = res[1];
                } else {
                    state.resA = res[1]; state.resB = res[0];
                }
            }
        } catch(e) { console.log("Scanning...", e); }
        
        checkState();
    }

    function updateQuote() {
        if(!state.pairExists) return;
        const rawA = document.getElementById("amtA").value;
        if(!rawA) return;

        const rA = parseFloat(ethers.formatUnits(state.resA, state.decA));
        const rB = parseFloat(ethers.formatUnits(state.resB, state.decB));
        if(rA === 0) return;

        const estB = parseFloat(rawA) * (rB / rA);
        document.getElementById("amtB").value = estB.toFixed(6);
        checkState();
    }

    // --- 3. STATE MACHINE ---
    async function checkState() {
        const btn = document.getElementById("mainBtn");
        const rawA = document.getElementById("amtA").value;
        const rawB = document.getElementById("amtB").value;
        const addrB = document.getElementById("addrB").value;

        if(!rawA || !rawB || !ethers.isAddress(addrB)) {
            btn.innerText = "Enter Amounts";
            btn.className = "action-btn btn-disabled";
            btn.onclick = null;
            return;
        }

        // Check Allowances
        const conB = new ethers.Contract(addrB, ERC20_ABI, signer);
        const reqB = ethers.parseUnits(rawB, state.decB);
        const allowB = await conB.allowance(userAddr, ROUTER_ADDR);

        if(allowB < reqB) {
            btn.innerText = "1. Approve Token B";
            btn.className = "action-btn btn-approve";
            btn.onclick = () => approve(addrB);
            return;
        }

        if(!state.isNative) {
            const addrA = document.getElementById("addrA").value;
            const conA = new ethers.Contract(addrA, ERC20_ABI, signer);
            const reqA = ethers.parseUnits(rawA, state.decA);
            const allowA = await conA.allowance(userAddr, ROUTER_ADDR);

            if(allowA < reqA) {
                btn.innerText = "2. Approve Token A";
                btn.className = "action-btn btn-approve";
                btn.onclick = () => approve(addrA);
                return;
            }
        }

        btn.innerText = "Supply Liquidity";
        btn.className = "action-btn btn-supply";
        btn.onclick = supply;
    }

    // --- 4. EXECUTION ---
    async function approve(tokenAddr) {
        const btn = document.getElementById("mainBtn");
        try {
            btn.innerText = "Approving..."; btn.disabled = true;
            const con = new ethers.Contract(tokenAddr, ERC20_ABI, signer);
            const tx = await con.approve(ROUTER_ADDR, ethers.MaxUint256);
            document.getElementById("debug").innerText = `Approve Tx: ${tx.hash}`;
            await tx.wait();
            checkState();
        } catch(e) {
            alert(e.reason || e.message);
            btn.disabled = false;
        }
    }

    async function supply() {
        const btn = document.getElementById("mainBtn");
        btn.innerText = "Confirming..."; btn.disabled = true;

        try {
            const deadline = Math.floor(Date.now()/1000) + 3600;
            const rawA = document.getElementById("amtA").value;
            const rawB = document.getElementById("amtB").value;
            const addrB = document.getElementById("addrB").value;
            const valB = ethers.parseUnits(rawB, state.decB);

            let calldata, valWei;

            if(state.isNative) {
                // Native BONE + Token
                const valA = ethers.parseEther(rawA);
                valWei = valA;
                calldata = ROUTER_IFACE.encodeFunctionData("addLiquidityETH", [
                    addrB, valB, 0, 0, userAddr, deadline
                ]);
            } else {
                // Token + Token (Corrected for WBONE)
                const addrA = document.getElementById("addrA").value;
                const valA = ethers.parseUnits(rawA, state.decA);
                valWei = 0n;
                calldata = ROUTER_IFACE.encodeFunctionData("addLiquidity", [
                    addrA, addrB, valA, valB, 0, 0, userAddr, deadline
                ]);
            }

            // FORCE SEND
            const tx = await signer.sendTransaction({
                to: ROUTER_ADDR,
                data: calldata,
                value: valWei,
                gasLimit: 6000000 
            });

            document.getElementById("poolStatus").innerHTML = `<a href="https://shibariumscan.io/tx/${tx.hash}" target="_blank" style="color:#00d26a">View Transaction</a>`;
            await tx.wait();
            alert("✅ Liquidity Successfully Added!");
            scanPair();

        } catch(e) {
            console.error(e);
            alert("Error: " + (e.reason || e.message));
        } finally {
            btn.disabled = false;
            checkState();
        }
    }
</script>
</body>
</html>
