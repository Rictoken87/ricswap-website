2. <!DOCTYPE html>
3. <html lang="en">
4. <head>
5.     <meta charset="UTF-8">
6.     <meta name="viewport" content="width=device-width, initial-scale=1.0">
7.     <title>RicSwap | Add Liquidity</title>
8.     <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
9.     <style>
10.         :root { --obsidian: #080808; --card-bg: #121212; --magma: linear-gradient(135deg, #ff4d00 0%, #ff8c00 100%); --gold: #ffd700; }
11.         body { background: var(--obsidian); color: white; font-family: system-ui, sans-serif; margin: 0; padding: 0; }
12.         .nav { padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,215,0,0.1); }
13.         .card { max-width: 500px; margin: 60px auto; background: var(--card-bg); border-radius: 24px; padding: 32px; box-shadow: 0 20px 40px rgba(0,0,0,0.8); }
14.         .input-group { background: #1a1a1a; border-radius: 16px; padding: 16px; margin-bottom: 16px; border: 1px solid #333; }
15.         .input-group:focus-within { border-color: var(--gold); }
16.         label { display: block; color: #888; font-size: 12px; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
17.         input { background: transparent; border: none; color: white; font-size: 20px; width: 100%; outline: none; }
18.         button { background: var(--magma); color: white; border: none; padding: 18px; border-radius: 16px; font-weight: bold; width: 100%; font-size: 18px; cursor: pointer; margin-top: 10px; }
19.         #connectBtn { width: auto !important; min-width: 140px !important; padding: 10px 24px !important; font-size: 15px !important; background: #222 !important; color: var(--gold) !important; border: 1px solid var(--gold) !important; }
20.         #status { text-align: center; margin-top: 20px; font-size: 14px; font-weight: 600; min-height: 24px; }
21.     </style>
22. </head>
23. <body>
24.     <div class="nav">
25.         <h2>RicSwap • LP Vault</h2>
26.         <button id="connectBtn">CONNECT WALLET</button>
27.     </div>
28. 
29.     <div class="card">
30.         <h3 style="text-align:center;">Add Liquidity (RIC/BONE Pair)</h3>
31. 
32.         <!-- Token A (BONE) -->
33.         <div class="input-group">
34.             <label>Token A (WBONE)</label>
35.             <input id="tokenA" value="0xC76F4c819D820369Fb2d7C1531aB3Bb18e6fE8d8" readonly>
36.             <input id="amountA" type="number" placeholder="Amount of BONE" style="font-size:24px; margin-top:12px;">
37.             <div id="balanceA" style="font-size:12px; color:#888; margin-top:4px;">Balance: -- BONE</div>
38.         </div>
39. 
40.         <div style="text-align:center; margin:10px 0; font-size:28px;">+</div>
41. 
42.         <!-- Token B (RIC) -->
43.         <div class="input-group">
44.             <label>Token B (RIC)</label>
45.             <input id="tokenB" value="0x12C94d3A30daa09f81Ea6c037004E6e99A4A3dfc" readonly>
46.             <input id="amountB" type="number" placeholder="Amount of RIC" style="font-size:24px; margin-top:12px;">
47.             <div id="balanceB" style="font-size:12px; color:#888; margin-top:4px;">Balance: -- RIC</div>
48.         </div>
49. 
50.         <button id="addBtn">ADD LIQUIDITY</button>
51.         <div id="status"></div>
52.     </div>
53. 
54.     <script>
55.         const ROUTER_ADDRESS = "0x9703f105f13F5Fd4C431EBAB8A1A6d7d36F7e7e0";   // ← YOUR NEW ROUTER
56.         const WBONE = "0xC76F4c819D820369Fb2d7C1531aB3Bb18e6fE8d8";
57.         const RIC = "0x12C94d3A30daa09f81Ea6c037004E6e99A4A3dfc";
58.         const SHIBARIUM_CHAIN_ID = 109;
59. 
60.         const ROUTER_ABI = [
61.             "function addLiquidityBONE(address token, uint256 amountTokenDesired, uint256 amountTokenMin, uint256 amountBONEMin, address to, uint256 deadline) external payable returns (uint256, uint256, uint256)"
62.         ];
63.         const ERC20_ABI = [
64.             "function approve(address spender, uint256 amount) public returns (bool)",
65.             "function allowance(address owner, address spender) public view returns (uint256)",
66.             "function balanceOf(address account) public view returns (uint256)"
67.         ];
68. 
69.         let provider, signer, userAddress;
70. 
71.         const connectBtn = document.getElementById("connectBtn");
72.         const addBtn = document.getElementById("addBtn");
73.         const statusEl = document.getElementById("status");
74. 
75.         async function switchToShibarium() {
76.             try {
77.                 await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: '0x' + SHIBARIUM_CHAIN_ID.toString(16) }] });
78.             } catch (e) {
79.                 if (e.code === 4902) {
80.                     await window.ethereum.request({ method: 'wallet_addEthereumChain', params: [{ chainId: '0x' + SHIBARIUM_CHAIN_ID.toString(16), chainName: 'Shibarium', nativeCurrency: { name: 'BONE', symbol: 'BONE', decimals: 18 }, rpcUrls: ['https://rpc.shibarium.shib.io'], blockExplorerUrls: ['https://shibariumscan.io'] }] });
81.                 }
82.             }
83.         }
84. 
85.         async function connectWallet() {
86.             if (!window.ethereum) return alert("Install MetaMask");
87.             try {
88.                 connectBtn.disabled = true;
89.                 connectBtn.textContent = "CONNECTING...";
90.                 await switchToShibarium();
91.                 provider = new ethers.BrowserProvider(window.ethereum);
92.                 signer = await provider.getSigner();
93.                 userAddress = await signer.getAddress();
94.                 connectBtn.textContent = userAddress.slice(0,6) + "..." + userAddress.slice(-4);
95.                 await loadBalances();
96.             } catch (e) { alert("Connection failed"); }
97.             finally { connectBtn.disabled = false; }
98.         }
99. 
100.         async function loadBalances() {
101.             if (!userAddress) return;
102.             await getBalance(WBONE, "balanceA");
103.             await getBalance(RIC, "balanceB");
104.         }
105. 
106.         async function getBalance(token, elementId) {
107.             try {
108.                 if (token === WBONE) {
109.                     const bal = await provider.getBalance(userAddress);
110.                     document.getElementById(elementId).textContent = `Balance: ${ethers.formatEther(bal)} BONE`;
111.                 } else {
112.                     const tokenContract = new ethers.Contract(token, ERC20_ABI, provider);
113.                     const bal = await tokenContract.balanceOf(userAddress);
114.                     document.getElementById(elementId).textContent = `Balance: ${ethers.formatEther(bal)}`;
115.                 }
116.             } catch (e) {
117.                 document.getElementById(elementId).textContent = "Balance: --";
118.             }
119.         }
120. 
121.         async function addLiquidity() {
122.             if (!signer) return connectWallet();
123. 
124.             const amountBONE = document.getElementById("amountA").value;
125.             const amountRIC = document.getElementById("amountB").value;
126. 
127.             if (!amountBONE || !amountRIC) return alert("Enter both amounts");
128. 
129.             try {
130.                 addBtn.disabled = true;
131.                 statusEl.textContent = "Adding liquidity...";
132. 
133.                 const router = new ethers.Contract(ROUTER_ADDRESS, ROUTER_ABI, signer);
134.                 const deadline = Math.floor(Date.now() / 1000) + 1200;
135.                 const amountBONEWei = ethers.parseEther(amountBONE);
136.                 const amountRICWei = ethers.parseEther(amountRIC);
137. 
138.                 // Approve RIC if needed
139.                 const ricContract = new ethers.Contract(RIC, ERC20_ABI, signer);
140.                 const allowance = await ricContract.allowance(userAddress, ROUTER_ADDRESS);
141.                 if (allowance < amountRICWei) {
142.                     await (await ricContract.approve(ROUTER_ADDRESS, ethers.MaxUint256)).wait();
143.                 }
144. 
145.                 const tx = await router.addLiquidityBONE(
146.                     RIC,
147.                     amountRICWei,
148.                     (amountRICWei * 995n) / 1000n,
149.                     (amountBONEWei * 995n) / 1000n,
150.                     userAddress,
151.                     deadline,
152.                     { value: amountBONEWei }
153.                 );
154. 
155.                 await tx.wait();
156. 
157.                 statusEl.style.color = "#0f0";
158.                 statusEl.textContent = "✅ Liquidity added successfully!";
159.                 loadBalances();
160.             } catch (e) {
161.                 console.error(e);
162.                 statusEl.style.color = "#f00";
163.                 statusEl.textContent = "Error: " + (e.reason || e.message || "Check console (F12)");
164.             } finally {
165.                 addBtn.disabled = false;
166.             }
167.         }
168. 
169.         document.getElementById("connectBtn").addEventListener("click", connectWallet);
170.         document.getElementById("addBtn").addEventListener("click", addLiquidity);
171.     </script>
172. </body>
173. </html>
