<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RicSwap | Add Liquidity</title>
    <style>
        :root { --obsidian: #080808; --card-bg: #121212; --magma: linear-gradient(135deg, #ff4d00 0%, #ff8c00 100%); --gold: #ffd700; }
        body { background: var(--obsidian); color: white; font-family: system-ui, sans-serif; margin: 0; padding: 0; }
        .nav { padding: 20px 40px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; border-bottom: 1px solid rgba(255,215,0,0.1); }
        .logo { font-size: 28px; font-weight: bold; color: var(--gold); }
        .nav-links { display: flex; gap: 30px; justify-content: center; }
        .nav-links a { color: white; text-decoration: none; font-weight: 500; }
        .nav-links a.active { color: var(--gold); }
        .connect-btn { justify-self: end; background: #222; color: white; border: 1px solid #444; padding: 10px 0; width: 160px; border-radius: 9999px; font-size: 14px; font-weight: 600; cursor: pointer; text-align: center; }
        .card { max-width: 520px; margin: 40px auto; background: var(--card-bg); border-radius: 24px; padding: 32px; box-shadow: 0 20px 40px rgba(0,0,0,0.8); border: 1px solid #222; }
        .input-group { background: #1a1a1a; border-radius: 16px; padding: 16px; margin-bottom: 16px; border: 1px solid #333; }
        label { display: block; color: #888; font-size: 12px; margin-bottom: 8px; text-transform: uppercase; }
        input { background: transparent; border: none; color: white; font-size: 20px; width: 100%; outline: none; }
        button.main-btn { background: var(--magma); color: white; border: none; padding: 18px; border-radius: 16px; font-weight: bold; width: 100%; font-size: 18px; cursor: pointer; margin-top: 10px; }
        .status { margin-top: 15px; text-align: center; font-size: 13px; min-height: 24px; font-family: monospace; color: #ffd700; background: rgba(255,215,0,0.05); padding: 8px; border-radius: 8px; }
        .token-info { font-size: 12px; color: var(--gold); margin-top: 4px; }
    </style>
</head>
<body>

<div class="nav">
    <div class="logo">RicSwap</div>
    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="swap.html">Swap</a>
        <a href="pools.html">Pools</a>
        <a href="liquidity.html" class="active">Add</a>
    </div>
    <button id="connectBtn" class="connect-btn">Connect Wallet</button>
</div>

<div class="card">
    <h2 style="text-align:center; margin-bottom:24px;">Initialize & Supply LP</h2>
    <div class="input-group">
        <label>Token Address</label>
        <input type="text" id="tokenAddress" placeholder="0x...">
        <div id="tokenInfo" class="token-info"></div>
    </div>
    <button id="createPairBtn" class="main-btn" style="background:#222; border: 1px solid #444; font-size: 14px;">1. Create Pair & Burner</button>
    <div style="margin: 20px 0; text-align:center; color:#444; font-size: 11px;">THEN ADD LIQUIDITY</div>
    <div class="input-group">
        <label>Amount BONE</label>
        <input type="number" id="amountBONE" value="1">
    </div>
    <div class="input-group">
        <label>Amount Token</label>
        <input type="number" id="amountToken" placeholder="0.0">
    </div>
    <button id="addBtn" class="main-btn">2. Supply Permanent LP</button>
    <div class="status" id="status">📡 Establishing Connection...</div>
</div>

<script>
    const CDNS = [
        "https://cloudflare.com",
        "https://jsdelivr.net",
        "https://unpkg.com"
    ];

    let provider, signer, userAddress;
    const FACTORY_ADDRESS = "0x78ae5cCD2f13D10aE3fF47F8418A79D99B4569d0";
    const ROUTER_ADDRESS = "0xA809a9060D36f5324061EF93192ad5DA12Afc62e";
    const WBONE = "0xC76F4c819D820369Fb2d7C1531aB3Bb18e6fE8d8";
    const CHAIN_ID_HEX = "0x6d"; 

    // --- AUTO-LOAD LIBRARIES ---
    function loadScript(index) {
        if (index >= CDNS.length) {
            document.getElementById("status").textContent = "❌ All CDNs blocked. Please disable AdBlock.";
            return;
        }
        const script = document.createElement('script');
        script.src = CDNS[index];
        script.onload = () => {
            document.getElementById("status").textContent = "✅ System Ready";
            startApp();
        };
        script.onerror = () => loadScript(index + 1);
        document.head.appendChild(script);
    }

    function startApp() {
        document.getElementById("connectBtn").onclick = connectWallet;
        document.getElementById("createPairBtn").onclick = createPair;
        document.getElementById("addBtn").onclick = addLiquidity;
        document.getElementById("tokenAddress").oninput = updateTokenInfo;
        if (window.ethereum && window.ethereum.selectedAddress) connectWallet();
    }

    async function connectWallet() {
        const status = document.getElementById("status");
        if (!window.ethereum) return alert("Install MetaMask!");
        try {
            status.textContent = "Connecting...";
            provider = new ethers.BrowserProvider(window.ethereum);
            const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
            userAddress = accounts[0];

            try {
                await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: CHAIN_ID_HEX }] });
            } catch (e) {
                if (e.code === 4902) {
                    await window.ethereum.request({
                        method: 'wallet_addEthereumChain',
                        params: [{
                            chainId: CHAIN_ID_HEX,
                            chainName: 'Shibarium',
                            nativeCurrency: { name: 'BONE', symbol: 'BONE', decimals: 18 },
                            rpcUrls: ['https://shib.io'],
                            blockExplorerUrls: ['https://shibariumscan.io']
                        }]
                    });
                }
            }
            signer = await provider.getSigner();
            document.getElementById("connectBtn").textContent = userAddress.slice(0,6) + "..." + userAddress.slice(-4);
            status.textContent = "✅ Wallet Connected";
        } catch (err) { status.textContent = "Connect Failed"; }
    }

    async function updateTokenInfo() {
        const addr = document.getElementById("tokenAddress").value.trim();
        if (!ethers.isAddress(addr) || !signer) return;
        try {
            const token = new ethers.Contract(addr, ["function symbol() view returns (string)", "function balanceOf(address) view returns (uint256)"], provider);
            const [sym, bal] = await Promise.all([token.symbol(), token.balanceOf(userAddress)]);
            document.getElementById("tokenInfo").textContent = `${sym} | Balance: ${Number(ethers.formatEther(bal)).toFixed(4)}`;
        } catch (e) { document.getElementById("tokenInfo").textContent = "Invalid Token"; }
    }

    async function createPair() {
        if (!signer) return connectWallet();
        const status = document.getElementById("status");
        const addr = document.getElementById("tokenAddress").value.trim();
        try {
            status.textContent = "Creating Pair...";
            const factory = new ethers.Contract(FACTORY_ADDRESS, ["function createPair(address,address) returns (address)"], signer);
            const tx = await factory.createPair(WBONE, addr, { gasLimit: 5000000 });
            await tx.wait();
            status.textContent = "✅ Pair Created!";
        } catch (e) { status.textContent = "Error: Check Gas/Pair"; }
    }

    async function addLiquidity() {
        if (!signer) return connectWallet();
        const status = document.getElementById("status");
        const addr = document.getElementById("tokenAddress").value.trim();
        const amtB = document.getElementById("amountBONE").value;
        const amtT = document.getElementById("amountToken").value;
        try {
            const valB = ethers.parseEther(amtB);
            const valT = ethers.parseEther(amtT);
            const token = new ethers.Contract(addr, ["function approve(address,uint) returns (bool)", "function allowance(address,address) view returns (uint256)"], signer);
            status.textContent = "Approving...";
            const allow = await token.allowance(userAddress, ROUTER_ADDRESS);
            if (allow < valT) await (await token.approve(ROUTER_ADDRESS, ethers.MaxUint256)).wait();
            status.textContent = "Depositing...";
            const router = new ethers.Contract(ROUTER_ADDRESS, ["function addLiquidityBONE(address,uint,uint,uint,address,uint) external payable returns (uint,uint,uint)"], signer);
            const tx = await router.addLiquidityBONE(addr, valT, 0, 0, userAddress, Math.floor(Date.now()/1000)+1200, { value: valB, gasLimit: 2000000 });
            await tx.wait();
            status.textContent = "✅ Liquidity Locked!";
        } catch (e) { status.textContent = "Error: Check Balance"; }
    }

    // Initialize with first CDN
    loadScript(0);
</script>
</body>
</html>
