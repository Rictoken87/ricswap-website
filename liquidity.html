<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RicSwap | Silver Bullet</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
    <style>
        body { background: #050505; color: #e0e0e0; font-family: 'Inter', monospace; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .card { width: 100%; max-width: 480px; background: #0f0f0f; padding: 32px; border-radius: 24px; border: 1px solid #222; box-shadow: 0 0 80px rgba(255, 77, 0, 0.1); }
        
        h2 { color: #ff4d00; margin: 0 0 10px 0; text-align: center; text-transform: uppercase; letter-spacing: 1px; font-size: 18px; }
        .sub { text-align: center; font-size: 12px; color: #666; margin-bottom: 25px; }
        
        .input-group { margin-bottom: 15px; background: #161616; padding: 18px; border-radius: 16px; border: 1px solid #222; }
        label { font-size: 11px; color: #666; text-transform: uppercase; font-weight: bold; display: flex; justify-content: space-between; }
        .bal { color: #ff4d00; cursor: pointer; }
        
        input.addr { width: 100%; background: transparent; border: none; color: #aaa; font-size: 11px; font-family: monospace; outline: none; margin-top: 8px; display: block; }
        input.amount { width: 100%; background: transparent; border: none; color: white; font-size: 24px; font-weight: bold; font-family: sans-serif; outline: none; margin-top: 5px; }
        
        button { width: 100%; padding: 20px; background: #ff4d00; color: white; font-weight: 800; border: none; border-radius: 14px; font-size: 16px; cursor: pointer; margin-top: 10px; text-transform: uppercase; }
        button:disabled { background: #222; color: #555; cursor: not-allowed; }
        
        #log { margin-top: 25px; padding: 15px; border-radius: 12px; background: #000; border: 1px solid #222; font-size: 11px; color: #888; font-family: monospace; min-height: 40px; max-height: 120px; overflow-y: auto; word-break: break-all; }
    </style>
</head>
<body>

<div class="card">
    <h2>⚡ Silver Bullet Injector</h2>
    <div class="sub">Uses "SupportingFeeOnTransferTokens" to prevent reverts.</div>
   
    <!-- NATIVE BONE -->
    <div class="input-group">
        <label><span>Native BONE Amount</span> <span class="bal" id="balA" onclick="setMax('A')">---</span></label>
        <input id="amountA" class="amount" type="number" placeholder="0.0">
    </div>

    <div style="text-align:center; font-size:20px; color:#333; margin:-10px 0 10px 0;">+</div>

    <!-- TOKEN B -->
    <div class="input-group">
        <label><span>Token B Address</span> <span class="bal" id="balB" onclick="setMax('B')">---</span></label>
        <input id="tokenB" class="addr" placeholder="Paste 0x..." onchange="refreshBalances()">
        <input id="amountB" class="amount" type="number" placeholder="0.0">
    </div>

    <button id="btn" onclick="execute()">Connect Wallet</button>
    <div id="log">Ready.</div>
</div>

<script>
    const ROUTER = "0xcfBF0917F2fCDC4F5170aC991fa26F2Bc3da9Fd4";
    const SHIBARIUM_ID = "0x6d";

    const ABI = [
        "function approve(address,uint) returns (bool)",
        "function decimals() view returns (uint8)",
        "function allowance(address,address) view returns (uint256)",
        "function balanceOf(address) view returns (uint256)"
    ];

    let provider, signer, userAddr;
    let balances = { A: 0n, B: 0n, decB: 18 };

    // 1. INIT
    async function init() {
        if(!window.ethereum) return log("No Wallet Found");
        try {
            await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: SHIBARIUM_ID }] });
            provider = new ethers.BrowserProvider(window.ethereum);
            signer = await provider.getSigner();
            userAddr = await signer.getAddress();
            
            document.getElementById("btn").innerText = "SUPPLY LIQUIDITY";
            log("Connected: " + userAddr.slice(0,6));
            refreshBalances();
        } catch(e) { log("Connection Error: " + e.message); }
    }

    // 2. BALANCES
    async function refreshBalances() {
        if(!userAddr) return;
        try {
            // A: Native BONE
            balances.A = await provider.getBalance(userAddr);
            document.getElementById("balA").innerText = parseFloat(ethers.formatEther(balances.A)).toFixed(4);

            // B: Token
            const addrB = document.getElementById("tokenB").value;
            if(ethers.isAddress(addrB)) {
                const conB = new ethers.Contract(addrB, ABI, provider);
                balances.B = await conB.balanceOf(userAddr);
                balances.decB = await conB.decimals().catch(()=>18);
                document.getElementById("balDisplayB").innerText = parseFloat(ethers.formatUnits(balances.B, balances.decB)).toFixed(4);
            }
        } catch(e) {}
    }

    // 3. EXECUTE (THE FIX)
    async function execute() {
        if(!signer) { await init(); return; }
        const btn = document.getElementById("btn");
        const addrB = document.getElementById("tokenB").value;
        const rawA = document.getElementById("amountA").value;
        const rawB = document.getElementById("amountB").value;

        if(!rawA || !rawB) return alert("Enter Amounts");

        try {
            btn.disabled = true;
            log("Checking Safety...");

            // Safety: Ensure Gas
            const valA = ethers.parseEther(rawA);
            const gasReserve = ethers.parseEther("0.5");
            if(balances.A < (valA + gasReserve)) return alert("Insufficient BONE for Gas! Leave at least 0.5 BONE.");

            // 1. Approve B
            const conB = new ethers.Contract(addrB, ABI, signer);
            const valB = ethers.parseUnits(rawB, balances.decB);
            const allowB = await conB.allowance(userAddr, ROUTER);
            
            if(allowB < valB) {
                log("Approving Token B...");
                const txApp = await conB.approve(ROUTER, ethers.MaxUint256);
                await txApp.wait();
            }

            // 2. Manual Hex Encoding (Selector 0xb698e2ad)
            // addLiquidityETHSupportingFeeOnTransferTokens(token, amountTokenDesired, amountTokenMin, amountETHMin, to, deadline)
            log("Constructing Silver Bullet Payload...");
            
            const deadline = Math.floor(Date.now()/1000) + 3600; // 1 hour
            const abiCoder = ethers.AbiCoder.defaultAbiCoder();
            
            const params = abiCoder.encode(
                ["address", "uint256", "uint256", "uint256", "address", "uint256"],
                [
                    addrB,    // token
                    valB,     // amountTokenDesired
                    0,        // amountTokenMin (0 prevents slippage errors)
                    0,        // amountETHMin (0 prevents slippage errors)
                    userAddr, // to
                    deadline
                ]
            );
            
            // Selector for "SupportingFeeOnTransferTokens"
            const selector = "0xb698e2ad"; 
            const calldata = selector + params.slice(2);

            log("Sending... (Gas: 4M)");

            const tx = await signer.sendTransaction({
                to: ROUTER,
                data: calldata,
                value: valA,
                gasLimit: 4000000
            });

            log("TX Sent: " + tx.hash);
            alert("✅ SUCCESS! Transaction Submitted.");
            await tx.wait();
            log("Confirmed on Blockchain.");
            btn.disabled = false;

        } catch(e) {
            console.error(e);
            log("Error: " + (e.reason || e.message));
            btn.disabled = false;
        }
    }
    
    function setMax(s) {
        if(s === 'A') {
            let v = balances.A - ethers.parseEther("1.0"); // Leave 1 BONE for safety
            if(v < 0n) v = 0n;
            document.getElementById("amountA").value = ethers.formatEther(v);
        } else {
            document.getElementById("amountB").value = ethers.formatUnits(balances.B, balances.decB);
        }
    }
    function log(m) { document.getElementById("log").innerText = m; }
</script>
</body>
</html>
