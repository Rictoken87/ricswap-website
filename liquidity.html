<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RicSwap | Fail-Safe Injector</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
    <style>
        body { background: #050505; color: #e0e0e0; font-family: 'Inter', monospace; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .card { width: 100%; max-width: 480px; background: #0f0f0f; padding: 32px; border-radius: 24px; border: 1px solid #222; box-shadow: 0 0 80px rgba(255, 77, 0, 0.1); }
        
        h2 { color: #ff4d00; margin: 0 0 20px 0; text-align: center; text-transform: uppercase; letter-spacing: 1px; font-size: 18px; }
        
        /* Status Badges */
        .status-box { display: flex; gap: 10px; margin-bottom: 20px; }
        .badge { flex: 1; text-align: center; padding: 8px; background: #1a1a1a; border-radius: 8px; font-size: 11px; color: #666; border: 1px solid #333; transition: 0.3s; }
        .badge.active { border-color: #ff4d00; color: #fff; background: #221111; }

        /* Inputs */
        .input-group { margin-bottom: 15px; background: #161616; padding: 18px; border-radius: 16px; border: 1px solid #222; position: relative; }
        
        .row-top { display: flex; justify-content: space-between; margin-bottom: 10px; }
        label { font-size: 11px; color: #666; text-transform: uppercase; font-weight: bold; }
        
        .balance { font-size: 11px; color: #ff4d00; cursor: pointer; }

        input.addr { width: 100%; background: transparent; border: none; color: #aaa; font-size: 11px; font-family: monospace; outline: none; margin-bottom: 8px; display: block; }
        input.amount { width: 100%; background: transparent; border: none; color: white; font-size: 24px; font-weight: bold; font-family: sans-serif; outline: none; }
        
        button { width: 100%; padding: 20px; background: #ff4d00; color: white; font-weight: 800; border: none; border-radius: 14px; font-size: 16px; cursor: pointer; margin-top: 10px; text-transform: uppercase; }
        button:disabled { background: #222; color: #555; cursor: not-allowed; }
        
        #log { margin-top: 25px; padding: 15px; border-radius: 12px; background: #000; border: 1px solid #222; font-size: 11px; color: #888; font-family: monospace; min-height: 60px; max-height: 120px; overflow-y: auto; word-break: break-all; }
    </style>
</head>
<body>

<div class="card">
    <h2>⚡ Fail-Safe Injector</h2>
    
    <div class="status-box">
        <div id="statusNative" class="badge active">Native BONE</div>
        <div id="statusToken" class="badge">Token Pair</div>
    </div>

    <div style="text-align:center; margin-bottom:15px;">
        <label style="display:inline-flex; align-items:center; gap:8px; cursor:pointer;">
            <input type="checkbox" id="nativeMode" checked onchange="toggleNative()">
            <span style="font-size:12px; color:#fff;">Use Native BONE</span>
        </label>
    </div>
   
    <!-- INPUT A -->
    <div class="input-group">
        <div class="row-top">
            <label id="labelA">Native BONE</label>
            <div class="balance" onclick="setMax('A')" id="balDisplayA">Bal: ---</div>
        </div>
        <input id="tokenA" class="addr" value="NATIVE_BONE" disabled onchange="refreshBalances()">
        <input id="amountA" class="amount" type="number" placeholder="0.0">
    </div>

    <div style="text-align:center; font-size:20px; color:#333; margin:-10px 0 10px 0;">+</div>

    <!-- INPUT B -->
    <div class="input-group">
        <div class="row-top">
            <label>Token B Address</label>
            <div class="balance" onclick="setMax('B')" id="balDisplayB">Bal: ---</div>
        </div>
        <input id="tokenB" class="addr" placeholder="Paste 0x..." onchange="refreshBalances()">
        <input id="amountB" class="amount" type="number" placeholder="0.0">
    </div>

    <button id="btn" onclick="executeFailSafe()">Connect Wallet</button>
    <div id="log">Ready.</div>
</div>

<script>
    // --- CONFIGURATION ---
    const ROUTER = "0xcfBF0917F2fCDC4F5170aC991fa26F2Bc3da9Fd4";
    const WBONE = "0xC76F4c819D820369Fb2d7C1531aB3Bb18e6fE8d8";
    const SHIBARIUM_ID = "0x6d";

    const ABI = [
        "function approve(address,uint) returns (bool)",
        "function decimals() view returns (uint8)",
        "function allowance(address,address) view returns (uint256)",
        "function balanceOf(address) view returns (uint256)"
    ];

    let provider, signer, userAddr;
    let balances = { A: 0n, B: 0n, decA: 18, decB: 18 };

    // --- INIT ---
    async function init() {
        if(!window.ethereum) return log("No Wallet");
        try {
            await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: SHIBARIUM_ID }] });
            provider = new ethers.BrowserProvider(window.ethereum);
            signer = await provider.getSigner();
            userAddr = await signer.getAddress();
            document.getElementById("btn").innerText = "EXECUTE TRANSACTION";
            log("Connected: " + userAddr.slice(0,6));
            refreshBalances();
        } catch(e) { console.error(e); }
    }

    function toggleNative() {
        const isNative = document.getElementById("nativeMode").checked;
        const el = document.getElementById("tokenA");
        const lbl = document.getElementById("labelA");
        
        if(isNative) {
            el.value = "NATIVE_BONE"; el.disabled = true;
            lbl.innerText = "Native BONE";
            document.getElementById("statusNative").className = "badge active";
            document.getElementById("statusToken").className = "badge";
        } else {
            el.value = WBONE; el.disabled = false;
            lbl.innerText = "Token A Address";
            document.getElementById("statusNative").className = "badge";
            document.getElementById("statusToken").className = "badge active";
        }
        refreshBalances();
    }

    // --- BALANCES ---
    async function refreshBalances() {
        if(!userAddr) return;
        const isNative = document.getElementById("nativeMode").checked;
        const addrA = isNative ? WBONE : document.getElementById("tokenA").value;
        const addrB = document.getElementById("tokenB").value;

        try {
            if(isNative) {
                balances.A = await provider.getBalance(userAddr);
                balances.decA = 18;
            } else if(ethers.isAddress(addrA)) {
                const cA = new ethers.Contract(addrA, ABI, provider);
                balances.A = await cA.balanceOf(userAddr);
                balances.decA = await cA.decimals().catch(()=>18);
            }
            document.getElementById("balDisplayA").innerText = `Bal: ${parseFloat(ethers.formatUnits(balances.A, balances.decA)).toFixed(4)}`;
        } catch(e) {}

        try {
            if(ethers.isAddress(addrB)) {
                const cB = new ethers.Contract(addrB, ABI, provider);
                balances.B = await cB.balanceOf(userAddr);
                balances.decB = await cB.decimals().catch(()=>18);
                document.getElementById("balDisplayB").innerText = `Bal: ${parseFloat(ethers.formatUnits(balances.B, balances.decB)).toFixed(4)}`;
            }
        } catch(e) {}
    }

    // --- CORE EXECUTION (FAIL-SAFE) ---
    async function executeFailSafe() {
        if(!signer) { await init(); return; }
        const btn = document.getElementById("btn");
        const isNative = document.getElementById("nativeMode").checked;
        
        try {
            btn.disabled = true;
            log("Starting Validation...");

            // 1. Get Inputs
            const rawA = document.getElementById("amountA").value;
            const rawB = document.getElementById("amountB").value;
            const addrB = document.getElementById("tokenB").value;
            const addrA = isNative ? WBONE : document.getElementById("tokenA").value;

            if(!rawA || !rawB) throw new Error("Enter valid amounts");
            if(!ethers.isAddress(addrB)) throw new Error("Invalid Token B Address");
            if(!isNative && !ethers.isAddress(addrA)) throw new Error("Invalid Token A Address");

            const valA = ethers.parseUnits(rawA, balances.decA);
            const valB = ethers.parseUnits(rawB, balances.decB);

            // 2. Check Approvals
            log("Checking Allowances...");
            
            // Approve B (Always)
            const conB = new ethers.Contract(addrB, ABI, signer);
            const allowB = await conB.allowance(userAddr, ROUTER);
            if(allowB < valB) {
                log("Approving Token B...");
                const tx = await conB.approve(ROUTER, ethers.MaxUint256);
                await tx.wait();
            }

            // Approve A (Only if Token Mode)
            if(!isNative) {
                const conA = new ethers.Contract(addrA, ABI, signer);
                const allowA = await conA.allowance(userAddr, ROUTER);
                if(allowA < valA) {
                    log("Approving Token A...");
                    const tx = await conA.approve(ROUTER, ethers.MaxUint256);
                    await tx.wait();
                }
            }

            // 3. GENERATE HEX (The Fix)
            log("Generating Payload...");
            
            const deadline = Math.floor(Date.now()/1000) + 3600;
            const iface = new ethers.Interface([
                "function addLiquidity(address tokenA, address tokenB, uint amountADesired, uint amountBDesired, uint amountAMin, uint amountBMin, address to, uint deadline)",
                "function addLiquidityETHSupportingFeeOnTransferTokens(address token, uint amountTokenDesired, uint amountTokenMin, uint amountETHMin, address to, uint deadline) payable"
            ]);
            
            let dataHex, valueWei;

            if(isNative) {
                // Native BONE
                valueWei = valA;
                dataHex = iface.encodeFunctionData("addLiquidityETHSupportingFeeOnTransferTokens", [
                    addrB, valB, 0, 0, userAddr, deadline
                ]);
            } else {
                // Token to Token
                valueWei = 0n;
                dataHex = iface.encodeFunctionData("addLiquidity", [
                    addrA, addrB, valA, valB, 0, 0, userAddr, deadline
                ]);
            }

            // 4. PAYLOAD INSPECTOR (Pre-Flight Check)
            // If this log shows "0x...", the transaction CANNOT be empty.
            log(`Payload Generated (${dataHex.length} chars). Sending...`);
            console.log("PAYLOAD:", dataHex);

            if(!dataHex || dataHex === "0x") throw new Error("Hex Generation Failed!");

            // 5. SEND
            const tx = await signer.sendTransaction({
                to: ROUTER,
                data: dataHex,
                value: valueWei,
                gasLimit: 5000000 // Force Gas
            });

            log(`TX SENT! Hash: ${tx.hash}`);
            alert("Transaction Sent! Check explorer.");
            
            await tx.wait();
            log("✅ Transaction Confirmed");
            btn.disabled = false;

        } catch(e) {
            console.error(e);
            log("❌ Error: " + (e.reason || e.message));
            btn.disabled = false;
        }
    }

    function setMax(s) {
        if(s==='A') document.getElementById("amountA").value = ethers.formatUnits(balances.A, balances.decA);
        else document.getElementById("amountB").value = ethers.formatUnits(balances.B, balances.decB);
    }
    function log(m) { document.getElementById("log").innerText = m; }
</script>
</body>
</html>
