<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RicSwap | Add Liquidity</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
    <style>
        :root {
            --obsidian: #050505;
            --card-bg: #121212;
            --magma: linear-gradient(135deg, #ff4d00 0%, #ff8c00 100%);
            --gold: #ffd700;
        }
        body { background: var(--obsidian); color: white; font-family: system-ui, sans-serif; margin: 0; padding: 0; }
        .nav { padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,215,0,0.1); }
        .card { max-width: 500px; margin: 60px auto; background: var(--card-bg); border-radius: 24px; padding: 32px; box-shadow: 0 20px 40px rgba(0,0,0,0.8); }
        .input-group { background: #1a1a1a; border-radius: 16px; padding: 16px; margin-bottom: 16px; border: 1px solid #333; }
        .input-group:focus-within { border-color: var(--gold); }
        label { display: block; color: #888; font-size: 12px; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        input { background: transparent; border: none; color: white; font-size: 24px; width: 100%; outline: none; }
        button { background: var(--magma); color: white; border: none; padding: 18px; border-radius: 16px; font-weight: bold; width: 100%; font-size: 18px; cursor: pointer; margin-top: 10px; }
        #status { text-align: center; margin-top: 20px; font-size: 14px; min-height: 24px; }
    </style>
</head>
<body>
    <div class="nav">
        <h2>RicSwap • Add Liquidity</h2>
        <button id="connectBtn">CONNECT WALLET</button>
    </div>

    <div class="card">
        <h3 style="text-align:center;">RIC / BONE Pool</h3>

        <div class="input-group">
            <label>BONE (Native)</label>
            <input id="amountA" type="number" placeholder="Amount of BONE" value="1">
            <div id="balanceA" style="font-size:12px; color:#888; margin-top:4px;">Balance: -- BONE</div>
        </div>

        <div style="text-align:center; margin:10px 0; font-size:28px;">+</div>

        <div class="input-group">
            <label>RIC Token</label>
            <input id="amountB" type="number" placeholder="Amount of RIC" value="1">
            <div id="balanceB" style="font-size:12px; color:#888; margin-top:4px;">Balance: -- RIC</div>
        </div>

        <button id="addBtn">ADD LIQUIDITY</button>
        <div id="status"></div>
    </div>

    <script>
        const ROUTER = "0xcfBF0917F2fCDC4F5170aC991fa26F2Bc3da9Fd4";  // Your original router
        const RIC = "0x12C94d3A30daa09f81Ea6c037004E6e99A4A3dfc";

        let signer, userAddress, provider;

        async function connectWallet() {
            if (!window.ethereum) return alert("Please install MetaMask or Rabby");

            try {
                await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: '0x6d' }] });
            } catch (e) {}

            provider = new ethers.BrowserProvider(window.ethereum);
            signer = await provider.getSigner();
            userAddress = await signer.getAddress();

            document.getElementById("connectBtn").textContent = userAddress.slice(0,6) + "..." + userAddress.slice(-4);
            loadBalances();
        }

        async function loadBalances() {
            if (!userAddress) return;
            const boneBal = await provider.getBalance(userAddress);
            document.getElementById("balanceA").textContent = `Balance: ${parseFloat(ethers.formatEther(boneBal)).toFixed(4)} BONE`;

            const ricContract = new ethers.Contract(RIC, ["function balanceOf(address) view returns (uint256)"], provider);
            const ricBal = await ricContract.balanceOf(userAddress);
            document.getElementById("balanceB").textContent = `Balance: ${parseFloat(ethers.formatUnits(ricBal, 18)).toFixed(4)} RIC`;
        }

        async function addLiquidity() {
            const status = document.getElementById("status");
            const btn = document.getElementById("addBtn");
            const amountBone = document.getElementById("amountA").value;
            const amountRic = document.getElementById("amountB").value;

            if (!amountBone || !amountRic) return alert("Please enter both amounts");

            btn.disabled = true;
            status.textContent = "Approving RIC...";

            try {
                // Approve RIC
                const ricContract = new ethers.Contract(RIC, ["function approve(address,uint256)"], signer);
                await ricContract.approve(ROUTER, ethers.MaxUint256);

                status.textContent = "Adding Liquidity...";

                const router = new ethers.Contract(ROUTER, [
                    "function addLiquidityETH(address token, uint amountTokenDesired, uint amountTokenMin, uint amountETHMin, address to, uint deadline) payable returns (uint,uint,uint)"
                ], signer);

                const tx = await router.addLiquidityETH(
                    RIC,
                    ethers.parseUnits(amountRic, 18),
                    0,
                    0,
                    userAddress,
                    Math.floor(Date.now()/1000) + 1200,
                    { value: ethers.parseEther(amountBone) }
                );

                status.innerHTML = `Tx Sent → <a href="https://shibariumscan.io/tx/${tx.hash}" target="_blank">View</a>`;
                await tx.wait();
                status.innerHTML = `<span style="color:#00ff88">✅ Liquidity Added Successfully!</span>`;

            } catch (e) {
                console.error(e);
                status.innerHTML = `<span style="color:#ff6666">Error: ${e.reason || e.message}</span>`;
            } finally {
                btn.disabled = false;
            }
        }

        document.getElementById("connectBtn").addEventListener("click", connectWallet);
        document.getElementById("addBtn").addEventListener("click", addLiquidity);
    </script>
</body>
</html>
