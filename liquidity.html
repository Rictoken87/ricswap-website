<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RicSwap | Add Liquidity</title>
    <!-- Using a highly reliable CDN for Ethers v6 -->
    <script src="https://cloudflare.com"></script>
    <style>
        :root {
            --obsidian: #080808;
            --card-bg: #121212;
            --magma: linear-gradient(135deg, #ff4d00 0%, #ff8c00 100%);
            --gold: #ffd700;
        }
        body { background: var(--obsidian); color: white; font-family: system-ui, sans-serif; margin: 0; padding: 0; }
        .nav { padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,215,0,0.1); }
        .logo { color: var(--gold); font-size: 28px; font-weight: bold; letter-spacing: -1px; }
        .nav-links a { color: white; text-decoration: none; margin-left: 32px; font-weight: 500; }
        .nav-links a:hover { color: var(--gold); }
        .nav-links a.active { color: var(--gold); font-weight: 600; }
        .card { max-width: 520px; margin: 40px auto; background: var(--card-bg); border-radius: 24px; padding: 32px; box-shadow: 0 20px 40px rgba(0,0,0,0.8); border: 1px solid #222; }
        .input-group { background: #1a1a1a; border-radius: 16px; padding: 16px; margin-bottom: 16px; border: 1px solid #333; }
        .input-group:focus-within { border-color: var(--gold); }
        label { display: block; color: #888; font-size: 11px; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        input { background: transparent; border: none; color: white; font-size: 18px; width: 100%; outline: none; }
        button { background: var(--magma); color: white; border: none; padding: 18px; border-radius: 16px; font-weight: bold; width: 100%; font-size: 18px; cursor: pointer; margin-top: 10px; transition: 0.2s; }
        button:disabled { opacity: 0.5; filter: grayscale(1); }
        .quick-btn { background: #222; color: var(--gold); border: 1px solid #444; padding: 8px 16px; border-radius: 9999px; font-size: 13px; cursor: pointer; margin: 4px; }
        #connectBtn { width: auto !important; padding: 10px 24px !important; font-size: 15px !important; background: #222 !important; color: var(--gold) !important; border: 1px solid var(--gold) !important; }
        #status { text-align: center; margin-top: 20px; font-size: 13px; min-height: 24px; font-family: monospace; color: #ffd700; background: rgba(255,215,0,0.05); border-radius: 8px; padding: 5px; }
    </style>
</head>
<body>

<div class="nav">
    <div class="logo">RicSwap</div>
    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="swap.html">Swap</a>
        <a href="pools.html">Pools</a>
        <a href="liquidity.html" class="active">Add Liquidity</a>
    </div>
    <button id="connectBtn">CONNECT WALLET</button>
</div>

<div class="card">
    <h3 style="text-align:center; margin:0;">Pair Manager</h3>
    <p style="text-align:center; color:#888; font-size:13px; margin: 12px 0 24px 0;">Initialize pair or supply liquidity</p>

    <div class="input-group">
        <label>Token A (Base)</label>
        <input id="tokenA" value="0xC76F4c819D820369Fb2d7C1531aB3Bb18e6fE8d8">
        <div style="margin-top:8px;">
            <button class="quick-btn" id="btnBone">BONE</button>
        </div>
    </div>

    <div class="input-group">
        <label>Token B (New Token)</label>
        <input id="tokenB" placeholder="Paste contract address">
    </div>

    <button id="createPairBtn">CHECK / CREATE PAIR</button>

    <div id="liquiditySection" style="display:none; margin-top:24px; border-top: 1px solid #333; padding-top: 24px;">
        <div class="input-group">
            <label>Amount BONE</label>
            <input id="amountA" type="number" placeholder="0.0">
        </div>
        <div class="input-group">
            <label>Amount Token B</label>
            <input id="amountB" type="number" placeholder="0.0">
        </div>
        <button id="addBtn">ADD LIQUIDITY</button>
    </div>

    <div id="status">System Ready</div>
</div>

<script>
    // Critical Config
    const FACTORY_ADDRESS = "0xc2e80224D2f61FaE15CF9b7D089e327F06db1106";
    const ROUTER_ADDRESS = "0x9703f105f13F5Fd4C431EBAB8A1A6d7d36F7e7e0";
    const WBONE = "0xC76F4c819D820369Fb2d7C1531aB3Bb18e6fE8d8";
    const CHAIN_ID = 109;

    let provider, signer, userAddress;

    // Wait for the window to load completely
    window.addEventListener('load', async () => {
        console.log("RicSwap Initialized");
        const connectBtn = document.getElementById("connectBtn");
        const statusEl = document.getElementById("status");

        // --- CONNECT WALLET FUNCTION ---
        async function connectWallet() {
            if (typeof window.ethereum === 'undefined') {
                statusEl.textContent = "Error: Install MetaMask";
                return alert("MetaMask not found!");
            }

            try {
                statusEl.textContent = "Connecting...";
                // Initialize Ethers Browser Provider
                provider = new ethers.BrowserProvider(window.ethereum);
                
                // Trigger MetaMask Popup
                const accounts = await provider.send("eth_requestAccounts", []);
                userAddress = accounts[0];
                
                // Network Switch Logic
                try {
                    await window.ethereum.request({ 
                        method: 'wallet_switchEthereumChain', 
                        params: [{ chainId: '0x' + CHAIN_ID.toString(16) }] 
                    });
                } catch (switchError) {
                    if (switchError.code === 4902) {
                        await window.ethereum.request({
                            method: 'wallet_addEthereumChain',
                            params: [{
                                chainId: '0x' + CHAIN_ID.toString(16),
                                chainName: 'Shibarium',
                                nativeCurrency: { name: 'BONE', symbol: 'BONE', decimals: 18 },
                                rpcUrls: ['https://shib.io'],
                                blockExplorerUrls: ['https://shibariumscan.io']
                            }]
                        });
                    }
                }

                // Finalize Signer
                signer = await provider.getSigner();
                connectBtn.textContent = userAddress.slice(0,6) + "..." + userAddress.slice(-4);
                statusEl.textContent = "Wallet Connected";
                console.log("Connected to:", userAddress);

            } catch (error) {
                console.error("Connection Error:", error);
                statusEl.textContent = "Connection Failed";
            }
        }

        // --- CREATE PAIR LOGIC ---
        async function checkOrCreate() {
            if (!signer) return connectWallet();
            const tA = document.getElementById("tokenA").value.trim();
            const tB = document.getElementById("tokenB").value.trim();
            if (!ethers.isAddress(tA) || !ethers.isAddress(tB)) return alert("Invalid Address");

            try {
                statusEl.textContent = "Checking Factory...";
                const factory = new ethers.Contract(FACTORY_ADDRESS, [
                    "function createPair(address tokenA, address tokenB) external returns (address pair)",
                    "function getPair(address tokenA, address tokenB) external view returns (address pair)"
                ], signer);

                const pairAddr = await factory.getPair(tA, tB);
                if (pairAddr !== ethers.ZeroAddress) {
                    statusEl.textContent = "Pair Found!";
                    document.getElementById("liquiditySection").style.display = "block";
                    return;
                }

                statusEl.textContent = "Creating Pair (Check Wallet)...";
                const tx = await factory.createPair(tA, tB, { gasLimit: 4000000 });
                await tx.wait();
                statusEl.textContent = "Pair Created Successfully!";
                document.getElementById("liquiditySection").style.display = "block";
            } catch (e) {
                statusEl.textContent = "Error: " + (e.reason || "Action Rejected");
            }
        }

        // --- ADD LIQUIDITY LOGIC ---
        async function addLiquidity() {
            const amtA = document.getElementById("amountA").value;
            const amtB = document.getElementById("amountB").value;
            const tB = document.getElementById("tokenB").value.trim();

            try {
                statusEl.textContent = "Approving...";
                const router = new ethers.Contract(ROUTER_ADDRESS, [
                    "function addLiquidityETH(address token, uint amountTokenDesired, uint amountTokenMin, uint amountETHMin, address to, uint deadline) external payable returns (uint amountToken, uint amountETH, uint liquidity)"
                ], signer);
                
                const valA = ethers.parseUnits(amtA, 18);
                const valB = ethers.parseUnits(amtB, 18);
                
                const tokenBContract = new ethers.Contract(tB, [
                    "function approve(address spender, uint256 amount) public returns (bool)",
                    "function allowance(address owner, address spender) public view returns (uint256)"
                ], signer);

                const allow = await tokenBContract.allowance(userAddress, ROUTER_ADDRESS);
                if (allow < valB) {
                    await (await tokenBContract.approve(ROUTER_ADDRESS, ethers.MaxUint256)).wait();
                }

                statusEl.textContent = "Adding Liquidity...";
                const tx = await router.addLiquidityETH(
                    tB, valB, 0, 0, userAddress, Math.floor(Date.now()/1000)+1200, 
                    { value: valA, gasLimit: 1500000 }
                );
                await tx.wait();
                statusEl.textContent = "Liquidity Added!";
            } catch (e) {
                statusEl.textContent = "Error: " + (e.reason || "Check Balance");
            }
        }

        // Event Assignments
        connectBtn.addEventListener("click", connectWallet);
        document.getElementById("createPairBtn").addEventListener("click", checkOrCreate);
        document.getElementById("addBtn").addEventListener("click", addLiquidity);
        document.getElementById("btnBone").addEventListener("click", () => { document.getElementById("tokenA").value = WBONE; });
        
        // Auto-connect if already authorized
        if (window.ethereum && window.ethereum.selectedAddress) {
            connectWallet();
        }
    });
</script>
</body>
</html>
