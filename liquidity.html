<script>
    const FACTORY_ADDRESS = "0x78ae5cCD2f13D10aE3fF47F8418A79D99B4569d0";
    const ROUTER_ADDRESS = "0xA809a9060D36f5324061EF93192ad5DA12Afc62e";
    const WBONE = "0xC76F4c819D820369Fb2d7C1531aB3Bb18e6fE8d8";

    let provider, signer, userAddress;

    const ERC20_ABI = [
        "function symbol() view returns (string)",
        "function balanceOf(address) view returns (uint256)",
        "function approve(address spender, uint256 amount) returns (bool)",
        "function allowance(address owner, address spender) view returns (uint256)"
    ];

    async function connectWallet() {
        if (!window.ethereum) return alert("Install MetaMask");
        try {
            provider = new ethers.BrowserProvider(window.ethereum);
            const accounts = await provider.send("eth_requestAccounts", []);
            userAddress = accounts[0];
            signer = await provider.getSigner();
            document.getElementById("connectBtn").textContent = userAddress.slice(0,6) + "..." + userAddress.slice(-4);
            const bal = await provider.getBalance(userAddress);
            document.getElementById("boneBalance").textContent = `Balance: ${Number(ethers.formatEther(bal)).toFixed(4)} BONE`;
            document.getElementById("status").textContent = "Wallet Connected";
        } catch (e) { console.error(e); }
    }

    async function updateTokenInfo() {
        const addr = document.getElementById("tokenAddress").value.trim();
        if (!ethers.isAddress(addr) || !signer) return;
        try {
            const contract = new ethers.Contract(addr, ERC20_ABI, provider);
            const [sym, bal] = await Promise.all([contract.symbol(), contract.balanceOf(userAddress)]);
            document.getElementById("tokenInfo").textContent = `Detected: ${sym} | Your Balance: ${Number(ethers.formatEther(bal)).toFixed(4)}`;
        } catch (e) { document.getElementById("tokenInfo").textContent = "Invalid Token"; }
    }

    async function addLiquidity() {
        if (!signer) return connectWallet();
        const status = document.getElementById("status");
        const tAddr = document.getElementById("tokenAddress").value.trim();
        const amtB = document.getElementById("amountBONE").value;
        const amtT = document.getElementById("amountToken").value;

        if (!amtB || !amtT || !ethers.isAddress(tAddr)) return alert("Check all fields");

        try {
            status.style.color = "orange";
            const factory = new ethers.Contract(FACTORY_ADDRESS, ["function getPair(address,address) view returns (address)", "function createPair(address,address) returns (address)"], signer);
            
            // 1. Check Pair
            status.textContent = "Verifying Pool...";
            let pair = await factory.getPair(WBONE, tAddr);
            if (pair === ethers.ZeroAddress) {
                status.textContent = "Creating New Permanent Pair...";
                const txP = await factory.createPair(WBONE, tAddr, { gasLimit: 5000000 });
                await txP.wait();
            }

            // 2. Handle Approval
            status.textContent = "Checking Allowance...";
            const tokenContract = new ethers.Contract(tAddr, ERC20_ABI, signer);
            const valT = ethers.parseEther(amtT);
            const valB = ethers.parseEther(amtB);
            
            const allowance = await tokenContract.allowance(userAddress, ROUTER_ADDRESS);
            if (allowance < valT) {
                status.textContent = "Approving Token for Router...";
                const txApp = await tokenContract.approve(ROUTER_ADDRESS, ethers.MaxUint256);
                await txApp.wait();
            }

            // 3. Add Liquidity with Forced Manual Gas
            status.textContent = "Confirming LP Deposit...";
            const router = new ethers.Contract(ROUTER_ADDRESS, [
                "function addLiquidityBONE(address,uint,uint,uint,address,uint) external payable returns (uint,uint,uint)",
                "function addLiquidityETH(address,uint,uint,uint,address,uint) external payable returns (uint,uint,uint)"
            ], signer);

            // Set a long deadline (2 hours) to avoid 'Expired' error
            const deadline = Math.floor(Date.now() / 1000) + 7200;

            // FIX: We manually set the gasLimit to bypass "estimateGas" failure
            const txOverrides = { 
                value: valB, 
                gasLimit: 2500000 
            };

            let tx;
            try {
                // Try BONE-specific function
                tx = await router.addLiquidityBONE(tAddr, valT, 0, 0, userAddress, deadline, txOverrides);
            } catch (err) {
                console.warn("BONE method failed, trying standard ETH method...");
                // Fallback to standard Uniswap name
                tx = await router.addLiquidityETH(tAddr, valT, 0, 0, userAddress, deadline, txOverrides);
            }

            status.textContent = "Mining transaction...";
            await tx.wait();
            
            status.style.color = "#0f0";
            status.innerHTML = `✅ Liquidity Seeded!<br><a href="https://shibariumscan.io{tx.hash}" target="_blank" style="color:var(--gold)">View Transaction</a>`;
        } catch (e) {
            console.error("Full Error Object:", e);
            status.style.color = "red";
            // Check for specific common failures
            if (e.message.includes("insufficient funds")) {
                status.textContent = "Error: Not enough BONE for gas/amount";
            } else {
                status.textContent = "Transaction Reverted. Check console (F12).";
            }
        }
    }

    document.getElementById("connectBtn").onclick = connectWallet;
    document.getElementById("addBtn").onclick = addLiquidity;
    document.getElementById("tokenAddress").oninput = updateTokenInfo;
</script>
