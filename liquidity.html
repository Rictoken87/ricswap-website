<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RicSwap | God Mode Creator</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
    <style>
        body { background: #050505; color: #e0e0e0; font-family: 'Inter', monospace; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .card { width: 100%; max-width: 500px; background: #0f0f0f; padding: 32px; border-radius: 24px; border: 1px solid #222; box-shadow: 0 0 80px rgba(255, 77, 0, 0.1); }
        
        h2 { color: #ff4d00; margin: 0 0 10px 0; text-align: center; text-transform: uppercase; letter-spacing: 1px; font-size: 20px; }
        .sub { text-align: center; font-size: 12px; color: #666; margin-bottom: 20px; }
        
        .warning { background: #220a0a; border: 1px solid #ff4444; color: #ff8888; padding: 12px; font-size: 11px; text-align: center; border-radius: 8px; margin-bottom: 20px; }

        .toggle-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 20px; background: #1a1a1a; padding: 10px; border-radius: 12px; border: 1px solid #333; }
        .toggle-label { font-size: 13px; font-weight: bold; color: #fff; cursor: pointer; }
        input[type="checkbox"] { transform: scale(1.4); accent-color: #ff4d00; cursor: pointer; }

        .input-group { margin-bottom: 15px; background: #161616; padding: 18px; border-radius: 16px; border: 1px solid #222; }
        label { font-size: 11px; color: #666; text-transform: uppercase; font-weight: bold; display: block; margin-bottom: 10px; }
        
        input.addr { width: 100%; background: transparent; border: none; color: white; font-size: 13px; font-family: monospace; outline: none; box-sizing: border-box; }
        input.amount { width: 100%; background: transparent; border: none; color: #ff4d00; font-size: 24px; font-weight: bold; margin-top: 8px; font-family: sans-serif; outline: none; }
        
        button { width: 100%; padding: 20px; background: #ff4d00; color: white; font-weight: 800; border: none; border-radius: 14px; font-size: 16px; cursor: pointer; margin-top: 10px; text-transform: uppercase; transition: 0.2s; }
        button:hover:not(:disabled) { background: #ff6600; box-shadow: 0 0 40px rgba(255, 77, 0, 0.3); transform: translateY(-1px); }
        button:disabled { background: #222; color: #555; cursor: not-allowed; transform: none; box-shadow: none; }
        
        #status { margin-top: 25px; padding: 15px; border-radius: 12px; background: #000; border: 1px solid #222; font-size: 12px; text-align: center; color: #888; font-family: monospace; min-height: 20px; line-height: 1.5; word-break: break-all; }
    </style>
</head>
<body>

<div class="card">
    <h2>🔥 God Mode Creator</h2>
    <div class="sub">Create Pool + Add Liquidity + Burn LP</div>
    
    <div class="warning">
        ⚠️ <strong>AUTO-BURN ACTIVE:</strong> LP Tokens will be sent to the DEAD address immediately. This action is irreversible.
    </div>

    <div class="toggle-row">
        <input type="checkbox" id="nativeMode" checked onchange="toggleMode()">
        <label for="nativeMode" class="toggle-label">Use Native BONE</label>
    </div>
   
    <div class="input-group">
        <label id="labelA">Token A (Native BONE)</label>
        <input id="tokenA" class="addr" placeholder="Native BONE" value="NATIVE_BONE" disabled>
        <input id="amountA" class="amount" type="number" placeholder="0.0" value="1">
    </div>

    <div style="text-align:center; font-size:24px; color:#333; margin:-10px 0 10px 0;">+</div>

    <div class="input-group">
        <label>Token B Contract (Any Token)</label>
        <input id="tokenB" class="addr" placeholder="Paste 0x..." value="">
        <input id="amountB" class="amount" type="number" placeholder="0.0" value="100">
    </div>

    <button id="btn" onclick="executeGodMode()">1. START SEQUENCE</button>
    <div id="status">Ready.</div>
</div>

<script>
    const ROUTER = "0xcfBF0917F2fCDC4F5170aC991fa26F2Bc3da9Fd4";
    const FACTORY = "0x78ae5cCD2f13D10aE3fF47F8418A79D99B4569d0";
    const DEAD = "0x000000000000000000000000000000000000dEaD";
    const WBONE = "0xC76F4c819D820369Fb2d7C1531aB3Bb18e6fE8d8"; 
    const SHIBARIUM_ID = "0x6d";

    const ABI = [
        "function approve(address spender, uint256 amount) returns (bool)",
        "function decimals() view returns (uint8)",
        "function allowance(address owner, address spender) view returns (uint256)",
        "function getPair(address tokenA, address tokenB) view returns (address)",
        "function balanceOf(address) view returns (uint256)",
        "function transfer(address to, uint256 amount) returns (bool)"
    ];

    function toggleMode() {
        const isNative = document.getElementById("nativeMode").checked;
        const inputA = document.getElementById("tokenA");
        const labelA = document.getElementById("labelA");
        if(isNative) {
            inputA.value = "NATIVE_BONE"; inputA.disabled = true;
            labelA.innerText = "Token A (Native BONE)";
        } else {
            inputA.value = WBONE; inputA.disabled = false;
            labelA.innerText = "Token A Contract (WBONE)";
        }
    }

    async function executeGodMode() {
        const btn = document.getElementById("btn");
        const status = document.getElementById("status");
        
        // Inputs
        const isNative = document.getElementById("nativeMode").checked;
        const addrB = document.getElementById("tokenB").value.trim();
        const rawAmtA = document.getElementById("amountA").value;
        const rawAmtB = document.getElementById("amountB").value;

        if(!ethers.isAddress(addrB)) return alert("Invalid Token B");
        if(!rawAmtA || !rawAmtB) return alert("Enter Amounts");

        try {
            if(!window.ethereum) return alert("No Wallet");
            btn.disabled = true;
            status.innerText = "Initializing...";

            // 1. Setup
            const provider = new ethers.BrowserProvider(window.ethereum);
            const signer = await provider.getSigner();
            const userAddr = await signer.getAddress();

            await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: SHIBARIUM_ID }] }).catch(()=>{});

            // 2. Token B Check (Decimals + Approval)
            status.innerText = "Checking Token B...";
            const contractB = new ethers.Contract(addrB, ABI, signer);
            const decB = await contractB.decimals().catch(() => 18);
            const valB = ethers.parseUnits(rawAmtB, decB);

            const allowB = await contractB.allowance(userAddr, ROUTER);
            if(allowB < valB) {
                status.innerText = "Approving Token B...";
                const txApp = await contractB.approve(ROUTER, ethers.MaxUint256);
                await txApp.wait();
            }

            // 3. Prepare Address A
            let addrA = WBONE;
            let valA;
            
            if (!isNative) {
                addrA = document.getElementById("tokenA").value.trim();
                const contractA = new ethers.Contract(addrA, ABI, signer);
                const decA = await contractA.decimals().catch(() => 18);
                valA = ethers.parseUnits(rawAmtA, decA);
                
                const allowA = await contractA.allowance(userAddr, ROUTER);
                if(allowA < valA) {
                    status.innerText = "Approving Token A...";
                    const txAppA = await contractA.approve(ROUTER, ethers.MaxUint256);
                    await txAppA.wait();
                }
            } else {
                valA = ethers.parseEther(rawAmtA); // Native is always 18
            }

            // 4. CREATE POOL (Manual Hex)
            status.innerText = "Step 1/2: Creating Pool...";
            const iface = new ethers.Interface([
                "function addLiquidity(address,address,uint,uint,uint,uint,address,uint)",
                "function addLiquidityETH(address,uint,uint,uint,address,uint) payable"
            ]);
            const deadline = Math.floor(Date.now()/1000) + 1200;
            let txData, txValue;

            if (isNative) {
                // addLiquidityETH
                txData = iface.encodeFunctionData("addLiquidityETH", [
                    addrB, valB, 0, 0, userAddr, deadline
                ]);
                txValue = valA;
            } else {
                // addLiquidity
                txData = iface.encodeFunctionData("addLiquidity", [
                    addrA, addrB, valA, valB, 0, 0, userAddr, deadline
                ]);
                txValue = 0;
            }

            const txCreate = await signer.sendTransaction({
                to: ROUTER,
                data: txData,
                value: txValue,
                gasLimit: 4000000
            });

            status.innerHTML = `Pool Creating... <a href="https://shibariumscan.io/tx/${txCreate.hash}" target="_blank">View TX</a>`;
            await txCreate.wait();

            // 5. AUTO-BURN SEQUENCE
            status.innerText = "Step 2/2: Finding LP Tokens...";
            
            // Find LP Address
            const factory = new ethers.Contract(FACTORY, ABI, signer);
            const lpAddr = await factory.getPair(addrA, addrB);
            
            if (lpAddr === "0x0000000000000000000000000000000000000000") {
                throw new Error("Pool Creation Failed (No LP Found)");
            }

            // Check Balance
            const lpContract = new ethers.Contract(lpAddr, ABI, signer);
            const lpBal = await lpContract.balanceOf(userAddr);

            if (lpBal > 0n) {
                status.innerText = "🔥 BURNING LP TOKENS...";
                
                // Manual Hex for Transfer (Safety)
                const lpIface = new ethers.Interface(["function transfer(address,uint)"]);
                const burnData = lpIface.encodeFunctionData("transfer", [DEAD, lpBal]);

                const burnTx = await signer.sendTransaction({
                    to: lpAddr,
                    data: burnData,
                    gasLimit: 250000
                });

                status.innerHTML = `Burning... <a href="https://shibariumscan.io/tx/${burnTx.hash}" target="_blank">View Burn</a>`;
                await burnTx.wait();
                status.innerHTML = `<b style="color:#00ff88">✅ MISSION COMPLETE<br>Pool Created & Locked Forever</b>`;
            } else {
                status.innerHTML = `<b style="color:#ff9900">⚠️ Pool Created, but no LP found to burn.</b>`;
            }

            btn.innerText = "DONE";
            btn.disabled = false;

        } catch(e) {
            console.error(e);
            status.innerHTML = `<span style="color:#ff4444">Error: ${e.reason || e.message}</span>`;
            btn.disabled = false;
            btn.innerText = "RETRY";
        }
    }
</script>
</body>
</html>
