<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RicSwap | Smart Manager</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
    <style>
        body { background: #050505; color: #e0e0e0; font-family: 'Inter', monospace; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .card { width: 100%; max-width: 480px; background: #0f0f0f; padding: 32px; border-radius: 24px; border: 1px solid #222; box-shadow: 0 0 60px rgba(255, 77, 0, 0.1); }
        
        h2 { color: #ff4d00; margin: 0 0 10px 0; text-align: center; text-transform: uppercase; letter-spacing: 1px; font-size: 18px; }
        .status-badge { text-align: center; margin-bottom: 20px; padding: 8px; background: #1a1a1a; border-radius: 8px; font-size: 12px; color: #888; border: 1px solid #333; }
        
        .input-group { margin-bottom: 15px; background: #161616; padding: 18px; border-radius: 16px; border: 1px solid #222; position: relative; }
        label { font-size: 11px; color: #666; text-transform: uppercase; font-weight: bold; display: block; margin-bottom: 10px; }
        
        input.addr { width: 100%; background: transparent; border: none; color: white; font-size: 11px; font-family: monospace; outline: none; box-sizing: border-box; }
        input.amount { width: 100%; background: transparent; border: none; color: #ff4d00; font-size: 24px; font-weight: bold; margin-top: 8px; font-family: sans-serif; outline: none; }
        
        /* Lock Overlay for Auto-Calc */
        .locked input.amount { color: #00ff88; cursor: not-allowed; }
        .locked::after { content: "AUTO-MATCHING PRICE"; position: absolute; top: 10px; right: 10px; font-size: 9px; background: #004422; color: #00ff88; padding: 4px 8px; border-radius: 4px; }

        button { width: 100%; padding: 20px; background: #ff4d00; color: white; font-weight: 800; border: none; border-radius: 14px; font-size: 16px; cursor: pointer; margin-top: 10px; text-transform: uppercase; }
        button:disabled { background: #222; color: #555; cursor: not-allowed; }
        
        #log { margin-top: 25px; padding: 15px; border-radius: 12px; background: #000; border: 1px solid #222; font-size: 11px; color: #888; font-family: monospace; min-height: 40px; max-height: 150px; overflow-y: auto; }
    </style>
</head>
<body>

<div class="card">
    <h2>⚡ Smart Liquidity</h2>
    <div id="poolStatus" class="status-badge">Initializing...</div>

    <!-- Toggle -->
    <div style="text-align:center; margin-bottom:15px;">
        <label style="display:inline-flex; align-items:center; gap:8px; cursor:pointer;">
            <input type="checkbox" id="nativeMode" checked onchange="updateUI()">
            <span style="font-size:12px; color:#fff;">Use Native BONE</span>
        </label>
    </div>
   
    <div class="input-group">
        <label id="labelA">Token A</label>
        <input id="tokenA" class="addr" value="NATIVE_BONE" disabled>
        <input id="amountA" class="amount" type="number" placeholder="0.0" oninput="calculateQuote()">
    </div>

    <div style="text-align:center; font-size:20px; color:#333; margin:-10px 0 10px 0;">+</div>

    <div class="input-group" id="groupB">
        <label>Token B Contract</label>
        <input id="tokenB" class="addr" placeholder="Paste 0x..." onchange="checkPool()">
        <input id="amountB" class="amount" type="number" placeholder="0.0">
    </div>

    <button id="btn" onclick="execute()">Load Pool Data</button>
    <div id="log">Enter Token B address to begin.</div>
</div>

<script>
    const ROUTER_ADDR = "0xcfBF0917F2fCDC4F5170aC991fa26F2Bc3da9Fd4";
    const FACTORY_ADDR = "0x78ae5cCD2f13D10aE3fF47F8418A79D99B4569d0";
    const WBONE = "0xC76F4c819D820369Fb2d7C1531aB3Bb18e6fE8d8";
    const SHIBARIUM_ID = "0x6d";

    // ABIs
    const ERC20_ABI = [
        "function approve(address spender, uint256 amount) returns (bool)",
        "function decimals() view returns (uint8)",
        "function allowance(address owner, address spender) view returns (uint256)",
        "function balanceOf(address) view returns (uint256)"
    ];
    const FACTORY_ABI = ["function getPair(address,address) view returns (address)"];
    const PAIR_ABI = [
        "function getReserves() view returns (uint112, uint112, uint32)",
        "function token0() view returns (address)"
    ];
    const ROUTER_ABI = [
        "function addLiquidity(address,address,uint,uint,uint,uint,address,uint) returns (uint,uint,uint)",
        "function addLiquidityETH(address,uint,uint,uint,address,uint) payable returns (uint,uint,uint)"
    ];

    let provider, signer, userAddr;
    let poolState = { exists: false, reserveA: 0n, reserveB: 0n, token0: "" };

    // 1. Initialization
    async function init() {
        if(!window.ethereum) return log("No Wallet Found");
        provider = new ethers.BrowserProvider(window.ethereum);
        signer = await provider.getSigner();
        userAddr = await signer.getAddress();
        
        // Force Chain
        await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: SHIBARIUM_ID }] }).catch(()=>{});
        
        document.getElementById("btn").innerText = "CHECK POOL";
        document.getElementById("btn").onclick = checkPool;
        updateUI();
    }

    function updateUI() {
        const isNative = document.getElementById("nativeMode").checked;
        const inputA = document.getElementById("tokenA");
        if(isNative) {
            inputA.value = "NATIVE_BONE"; inputA.disabled = true;
        } else {
            inputA.value = WBONE; inputA.disabled = false;
        }
    }

    function log(msg) {
        const div = document.getElementById("log");
        div.innerHTML += `<div>> ${msg}</div>`;
        div.scrollTop = div.scrollHeight;
    }

    // 2. Check Pool Status
    async function checkPool() {
        if(!signer) await init();
        
        const isNative = document.getElementById("nativeMode").checked;
        const addrA = isNative ? WBONE : document.getElementById("tokenA").value;
        const addrB = document.getElementById("tokenB").value;

        if(!ethers.isAddress(addrB)) return log("Invalid Token B");

        log("Checking Factory for pair...");
        const factory = new ethers.Contract(FACTORY_ADDR, FACTORY_ABI, signer);
        const pairAddr = await factory.getPair(addrA, addrB);

        if(pairAddr === "0x0000000000000000000000000000000000000000") {
            poolState.exists = false;
            document.getElementById("poolStatus").innerText = "✨ NEW POOL (You set the price)";
            document.getElementById("poolStatus").style.color = "#ff4d00";
            document.getElementById("groupB").classList.remove("locked");
            document.getElementById("amountB").disabled = false;
            
            document.getElementById("btn").innerText = "CREATE POOL";
            document.getElementById("btn").onclick = execute;
        } else {
            poolState.exists = true;
            document.getElementById("poolStatus").innerText = "🔒 EXISTING POOL (Auto-Matching Price)";
            document.getElementById("poolStatus").style.color = "#00ff88";
            
            // Fetch Reserves
            const pair = new ethers.Contract(pairAddr, PAIR_ABI, signer);
            const reserves = await pair.getReserves();
            const token0 = await pair.token0();
            
            poolState.token0 = token0;
            // Align reserves to A/B logic
            if(token0.toLowerCase() === addrA.toLowerCase()) {
                poolState.reserveA = reserves[0];
                poolState.reserveB = reserves[1];
            } else {
                poolState.reserveA = reserves[1];
                poolState.reserveB = reserves[0];
            }
            
            document.getElementById("groupB").classList.add("locked");
            document.getElementById("amountB").disabled = true;
            document.getElementById("btn").innerText = "ADD LIQUIDITY";
            document.getElementById("btn").onclick = execute;
            
            log("Pool Found! Input A to calculate B.");
        }
    }

    // 3. Auto-Math (Quote)
    async function calculateQuote() {
        if(!poolState.exists) return; // Free mode
        
        const amtA = document.getElementById("amountA").value;
        if(!amtA) return;

        // Simple math: (AmtA * ResB) / ResA
        // Note: This is rough estimate for UI. Real tx uses smart contract logic.
        // We need decimals to be precise, but for UI rough ratio is okay.
        
        // Better: Just use JS math for UI feedback since we can't easily get decimals async here without lag
        // A more robust way is to assume ratio:
        const ratio = Number(poolState.reserveB) / Number(poolState.reserveA);
        const estimatedB = parseFloat(amtA) * ratio;
        
        document.getElementById("amountB").value = estimatedB.toFixed(6);
    }

    // 4. Execution
    async function execute() {
        try {
            const btn = document.getElementById("btn");
            btn.disabled = true;
            
            const isNative = document.getElementById("nativeMode").checked;
            const addrB = document.getElementById("tokenB").value;
            const amtA = document.getElementById("amountA").value;
            const amtB = document.getElementById("amountB").value; // Use the calculated value

            // 1. Get Decimals
            const contractB = new ethers.Contract(addrB, ERC20_ABI, signer);
            const decB = await contractB.decimals().catch(()=>18);
            const valB = ethers.parseUnits(amtB, decB);
            
            // 2. Approve B
            log("Approving Token B...");
            const txApp = await contractB.approve(ROUTER_ADDR, ethers.MaxUint256);
            await txApp.wait();

            // 3. Add Liquidity
            log("Sending Transaction...");
            const router = new ethers.Contract(ROUTER_ADDR, ROUTER_ABI, signer);
            const deadline = Math.floor(Date.now()/1000) + 1200;
            let tx;

            if(isNative) {
                const valA = ethers.parseEther(amtA);
                // Native BONE
                tx = await router.addLiquidityETH(
                    addrB,
                    valB,
                    0, 0, // Slippage 0 for ease
                    userAddr,
                    deadline,
                    { value: valA, gasLimit: 4000000 }
                );
            } else {
                // WBONE logic would go here (omitted for brevity in Native mode)
            }

            log(`TX Sent: ${tx.hash}`);
            document.getElementById("poolStatus").innerHTML = `<a href="https://shibariumscan.io/tx/${tx.hash}" target="_blank" style="color:#fff">VIEW SUCCESS</a>`;
            await tx.wait();
            alert("Success!");
            btn.disabled = false;

        } catch(e) {
            console.error(e);
            log("ERROR: " + (e.reason || e.message));
            document.getElementById("btn").disabled = false;
        }
    }

    // Start
    setTimeout(init, 1000);

</script>
</body>
</html>
