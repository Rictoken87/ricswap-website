<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RicSwap | Add Liquidity</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
    <style>
        :root {
            --obsidian: #050505;
            --card-bg: #0a0a0a;
            --gold: #ffd700;
            --magma: linear-gradient(135deg, #ff4d00 0%, #ff8c00 100%);
        }
        body { background: var(--obsidian); color: white; font-family: 'Inter', sans-serif; margin: 0; min-height: 100vh; }
        .nav { padding: 20px 5%; display: flex; align-items: center; background: rgba(5,5,5,0.95); border-bottom: 1px solid #222; }
        .logo { font-size: 24px; font-weight: 900; color: var(--gold); }
        .connect-btn { margin-left: auto; padding: 8px 20px; background: rgba(255,215,0,0.1); color: var(--gold); border: 1px solid var(--gold); border-radius: 999px; cursor: pointer; }
        
        .container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { width: 100%; max-width: 460px; background: #0f0f0f; padding: 24px; border-radius: 24px; border: 1px solid #222; }
        
        .input-box { background: #111; border: 1px solid #222; border-radius: 16px; padding: 16px; margin-bottom: 12px; }
        input { background: transparent; border: none; color: white; font-size: 28px; width: 100%; outline: none; }
        .token-pill { background: #222; padding: 8px 16px; border-radius: 10px; }
        
        button { width: 100%; padding: 16px; font-size: 17px; font-weight: bold; border-radius: 12px; margin-top: 10px; cursor: pointer; }
        #btnSupply { background: var(--magma); color: white; border: none; }
        
        #status { margin-top: 15px; text-align: center; font-size: 14px; min-height: 28px; }
    </style>
</head>
<body>
    <nav class="nav">
        <div class="logo">RicSwap</div>
        <button id="connectBtn" class="connect-btn">Connect Wallet</button>
    </nav>

    <div class="container">
        <div class="card">
            <h2>Add Liquidity (BONE + RIC)</h2>
            
            <div class="input-box">
                <input type="number" id="amountA" placeholder="BONE Amount" value="1">
                <div style="text-align:right; margin-top:8px;">BONE</div>
            </div>

            <div style="text-align:center; font-size:28px; margin:10px 0;">+</div>

            <div class="input-box">
                <input type="number" id="amountB" placeholder="RIC Amount" value="1">
                <div style="text-align:right; margin-top:8px;">RIC</div>
            </div>

            <button id="btnSupply" onclick="supply()">SUPPLY LIQUIDITY</button>
            <div id="status"></div>
        </div>
    </div>

    <script>
        const CONFIG = {
            ROUTER: "0xcfBF0917F2fCDC4F5170aC991fa26F2Bc3da9Fd4",
            RIC: "0x12C94d3A30daa09f81Ea6c037004E6e99A4A3dfc"
        };

        let signer, userAddr;

        async function connect() {
            if (!window.ethereum) return alert("Please install MetaMask or Rabby");
            const provider = new ethers.BrowserProvider(window.ethereum);
            signer = await provider.getSigner();
            userAddr = await signer.getAddress();
            document.getElementById("connectBtn").innerText = userAddr.slice(0,6) + "...";
        }

        async function supply() {
            const status = document.getElementById("status");
            const btn = document.getElementById("btnSupply");
            btn.disabled = true;
            btn.innerText = "Processing...";

            try {
                const amountBone = document.getElementById("amountA").value;
                const amountRic = document.getElementById("amountB").value;

                if (!amountBone || !amountRic) return alert("Please enter amounts");

                status.innerText = "Approving RIC...";

                // Approve RIC
                const ricContract = new ethers.Contract(CONFIG.RIC, [
                    "function approve(address,uint256) returns (bool)"
                ], signer);

                await ricContract.approve(CONFIG.ROUTER, ethers.MaxUint256);

                status.innerText = "Adding Liquidity...";

                const router = new ethers.Contract(CONFIG.ROUTER, [
                    "function addLiquidityETH(address,uint256,uint256,uint256,address,uint256) payable returns (uint256,uint256,uint256)"
                ], signer);

                const tx = await router.addLiquidityETH(
                    CONFIG.RIC,
                    ethers.parseUnits(amountRic, 18),
                    0,
                    0,
                    userAddr,
                    Math.floor(Date.now()/1000) + 1200,
                    { value: ethers.parseEther(amountBone) }
                );

                status.innerHTML = `Tx Sent! <a href="https://shibariumscan.io/tx/${tx.hash}" target="_blank">View Tx</a>`;
                await tx.wait();
                
                status.innerHTML = `<span style="color:#00ff88">✅ Liquidity Added Successfully!<br>You should now have LP tokens.</span>`;
                
            } catch (e) {
                console.error(e);
                status.innerHTML = `<span style="color:#ff6666">❌ ${e.reason || e.message || "Transaction Failed"}</span>`;
            } finally {
                btn.disabled = false;
                btn.innerText = "SUPPLY LIQUIDITY";
            }
        }

        document.getElementById("connectBtn").addEventListener("click", connect);
    </script>
</body>
</html>
