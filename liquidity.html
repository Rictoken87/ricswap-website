<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RicSwap | Add Liquidity</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
    <style>
        :root { --obsidian: #080808; --card-bg: #121212; --magma: linear-gradient(135deg, #ff4d00 0%, #ff8c00 100%); --gold: #ffd700; }
        body { background: var(--obsidian); color: white; font-family: system-ui, sans-serif; margin: 0; padding: 0; }
        .nav { padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,215,0,0.1); }
        .card { max-width: 500px; margin: 60px auto; background: var(--card-bg); border-radius: 24px; padding: 32px; box-shadow: 0 20px 40px rgba(0,0,0,0.8); }
        .input-group { background: #1a1a1a; border-radius: 16px; padding: 16px; margin-bottom: 16px; border: 1px solid #333; }
        .input-group:focus-within { border-color: var(--gold); }
        label { display: block; color: #888; font-size: 12px; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        input { background: transparent; border: none; color: white; font-size: 20px; width: 100%; outline: none; }
        button { background: var(--magma); color: white; border: none; padding: 18px; border-radius: 16px; font-weight: bold; width: 100%; font-size: 18px; cursor: pointer; margin-top: 10px; }
        #connectBtn { width: auto !important; min-width: 140px !important; padding: 10px 24px !important; font-size: 15px !important; background: #222 !important; color: var(--gold) !important; border: 1px solid var(--gold) !important; }
        .quick-btn { background: #222; color: var(--gold); border: 1px solid #444; padding: 8px 16px; border-radius: 9999px; font-size: 14px; margin-right: 8px; cursor: pointer; }
        #status { text-align: center; margin-top: 20px; font-size: 14px; font-weight: 600; min-height: 24px; }
    </style>
</head>
<body>
    <div class="nav">
        <h2>RicSwap • LP Vault</h2>
        <button id="connectBtn">CONNECT WALLET</button>
    </div>

    <div class="card">
        <h3 style="text-align:center;">Add Liquidity (Any Token Pair)</h3>

        <!-- Token A -->
        <div class="input-group">
            <label>Token A Address</label>
            <input id="tokenA" value="0xC76F4c819D820369Fb2d7C1531aB3Bb18e6fE8d8" placeholder="Token A">
            <div style="margin-top:8px;">
                <button class="quick-btn" onclick="quickSelectA()">BONE (Native)</button>
            </div>
            <input id="amountA" type="number" placeholder="Amount" style="font-size:24px; margin-top:12px;">
            <div id="balanceA" style="font-size:12px; color:#888; margin-top:4px;">Balance: -- BONE</div>
        </div>

        <div style="text-align:center; margin:10px 0; font-size:28px;">+</div>

        <!-- Token B -->
        <div class="input-group">
            <label>Token B Address</label>
            <input id="tokenB" value="0x12C94d3A30daa09f81Ea6c037004E6e99A4A3dfc" placeholder="Token B">
            <div style="margin-top:8px;">
                <button class="quick-btn" onclick="quickSelectB()">RIC</button>
            </div>
            <input id="amountB" type="number" placeholder="Amount" style="font-size:24px; margin-top:12px;">
            <div id="balanceB" style="font-size:12px; color:#888; margin-top:4px;">Balance: --</div>
        </div>

        <button id="addBtn">ADD LIQUIDITY</button>
        <div id="status"></div>
    </div>

    <script>
        const ROUTER_ADDRESS = "0x21c38fA2c2EA3D835CCd41733E35636E75022A53";
        const WBONE = "0xC76F4c819D820369Fb2d7C1531aB3Bb18e6fE8d8";
        const SHIBARIUM_CHAIN_ID = 109;

        const ROUTER_ABI = [
            "function addLiquidity(address tokenA, address tokenB, uint256 amountADesired, uint256 amountBDesired, uint256 amountAMin, uint256 amountBMin, address to, uint256 deadline) external returns (uint256, uint256, uint256)",
            "function addLiquidityBONE(address token, uint256 amountTokenDesired, uint256 amountTokenMin, uint256 amountBONEMin, address to, uint256 deadline) external payable returns (uint256, uint256, uint256)"
        ];
        const ERC20_ABI = [
            "function approve(address spender, uint256 amount) public returns (bool)",
            "function allowance(address owner, address spender) public view returns (uint256)",
            "function balanceOf(address account) public view returns (uint256)"
        ];

        let provider, signer, userAddress;

        const connectBtn = document.getElementById("connectBtn");
        const addBtn = document.getElementById("addBtn");
        const statusEl = document.getElementById("status");

        async function switchToShibarium() {
            try {
                await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: '0x' + SHIBARIUM_CHAIN_ID.toString(16) }] });
            } catch (e) {
                if (e.code === 4902) {
                    await window.ethereum.request({ method: 'wallet_addEthereumChain', params: [{ chainId: '0x' + SHIBARIUM_CHAIN_ID.toString(16), chainName: 'Shibarium', nativeCurrency: { name: 'BONE', symbol: 'BONE', decimals: 18 }, rpcUrls: ['https://rpc.shibarium.shib.io'], blockExplorerUrls: ['https://shibariumscan.io'] }] });
                }
            }
        }

        async function connectWallet() {
            if (!window.ethereum) return alert("Please install MetaMask");
            try {
                connectBtn.disabled = true;
                connectBtn.textContent = "CONNECTING...";
                await switchToShibarium();
                provider = new ethers.BrowserProvider(window.ethereum);
                signer = await provider.getSigner();
                userAddress = await signer.getAddress();
                connectBtn.textContent = userAddress.slice(0,6) + "..." + userAddress.slice(-4);
                await loadBalances();
            } catch (e) {
                alert("Connection failed: " + e.message);
            } finally {
                connectBtn.disabled = false;
            }
        }

        async function loadBalances() {
            if (!userAddress || !provider) return;
            const tokenA = document.getElementById("tokenA").value.trim();
            const tokenB = document.getElementById("tokenB").value.trim();
            if (tokenA) await getBalance(tokenA, "balanceA");
            if (tokenB) await getBalance(tokenB, "balanceB");
        }

        async function getBalance(tokenAddress, elementId) {
            try {
                const el = document.getElementById(elementId);
                if (tokenAddress.toLowerCase() === WBONE.toLowerCase()) {
                    const balance = await provider.getBalance(userAddress);
                    el.textContent = `Balance: ${ethers.formatEther(balance)} BONE`;
                } else {
                    const token = new ethers.Contract(tokenAddress, ERC20_ABI, provider);
                    const balance = await token.balanceOf(userAddress);
                    el.textContent = `Balance: ${ethers.formatEther(balance)}`;
                }
            } catch (e) {
                document.getElementById(elementId).textContent = "Balance: --";
            }
        }

        function quickSelectA() {
            document.getElementById("tokenA").value = WBONE;
            loadBalances();
        }
        function quickSelectB() {
            document.getElementById("tokenB").value = "0x12C94d3A30daa09f81Ea6c037004E6e99A4A3dfc";
            loadBalances();
        }

        async function addLiquidity() {
            if (!signer) return connectWallet();

            const tokenA = document.getElementById("tokenA").value.trim();
            const tokenB = document.getElementById("tokenB").value.trim();
            const amountA = document.getElementById("amountA").value;
            const amountB = document.getElementById("amountB").value;

            if (!tokenA || !tokenB || !amountA || !amountB) return alert("Please fill all fields");

            try {
                addBtn.disabled = true;
                statusEl.textContent = "Adding liquidity...";

                const router = new ethers.Contract(ROUTER_ADDRESS, ROUTER_ABI, signer);
                const deadline = Math.floor(Date.now() / 1000) + 1200;

                const isBONEA = tokenA.toLowerCase() === WBONE.toLowerCase();
                const isBONEB = tokenB.toLowerCase() === WBONE.toLowerCase();

                if (isBONEA || isBONEB) {
                    const token = isBONEA ? tokenB : tokenA;
                    const amountToken = ethers.parseEther(isBONEA ? amountB : amountA);
                    const amountBONE = ethers.parseEther(isBONEA ? amountA : amountB);

                    const tokenContract = new ethers.Contract(token, ERC20_ABI, signer);
                    const allowance = await tokenContract.allowance(userAddress, ROUTER_ADDRESS);
                    if (allowance < amountToken) {
                        statusEl.textContent = "Approving token...";
                        const txApprove = await tokenContract.approve(ROUTER_ADDRESS, ethers.MaxUint256);
                        await txApprove.wait();
                    }

                    const tx = await router.addLiquidityBONE(
                        token,
                        amountToken,
                        (amountToken * 995n) / 1000n,
                        (amountBONE * 995n) / 1000n,
                        userAddress,
                        deadline,
                        { value: amountBONE }
                    );
                    await tx.wait();
                } else {
                    const amountAWei = ethers.parseEther(amountA);
                    const amountBWei = ethers.parseEther(amountB);

                    const tokenAContract = new ethers.Contract(tokenA, ERC20_ABI, signer);
                    const tokenBContract = new ethers.Contract(tokenB, ERC20_ABI, signer);

                    if ((await tokenAContract.allowance(userAddress, ROUTER_ADDRESS)) < amountAWei) {
                        await (await tokenAContract.approve(ROUTER_ADDRESS, ethers.MaxUint256)).wait();
                    }
                    if ((await tokenBContract.allowance(userAddress, ROUTER_ADDRESS)) < amountBWei) {
                        await (await tokenBContract.approve(ROUTER_ADDRESS, ethers.MaxUint256)).wait();
                    }

                    const tx = await router.addLiquidity(
                        tokenA, tokenB, amountAWei, amountBWei,
                        (amountAWei * 995n) / 1000n,
                        (amountBWei * 995n) / 1000n,
                        userAddress,
                        deadline
                    );
                    await tx.wait();
                }

                statusEl.style.color = "#0f0";
                statusEl.textContent = "✅ Liquidity added successfully!";
                loadBalances();
            } catch (e) {
                console.error(e);
                statusEl.style.color = "#f00";
                statusEl.textContent = "Error: " + (e.reason || e.message || "Check console");
            } finally {
                addBtn.disabled = false;
            }
        }

        document.getElementById("connectBtn").addEventListener("click", connectWallet);
        document.getElementById("addBtn").addEventListener("click", addLiquidity);
        document.getElementById("tokenA").addEventListener("change", loadBalances);
        document.getElementById("tokenB").addEventListener("change", loadBalances);
    </script>
</body>
</html>
