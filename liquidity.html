<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RicSwap | Add Liquidity</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
    <style>
        :root {
            --obsidian: #080808;
            --card-bg: #121212;
            --magma: linear-gradient(135deg, #ff4d00 0%, #ff8c00 100%);
            --gold: #ffd700;
        }
        body { background: var(--obsidian); color: white; font-family: system-ui, sans-serif; margin: 0; padding: 0; }
        .nav { padding: 20px 40px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255,215,0,0.1); }
        .logo { font-size: 28px; font-weight: bold; color: var(--gold); }
        .nav-links { display: flex; gap: 30px; margin-left: 40px; }
        .nav-links a { color: white; text-decoration: none; font-weight: 500; }
        .nav-links a:hover, .nav-links a.active { color: var(--gold); }
        .connect-btn { background: #222; color: white; border: 1px solid #444; padding: 8px 18px; border-radius: 9999px; font-size: 14px; font-weight: 500; cursor: pointer; white-space: nowrap; margin-left: auto; flex-shrink: 0; width: 160px; text-align: center; }
        .connect-btn:hover { background: #333; border-color: var(--gold); }
        .card { max-width: 520px; margin: 40px auto; background: var(--card-bg); border-radius: 24px; padding: 32px; box-shadow: 0 20px 40px rgba(0,0,0,0.8); border: 1px solid #222; }
        .input-group { background: #1a1a1a; border-radius: 16px; padding: 16px; margin-bottom: 16px; border: 1px solid #333; }
        .input-group:focus-within { border-color: var(--gold); }
        label { display: block; color: #888; font-size: 12px; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        input { background: transparent; border: none; color: white; font-size: 24px; width: 100%; outline: none; }
        button.main-btn { background: var(--magma); color: white; border: none; padding: 18px; border-radius: 16px; font-weight: bold; width: 100%; font-size: 18px; cursor: pointer; margin-top: 10px; transition: 0.2s; }
        button.main-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .status { margin-top: 15px; text-align: center; font-size: 13px; min-height: 24px; font-family: monospace; line-height: 1.5; }
        .token-info { font-size: 13px; color: var(--gold); margin-top: 4px; font-weight: 500; }
        .tx-link { color: var(--gold); text-decoration: underline; font-size: 13px; }
    </style>
</head>
<body>

<div class="nav">
    <div class="logo">RicSwap</div>
    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="swap.html">Swap</a>
        <a href="pools.html">Pools</a>
        <a href="liquidity.html" class="active">Add</a>
    </div>
    <button id="connectBtn" class="connect-btn">Connect Wallet</button>
</div>

<div class="card">
    <h2 style="text-align:center; margin-bottom:24px;">Initialize & Supply LP</h2>
    
    <div class="input-group">
        <label>Token Address</label>
        <input type="text" id="tokenAddress" placeholder="0x..." style="font-size:16px;">
        <div id="tokenInfo" class="token-info"></div>
    </div>
    <button id="createPairBtn" class="main-btn" style="background:#222; border: 1px solid #444; font-size: 14px;">1. Create Pair & Burner</button>

    <div style="margin: 25px 0; text-align:center; color:#444; font-size: 11px; letter-spacing: 2px;">THEN ADD LIQUIDITY</div>

    <div class="input-group">
        <label>You add BONE</label>
        <input type="number" id="amountBONE" placeholder="0.0" value="1">
        <div style="text-align:right; font-size:11px; color:#666;" id="boneBalance">Balance: --</div>
    </div>

    <div class="input-group">
        <label>Token Amount <span id="symDisplay"></span></label>
        <input type="number" id="amountToken" placeholder="0.0">
    </div>

    <button id="addBtn" class="main-btn">2. Supply Permanent LP</button>
    <div class="status" id="status"></div>
</div>

<script>
    const FACTORY_ADDRESS = "0x78ae5cCD2f13D10aE3fF47F8418A79D99B4569d0";
    const ROUTER_ADDRESS = "0xA809a9060D36f5324061EF93192ad5DA12Afc62e";
    const WBONE = "0xC76F4c819D820369Fb2d7C1531aB3Bb18e6fE8d8";

    let provider, signer, userAddress;

    const ERC20_ABI = [
        "function symbol() view returns (string)",
        "function balanceOf(address) view returns (uint256)",
        "function approve(address,uint) returns (bool)",
        "function allowance(address,address) view returns (uint256)"
    ];

    async function connectWallet() {
        if (!window.ethereum) return alert("Install MetaMask");
        try {
            provider = new ethers.BrowserProvider(window.ethereum);
            const accounts = await provider.send("eth_requestAccounts", []);
            userAddress = accounts[0]; // Isolate specific address string
            signer = await provider.getSigner();
            
            document.getElementById("connectBtn").textContent = userAddress.slice(0,6) + "..." + userAddress.slice(-4);
            const bal = await provider.getBalance(userAddress);
            document.getElementById("boneBalance").textContent = `Balance: ${Number(ethers.formatEther(bal)).toFixed(4)} BONE`;
            document.getElementById("status").textContent = "✅ Connected to Shibarium";
        } catch (e) { console.error(e); }
    }

    async function updateTokenInfo() {
        const addr = document.getElementById("tokenAddress").value.trim();
        if (!ethers.isAddress(addr) || !signer) return;
        try {
            const token = new ethers.Contract(addr, ERC20_ABI, provider);
            const [sym, bal] = await Promise.all([token.symbol(), token.balanceOf(userAddress)]);
            document.getElementById("tokenInfo").textContent = `Token: ${sym} | Balance: ${Number(ethers.formatEther(bal)).toFixed(4)}`;
            document.getElementById("symDisplay").textContent = `(${sym})`;
        } catch (e) { document.getElementById("tokenInfo").textContent = "Invalid Token Address"; }
    }

    async function createPair() {
        if (!signer) return connectWallet();
        const status = document.getElementById("status");
        const addr = document.getElementById("tokenAddress").value.trim();
        try {
            status.style.color = "orange";
            status.textContent = "Creating Pair & Auto-Burner...";
            const factory = new ethers.Contract(FACTORY_ADDRESS, ["function createPair(address,address) returns (address)"], signer);
            // Manual Gas Limit for heavy Factory creation
            const tx = await factory.createPair(WBONE, addr, { gasLimit: 5000000 });
            await tx.wait();
            status.style.color = "#0f0";
            status.innerHTML = `✅ Pair Created!<br><a href="https://shibariumscan.io/tx/${tx.hash}" target="_blank" class="tx-link">View Transaction</a>`;
        } catch (e) { status.style.color = "red"; status.textContent = "Error: " + (e.reason || "Check Balance/Gas"); }
    }

    async function addLiquidity() {
        if (!signer) return connectWallet();
        const status = document.getElementById("status");
        const addr = document.getElementById("tokenAddress").value.trim();
        const amtB = document.getElementById("amountBONE").value;
        const amtT = document.getElementById("amountToken").value;

        try {
            status.style.color = "orange";
            const valB = ethers.parseEther(amtB);
            const valT = ethers.parseEther(amtT);
            const token = new ethers.Contract(addr, ERC20_ABI, signer);

            // AUTO-APPROVAL LOGIC
            status.textContent = "Approving Token for Router...";
            const allowance = await token.allowance(userAddress, ROUTER_ADDRESS);
            if (allowance < valT) {
                await (await token.approve(ROUTER_ADDRESS, ethers.MaxUint256)).wait();
            }

            status.textContent = "Supplying Permanent LP...";
            const router = new ethers.Contract(ROUTER_ADDRESS, ["function addLiquidityBONE(address,uint,uint,uint,address,uint) external payable returns (uint,uint,uint)"], signer);
            const deadline = Math.floor(Date.now() / 1000) + 1200;

            const tx = await router.addLiquidityBONE(
                addr, valT, 0, 0, userAddress, deadline, 
                { value: valB, gasLimit: 2000000 }
            );
            await tx.wait();
            status.style.color = "#0f0";
            status.innerHTML = `✅ Permanent LP Added!<br><a href="https://shibariumscan.io/tx/${tx.hash}" target="_blank" class="tx-link">View Receipt</a>`;
        } catch (e) { status.style.color = "red"; status.textContent = "Error: " + (e.reason || "Check Balance/Gas"); }
    }

    document.getElementById("connectBtn").onclick = connectWallet;
    document.getElementById("createPairBtn").onclick = createPair;
    document.getElementById("addBtn").onclick = addLiquidity;
    document.getElementById("tokenAddress").oninput = updateTokenInfo;

    window.onload = () => { if(window.ethereum?.selectedAddress) connectWallet(); }
</script>
</body>
</html>
