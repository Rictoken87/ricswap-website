<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RicSwap | Add Liquidity</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
    <style>
        body { background: #050505; color: #e0e0e0; font-family: monospace; display: flex; justify-content: center; padding: 30px; }
        .card { background: #111; padding: 30px; border: 1px solid #333; width: 520px; border-radius: 16px; }
        h2 { color: #00ff88; text-align: center; }
        .input-group { margin-bottom: 20px; background: #1a1a1a; padding: 15px; border-radius: 12px; }
        label { display: block; color: #888; font-size: 12px; margin-bottom: 6px; }
        input { width: 100%; background: #222; border: none; color: #fff; padding: 12px; border-radius: 8px; }
        button { width: 100%; padding: 18px; background: #00ff88; color: #000; border: none; border-radius: 12px; font-weight: bold; margin-top: 15px; cursor: pointer; }
        #status { margin-top: 20px; padding: 15px; background: #000; border: 1px solid #222; border-radius: 8px; font-size: 13px; min-height: 80px; }
        .success { color: #00ff88; }
    </style>
</head>
<body>
<div class="card">
    <h2>💧 Add Liquidity</h2>
    
    <div class="input-group">
        <label>Token A (e.g. RIC)</label>
        <input id="tokenA" placeholder="0x..." value="">
        <input id="amountA" type="number" placeholder="Amount" value="100">
    </div>
    
    <div class="input-group">
        <label>Token B (Any Token)</label>
        <input id="tokenB" placeholder="0x..." value="">
        <input id="amountB" type="number" placeholder="Amount" value="100">
    </div>

    <button onclick="addLiquidity()">ADD LIQUIDITY + AUTO BURN LP</button>
    <div id="status">Ready</div>
</div>

<script>
    const ROUTER = "0xe8E937e14842f376f4EA5bdBf211422c46d12473";   // ← Your Working Router
    const FACTORY = "0x78ae5cCD2f13D10aE3fF47F8418A79D99B4569d0";
    const DEAD = "0x000000000000000000000000000000000000dEaD";

    async function addLiquidity() {
        const status = document.getElementById("status");
        const tokenA = document.getElementById("tokenA").value.trim();
        const tokenB = document.getElementById("tokenB").value.trim();
        const amtA = document.getElementById("amountA").value;
        const amtB = document.getElementById("amountB").value;

        if (!ethers.isAddress(tokenA) || !ethers.isAddress(tokenB)) {
            return status.innerHTML = `<span class="error">Invalid token address</span>`;
        }

        try {
            status.innerText = "Connecting wallet...";
            const provider = new ethers.BrowserProvider(window.ethereum);
            const signer = await provider.getSigner();
            const user = await signer.getAddress();

            // Approve both tokens
            status.innerText = "Approving Token A...";
            await new ethers.Contract(tokenA, ["function approve(address,uint256)"], signer)
                .approve(ROUTER, ethers.MaxUint256).then(tx => tx.wait());

            status.innerText = "Approving Token B...";
            await new ethers.Contract(tokenB, ["function approve(address,uint256)"], signer)
                .approve(ROUTER, ethers.MaxUint256).then(tx => tx.wait());

            // Add Liquidity
            status.innerText = "Adding Liquidity...";
            const router = new ethers.Contract(ROUTER, [
                "function addLiquidity(address tokenA, address tokenB, uint amountADesired, uint amountBDesired, uint amountAMin, uint amountBMin, address to, uint deadline) returns (uint,uint,uint)"
            ], signer);

            const deadline = Math.floor(Date.now() / 1000) + 1800;
            const tx = await router.addLiquidity(
                tokenA, tokenB,
                ethers.parseUnits(amtA, 18),
                ethers.parseUnits(amtB, 18),
                0, 0,
                user,
                deadline,
                { gasLimit: 3000000 }
            );

            status.innerHTML = `Tx Sent → <a href="https://shibariumscan.io/tx/${tx.hash}" target="_blank">View</a>`;
            await tx.wait();

            // Auto Burn LP
            status.innerText = "Burning LP tokens to DEAD...";
            const factory = new ethers.Contract(FACTORY, ["function getPair(address,address) view returns (address)"], provider);
            const lpAddr = await factory.getPair(tokenA, tokenB);

            if (lpAddr !== "0x0000000000000000000000000000000000000000") {
                const lpContract = new ethers.Contract(lpAddr, [
                    "function balanceOf(address) view returns (uint256)",
                    "function transfer(address,uint256) returns (bool)"
                ], signer);

                const balance = await lpContract.balanceOf(user);
                if (balance > 0) {
                    const burnTx = await lpContract.transfer(DEAD, balance);
                    await burnTx.wait();
                }
            }

            status.innerHTML = `<span class="success">✅ SUCCESS! Liquidity Added & LP Permanently Burned</span>`;

        } catch (e) {
            console.error(e);
            status.innerHTML = `<span class="error">Error: ${e.reason || e.message}</span>`;
        }
    }
</script>
</body>
</html>
