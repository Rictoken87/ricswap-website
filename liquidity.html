<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#030407">
<meta name="description" content="RicSwap -- Add liquidity to earn fees on Shibarium">
<title>RicSwap | Add Liquidity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DESIGN SYSTEM -- identical to swap.html
   ============================================================ */
:root {
  --void:  #030407;
  --deep:  #05060e;
  --well:  #080918;
  --pit:   #0b0c1c;
  --card:  #0e1022;
  --lift:  #12142c;
  --rim:   rgba(255,255,255,0.055);
  --rim2:  rgba(255,77,0,0.28);

  --magma: #ff4d00;
  --ember: #ff8c00;
  --gold:  #e8b84b;
  --green: #00ffb2;
  --red:   #ff3366;
  --blue:  #4d9fff;

  --ash:   #383b52;
  --smoke: #656880;
  --fog:   #a0a2bc;
  --mist:  #c4c6dc;
  --white: #eef0f8;

  --mono:    'JetBrains Mono', monospace;
  --display: 'Bebas Neue', sans-serif;
  --body:    'DM Sans', sans-serif;
}

*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; }
body {
  background: var(--void); color: var(--fog);
  font-family: var(--body); font-size: 15px;
  line-height: 1.6; min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  display: flex; flex-direction: column;
  overflow-x: hidden;
}
a { color: inherit; text-decoration: none; }
button { font-family: var(--body); cursor: pointer; border: none; outline: none; }
input  { font-family: var(--body); outline: none; border: none; background: transparent; }

/* Grid + noise */
body::before {
  content: ''; position: fixed; inset: 0;
  background-image:
    linear-gradient(rgba(255,77,0,.016) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,77,0,.016) 1px, transparent 1px);
  background-size: 52px 52px;
  pointer-events: none; z-index: 0;
}
body::after {
  content: ''; position: fixed; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  opacity: 0.014; pointer-events: none; z-index: 0;
}
.bg-glow {
  position: fixed; top: 30%; left: 50%;
  transform: translate(-50%,-50%);
  width: 600px; height: 600px;
  background: radial-gradient(circle, rgba(0,255,178,.04) 0%, transparent 70%);
  pointer-events: none; z-index: 0;
}

/* ============================================================
   HEADER -- identical to swap.html
   ============================================================ */
.header {
  position: sticky; top: 0; z-index: 200;
  background: rgba(3,4,7,0.88);
  backdrop-filter: blur(24px);
  border-bottom: 1px solid var(--rim);
  padding: 0 24px; height: 64px;
  display: flex; align-items: center;
  justify-content: space-between; gap: 12px;
}
.logo {
  font-family: var(--display); font-size: 26px;
  letter-spacing: 2px;
  background: linear-gradient(135deg, var(--gold), var(--magma));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  flex-shrink: 0;
}
.header-nav { display: flex; align-items: center; gap: 2px; flex: 1; justify-content: center; }
.nav-link {
  padding: 6px 16px; border-radius: 8px;
  font-size: 14px; font-weight: 500;
  color: var(--smoke); cursor: pointer;
  transition: all .2s; white-space: nowrap;
  background: transparent; border: none;
}
.nav-link:hover  { color: var(--fog); }
.nav-link.active { color: var(--white); background: rgba(255,255,255,.06); }
.header-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.net-badge {
  display: flex; align-items: center; gap: 5px;
  padding: 5px 11px; border-radius: 20px;
  background: rgba(0,255,178,.06); border: 1px solid rgba(0,255,178,.15);
  font-family: var(--mono); font-size: 10px; color: var(--green); letter-spacing: .5px;
}
.pulse { width: 5px; height: 5px; border-radius: 50%; background: var(--green); animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
.connect-btn {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 18px; border-radius: 10px;
  font-size: 13px; font-weight: 500;
  background: linear-gradient(135deg, var(--magma), var(--ember));
  color: white; transition: all .2s; border: none; cursor: pointer; white-space: nowrap;
}
.connect-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(255,77,0,.38); }
.connect-btn.connected { background: transparent; border: 1px solid rgba(0,255,178,.25); color: var(--green); }
.connect-btn.connected:hover { background: rgba(0,255,178,.05); transform: none; box-shadow: none; }
.connect-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ============================================================
   MAIN
   ============================================================ */
.main {
  position: relative; z-index: 1; flex: 1;
  display: flex; align-items: flex-start;
  justify-content: center; padding: 40px 24px 80px; gap: 20px;
}

/* ============================================================
   LIQUIDITY CARD
   ============================================================ */
.liq-card {
  width: 100%; max-width: 520px;
  background: var(--card); border: 1px solid var(--rim);
  border-radius: 20px; overflow: hidden; position: relative;
}
.liq-card::before {
  content: ''; position: absolute;
  top: -1px; left: 12%; right: 12%; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(0,255,178,.4), transparent);
}

/* Card header */
.card-header {
  padding: 20px 20px 0;
  display: flex; align-items: center; justify-content: space-between;
}
.card-title {
  font-family: var(--display); font-size: 28px;
  letter-spacing: 2px; color: var(--white);
}
.card-sub {
  font-family: var(--mono); font-size: 10px;
  color: var(--ash); letter-spacing: 1px;
  text-transform: uppercase; margin-top: 2px;
}
.remove-link {
  display: flex; align-items: center; gap: 5px;
  font-family: var(--mono); font-size: 11px;
  color: var(--smoke); padding: 6px 12px;
  border: 1px solid var(--rim); border-radius: 8px;
  cursor: pointer; transition: all .2s; white-space: nowrap;
}
.remove-link:hover { border-color: var(--rim2); color: var(--magma); }
.remove-link svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.card-body { padding: 20px; }

/* Section label */
.sec-label {
  font-family: var(--mono); font-size: 9px;
  letter-spacing: 2px; text-transform: uppercase;
  color: var(--ash); margin-bottom: 8px;
  display: flex; align-items: center; gap: 8px;
}
.sec-label::after { content: ''; flex: 1; height: 1px; background: var(--rim); }

/* Token input box */
.token-box {
  background: var(--pit); border: 1px solid var(--rim);
  border-radius: 14px; padding: 14px 16px;
  transition: border-color .2s;
}
.token-box:focus-within { border-color: rgba(255,77,0,.28); }

/* Address row */
.addr-row {
  display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
}
.addr-tag {
  font-family: var(--mono); font-size: 9px;
  letter-spacing: 1.5px; text-transform: uppercase;
  color: var(--ash); flex-shrink: 0; white-space: nowrap;
}
.addr-input {
  flex: 1; background: var(--well);
  border: 1px solid var(--rim); border-radius: 8px;
  color: var(--white); padding: 8px 12px;
  font-family: var(--mono); font-size: 12px;
  transition: border-color .2s; width: 100%;
}
.addr-input:focus { border-color: rgba(255,77,0,.3); }
.addr-input::placeholder { color: var(--ash); }

/* Amount row */
.amt-row { display: flex; align-items: center; gap: 10px; }
.amt-input {
  flex: 1; min-width: 0; width: 100%;
  background: transparent; border: none;
  color: var(--white); font-family: var(--display);
  font-size: 32px; letter-spacing: 1px;
}
.amt-input::placeholder { color: var(--ash); }
.amt-input::-webkit-inner-spin-button,
.amt-input::-webkit-outer-spin-button { -webkit-appearance: none; }
.bal-group { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.bal-lbl { font-family: var(--mono); font-size: 10px; color: var(--smoke); }
.bal-val { font-family: var(--mono); font-size: 10px; color: var(--fog); }
.max-btn {
  font-size: 9px; letter-spacing: .5px; padding: 2px 8px;
  border-radius: 5px; background: rgba(255,77,0,.1);
  border: 1px solid rgba(255,77,0,.2); color: var(--magma);
  cursor: pointer; transition: all .15s; font-family: var(--mono);
}
.max-btn:hover { background: rgba(255,77,0,.2); }

/* Token meta pill */
.token-meta {
  display: flex; align-items: center; gap: 8px;
  margin-top: 8px; min-height: 22px; flex-wrap: wrap;
}
.meta-sym {
  font-family: var(--mono); font-size: 11px;
  color: var(--green); background: rgba(0,255,178,.08);
  border: 1px solid rgba(0,255,178,.15);
  padding: 2px 9px; border-radius: 4px;
}
.meta-dec { font-family: var(--mono); font-size: 11px; color: var(--ash); }
.meta-err { font-family: var(--mono); font-size: 11px; color: var(--red); }

/* Plus divider */
.plus-divider {
  display: flex; align-items: center; justify-content: center;
  gap: 12px; margin: 8px 0; color: var(--ash);
}
.plus-divider::before,
.plus-divider::after { content: ''; flex: 1; height: 1px; background: var(--rim); }
.plus-icon {
  width: 32px; height: 32px; border-radius: 8px;
  background: var(--pit); border: 1px solid var(--rim);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; color: var(--ash);
}

/* Pair info */
.pair-info {
  display: none; background: var(--pit);
  border: 1px solid var(--rim); border-radius: 10px;
  padding: 10px 14px; margin: 10px 0;
  font-family: var(--mono); font-size: 11px; color: var(--ash);
}
.pair-info.show { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pair-info span { color: var(--fog); word-break: break-all; }
.pair-badge {
  padding: 2px 8px; border-radius: 4px;
  font-size: 10px; font-weight: 500;
}
.pair-badge.exists { background: rgba(0,255,178,.08); color: var(--green); border: 1px solid rgba(0,255,178,.15); }
.pair-badge.new    { background: rgba(77,159,255,.08); color: var(--blue);  border: 1px solid rgba(77,159,255,.15); }

/* Settings row */
.settings-row {
  display: flex; align-items: center; justify-content: space-between;
  background: var(--pit); border: 1px solid var(--rim);
  border-radius: 10px; padding: 10px 14px; margin: 12px 0;
}
.settings-lbl { font-family: var(--mono); font-size: 11px; color: var(--smoke); }
.slip-btns { display: flex; gap: 4px; }
.slip-btn {
  padding: 5px 11px; border-radius: 6px;
  font-family: var(--mono); font-size: 10px;
  background: transparent; border: 1px solid var(--rim);
  color: var(--ash); cursor: pointer; transition: all .15s;
}
.slip-btn:hover { border-color: var(--rim2); color: var(--fog); }
.slip-btn.active { background: rgba(255,77,0,.12); border-color: rgba(255,77,0,.3); color: var(--magma); }

/* Supply button */
.supply-btn {
  width: 100%; padding: 16px; border-radius: 14px;
  font-size: 15px; font-weight: 600; letter-spacing: .3px;
  background: linear-gradient(135deg, var(--magma), var(--ember));
  color: white; transition: all .2s; margin-top: 10px;
  position: relative; overflow: hidden; border: none; cursor: pointer;
}
.supply-btn::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,.1), transparent); opacity: 0; transition: opacity .2s; }
.supply-btn:hover:not(:disabled)::before { opacity: 1; }
.supply-btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 10px 30px rgba(255,77,0,.38); }
.supply-btn:disabled { background: var(--well); color: var(--ash); cursor: not-allowed; transform: none; box-shadow: none; }

/* LP result */
.lp-result {
  display: none; margin-top: 12px;
  background: rgba(0,255,178,.05); border: 1px solid rgba(0,255,178,.2);
  border-radius: 12px; padding: 14px 16px;
}
.lp-result.show { display: block; }
.lp-result-lbl { font-family: var(--mono); font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--ash); margin-bottom: 4px; }
.lp-result-val { font-family: var(--display); font-size: 28px; color: var(--green); letter-spacing: 1px; }

/* Status */
.status-box {
  margin-top: 12px; padding: 10px 14px;
  background: var(--pit); border: 1px solid var(--rim);
  border-radius: 10px; font-family: var(--mono); font-size: 11px;
  color: var(--smoke); display: flex; align-items: center; gap: 8px;
  min-height: 38px; transition: all .2s;
}
.status-box.success { border-color: rgba(0,255,178,.3); color: var(--green); }
.status-box.error   { border-color: rgba(255,51,102,.3); color: var(--red); }
.status-box.loading { border-color: rgba(255,77,0,.3);   color: var(--magma); }
.status-box a { color: inherit; text-decoration: underline; }

/* Spinner */
.spinner { width: 14px; height: 14px; border: 2px solid rgba(255,77,0,.2); border-top-color: var(--magma); border-radius: 50%; animation: spin .7s linear infinite; flex-shrink: 0; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Fade in */
.fade-up { animation: fadeUp .3s ease both; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

@media (max-width: 600px) {
  .header-nav { display: none; }
  .header { padding: 0 14px; }
  .main { padding: 20px 14px 60px; }
  .net-badge { display: none; }
  .card-body { padding: 14px; }
}
</style>
</head>
<body>

<div class="bg-glow"></div>

<!-- ============================================================
     HEADER -- identical to swap.html
     ============================================================ -->
<div class="header">
  <a class="logo" href="index.html">RicSwap</a>

  <nav class="header-nav">
    <button class="nav-link" onclick="location.href='index.html'">Home</button>
    <button class="nav-link" onclick="location.href='swap.html'">Swap</button>

      <span>Shibarium</span>
    </div>
    <button class="connect-btn" id="connectBtn" onclick="connectWallet()">
      <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 3H8a2 2 0 00-2 2v2h12V5a2 2 0 00-2-2z"/></svg>

<div class="main">

      <!-- Card header -->
      <div class="card-header">
        <div>
          <div class="card-title">Add Liquidity</div>
          <div class="card-sub">Provide tokens to earn 0.3% trading fees</div>
        </div>
        <a class="remove-link" href="remove-liquidity.html">
          <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>

          </div>
          <div class="token-meta" id="metaA"></div>
        </div>

        <!-- Plus divider -->
        <div class="plus-divider">
          <div class="plus-icon">+</div>
        </div>

        <!-- Token B -->
        <div class="sec-label">Token B</div>
        <div class="token-box">
          <div class="addr-row">
            <span class="addr-tag">Address</span>
            <input class="addr-input" id="tokenB" placeholder="0x..." oninput="onAddrChange('B')">
          </div>
          <div class="amt-row">
            <input class="amt-input" type="number" id="amountB" placeholder="0.0" step="any">
            <div class="bal-group">
              <span class="bal-lbl">BAL</span>
              <span class="bal-val" id="balB">--</span>
              <button class="max-btn" onclick="setMax('B')">MAX</button>
            </div>
          </div>

        <!-- Pair info -->
        <div class="pair-info" id="pairInfo"></div>

        <!-- Slippage -->

          Supply Liquidity
        </button>

        <!-- LP result -->
        <div class="lp-result" id="lpResult">
          <div class="lp-result-lbl">LP Tokens Received</div>
          <div class="lp-result-val" id="lpAmount">--</div>
        </div>

        <!-- Status -->
        <div class="status-box" id="statusBox">
          <span>&#9675;</span>
          <span id="statusTxt">Connect wallet to begin</span>
        </div>

      </div>
    </div>
  </div>
</div>

<!-- ============================================================
     JAVASCRIPT -- all logic preserved from original
     ============================================================ -->
<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
<script>
const CONFIG = {
  ROUTER:     '0x652875c0F607CB392C0F9E5FB957A7055c2deD2e',
  FACTORY:    '0xD8fFEECfDE1698a70A26a094afBE917bA58E2F70',
  CHAIN_ID:   109n,
  CHAIN_NAME: 'Shibarium',
  EXPLORER:   'https://shibariumscan.io',
};
const WBONE = '0xc76f4c819d820369fb2d7c1531ab3bb18e6fe8d8';

const ERC20_ABI = [
  'function balanceOf(address) view returns (uint256)',
  'function decimals() view returns (uint8)',
  'function symbol() view returns (string)',
  'function name() view returns (string)',
  'function allowance(address,address) view returns (uint256)',
  'function approve(address,uint256) returns (bool)',
];
const ROUTER_ABI = [
  'function addLiquidity(address,address,uint256,uint256,uint256,uint256,address,uint256) external returns (uint256,uint256,uint256)',
  'function addLiquidityETH(address,uint256,uint256,uint256,address,uint256) external payable returns (uint256,uint256,uint256)',
];
const FACTORY_ABI = ['function getPair(address,address) view returns (address)'];

let provider, signer, userAddress;
let slipBps   = 500n;
let tokenInfo = { A: null, B: null };

// ── Wallet ────────────────────────────────────────────────────
async function connectWallet() {
  if (!window.ethereum) return alert('Please install MetaMask or Rabby Wallet');
  try {
    provider = new ethers.BrowserProvider(window.ethereum);
    signer   = await provider.getSigner();
    const net = await provider.getNetwork();
    if (net.chainId !== CONFIG.CHAIN_ID) {
      setSt('loading', null, 'Switching to Shibarium...');
      try {
        await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: '0x6d' }] });
        provider = new ethers.BrowserProvider(window.ethereum);
        signer   = await provider.getSigner();
      } catch(e) { setSt('error', '✕', 'Please switch to Shibarium manually'); return; }
    }
    userAddress = await signer.getAddress();
    const btn   = document.getElementById('connectBtn');
    btn.classList.add('connected');
    document.getElementById('connectLabel').textContent = userAddress.slice(0,6)+'...'+userAddress.slice(-4);
    setSt('', '○', 'Wallet connected — enter token addresses');
    window.ethereum.on('accountsChanged', () => location.reload());
    window.ethereum.on('chainChanged',    () => location.reload());
    if (ethers.isAddress(document.getElementById('tokenA').value)) onAddrChange('A');
    if (ethers.isAddress(document.getElementById('tokenB').value)) onAddrChange('B');
  } catch(e) { setSt('error', '✕', decErr(e)); }
}

// ── Token address change ──────────────────────────────────────
async function onAddrChange(side) {
  const addr = document.getElementById('token'+side).value.trim();
  const meta = document.getElementById('meta'+side);
  meta.innerHTML = ''; tokenInfo[side] = null;
  document.getElementById('bal'+side).textContent = '--';
  if (!ethers.isAddress(addr) || !provider) return;
  const isWBONE = addr.toLowerCase() === WBONE.toLowerCase();
  try {
    const c = new ethers.Contract(addr, ERC20_ABI, provider);
    let symbol, decimals, balance;
    if (isWBONE) {
      decimals = 18; symbol = 'WBONE';
      balance  = userAddress ? await provider.getBalance(userAddress) : 0n;
    } else {
      [decimals, balance] = await Promise.all([
        c.decimals(),
        userAddress ? c.balanceOf(userAddress) : 0n,
      ]);
      try { symbol = await c.symbol(); }
      catch(_) { try { symbol = await c.name(); } catch(_) { symbol = addr.slice(0,6)+'...'; } }
    }
    tokenInfo[side] = { symbol, decimals, balance, address: addr, isWBONE };
    meta.innerHTML = `<span class="meta-sym">${isWBONE ? 'WBONE (native)' : symbol}</span><span class="meta-dec">${decimals} decimals</span>`;
    document.getElementById('bal'+side).textContent = fmtU(balance, decimals) + (isWBONE ? ' BONE' : '');
    checkPair();
  } catch(e) {
    meta.innerHTML = `<span class="meta-err">Error: ${sanitize(decErr(e)).slice(0,60)}</span>`;
  }
}

async function checkPair() {
  const addrA = document.getElementById('tokenA').value.trim();
  const addrB = document.getElementById('tokenB').value.trim();
  const el    = document.getElementById('pairInfo');
  if (!ethers.isAddress(addrA) || !ethers.isAddress(addrB) || !provider) { el.classList.remove('show'); return; }
  try {
    const factory = new ethers.Contract(CONFIG.FACTORY, FACTORY_ABI, provider);
    const pair    = await factory.getPair(addrA, addrB);
    const exists  = pair !== '0x0000000000000000000000000000000000000000';
    el.classList.add('show');
    if (exists) {
      el.innerHTML = `<span class="pair-badge exists">Pair exists</span><span>${pair}</span>`;
    } else {
      el.innerHTML = `<span class="pair-badge new">New pair</span><span>Will be created automatically on first deposit</span>`;
    }
  } catch(_) { el.classList.remove('show'); }
}

function setMax(side) {
  if (!tokenInfo[side]) return;
  const { balance, decimals, isWBONE } = tokenInfo[side];
  const safe = isWBONE && balance > ethers.parseEther('0.01') ? balance - ethers.parseEther('0.01') : balance;
  document.getElementById('amount'+side).value = ethers.formatUnits(safe, decimals);
}

function setSlip(pct) {
  slipBps = BigInt(pct * 100);
  document.querySelectorAll('.slip-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
}

// ── Add Liquidity ─────────────────────────────────────────────
async function addLiquidity() {
  const addrA = document.getElementById('tokenA').value.trim();
  const addrB = document.getElementById('tokenB').value.trim();
  const amtA  = document.getElementById('amountA').value.trim();
  const amtB  = document.getElementById('amountB').value.trim();

  if (!userAddress)                                return setSt('error','✕','Connect wallet first');
  if (!ethers.isAddress(addrA))                   return setSt('error','✕','Invalid Token A address');
  if (!ethers.isAddress(addrB))                   return setSt('error','✕','Invalid Token B address');
  if (addrA.toLowerCase()===addrB.toLowerCase())  return setSt('error','✕','Tokens cannot be the same');
  if (!tokenInfo.A)                               return setSt('error','✕','Token A not loaded');
  if (!tokenInfo.B)                               return setSt('error','✕','Token B not loaded');
  if (!amtA || parseFloat(amtA)<=0)              return setSt('error','✕','Enter amount for Token A');
  if (!amtB || parseFloat(amtB)<=0)              return setSt('error','✕','Enter amount for Token B');

  let amountAWei, amountBWei;
  try {
    amountAWei = ethers.parseUnits(amtA, tokenInfo.A.decimals);
    amountBWei = ethers.parseUnits(amtB, tokenInfo.B.decimals);
  } catch(e) { return setSt('error','✕','Amount too precise for token decimals'); }

  if (amountAWei > tokenInfo.A.balance) return setSt('error','✕',`Insufficient ${tokenInfo.A.symbol} balance`);
  if (amountBWei > tokenInfo.B.balance) return setSt('error','✕',`Insufficient ${tokenInfo.B.symbol} balance`);

  const minA = amountAWei * (10000n - slipBps) / 10000n;
  const minB = amountBWei * (10000n - slipBps) / 10000n;

  setBtnLoading(true);
  document.getElementById('lpResult').classList.remove('show');

  try {
    const tcA = new ethers.Contract(addrA, ERC20_ABI, signer);
    const tcB = new ethers.Contract(addrB, ERC20_ABI, signer);
    setSt('loading', null, 'Checking allowances...');

    const [allowA, allowB] = await Promise.all([
      tcA.allowance(userAddress, CONFIG.ROUTER),
      tcB.allowance(userAddress, CONFIG.ROUTER),
    ]);

    const aIsWBONE = tokenInfo.A.isWBONE;
    const bIsWBONE = tokenInfo.B.isWBONE;

    if (!aIsWBONE && allowA < amountAWei) {
      setSt('loading', null, `Approving ${tokenInfo.A.symbol}...`);
      const tx = await tcA.approve(CONFIG.ROUTER, amountAWei);
      setSt('loading', null, `Waiting for ${tokenInfo.A.symbol} approval...`);
      await tx.wait();
    }
    if (!bIsWBONE && allowB < amountBWei) {
      setSt('loading', null, `Approving ${tokenInfo.B.symbol}...`);
      const tx = await tcB.approve(CONFIG.ROUTER, amountBWei);
      setSt('loading', null, `Waiting for ${tokenInfo.B.symbol} approval...`);
      await tx.wait();
    }

    setSt('loading', null, 'Simulating transaction...');
    const router   = new ethers.Contract(CONFIG.ROUTER, ROUTER_ABI, signer);
    const deadline = BigInt(Math.floor(Date.now()/1000) + 300);
    const useETH   = aIsWBONE || bIsWBONE;
    const tokenAddr = aIsWBONE ? addrB : addrA;
    const tokenAmt  = aIsWBONE ? amountBWei : amountAWei;
    const tokenMin  = aIsWBONE ? minB : minA;
    const ethAmt    = aIsWBONE ? amountAWei : amountBWei;
    const ethMin    = aIsWBONE ? minA : minB;

    try {
      if (useETH) {
        await router.addLiquidityETH.staticCall(tokenAddr, tokenAmt, tokenMin, ethMin, userAddress, deadline, { value: ethAmt });
      } else {
        await router.addLiquidity.staticCall(addrA, addrB, amountAWei, amountBWei, minA, minB, userAddress, deadline);
      }
    } catch(se) {
      throw new Error('Simulation failed: ' + decErr(se));
    }

    setSt('loading', null, 'Confirm in wallet...');
    let tx;
    if (useETH) {
      tx = await router.addLiquidityETH(tokenAddr, tokenAmt, tokenMin, ethMin, userAddress, deadline, { value: ethAmt });
    } else {
      tx = await router.addLiquidity(addrA, addrB, amountAWei, amountBWei, minA, minB, userAddress, deadline);
    }
    setSt('loading', null, 'Confirming... '+tx.hash.slice(0,10)+'...');
    const receipt = await tx.wait();

    let lpReceived = '--';
    try {
      const transferTopic = ethers.id('Transfer(address,address,uint256)');
      const zeroAddr = '0x0000000000000000000000000000000000000000';
      for (const log of receipt.logs) {
        if (log.topics[0]===transferTopic && log.topics.length===3 && ethers.getAddress('0x'+log.topics[1].slice(26))===zeroAddr) {
          lpReceived = fmtU(BigInt(log.data), 18) + ' LP';
          break;
        }
      }
    } catch(_) {}

    document.getElementById('lpAmount').textContent = lpReceived;
    document.getElementById('lpResult').classList.add('show');
    setSt('success','✓',`Done! <a href="${CONFIG.EXPLORER}/tx/${tx.hash}" target="_blank">View on Explorer &#8599;</a>`);
    onAddrChange('A'); onAddrChange('B');

  } catch(e) {
    setSt('error','✕',sanitize(decErr(e)));
  } finally {
    setBtnLoading(false);
  }
}

// ── Helpers ───────────────────────────────────────────────────
function fmtU(val, dec) {
  const n = parseFloat(ethers.formatUnits(val, dec));
  if (!n) return '0';
  if (n < 0.0001) return '< 0.0001';
  return n.toLocaleString(undefined, { maximumFractionDigits: 6 });
}

function setSt(type, icon, msg) {
  const box=document.getElementById('statusBox'), txt=document.getElementById('statusTxt');
  box.className='status-box'+(type?' '+type:'');
  const old=box.querySelector('.spinner,.st-ic');if(old)old.remove();
  if(type==='loading'){const sp=document.createElement('div');sp.className='spinner';box.insertBefore(sp,txt);}
  else if(icon){const ic=document.createElement('span');ic.className='st-ic';ic.textContent=icon;box.insertBefore(ic,txt);}
  if(type==='success')txt.innerHTML=msg;else txt.textContent=msg;
}

function setBtnLoading(loading) {
  const btn = document.getElementById('supplyBtn');
  btn.disabled = loading;
  btn.textContent = loading ? 'Processing...' : 'Supply Liquidity';
}

function decErr(e) {
  if (!e) return 'Unknown error';
  if (e.code===4001||e.code==='ACTION_REJECTED') return 'Rejected by user';
  if (e.reason) return e.reason;
  if (e.shortMessage) return e.shortMessage;
  if (e.error?.reason) return e.error.reason;
  const data = e?.data||e?.error?.data||e?.info?.error?.data;
  if (typeof data==='string'&&data.startsWith('0x08c379a0')) {
    try { return ethers.AbiCoder.defaultAbiCoder().decode(['string'],'0x'+data.slice(10))[0]; } catch(_) {}
  }
  const raw = e.message||String(e);
  const m = raw.match(/reason="([^"]+)"/);
  if (m) return m[1];
  return raw.replace('missing revert data','Contract reverted — check addresses and approvals').slice(0,200);
}

function sanitize(s) { return String(s).replace(/<[^>]*>/g,'').slice(0,220); }

setSt('','○','Connect wallet to begin');
</script>
