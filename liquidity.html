<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RicSwap | Secure Liquidity</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
    <style>
        body { background: #050505; color: white; font-family: 'Inter', sans-serif; padding: 20px; }
        .card { max-width: 500px; margin: 40px auto; background: #0f0f0f; padding: 32px; border-radius: 24px; border: 1px solid #222; }
        input, button { width: 100%; padding: 14px; margin: 10px 0; border-radius: 12px; }
        button { background: #ff4444; color: white; font-weight: bold; border: none; cursor: pointer; }
        .status { margin-top: 15px; padding: 12px; border-radius: 8px; }
    </style>
</head>
<body>
<div class="card">
    <h2>Secure Liquidity Creator</h2>
    <p>Token A Address</p>
    <input id="tokenA" placeholder="0x..." value="0x12C94d3A30daa09f81Ea6c037004E6e99A4A3dfc">
    <p>Token B Address</p>
    <input id="tokenB" placeholder="0x..." value="0xC76F4c819D820369Fb2d7C1531aB3Bb18e6fE8d8">
    
    <p>Amount A</p>
    <input id="amtA" type="number" value="100">
    <p>Amount B</p>
    <input id="amtB" type="number" value="100">

    <button onclick="createSecurePool()">Create Secure Pool + Burn LP</button>
    <div id="status" class="status"></div>
</div>

<script>
    const ROUTER = "0xcfBF0917F2fCDC4F5170aC991fa26F2Bc3da9Fd4";
    const DEAD = "0x000000000000000000000000000000000000dEaD";

    async function createSecurePool() {
        const status = document.getElementById("status");
        status.innerText = "Connecting...";

        const provider = new ethers.BrowserProvider(window.ethereum);
        const signer = await provider.getSigner();
        const user = await signer.getAddress();

        const tokenA = document.getElementById("tokenA").value;
        const tokenB = document.getElementById("tokenB").value;
        const amtA = document.getElementById("amtA").value;
        const amtB = document.getElementById("amtB").value;

        try {
            // Approve both tokens
            for (let addr of [tokenA, tokenB]) {
                const c = new ethers.Contract(addr, ["function approve(address,uint256)"], signer);
                await c.approve(ROUTER, ethers.MaxUint256);
            }

            const router = new ethers.Contract(ROUTER, [
                "function addLiquidity(address tokenA, address tokenB, uint amountADesired, uint amountBDesired, uint amountAMin, uint amountBMin, address to, uint deadline) returns (uint,uint,uint)"
            ], signer);

            const tx = await router.addLiquidity(
                tokenA, tokenB,
                ethers.parseUnits(amtA, 18),
                ethers.parseUnits(amtB, 18),
                0, 0, user,
                Math.floor(Date.now()/1000) + 1200
            );

            status.innerText = "Pool created. Now burning LP...";

            // After pool is created, you can burn LP using your burn.html

            await tx.wait();
            status.innerHTML = `<span style="color:#00ff88">Pool Created!<br>Now go to burn.html to lock liquidity.</span>`;

        } catch (e) {
            status.innerHTML = `<span style="color:#ff6666">Error: ${e.reason || e.message}</span>`;
        }
    }
</script>
</body>
</html>
