<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RicSwap | Add Any Liquidity</title>
  <script src="https://cdn.jsdelivr.net/npm/web3@latest/dist/web3.min.js"></script>
  <style>
    body { background: #050505; color: #e0e0e0; font-family: 'Inter', sans-serif; margin:0; padding:20px; }
    .container { max-width: 620px; margin:auto; background:#12122b; padding:30px; border-radius:16px; box-shadow:0 10px 30px rgba(0,0,0,0.6); }
    h1 { text-align:center; color:#ff4d00; }
    .input-group { background:#1f1f3b; padding:18px; border-radius:12px; margin-bottom:20px; border:1px solid #333; }
    label { display:block; font-size:13px; margin-bottom:6px; color:#aaa; }
    input { width:100%; background:#2a2a4a; border:none; color:#fff; padding:14px; border-radius:8px; font-size:16px; }
    .balance { text-align:right; font-size:13px; color:#888; cursor:pointer; }
    button { width:100%; padding:16px; margin:10px 0; border:none; border-radius:10px; font-weight:bold; cursor:pointer; }
    .approve { background:#3b82f6; color:white; }
    .supply { background:#00ff9d; color:black; font-size:18px; }
    #status { margin-top:15px; padding:14px; background:#1f1f3b; border-radius:8px; text-align:center; min-height:28px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Add Any Liquidity</h1>
    <button onclick="connectWallet()">Connect Wallet</button>
    <p id="account" style="text-align:center; font-size:0.9em; margin:10px 0;"></p>

    <div class="input-group">
      <label>Token A Address</label>
      <input type="text" id="tokenA" placeholder="0x...">
      <input type="number" id="amountA" placeholder="Amount" step="0.0000001">
      <div class="balance" onclick="getBalance('A')">Balance: <span id="balA">0.00</span></div>
    </div>

    <div class="input-group">
      <label>Token B Address</label>
      <input type="text" id="tokenB" placeholder="0x...">
      <input type="number" id="amountB" placeholder="Amount" step="0.0000001">
      <div class="balance" onclick="getBalance('B')">Balance: <span id="balB">0.00</span></div>
    </div>

    <button class="approve" onclick="approveToken('A')">1. Approve Token A</button>
    <button class="approve" onclick="approveToken('B')">2. Approve Token B</button>
    <button class="supply" onclick="addLiquidity()">SUPPLY LIQUIDITY</button>

    <div id="status">Ready</div>
  </div>

  <script>
    let web3, account;
    const ROUTER = "0x8869D8B61dC440e44B9b844E43B303636982c65e";   // Your latest working router

    async function connectWallet() {
      if (!window.ethereum) return alert("Please install MetaMask or Rabby");
      web3 = new Web3(window.ethereum);
      const accounts = await ethereum.request({ method: 'eth_requestAccounts' });
      account = accounts[0];
      document.getElementById("account").innerHTML = `Connected: ${account.slice(0,6)}...${account.slice(-4)}`;
    }

    async function getBalance(side) {
      if (!account) return;
      const addr = document.getElementById("token" + side).value.trim();
      if (!addr || !web3.utils.isAddress(addr)) return;

      try {
        const token = new web3.eth.Contract([{
          "constant": true,
          "inputs": [{"name":"_owner","type":"address"}],
          "name": "balanceOf",
          "outputs": [{"name":"balance","type":"uint256"}],
          "type": "function"
        }], addr);

        const bal = await token.methods.balanceOf(account).call();
        document.getElementById("bal" + side).innerText = web3.utils.fromWei(bal, 'ether');
      } catch(e) {
        console.error(e);
      }
    }

    async function approveToken(side) {
      if (!account) return alert("Connect wallet first");
      const tokenAddr = document.getElementById("token" + side).value.trim();
      const amountStr = document.getElementById("amount" + side).value;

      if (!tokenAddr || !web3.utils.isAddress(tokenAddr)) return alert("Invalid token address");
      if (!amountStr || parseFloat(amountStr) <= 0) return alert("Enter amount");

      const status = document.getElementById("status");
      status.innerHTML = `Approving Token ${side}...`;

      const abi = [{
        "constant": false,
        "inputs": [{"name":"spender","type":"address"},{"name":"amount","type":"uint256"}],
        "name": "approve",
        "outputs": [{"name":"","type":"bool"}],
        "type": "function"
      }];

      const token = new web3.eth.Contract(abi, tokenAddr);
      const amount = web3.utils.toWei(amountStr, 'ether');

      try {
        await token.methods.approve(ROUTER, amount).send({ from: account });
        status.innerHTML = `✅ Token ${side} Approved`;
      } catch (e) {
        status.innerHTML = "❌ Approval failed";
        console.error(e);
      }
    }

    async function addLiquidity() {
      if (!account) return alert("Connect wallet first");

      const tokenA = document.getElementById("tokenA").value.trim();
      const tokenB = document.getElementById("tokenB").value.trim();
      const amtA = document.getElementById("amountA").value;
      const amtB = document.getElementById("amountB").value;

      if (!tokenA || !tokenB || !amtA || !amtB) return alert("Fill all fields");

      const status = document.getElementById("status");
      status.innerHTML = "Adding Liquidity...";

      const deadline = Math.floor(Date.now() / 1000) + 1200;

      try {
        const routerABI = [{
          "inputs": [
            {"name":"tokenA","type":"address"},
            {"name":"tokenB","type":"address"},
            {"name":"amountADesired","type":"uint256"},
            {"name":"amountBDesired","type":"uint256"},
            {"name":"amountAMin","type":"uint256"},
            {"name":"amountBMin","type":"uint256"},
            {"name":"to","type":"address"},
            {"name":"deadline","type":"uint256"}
          ],
          "name": "addLiquidity",
          "outputs": [],
          "type": "function"
        }];

        const router = new web3.eth.Contract(routerABI, ROUTER);

        await router.methods.addLiquidity(
          tokenA,
          tokenB,
          web3.utils.toWei(amtA, 'ether'),
          web3.utils.toWei(amtB, 'ether'),
          0,   // amountAMin
          0,   // amountBMin
          account,
          deadline
        ).send({ from: account });

        status.innerHTML = `✅ Success! <a href="https://shibariumscan.io/address/${account}" target="_blank">Check your LP</a>`;
      } catch (e) {
        console.error(e);
        status.innerHTML = "❌ " + (e.reason || e.message || "Transaction failed");
      }
    }
  </script>
</body>
</html>
