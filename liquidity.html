<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RicSwap | Add Liquidity</title>
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
  <style>
    body { background: #050505; color: #e0e0e0; font-family: 'Inter', sans-serif; margin:0; padding:20px; }
    .container { max-width: 620px; margin:auto; background:#12122b; padding:30px; border-radius:16px; box-shadow:0 10px 30px rgba(0,0,0,0.6); }
    h1 { text-align:center; color:#ff4d00; }
    .input-group { background:#1f1f3b; padding:18px; border-radius:12px; margin-bottom:20px; border:1px solid #333; }
    label { display:block; font-size:13px; margin-bottom:6px; color:#aaa; }
    input { width:100%; background:#2a2a4a; border:none; color:#fff; padding:14px; border-radius:8px; font-size:16px; }
    .balance { text-align:right; font-size:13px; color:#888; cursor:pointer; }
    button { width:100%; padding:16px; margin:10px 0; border:none; border-radius:10px; font-weight:bold; cursor:pointer; }
    .create { background:#ffaa00; color:black; }
    .approve { background:#3b82f6; color:white; }
    .supply { background:#00ff9d; color:black; font-size:18px; }
    #status { margin-top:15px; padding:14px; background:#1f1f3b; border-radius:8px; text-align:center; min-height:28px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Add Any Liquidity</h1>
    <button onclick="connectWallet()">Connect Wallet</button>
    <p id="account" style="text-align:center; font-size:0.9em; margin:10px 0;"></p>

    <div class="input-group">
      <label>Token A Address</label>
      <input type="text" id="tokenA" placeholder="0x...">
      <input type="number" id="amountA" placeholder="Amount" step="0.0000001">
      <div class="balance" onclick="getBalance('A')">Balance: <span id="balA">0.00</span></div>
    </div>

    <div class="input-group">
      <label>Token B Address</label>
      <input type="text" id="tokenB" placeholder="0x...">
      <input type="number" id="amountB" placeholder="Amount" step="0.0000001">
      <div class="balance" onclick="getBalance('B')">Balance: <span id="balB">0.00</span></div>
    </div>

    <button class="create" onclick="createPair()">1. Create Pair (First Time Only)</button>
    <button class="approve" onclick="approveToken('A')">2. Approve Token A</button>
    <button class="approve" onclick="approveToken('B')">3. Approve Token B</button>
    <button class="supply" onclick="addLiquidity()">SUPPLY LIQUIDITY</button>

    <div id="status">Ready</div>
  </div>

  <script>
    let provider, signer, userAddress;
    const ROUTER = "0x8869D8B61dC440e44B9b844E43B303636982c65e";
    const FACTORY = "0x78ae5cCD2f13D10aE3fF47F8418A79D99B4569d0";

    async function connectWallet() {
      if (!window.ethereum) return alert("Please install MetaMask or Rabby");
      provider = new ethers.BrowserProvider(window.ethereum);
      signer = await provider.getSigner();
      userAddress = await signer.getAddress();
      document.getElementById("account").innerHTML = `Connected: ${userAddress.slice(0,6)}...${userAddress.slice(-4)}`;
    }

    async function getBalance(side) {
      const addr = document.getElementById("token" + side).value.trim();
      if (!ethers.isAddress(addr)) return;

      try {
        const token = new ethers.Contract(addr, ["function balanceOf(address) view returns (uint256)"], provider);
        const bal = await token.balanceOf(userAddress);
        document.getElementById("bal" + side).innerText = parseFloat(ethers.formatEther(bal)).toFixed(4);
      } catch(e) {}
    }

    async function createPair() {
      const tokenA = document.getElementById("tokenA").value.trim();
      const tokenB = document.getElementById("tokenB").value.trim();

      if (!ethers.isAddress(tokenA) || !ethers.isAddress(tokenB)) {
        return alert("❌ Invalid Token A or Token B address");
      }
      if (tokenA.toLowerCase() === tokenB.toLowerCase()) {
        return alert("❌ Token A and Token B cannot be the same");
      }

      const status = document.getElementById("status");
      status.innerHTML = "Creating Pair...";

      try {
        const factory = new ethers.Contract(FACTORY, [
          "function createPair(address tokenA, address tokenB) external returns (address pair)"
        ], signer);

        const tx = await factory.createPair(tokenA, tokenB);
        status.innerHTML = `✅ Pair Created! <a href="https://shibariumscan.io/tx/${tx.hash}" target="_blank">View Tx</a>`;
        await tx.wait();
      } catch (e) {
        status.innerHTML = "❌ " + (e.reason || e.message || "Failed to create pair");
        console.error(e);
      }
    }

    async function approveToken(side) {
      const tokenAddr = document.getElementById("token" + side).value.trim();
      const amountStr = document.getElementById("amount" + side).value;

      if (!ethers.isAddress(tokenAddr)) return alert("❌ Invalid token address");
      if (!amountStr || parseFloat(amountStr) <= 0) return alert("❌ Enter valid amount");

      const status = document.getElementById("status");
      status.innerHTML = `Approving Token ${side}...`;

      try {
        const token = new ethers.Contract(tokenAddr, [
          "function approve(address spender, uint256 amount) external returns (bool)"
        ], signer);

        const amount = ethers.parseEther(amountStr);
        const tx = await token.approve(ROUTER, amount);
        await tx.wait();
        status.innerHTML = `✅ Token ${side} Approved`;
      } catch (e) {
        status.innerHTML = "❌ Approval failed";
        console.error(e);
      }
    }

    async function addLiquidity() {
      const tokenA = document.getElementById("tokenA").value.trim();
      const tokenB = document.getElementById("tokenB").value.trim();
      const amtA = document.getElementById("amountA").value;
      const amtB = document.getElementById("amountB").value;

      if (!ethers.isAddress(tokenA) || !ethers.isAddress(tokenB)) return alert("❌ Invalid token address");
      if (!amtA || !amtB) return alert("❌ Enter amounts");

      const status = document.getElementById("status");
      status.innerHTML = "Adding Liquidity...";

      const deadline = Math.floor(Date.now() / 1000) + 1200;

      try {
        const router = new ethers.Contract(ROUTER, [
          "function addLiquidity(address tokenA, address tokenB, uint256 amountADesired, uint256 amountBDesired, uint256 amountAMin, uint256 amountBMin, address to, uint256 deadline) external returns (uint256,uint256,uint256)"
        ], signer);

        const tx = await router.addLiquidity(
          tokenA,
          tokenB,
          ethers.parseEther(amtA),
          ethers.parseEther(amtB),
          0,   // amountAMin
          0,   // amountBMin
          userAddress,
          deadline
        );

        status.innerHTML = `✅ Success! <a href="https://shibariumscan.io/tx/${tx.hash}" target="_blank">View Transaction</a>`;
        await tx.wait();
      } catch (e) {
        console.error(e);
        status.innerHTML = "❌ " + (e.reason || e.message || "Transaction failed");
      }
    }
  </script>
</body>
</html>
