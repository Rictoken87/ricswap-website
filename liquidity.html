<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RicSwap | Add Liquidity</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
    <style>
        :root {
            --obsidian: #050505;
            --card-bg: #0a0a0a;
            --input-bg: #111;
            --gold: #ffd700;
            --gold-dim: rgba(255, 215, 0, 0.1);
            --magma: linear-gradient(135deg, #ff4d00 0%, #ff8c00 100%);
            --border: #222;
            --text: #e0e0e0;
            --text-mute: #666;
        }
        body { background: var(--obsidian); color: var(--text); font-family: 'Inter', system-ui, sans-serif; margin: 0; display: flex; flex-direction: column; min-height: 100vh; }
       
        /* Nav */
        .nav { padding: 20px 5%; display: flex; align-items: center; border-bottom: 1px solid rgba(255,215,0,0.1); background: rgba(5,5,5,0.95); position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 22px; font-weight: 900; color: var(--gold); margin-right: 40px; }
        .nav-links { display: flex; gap: 24px; }
        .nav-links a { color: #888; text-decoration: none; font-weight: 600; font-size: 14px; transition: 0.2s; }
        .nav-links a:hover, .nav-links a.active { color: var(--gold); }
        .connect-btn { margin-left: auto; background: var(--gold-dim); color: var(--gold); border: 1px solid var(--gold); padding: 8px 18px; border-radius: 99px; font-weight: 600; cursor: pointer; }
        /* Container */
        .container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { width: 100%; max-width: 460px; background: var(--card-bg); border-radius: 24px; padding: 24px; border: 1px solid var(--border); box-shadow: 0 0 80px rgba(255, 77, 0, 0.08); }
        h2 { margin: 0 0 8px 0; font-size: 20px; font-weight: 700; }
        .sub-header { font-size: 13px; color: #666; margin-bottom: 24px; }
        /* Inputs */
        .input-box { background: var(--input-bg); border: 1px solid var(--border); border-radius: 18px; padding: 16px; margin-bottom: 8px; position: relative; }
        .label-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-mute); margin-bottom: 8px; }
        .input-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        input { background: transparent; border: none; color: white; font-size: 24px; width: 100%; outline: none; font-weight: 600; font-family: monospace; }
       
        .plus-icon { text-align: center; font-size: 20px; color: #444; margin: -10px 0; position: relative; z-index: 2; }
        /* Token Pill */
        .token-pill { background: #222; padding: 6px 12px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; gap: 8px; border: 1px solid #333; min-width: 80px; justify-content: center; }
        .token-pill:hover { border-color: var(--gold); }
        /* Address Input */
        .custom-addr { display: none; width: 95%; background: #000; border: 1px solid #333; color: #aaa; padding: 8px; border-radius: 8px; margin-top: 8px; font-size: 11px; font-family: monospace; }
        .custom-addr.show { display: block; }
        /* Pool Info */
        .pool-info { background: rgba(255,215,0,0.03); border: 1px solid rgba(255,215,0,0.1); border-radius: 16px; padding: 16px; margin-top: 20px; font-size: 13px; }
        .info-row { display: flex; justify-content: space-between; margin-bottom: 6px; color: #aaa; }
        .info-val { color: white; font-weight: 600; font-family: monospace; }
       
        /* Warning for New Pairs */
        .new-pair-alert { display: none; background: rgba(255,215,0,0.1); border: 1px solid var(--gold); padding: 10px; border-radius: 8px; margin-top: 15px; font-size: 12px; color: var(--gold); text-align: center; }
        /* Buttons */
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .action-btn { background: #222; color: #666; border: none; padding: 16px; border-radius: 12px; font-weight: 700; cursor: not-allowed; width: 100%; transition: 0.2s; }
       
        .action-btn.ready { background: var(--gold); color: black; cursor: pointer; }
        .action-btn.supply { grid-column: span 2; background: var(--magma); color: white; cursor: pointer; font-size: 16px; box-shadow: 0 4px 15px rgba(255, 77, 0, 0.3); }
        .action-btn:active { transform: scale(0.98); }
       
        #status { margin-top: 15px; text-align: center; font-size: 13px; min-height: 20px; color: #888; }
    </style>
</head>
<body>
    <nav class="nav">
        <div class="logo">RicSwap</div>
        <div class="nav-links">
            <a href="swap.html">Swap</a>
            <a href="liquidity.html" class="active">Liquidity</a>
            <a href="pools.html">Pools</a>
        </div>
        <button id="connectBtn" class="connect-btn">Connect Wallet</button>
    </nav>
    <div class="container">
        <div class="card">
            <h2>Add Liquidity</h2>
            <div class="sub-header">Receive LP tokens and earn trading fees</div>
            <!-- Token A -->
            <div class="input-box">
                <div class="label-row">
                    <span>Input</span>
                    <span>Bal: <span id="balA">0.00</span></span>
                </div>
                <div class="input-row">
                    <input type="number" id="amountA" placeholder="0.0" oninput="calculateB()">
                    <div class="token-pill" onclick="toggleAddr('A')">
                        <span id="symA">BONE</span> ▾
                    </div>
                </div>
                <input type="text" id="addrA" class="custom-addr" placeholder="Paste Address..." onchange="importToken('A')">
            </div>
            <div class="plus-icon">+</div>
            <!-- Token B -->
            <div class="input-box">
                <div class="label-row">
                    <span>Input</span>
                    <span>Bal: <span id="balB">0.00</span></span>
                </div>
                <div class="input-row">
                    <input type="number" id="amountB" placeholder="0.0" oninput="calculateA()">
                    <div class="token-pill" onclick="toggleAddr('B')">
                        <span id="symB">RIC</span> ▾
                    </div>
                </div>
                <input type="text" id="addrB" class="custom-addr" placeholder="Paste Address..." onchange="importToken('B')">
            </div>
            <!-- Pool Stats -->
            <div class="pool-info">
                <div class="info-row"><span>Initial Price</span> <span class="info-val" id="rateVal">Loading...</span></div>
                <div class="info-row"><span>Share of Pool</span> <span class="info-val" id="shareVal">0%</span></div>
            </div>
            <div id="newPairWarning" class="new-pair-alert">
                ⚠️ <b>First Provider:</b> You are creating this pool.<br>The ratio you enter will set the market price.
            </div>
            <!-- Actions -->
            <div class="btn-grid">
                <button id="btnApproveA" class="action-btn" onclick="approve('A')">Approve A</button>
                <button id="btnApproveB" class="action-btn" onclick="approve('B')">Approve B</button>
                <button id="btnSupply" class="action-btn supply" onclick="supply()" disabled>Supply</button>
            </div>
           
            <div id="status"></div>
        </div>
    </div>
    <script>
        // --- CONFIGURATION ---
        const CONFIG = {
            ROUTER: "0xcfBF0917F2fCDC4F5170aC991fa26F2Bc3da9Fd4",
            FACTORY: "0x78ae5cCD2f13D10aE3fF47F8418A79D99B4569d0",
            WBONE: "0xC76F4c819D820369Fb2d7C1531aB3Bb18e6fE8d8",
            RIC: "0x12C94d3A30daa09f81Ea6c037004E6e99A4A3dfc"
        };
        const ABIS = {
            ERC20: ["function approve(address,uint) returns (bool)", "function allowance(address,address) view returns (uint)", "function balanceOf(address) view returns (uint)", "function decimals() view returns (uint8)", "function symbol() view returns (string)"],
            ROUTER: ["function addLiquidity(address,address,uint,uint,uint,uint,address,uint) returns (uint,uint,uint)", "function addLiquidityETH(address,uint,uint,uint,address,uint) payable returns (uint,uint,uint)"],
            FACTORY: ["function getPair(address,address) view returns (address)"],
            PAIR: ["function getReserves() view returns (uint112,uint112,uint32)", "function token0() view returns (address)", "function totalSupply() view returns (uint)"]
        };
        // --- STATE ---
        let state = {
            provider: null, signer: null, userAddr: null,
            tokens: {
                A: { symbol: "BONE", address: "NATIVE", decimals: 18, isNative: true },
                B: { symbol: "RIC", address: CONFIG.RIC, decimals: 18, isNative: false }
            },
            isNewPair: false,
            ratio: 0
        };
        // --- LOGIC ---
        async function init() {
            if(window.ethereum) {
                state.provider = new ethers.BrowserProvider(window.ethereum);
                const accs = await state.provider.listAccounts();
                if(accs.length > 0) connect();
            }
        }
        async function connect() {
            state.provider = new ethers.BrowserProvider(window.ethereum);
            state.signer = await state.provider.getSigner();
            state.userAddr = await state.signer.getAddress();
            document.getElementById("connectBtn").innerText = state.userAddr.slice(0,6)+"...";
            checkPair();
            updateBalances();
        }
        // ... (the rest of your original script remains the same) ...
        document.getElementById("connectBtn").addEventListener("click", connect);
        init();
    </script>
</body>
</html>
