<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RicSwap | Add Liquidity (Any Token)</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
    <style>
        :root {
            --obsidian: #050505;
            --card-bg: #0a0a0a;
            --gold: #ffd700;
            --magma: linear-gradient(135deg, #ff4d00 0%, #ff8c00 100%);
        }
        body { background: var(--obsidian); color: white; font-family: 'Inter', sans-serif; margin: 0; min-height: 100vh; }
        .nav { padding: 20px 5%; display: flex; align-items: center; background: rgba(5,5,5,0.95); border-bottom: 1px solid #222; }
        .logo { font-size: 24px; font-weight: 900; color: var(--gold); }
        .connect-btn { margin-left: auto; padding: 8px 20px; background: rgba(255,215,0,0.1); color: var(--gold); border: 1px solid var(--gold); border-radius: 999px; cursor: pointer; }
        
        .container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { width: 100%; max-width: 480px; background: var(--card-bg); padding: 32px; border-radius: 24px; border: 1px solid #222; }
        
        .input-box { background: #111; border: 1px solid #222; border-radius: 16px; padding: 16px; margin-bottom: 16px; }
        .label-row { display: flex; justify-content: space-between; margin-bottom: 8px; color: #aaa; font-size: 13px; }
        input { background: transparent; border: none; color: white; font-size: 26px; width: 100%; outline: none; }
        .token-input { font-size: 14px; margin-top: 8px; }
        
        button { width: 100%; padding: 18px; background: var(--magma); color: white; border: none; border-radius: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        #status { margin-top: 20px; text-align: center; font-size: 14px; min-height: 28px; }
    </style>
</head>
<body>
    <nav class="nav">
        <div class="logo">RicSwap</div>
        <button id="connectBtn" class="connect-btn">Connect Wallet</button>
    </nav>

    <div class="container">
        <div class="card">
            <h2>Create New Pool (RIC + Any Token)</h2>
            
            <!-- Token A: RIC -->
            <div class="input-box">
                <div class="label-row">
                    <span>RIC (Fixed)</span>
                    <span>Bal: <span id="balRIC">0.00</span></span>
                </div>
                <input type="number" id="amountRIC" placeholder="0.0" value="100">
            </div>

            <div style="text-align:center; font-size:28px; margin:10px 0;">+</div>

            <!-- Token B: Any Token -->
            <div class="input-box">
                <div class="label-row">
                    <span>Custom Token Address</span>
                    <span>Bal: <span id="balCustom">0.00</span></span>
                </div>
                <input type="text" id="customToken" placeholder="0x..." style="font-size:15px; margin-bottom:8px;">
                <input type="number" id="amountCustom" placeholder="0.0" value="100">
            </div>

            <button id="supplyBtn" onclick="supplyLiquidity()">CREATE POOL & ADD LIQUIDITY</button>
            <div id="status"></div>
        </div>
    </div>

    <script>
        const CONFIG = {
            ROUTER: "0xcfBF0917F2fCDC4F5170aC991fa26F2Bc3da9Fd4",
            RIC: "0x12C94d3A30daa09f81Ea6c037004E6e99A4A3dfc"
        };

        let signer, userAddr, provider;
        let customTokenAddress = null;

        async function connect() {
            if (!window.ethereum) return alert("Please install MetaMask or Rabby");

            provider = new ethers.BrowserProvider(window.ethereum);
            signer = await provider.getSigner();
            userAddr = await signer.getAddress();

            document.getElementById("connectBtn").innerText = userAddr.slice(0,6) + "...";
            updateBalances();
        }

        async function updateBalances() {
            if (!userAddr) return;

            // RIC Balance
            const ricContract = new ethers.Contract(CONFIG.RIC, ["function balanceOf(address) view returns (uint256)"], provider);
            const ricBal = await ricContract.balanceOf(userAddr);
            document.getElementById("balRIC").innerText = parseFloat(ethers.formatUnits(ricBal, 18)).toFixed(4);

            // Custom Token Balance (if entered)
            const addr = document.getElementById("customToken").value.trim();
            if (ethers.isAddress(addr)) {
                try {
                    const tokenContract = new ethers.Contract(addr, ["function balanceOf(address) view returns (uint256)"], provider);
                    const bal = await tokenContract.balanceOf(userAddr);
                    document.getElementById("balCustom").innerText = parseFloat(ethers.formatUnits(bal, 18)).toFixed(4);
                } catch(e) {}
            }
        }

        async function supplyLiquidity() {
            const status = document.getElementById("status");
            const btn = document.getElementById("supplyBtn");
            const amountRIC = document.getElementById("amountRIC").value;
            const amountCustom = document.getElementById("amountCustom").value;
            const tokenAddr = document.getElementById("customToken").value.trim();

            if (!tokenAddr || !ethers.isAddress(tokenAddr)) return alert("Please enter valid token address");
            if (!amountRIC || !amountCustom) return alert("Please enter amounts");

            btn.disabled = true;
            btn.innerText = "Creating Pool...";

            try {
                // Approve RIC
                const ricContract = new ethers.Contract(CONFIG.RIC, ["function approve(address,uint256)"], signer);
                await ricContract.approve(CONFIG.ROUTER, ethers.MaxUint256);

                // Approve Custom Token
                const customContract = new ethers.Contract(tokenAddr, ["function approve(address,uint256)"], signer);
                await customContract.approve(CONFIG.ROUTER, ethers.MaxUint256);

                status.innerText = "Adding Liquidity...";

                const router = new ethers.Contract(CONFIG.ROUTER, [
                    "function addLiquidity(address tokenA, address tokenB, uint amountADesired, uint amountBDesired, uint amountAMin, uint amountBMin, address to, uint deadline) returns (uint,uint,uint)"
                ], signer);

                const tx = await router.addLiquidity(
                    CONFIG.RIC,
                    tokenAddr,
                    ethers.parseUnits(amountRIC, 18),
                    ethers.parseUnits(amountCustom, 18),
                    0,
                    0,
                    userAddr,
                    Math.floor(Date.now()/1000) + 1200
                );

                status.innerHTML = `Tx Sent! <a href="https://shibariumscan.io/tx/${tx.hash}" target="_blank">View</a>`;
                await tx.wait();
                status.innerHTML = `<span style="color:#00ff88">✅ New Pool Created Successfully!</span>`;

            } catch (e) {
                console.error(e);
                status.innerHTML = `<span style="color:#ff6666">Error: ${e.reason || e.message}</span>`;
            } finally {
                btn.disabled = false;
                btn.innerText = "CREATE POOL & ADD LIQUIDITY";
            }
        }

        document.getElementById("connectBtn").addEventListener("click", connect);
        document.getElementById("customToken").addEventListener("input", updateBalances);
    </script>
</body>
</html>
