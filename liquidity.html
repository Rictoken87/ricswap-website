<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RicSwap | Add Liquidity</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
    <style>
        :root { --obsidian: #080808; --card-bg: #121212; --magma: linear-gradient(135deg, #ff4d00 0%, #ff8c00 100%); --gold: #ffd700; }
        body { background: var(--obsidian); color: white; font-family: system-ui, sans-serif; margin: 0; padding: 0; }
        .nav { padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,215,0,0.1); }
        .logo { color: var(--gold); font-size: 28px; font-weight: bold; letter-spacing: -1px; }
        .nav-links a { color: white; text-decoration: none; margin-left: 32px; font-weight: 500; }
        .nav-links a:hover { color: var(--gold); }
        .nav-links a.active { color: var(--gold); font-weight: 600; }
        .card { max-width: 520px; margin: 40px auto; background: var(--card-bg); border-radius: 24px; padding: 32px; box-shadow: 0 20px 40px rgba(0,0,0,0.8); border: 1px solid #222; }
        .input-group { background: #1a1a1a; border-radius: 16px; padding: 16px; margin-bottom: 16px; border: 1px solid #333; }
        .input-group:focus-within { border-color: var(--gold); }
        label { display: block; color: #888; font-size: 12px; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        input { background: transparent; border: none; color: white; font-size: 20px; width: 100%; outline: none; }
        button { background: var(--magma); color: white; border: none; padding: 18px; border-radius: 16px; font-weight: bold; width: 100%; font-size: 18px; cursor: pointer; margin-top: 10px; }
        .quick-btn { background: #222; color: var(--gold); border: 1px solid #444; padding: 8px 16px; border-radius: 9999px; font-size: 13px; cursor: pointer; margin: 4px; }
        #connectBtn { width: auto !important; padding: 10px 24px !important; font-size: 15px !important; background: #222 !important; color: var(--gold) !important; border: 1px solid var(--gold) !important; }
        #status { text-align: center; margin-top: 20px; font-size: 14px; font-weight: 600; min-height: 24px; }
    </style>
</head>
<body>
    <div class="nav">
        <div class="logo">RicSwap</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="swap.html">Swap</a>
            <a href="pools.html">Pools</a>
            <a href="liquidity.html" class="active">Add Liquidity</a>
        </div>
        <button id="connectBtn">CONNECT WALLET</button>
    </div>

    <div class="card">
        <h3 style="text-align:center;">Create Any Pair + Add Liquidity</h3>
        <p style="text-align:center; color:#888; font-size:14px; margin-bottom:20px;">
            BONE + Any Token (Permissionless)
        </p>

        <div class="input-group">
            <label>Token A Address</label>
            <input id="tokenA" value="0xC76F4c819D820369Fb2d7C1531aB3Bb18e6fE8d8">
            <div style="margin-top:8px;">
                <button class="quick-btn" onclick="document.getElementById('tokenA').value='0xC76F4c819D820369Fb2d7C1531aB3Bb18e6fE8d8'">BONE</button>
            </div>
        </div>

        <div class="input-group">
            <label>Token B Address (any token)</label>
            <input id="tokenB" placeholder="Paste any token contract address">
        </div>

        <button id="createPairBtn">CREATE NEW PAIR + AUTO BURNER</button>

        <div id="liquiditySection" style="display:none; margin-top:24px;">
            <div class="input-group">
                <label>Amount of Token A</label>
                <input id="amountA" type="number" placeholder="0.0">
            </div>
            <div class="input-group">
                <label>Amount of Token B</label>
                <input id="amountB" type="number" placeholder="0.0">
            </div>
            <button id="addBtn">ADD LIQUIDITY</button>
        </div>

        <div id="status"></div>
    </div>

    <script>
        const FACTORY_ADDRESS = "0xc2e80224D2f61FaE15CF9b7D089e327F06db1106";
        const CHAIN_ID = 109;

        const FACTORY_ABI = [
            "function createPair(address tokenA, address tokenB) external returns (address pair)",
            "function getPair(address tokenA, address tokenB) external view returns (address pair)"
        ];

        let provider, signer, userAddress;

        async function connectWallet() {
            if (!window.ethereum) return alert("Install MetaMask");
            try {
                provider = new ethers.BrowserProvider(window.ethereum);
                await provider.send("eth_requestAccounts", []);
                await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: '0x' + CHAIN_ID.toString(16) }] });
                signer = await provider.getSigner();
                userAddress = await signer.getAddress();
                document.getElementById("connectBtn").textContent = userAddress.slice(0,6) + "..." + userAddress.slice(-4);
            } catch (e) { console.error(e); }
        }

        async function createPair() {
            if (!signer) return connectWallet();

            const tokenA = document.getElementById("tokenA").value.trim();
            const tokenB = document.getElementById("tokenB").value.trim();

            if (!tokenA || !tokenB) return alert("Please fill both token addresses");

            try {
                const factory = new ethers.Contract(FACTORY_ADDRESS, FACTORY_ABI, signer);
                const existingPair = await factory.getPair(tokenA, tokenB);

                if (existingPair !== "0x0000000000000000000000000000000000000000") {
                    document.getElementById("status").innerHTML = `✅ Pair already exists!<br>Pair Address: ${existingPair}`;
                    document.getElementById("liquiditySection").style.display = "block";
                    return;
                }

                const tx = await factory.createPair(tokenA, tokenB);
                document.getElementById("status").innerHTML = `Creating new pair + auto-burner...<br><small>Tx: ${tx.hash.slice(0,12)}...</small>`;
                await tx.wait();
                document.getElementById("status").innerHTML = `✅ New pair created successfully!`;
                document.getElementById("liquiditySection").style.display = "block";
            } catch (e) {
                document.getElementById("status").innerHTML = `Error: ${e.reason || e.message}`;
            }
        }

        async function addLiquidity() {
            alert("✅ You can now add liquidity to the pair.\n\nTest with small amounts first.");
        }

        document.getElementById("createPairBtn").addEventListener("click", createPair);
        document.getElementById("addBtn").addEventListener("click", addLiquidity);
        document.getElementById("connectBtn").addEventListener("click", connectWallet);
    </script>
</body>
</html>
