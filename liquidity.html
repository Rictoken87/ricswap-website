<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RicSwap | Balance Guard</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
    <style>
        body { background: #050505; color: #e0e0e0; font-family: 'Inter', monospace; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .card { width: 100%; max-width: 480px; background: #0f0f0f; padding: 32px; border-radius: 24px; border: 1px solid #222; box-shadow: 0 0 80px rgba(255, 77, 0, 0.1); }
        
        h2 { color: #ff4d00; margin: 0 0 20px 0; text-align: center; text-transform: uppercase; letter-spacing: 1px; font-size: 18px; }
        
        .status-box { display: flex; gap: 10px; margin-bottom: 20px; }
        .badge { flex: 1; text-align: center; padding: 8px; background: #1a1a1a; border-radius: 8px; font-size: 11px; color: #666; border: 1px solid #333; transition: 0.3s; }
        .badge.active { border-color: #ff4d00; color: #fff; background: #221111; }
        .badge.found { border-color: #00ff88; color: #00ff88; background: #112211; }

        .input-group { margin-bottom: 15px; background: #161616; padding: 18px; border-radius: 16px; border: 1px solid #222; position: relative; transition: 0.2s; }
        
        .row-top { display: flex; justify-content: space-between; margin-bottom: 10px; }
        label { font-size: 11px; color: #666; text-transform: uppercase; font-weight: bold; }
        
        .balance { font-size: 11px; color: #ff4d00; cursor: pointer; }
        
        input.addr { width: 100%; background: transparent; border: none; color: #aaa; font-size: 11px; font-family: monospace; outline: none; margin-bottom: 8px; display: block; }
        input.amount { width: 100%; background: transparent; border: none; color: white; font-size: 24px; font-weight: bold; font-family: sans-serif; outline: none; }
        
        .locked { opacity: 0.8; border-color: #004422; }
        .locked input.amount { color: #00ff88; cursor: not-allowed; }
        
        /* Buttons */
        button { width: 100%; padding: 20px; background: #ff4d00; color: white; font-weight: 800; border: none; border-radius: 14px; font-size: 16px; cursor: pointer; margin-top: 10px; text-transform: uppercase; }
        button:disabled { background: #222; color: #555; cursor: not-allowed; }
        
        .btn-wrap { background: #333; border: 1px solid #ff4d00; color: #ff4d00; font-size: 11px; padding: 4px 8px; border-radius: 4px; cursor: pointer; display: none; }

        #log { margin-top: 25px; padding: 15px; border-radius: 12px; background: #000; border: 1px solid #222; font-size: 11px; color: #888; font-family: monospace; min-height: 20px; max-height: 100px; overflow-y: auto; word-break: break-all; }
        .err { color: #ff4444; }
    </style>
</head>
<body>

<div class="card">
    <h2>⚡ Balance Guard Injector</h2>
    
    <div class="status-box">
        <div id="statusPool" class="badge">Scanning...</div>
        <div id="statusNative" class="badge active">Native Mode</div>
    </div>

    <div style="text-align:center; margin-bottom:15px;">
        <label style="display:inline-flex; align-items:center; gap:8px; cursor:pointer;">
            <input type="checkbox" id="nativeMode" checked onchange="toggleNative()">
            <span style="font-size:12px; color:#fff;">Use Native BONE (Recommended)</span>
        </label>
    </div>
   
    <!-- INPUT A -->
    <div class="input-group" id="groupA">
        <div class="row-top">
            <label id="labelA">Native BONE</label>
            <div>
                <button id="wrapBtn" class="btn-wrap" onclick="wrapBone()">WRAP BONE</button>
                <span class="balance" onclick="setMax('A')" id="balDisplayA">Bal: ---</span>
            </div>
        </div>
        <input id="tokenA" class="addr" value="NATIVE_BONE" disabled onchange="refreshBalances()">
        <input id="amountA" class="amount" type="number" placeholder="0.0" oninput="validateAndQuote()">
    </div>

    <div style="text-align:center; font-size:20px; color:#333; margin:-10px 0 10px 0;">+</div>

    <!-- INPUT B -->
    <div class="input-group" id="groupB">
        <div class="row-top">
            <label>Token B Address</label>
            <div class="balance" onclick="setMax('B')" id="balDisplayB">Bal: ---</div>
        </div>
        <input id="tokenB" class="addr" placeholder="Paste 0x..." value="" oninput="refreshBalances()">
        <input id="amountB" class="amount" type="number" placeholder="0.0">
    </div>

    <button id="btn" onclick="execute()">Connect Wallet</button>
    <div id="log">Ready.</div>
</div>

<script>
    // --- CONFIGURATION ---
    const ROUTER = "0xcfBF0917F2fCDC4F5170aC991fa26F2Bc3da9Fd4";
    const FACTORY = "0x78ae5cCD2f13D10aE3fF47F8418A79D99B4569d0";
    const WBONE = "0xC76F4c819D820369Fb2d7C1531aB3Bb18e6fE8d8";
    const SHIBARIUM_ID = "0x6d";

    const ABI = [
        "function approve(address,uint) returns (bool)",
        "function decimals() view returns (uint8)",
        "function allowance(address,address) view returns (uint256)",
        "function balanceOf(address) view returns (uint256)",
        "function getPair(address,address) view returns (address)",
        "function getReserves() view returns (uint112,uint112,uint32)",
        "function token0() view returns (address)",
        "function deposit() payable"
    ];

    // Manual Hex Interface
    const IFACE = new ethers.Interface([
        "function addLiquidity(address tokenA, address tokenB, uint amountADesired, uint amountBDesired, uint amountAMin, uint amountBMin, address to, uint deadline)",
        "function addLiquidityETHSupportingFeeOnTransferTokens(address token, uint amountTokenDesired, uint amountTokenMin, uint amountETHMin, address to, uint deadline) payable"
    ]);

    let provider, signer, userAddr;
    let poolState = { exists: false, reserveA: 0n, reserveB: 0n };
    let balances = { A: 0n, B: 0n, decA: 18, decB: 18 };

    // --- 1. INIT ---
    async function init() {
        if(!window.ethereum) return log("No Wallet Found");
        try {
            await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: SHIBARIUM_ID }] });
            provider = new ethers.BrowserProvider(window.ethereum);
            signer = await provider.getSigner();
            userAddr = await signer.getAddress();
            document.getElementById("btn").innerText = "SUPPLY LIQUIDITY";
            log("Connected: " + userAddr.slice(0,6));
            refreshBalances();
        } catch(e) { console.error(e); }
    }

    function toggleNative() {
        const isNative = document.getElementById("nativeMode").checked;
        const el = document.getElementById("tokenA");
        const lbl = document.getElementById("labelA");
        const badge = document.getElementById("statusNative");
        
        if(isNative) {
            el.value = "NATIVE_BONE"; el.disabled = true;
            lbl.innerText = "Native BONE";
            badge.innerText = "Native Mode"; badge.classList.add("active");
            document.getElementById("wrapBtn").style.display = "none";
        } else {
            el.value = WBONE; el.disabled = false;
            lbl.innerText = "Token A Address";
            badge.innerText = "Token Mode"; badge.classList.remove("active");
        }
        refreshBalances();
    }

    // --- 2. BALANCES & SAFETY ---
    async function refreshBalances() {
        if(!userAddr) return;
        const isNative = document.getElementById("nativeMode").checked;
        const addrA = isNative ? WBONE : document.getElementById("tokenA").value;
        const addrB = document.getElementById("tokenB").value;

        try {
            // Balance A
            if(isNative) {
                balances.A = await provider.getBalance(userAddr);
                balances.decA = 18;
            } else if(ethers.isAddress(addrA)) {
                const cA = new ethers.Contract(addrA, ABI, provider);
                balances.A = await cA.balanceOf(userAddr);
                balances.decA = await cA.decimals().catch(()=>18);
            }
            document.getElementById("balDisplayA").innerText = fmtBal(balances.A, balances.decA);

            // Show Wrap Button if Needed
            if(!isNative && addrA.toLowerCase() === WBONE.toLowerCase()) {
                const nativeBal = await provider.getBalance(userAddr);
                if(balances.A === 0n && nativeBal > 0n) {
                    document.getElementById("wrapBtn").style.display = "inline-block";
                } else {
                    document.getElementById("wrapBtn").style.display = "none";
                }
            }

            // Balance B
            if(ethers.isAddress(addrB)) {
                const cB = new ethers.Contract(addrB, ABI, provider);
                balances.B = await cB.balanceOf(userAddr);
                balances.decB = await cB.decimals().catch(()=>18);
                document.getElementById("balDisplayB").innerText = fmtBal(balances.B, balances.decB);
                checkPool(addrA, addrB);
            }
        } catch(e) {}
        
        validateAndQuote();
    }

    async function checkPool(addrA, addrB) {
        const factory = new ethers.Contract(FACTORY, ABI, provider);
        const pair = await factory.getPair(addrA, addrB);
        const badge = document.getElementById("statusPool");

        if(pair === "0x0000000000000000000000000000000000000000") {
            poolState.exists = false;
            badge.innerText = "New Pool"; badge.className = "badge active";
            document.getElementById("groupB").classList.remove("locked");
            document.getElementById("amountB").disabled = false;
        } else {
            poolState.exists = true;
            badge.innerText = "Pool Exists"; badge.className = "badge found";
            const pairC = new ethers.Contract(pair, ABI, provider);
            const res = await pairC.getReserves();
            const t0 = await pairC.token0();
            
            if(t0.toLowerCase() === addrA.toLowerCase()) {
                poolState.reserveA = res[0]; poolState.reserveB = res[1];
            } else {
                poolState.reserveA = res[1]; poolState.reserveB = res[0];
            }
            document.getElementById("groupB").classList.add("locked");
            document.getElementById("amountB").disabled = true;
            validateAndQuote();
        }
    }

    function validateAndQuote() {
        const amtA = document.getElementById("amountA").value;
        const btn = document.getElementById("btn");
        
        if(!amtA) return;
        
        // Balance Guard
        const reqA = ethers.parseUnits(amtA, balances.decA);
        if(reqA > balances.A) {
            btn.disabled = true;
            btn.innerText = "INSUFFICIENT BALANCE (A)";
            document.getElementById("groupA").style.borderColor = "#ff4444";
        } else {
            btn.disabled = false;
            btn.innerText = "SUPPLY LIQUIDITY";
            document.getElementById("groupA").style.borderColor = "#222";
        }

        if(poolState.exists) {
            const rA = parseFloat(ethers.formatUnits(poolState.reserveA, balances.decA));
            const rB = parseFloat(ethers.formatUnits(poolState.reserveB, balances.decB));
            if(rA === 0) return;
            const estB = parseFloat(amtA) * (rB / rA);
            document.getElementById("amountB").value = estB.toFixed(6);
        }
    }

    // --- 3. ACTIONS ---
    async function wrapBone() {
        if(!signer) return init();
        try {
            const wbone = new ethers.Contract(WBONE, ABI, signer);
            const val = ethers.parseEther(document.getElementById("amountA").value || "1");
            log("Wrapping...");
            const tx = await wbone.deposit({ value: val });
            await tx.wait();
            refreshBalances();
            log("✅ Wrapped. You can now supply.");
        } catch(e) { alert(e.message); }
    }

    async function execute() {
        if(!signer) return init();
        const btn = document.getElementById("btn");
        const addrB = document.getElementById("tokenB").value;
        const rawA = document.getElementById("amountA").value;
        const rawB = document.getElementById("amountB").value;
        const isNative = document.getElementById("nativeMode").checked;

        try {
            btn.disabled = true;
            log("Checking Approvals...");

            // Approve B
            const conB = new ethers.Contract(addrB, ABI, signer);
            const valB = ethers.parseUnits(rawB, balances.decB);
            const allowB = await conB.allowance(userAddr, ROUTER);
            if(allowB < valB) {
                log("Approving Token B...");
                const tx = await conB.approve(ROUTER, ethers.MaxUint256);
                await tx.wait();
            }

            let calldata, valA_Wei, txValue;
            const deadline = Math.floor(Date.now()/1000) + 3600;

            if(isNative) {
                // Native Mode: Hex Protocol for SafeETH
                valA_Wei = ethers.parseEther(rawA);
                calldata = IFACE.encodeFunctionData("addLiquidityETHSupportingFeeOnTransferTokens", [
                    addrB, valB, 0, 0, userAddr, deadline
                ]);
                txValue = valA_Wei;
            } else {
                // Token Mode: Check A Approval
                const addrA = document.getElementById("tokenA").value;
                const conA = new ethers.Contract(addrA, ABI, signer);
                const valA = ethers.parseUnits(rawA, balances.decA);
                
                // BALANCE GUARD
                if(valA > balances.A) throw new Error("Insufficient Token A Balance! Wrap BONE first.");

                const allowA = await conA.allowance(userAddr, ROUTER);
                if(allowA < valA) {
                    log("Approving Token A...");
                    const txA = await conA.approve(ROUTER, ethers.MaxUint256);
                    await txA.wait();
                }
                
                calldata = IFACE.encodeFunctionData("addLiquidity", [
                    addrA, addrB, valA, valB, 0, 0, userAddr, deadline
                ]);
                txValue = 0n;
            }

            log("Sending (10M Gas)...");
            
            const tx = await signer.sendTransaction({
                to: ROUTER,
                data: calldata,
                value: txValue,
                gasLimit: 10000000 // Max Gas for Safety
            });

            log("TX Sent: " + tx.hash);
            document.getElementById("statusPool").innerHTML = `<a href="https://shibariumscan.io/tx/${tx.hash}" target="_blank" style="color:#fff">VIEW TX</a>`;
            
            await tx.wait();
            alert("✅ SUCCESS!");
            btn.disabled = false;
            refreshBalances();

        } catch(e) {
            console.error(e);
            log("❌ Error: " + (e.reason || e.message));
            if(e.message.includes("Insufficient")) alert("You don't have enough tokens! Check balances.");
            btn.disabled = false;
        }
    }
    
    function setMax(s) {
        if(s==='A') {
            let v = balances.A; 
            if(document.getElementById("nativeMode").checked) v -= ethers.parseEther("1.0");
            if(v<0) v=0n;
            document.getElementById("amountA").value = ethers.formatUnits(v, balances.decA);
        } else {
            document.getElementById("amountB").value = ethers.formatUnits(balances.B, balances.decB);
        }
        validateAndQuote();
    }
    function fmtBal(b, d) { return "Bal: " + parseFloat(ethers.formatUnits(b, d)).toFixed(4) + " (MAX)"; }
    function log(m) { document.getElementById("log").innerText = m; }
</script>
</body>
</html>
