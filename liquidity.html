<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RicSwap | Add Liquidity</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
    <style>
        :root {
            --obsidian: #050505;
            --card-bg: #0a0a0a;
            --input-bg: #111;
            --gold: #ffd700;
            --gold-dim: rgba(255, 215, 0, 0.1);
            --magma: linear-gradient(135deg, #ff4d00 0%, #ff8c00 100%);
            --border: #222;
            --text: #e0e0e0;
            --text-mute: #666;
        }
        body { background: var(--obsidian); color: var(--text); font-family: 'Inter', system-ui, sans-serif; margin: 0; display: flex; flex-direction: column; min-height: 100vh; }
        
        /* Nav */
        .nav { padding: 20px 5%; display: flex; align-items: center; border-bottom: 1px solid rgba(255,215,0,0.1); background: rgba(5,5,5,0.95); position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 22px; font-weight: 900; color: var(--gold); margin-right: 40px; }
        .nav-links { display: flex; gap: 24px; }
        .nav-links a { color: #888; text-decoration: none; font-weight: 600; font-size: 14px; transition: 0.2s; }
        .nav-links a:hover, .nav-links a.active { color: var(--gold); }
        .connect-btn { margin-left: auto; background: var(--gold-dim); color: var(--gold); border: 1px solid var(--gold); padding: 8px 18px; border-radius: 99px; font-weight: 600; cursor: pointer; }

        /* Container */
        .container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { width: 100%; max-width: 460px; background: var(--card-bg); border-radius: 24px; padding: 24px; border: 1px solid var(--border); box-shadow: 0 0 80px rgba(255, 77, 0, 0.08); }

        h2 { margin: 0 0 8px 0; font-size: 20px; font-weight: 700; }
        .sub-header { font-size: 13px; color: #666; margin-bottom: 24px; }

        /* Inputs */
        .input-box { background: var(--input-bg); border: 1px solid var(--border); border-radius: 18px; padding: 16px; margin-bottom: 8px; position: relative; }
        .label-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-mute); margin-bottom: 8px; }
        .input-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        input { background: transparent; border: none; color: white; font-size: 24px; width: 100%; outline: none; font-weight: 600; font-family: monospace; }
        
        .plus-icon { text-align: center; font-size: 20px; color: #444; margin: -10px 0; position: relative; z-index: 2; }

        /* Token Pill */
        .token-pill { background: #222; padding: 6px 12px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; gap: 8px; border: 1px solid #333; min-width: 80px; justify-content: center; }
        .token-pill:hover { border-color: var(--gold); }

        /* Address Input */
        .custom-addr { display: none; width: 95%; background: #000; border: 1px solid #333; color: #aaa; padding: 8px; border-radius: 8px; margin-top: 8px; font-size: 11px; font-family: monospace; }
        .custom-addr.show { display: block; }

        /* Pool Info */
        .pool-info { background: rgba(255,215,0,0.03); border: 1px solid rgba(255,215,0,0.1); border-radius: 16px; padding: 16px; margin-top: 20px; font-size: 13px; }
        .info-row { display: flex; justify-content: space-between; margin-bottom: 6px; color: #aaa; }
        .info-val { color: white; font-weight: 600; font-family: monospace; }
        
        /* Warning for New Pairs */
        .new-pair-alert { display: none; background: rgba(255,215,0,0.1); border: 1px solid var(--gold); padding: 10px; border-radius: 8px; margin-top: 15px; font-size: 12px; color: var(--gold); text-align: center; }

        /* Buttons */
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .action-btn { background: #222; color: #666; border: none; padding: 16px; border-radius: 12px; font-weight: 700; cursor: not-allowed; width: 100%; transition: 0.2s; }
        
        .action-btn.ready { background: var(--gold); color: black; cursor: pointer; }
        .action-btn.supply { grid-column: span 2; background: var(--magma); color: white; cursor: pointer; font-size: 16px; box-shadow: 0 4px 15px rgba(255, 77, 0, 0.3); }
        .action-btn:active { transform: scale(0.98); }
        
        #status { margin-top: 15px; text-align: center; font-size: 13px; min-height: 20px; color: #888; }
    </style>
</head>
<body>

    <nav class="nav">
        <div class="logo">RicSwap</div>
        <div class="nav-links">
            <a href="swap.html">Swap</a>
            <a href="liquidity.html" class="active">Liquidity</a>
            <a href="pools.html">Pools</a>
        </div>
        <button id="connectBtn" class="connect-btn">Connect Wallet</button>
    </nav>

    <div class="container">
        <div class="card">
            <h2>Add Liquidity</h2>
            <div class="sub-header">Receive LP tokens and earn trading fees</div>

            <!-- Token A -->
            <div class="input-box">
                <div class="label-row">
                    <span>Input</span>
                    <span>Bal: <span id="balA">0.00</span></span>
                </div>
                <div class="input-row">
                    <input type="number" id="amountA" placeholder="0.0" oninput="calculateB()">
                    <div class="token-pill" onclick="toggleAddr('A')">
                        <span id="symA">BONE</span> ▾
                    </div>
                </div>
                <input type="text" id="addrA" class="custom-addr" placeholder="Paste Address..." onchange="importToken('A')">
            </div>

            <div class="plus-icon">+</div>

            <!-- Token B -->
            <div class="input-box">
                <div class="label-row">
                    <span>Input</span>
                    <span>Bal: <span id="balB">0.00</span></span>
                </div>
                <div class="input-row">
                    <input type="number" id="amountB" placeholder="0.0" oninput="calculateA()">
                    <div class="token-pill" onclick="toggleAddr('B')">
                        <span id="symB">RIC</span> ▾
                    </div>
                </div>
                <input type="text" id="addrB" class="custom-addr" placeholder="Paste Address..." onchange="importToken('B')">
            </div>

            <!-- Pool Stats -->
            <div class="pool-info">
                <div class="info-row"><span>Initial Price</span> <span class="info-val" id="rateVal">Loading...</span></div>
                <div class="info-row"><span>Share of Pool</span> <span class="info-val" id="shareVal">0%</span></div>
            </div>

            <div id="newPairWarning" class="new-pair-alert">
                ⚠️ <b>First Provider:</b> You are creating this pool.<br>The ratio you enter will set the market price.
            </div>

            <!-- Actions -->
            <div class="btn-grid">
                <button id="btnApproveA" class="action-btn" onclick="approve('A')">Approve A</button>
                <button id="btnApproveB" class="action-btn" onclick="approve('B')">Approve B</button>
                <button id="btnSupply" class="action-btn supply" onclick="supply()" disabled>Supply</button>
            </div>
            
            <div id="status"></div>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const CONFIG = {
            ROUTER: "0xcfBF0917F2fCDC4F5170aC991fa26F2Bc3da9Fd4", // CORRECT ROUTER
            FACTORY: "0x78ae5cCD2f13D10aE3fF47F8418A79D99B4569d0", // CORRECT FACTORY
            WBONE: "0xC76F4c819D820369Fb2d7C1531aB3Bb18e6fE8d8",
            RIC: "0x12C94d3A30daa09f81Ea6c037004E6e99A4A3dfc"
        };

        const ABIS = {
            ERC20: ["function approve(address,uint) returns (bool)", "function allowance(address,address) view returns (uint)", "function balanceOf(address) view returns (uint)", "function decimals() view returns (uint8)", "function symbol() view returns (string)"],
            ROUTER: ["function addLiquidity(address,address,uint,uint,uint,uint,address,uint) returns (uint,uint,uint)", "function addLiquidityETH(address,uint,uint,uint,address,uint) payable returns (uint,uint,uint)"],
            FACTORY: ["function getPair(address,address) view returns (address)"],
            PAIR: ["function getReserves() view returns (uint112,uint112,uint32)", "function token0() view returns (address)", "function totalSupply() view returns (uint)"]
        };

        // --- STATE ---
        let state = {
            provider: null, signer: null, userAddr: null,
            tokens: {
                A: { symbol: "BONE", address: "NATIVE", decimals: 18, isNative: true },
                B: { symbol: "RIC", address: CONFIG.RIC, decimals: 18, isNative: false }
            },
            isNewPair: false,
            ratio: 0 
        };

        // --- LOGIC ---

        async function init() {
            if(window.ethereum) {
                state.provider = new ethers.BrowserProvider(window.ethereum);
                const accs = await state.provider.listAccounts();
                if(accs.length > 0) connect();
            }
        }

        async function connect() {
            state.provider = new ethers.BrowserProvider(window.ethereum);
            state.signer = await state.provider.getSigner();
            state.userAddr = await state.signer.getAddress();
            document.getElementById("connectBtn").innerText = state.userAddr.slice(0,6)+"...";
            checkPair();
            updateBalances();
        }

        async function checkPair() {
            if(!state.userAddr) return;
            const factory = new ethers.Contract(CONFIG.FACTORY, ABIS.FACTORY, state.provider);
            
            const addrA = state.tokens.A.isNative ? CONFIG.WBONE : state.tokens.A.address;
            const addrB = state.tokens.B.isNative ? CONFIG.WBONE : state.tokens.B.address;

            const pairAddr = await factory.getPair(addrA, addrB);
            
            if (pairAddr === "0x0000000000000000000000000000000000000000") {
                state.isNewPair = true;
                document.getElementById("rateVal").innerText = "Determined by Input";
                document.getElementById("newPairWarning").style.display = "block";
                document.getElementById("shareVal").innerText = "100%";
            } else {
                state.isNewPair = false;
                document.getElementById("newPairWarning").style.display = "none";
                
                const pair = new ethers.Contract(pairAddr, ABIS.PAIR, state.provider);
                const [r0, r1] = await pair.getReserves();
                const t0 = await pair.token0();
                
                const resA = t0.toLowerCase() === addrA.toLowerCase() ? r0 : r1;
                const resB = t0.toLowerCase() === addrA.toLowerCase() ? r1 : r0;
                
                if(resA > 0) {
                    const floatA = parseFloat(ethers.formatUnits(resA, state.tokens.A.decimals));
                    const floatB = parseFloat(ethers.formatUnits(resB, state.tokens.B.decimals));
                    state.ratio = floatB / floatA;
                    document.getElementById("rateVal").innerText = `1 ${state.tokens.A.symbol} = ${state.ratio.toFixed(4)} ${state.tokens.B.symbol}`;
                    document.getElementById("shareVal").innerText = "< 1%"; // simplified
                }
            }
            checkAllowances();
        }

        function calculateB() {
            if(state.isNewPair) return; 
            const valA = parseFloat(document.getElementById("amountA").value);
            if(valA > 0) document.getElementById("amountB").value = (valA * state.ratio).toFixed(6);
            checkAllowances();
        }

        function calculateA() {
            if(state.isNewPair) return;
            const valB = parseFloat(document.getElementById("amountB").value);
            if(valB > 0 && state.ratio > 0) document.getElementById("amountA").value = (valB / state.ratio).toFixed(6);
            checkAllowances();
        }

        async function checkAllowances() {
            const amtA = document.getElementById("amountA").value;
            const amtB = document.getElementById("amountB").value;
            
            if(state.tokens.A.isNative) {
                setBtn("btnApproveA", "Native (OK)", true);
            } else {
                const allowed = await getAllowance(state.tokens.A);
                const needed = ethers.parseUnits(amtA || "0", state.tokens.A.decimals);
                if(allowed < needed) setBtn("btnApproveA", `Approve ${state.tokens.A.symbol}`, false);
                else setBtn("btnApproveA", "Approved", true);
            }

            if(state.tokens.B.isNative) {
                setBtn("btnApproveB", "Native (OK)", true);
            } else {
                const allowed = await getAllowance(state.tokens.B);
                const needed = ethers.parseUnits(amtB || "0", state.tokens.B.decimals);
                if(allowed < needed) setBtn("btnApproveB", `Approve ${state.tokens.B.symbol}`, false);
                else setBtn("btnApproveB", "Approved", true);
            }
            
            const btnS = document.getElementById("btnSupply");
            const btnA = document.getElementById("btnApproveA");
            const btnB = document.getElementById("btnApproveB");
            
            if(btnA.classList.contains("ready") && btnB.classList.contains("ready") && amtA > 0 && amtB > 0) {
                btnS.disabled = false;
                btnS.style.opacity = "1";
            } else {
                btnS.disabled = true;
                btnS.style.opacity = "0.5";
            }
        }

        async function supply() {
            const btn = document.getElementById("btnSupply");
            const status = document.getElementById("status");
            btn.innerText = "Supplying..."; btn.disabled = true;

            try {
                const router = new ethers.Contract(CONFIG.ROUTER, ABIS.ROUTER, state.signer);
                const valA = document.getElementById("amountA").value;
                const valB = document.getElementById("amountB").value;
                
                const amtA = ethers.parseUnits(valA, state.tokens.A.decimals);
                const amtB = ethers.parseUnits(valB, state.tokens.B.decimals);
                const deadline = Math.floor(Date.now()/1000) + 1200;

                let tx;
                if(state.tokens.A.isNative) {
                    tx = await router.addLiquidityETH(state.tokens.B.address, amtB, 0, 0, state.userAddr, deadline, { value: amtA });
                } else if(state.tokens.B.isNative) {
                    tx = await router.addLiquidityETH(state.tokens.A.address, amtA, 0, 0, state.userAddr, deadline, { value: amtB });
                } else {
                    tx = await router.addLiquidity(state.tokens.A.address, state.tokens.B.address, amtA, amtB, 0, 0, state.userAddr, deadline);
                }

                status.innerHTML = `Tx Sent! <a href="https://shibariumscan.io/tx/${tx.hash}" target="_blank" style="color:white">View</a>`;
                await tx.wait();
                status.innerText = "Success! Liquidity Added.";
                status.style.color = "#00ff88";
                updateBalances();
                checkPair(); // Refresh pool stats
                
            } catch(e) {
                console.error(e);
                status.innerText = "Error: " + (e.reason || "Failed");
                status.style.color = "red";
            } finally {
                btn.innerText = "Supply";
                btn.disabled = false;
            }
        }

        async function getAllowance(token) {
            const c = new ethers.Contract(token.address, ABIS.ERC20, state.provider);
            return await c.allowance(state.userAddr, CONFIG.ROUTER);
        }

        async function approve(side) {
            const token = state.tokens[side];
            const btn = document.getElementById(`btnApprove${side}`);
            if(btn.classList.contains("ready")) return;

            try {
                btn.innerText = "Processing...";
                const c = new ethers.Contract(token.address, ABIS.ERC20, state.signer);
                const tx = await c.approve(CONFIG.ROUTER, ethers.MaxUint256);
                await tx.wait();
                checkAllowances();
            } catch(e) { btn.innerText = "Failed"; }
        }

        function setBtn(id, text, isReady) {
            const el = document.getElementById(id);
            el.innerText = text;
            if(isReady) el.classList.add("ready");
            else el.classList.remove("ready");
        }

        async function updateBalances() {
            if(!state.userAddr) return;
            const getBal = async (t) => t.isNative ? ethers.formatEther(await state.provider.getBalance(state.userAddr)) : ethers.formatUnits(await (new ethers.Contract(t.address, ABIS.ERC20, state.provider)).balanceOf(state.userAddr), t.decimals);
            document.getElementById("balA").innerText = parseFloat(await getBal(state.tokens.A)).toFixed(4);
            document.getElementById("balB").innerText = parseFloat(await getBal(state.tokens.B)).toFixed(4);
        }

        function toggleAddr(side) { document.getElementById(`addr${side}`).classList.toggle('show'); }
        
        async function importToken(side) {
            const addr = document.getElementById(`addr${side}`).value.trim();
            if(!ethers.isAddress(addr)) return;
            
            if(addr.toLowerCase() === CONFIG.WBONE.toLowerCase()) {
                state.tokens[side] = { symbol: "BONE", address: "NATIVE", decimals: 18, isNative: true };
            } else {
                try {
                    const c = new ethers.Contract(addr, ABIS.ERC20, state.provider);
                    const sym = await c.symbol();
                    const dec = await c.decimals();
                    state.tokens[side] = { symbol: sym, address: addr, decimals: dec, isNative: false };
                } catch(e) { return alert("Invalid Token"); }
            }
            document.getElementById(`sym${side}`).innerText = state.tokens[side].symbol;
            document.getElementById(`addr${side}`).classList.remove("show");
            document.getElementById(`addr${side}`).value = "";
            
            updateBalances();
            checkPair(); // Re-check if pair exists with new tokens
        }

        document.getElementById("connectBtn").addEventListener("click", connect);
        init();
    </script>
</body>
</html>
