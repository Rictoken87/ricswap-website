<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RicSwap | Add Any Liquidity</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
    <style>
        body { background: #050505; color: white; font-family: 'Inter', sans-serif; padding: 20px; }
        .card { max-width: 500px; margin: 40px auto; background: #0f0f0f; padding: 32px; border-radius: 24px; border: 1px solid #222; }
        input, button { width: 100%; padding: 14px; margin: 8px 0; border-radius: 12px; font-size: 16px; }
        button { background: #ff4d00; color: white; font-weight: bold; border: none; cursor: pointer; }
        #status { margin-top: 15px; padding: 12px; border-radius: 8px; background: #1a1a1a; }
    </style>
</head>
<body>
<div class="card">
    <h2>Create Any Token Pair</h2>
    
    <p>Token A Address</p>
    <input id="tokenA" placeholder="0x..." value="0x12C94d3A30daa09f81Ea6c037004E6e99A4A3dfc">
    <p>Amount A</p>
    <input id="amountA" type="number" value="100">

    <p>Token B Address</p>
    <input id="tokenB" placeholder="0x..." value="">
    <p>Amount B</p>
    <input id="amountB" type="number" value="100">

    <button onclick="addLiquidity()">CREATE POOL + ADD LIQUIDITY</button>
    <div id="status">Ready</div>
</div>

<script>
    const ROUTER = "0xcfBF0917F2fCDC4F5170aC991fa26F2Bc3da9Fd4";

    async function addLiquidity() {
        const status = document.getElementById("status");
        const tokenA = document.getElementById("tokenA").value.trim();
        const tokenB = document.getElementById("tokenB").value.trim();
        const amtA = document.getElementById("amountA").value;
        const amtB = document.getElementById("amountB").value;

        if (!ethers.isAddress(tokenA) || !ethers.isAddress(tokenB)) {
            return status.innerHTML = `<span style="color:red">Invalid token address</span>`;
        }

        status.innerText = "Connecting wallet...";

        try {
            const provider = new ethers.BrowserProvider(window.ethereum);
            const signer = await provider.getSigner();

            // Approve Token A
            status.innerText = "Approving Token A...";
            const contractA = new ethers.Contract(tokenA, ["function approve(address,uint256)"], signer);
            await contractA.approve(ROUTER, ethers.MaxUint256);

            // Approve Token B
            status.innerText = "Approving Token B...";
            const contractB = new ethers.Contract(tokenB, ["function approve(address,uint256)"], signer);
            await contractB.approve(ROUTER, ethers.MaxUint256);

            status.innerText = "Creating Pool...";

            const router = new ethers.Contract(ROUTER, [
                "function addLiquidity(address tokenA, address tokenB, uint amountADesired, uint amountBDesired, uint amountAMin, uint amountBMin, address to, uint deadline) returns (uint,uint,uint)"
            ], signer);

            const tx = await router.addLiquidity(
                tokenA,
                tokenB,
                ethers.parseUnits(amtA, 18),
                ethers.parseUnits(amtB, 18),
                0,
                0,
                await signer.getAddress(),
                Math.floor(Date.now()/1000) + 1200
            );

            status.innerHTML = `Tx Sent! <a href="https://shibariumscan.io/tx/${tx.hash}" target="_blank">View</a>`;
            await tx.wait();
            status.innerHTML = `<span style="color:#00ff88">✅ Pool Created Successfully!</span>`;

        } catch (e) {
            console.error(e);
            status.innerHTML = `<span style="color:red">Error: ${e.reason || e.message}</span>`;
        }
    }
</script>
</body>
</html>
