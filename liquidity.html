<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RicSwap | Deep Debugger</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
    <style>
        body { background: #050505; color: #e0e0e0; font-family: 'Inter', monospace; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .card { width: 100%; max-width: 520px; background: #0a0a0a; padding: 30px; border-radius: 24px; border: 1px solid #333; box-shadow: 0 0 50px rgba(255, 68, 0, 0.1); }
        
        h2 { color: #ff4400; margin: 0 0 20px 0; text-transform: uppercase; letter-spacing: 1px; font-size: 18px; text-align: center; }
        
        .box { background: #111; padding: 15px; border-radius: 12px; border: 1px solid #222; margin-bottom: 15px; }
        .row { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 5px; color: #888; }
        .val { color: #fff; font-weight: bold; font-family: monospace; }

        label { font-size: 10px; color: #666; text-transform: uppercase; display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; background: transparent; border: none; color: #fff; font-family: monospace; font-size: 14px; outline: none; padding: 5px 0; border-bottom: 1px solid #333; margin-bottom: 15px; }
        input:focus { border-color: #ff4400; }

        .btn-row { display: flex; gap: 10px; margin-top: 20px; }
        button { flex: 1; padding: 15px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 12px; }
        
        .btn-sim { background: #333; color: #fff; border: 1px solid #555; }
        .btn-sim:hover { background: #444; }
        
        .btn-send { background: #ff4400; color: #000; opacity: 0.5; cursor: not-allowed; }
        .btn-send.active { opacity: 1; cursor: pointer; box-shadow: 0 0 20px rgba(255, 68, 0, 0.4); }

        #console { background: #000; color: #aaa; font-family: monospace; font-size: 11px; padding: 15px; border-radius: 8px; height: 120px; overflow-y: auto; border: 1px solid #222; margin-top: 15px; }
        .log-err { color: #ff4444; }
        .log-ok { color: #00ff88; }
    </style>
</head>
<body>

<div class="card">
    <h2>🔬 Liquidity Debugger</h2>

    <div class="box">
        <div class="row"><span>Pool Status:</span> <span class="val" id="poolState">Scanning...</span></div>
        <div class="row"><span>Reserve A:</span> <span class="val" id="resA">0</span></div>
        <div class="row"><span>Reserve B:</span> <span class="val" id="resB">0</span></div>
    </div>

    <div style="display:flex; gap:10px; align-items:center; margin-bottom:15px;">
        <input type="checkbox" id="useNative" checked onchange="renderInputs()">
        <span style="font-size:12px;">Use Native BONE</span>
    </div>

    <div id="inputs"></div>

    <div class="btn-row">
        <button class="btn-sim" onclick="runSimulation()">1. Simulate (Dry Run)</button>
        <button class="btn-send" id="sendBtn" onclick="executeReal()">2. Force Send</button>
    </div>

    <div id="console">System Ready. Connect Wallet.</div>
</div>

<script>
    const ROUTER = "0xcfBF0917F2fCDC4F5170aC991fa26F2Bc3da9Fd4"; 
    const FACTORY = "0x78ae5cCD2f13D10aE3fF47F8418A79D99B4569d0";
    const WBONE = "0xC76F4c819D820369Fb2d7C1531aB3Bb18e6fE8d8";
    const SHIBARIUM_ID = "0x6d";

    const ABI = [
        "function approve(address,uint) returns (bool)",
        "function decimals() view returns (uint8)",
        "function allowance(address,address) view returns (uint256)",
        "function getPair(address,address) view returns (address)",
        "function getReserves() view returns (uint112,uint112,uint32)",
        "function token0() view returns (address)"
    ];
    
    // We use the Interface to encode manual data
    const IFACE = new ethers.Interface([
        "function addLiquidity(address tokenA, address tokenB, uint amountADesired, uint amountBDesired, uint amountAMin, uint amountBMin, address to, uint deadline) returns (uint, uint, uint)",
        "function addLiquidityETH(address token, uint amountTokenDesired, uint amountTokenMin, uint amountETHMin, address to, uint deadline) payable returns (uint, uint, uint)"
    ]);

    let provider, signer, userAddr;
    let payload = { to: "", data: "", value: 0n };

    // --- UI RENDER ---
    function renderInputs() {
        const isNative = document.getElementById("useNative").checked;
        const html = `
            <label>${isNative ? "Native BONE Amount" : "Token A Address"}</label>
            ${!isNative ? '<input id="addrA" placeholder="0x..." onchange="scanPool()">' : ''}
            <input id="amtA" type="number" placeholder="Amount A">
            
            <label>Token B Address</label>
            <input id="addrB" placeholder="0x..." onchange="scanPool()">
            <label>Token B Amount</label>
            <input id="amtB" type="number" placeholder="Amount B">
        `;
        document.getElementById("inputs").innerHTML = html;
    }

    // --- LOGIC ---
    async function init() {
        if(!window.ethereum) return log("No Wallet", "err");
        await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: SHIBARIUM_ID }] });
        provider = new ethers.BrowserProvider(window.ethereum);
        signer = await provider.getSigner();
        userAddr = await signer.getAddress();
        renderInputs();
        log("Connected: " + userAddr.slice(0,6));
    }

    function log(msg, type="") {
        const box = document.getElementById("console");
        const color = type === "err" ? "#ff4444" : type === "ok" ? "#00ff88" : "#aaa";
        box.innerHTML += `<div style="color:${color}">> ${msg}</div>`;
        box.scrollTop = box.scrollHeight;
    }

    async function scanPool() {
        if(!signer) await init();
        const isNative = document.getElementById("useNative").checked;
        
        let addrA = isNative ? WBONE : document.getElementById("addrA").value;
        let addrB = document.getElementById("addrB").value;
        
        if(!ethers.isAddress(addrA) || !ethers.isAddress(addrB)) return;

        try {
            const factory = new ethers.Contract(FACTORY, ABI, provider);
            const pair = await factory.getPair(addrA, addrB);
            
            if(pair === "0x0000000000000000000000000000000000000000") {
                document.getElementById("poolState").innerText = "DOES NOT EXIST";
                document.getElementById("resA").innerText = "0";
                document.getElementById("resB").innerText = "0";
            } else {
                document.getElementById("poolState").innerText = "ACTIVE: " + pair.slice(0,6);
                const pairC = new ethers.Contract(pair, ABI, provider);
                const res = await pairC.getReserves();
                document.getElementById("resA").innerText = res[0].toString();
                document.getElementById("resB").innerText = res[1].toString();
            }
        } catch(e) { log("Scan Error: " + e.message, "err"); }
    }

    async function runSimulation() {
        if(!signer) await init();
        const isNative = document.getElementById("useNative").checked;
        const addrB = document.getElementById("addrB").value;
        const amtA = document.getElementById("amtA").value;
        const amtB = document.getElementById("amtB").value;

        try {
            log("--- STARTING SIMULATION ---");
            
            // 1. Get Decimals
            const conB = new ethers.Contract(addrB, ABI, provider);
            const decB = await conB.decimals().catch(()=>18);
            const valB = ethers.parseUnits(amtB, decB);
            let valA, addrA;

            if(isNative) {
                valA = ethers.parseEther(amtA);
                addrA = WBONE;
            } else {
                addrA = document.getElementById("addrA").value;
                const conA = new ethers.Contract(addrA, ABI, provider);
                const decA = await conA.decimals().catch(()=>18);
                valA = ethers.parseUnits(amtA, decA);
            }

            // 2. Check Allowances
            log("Checking Allowances...");
            if(!isNative) {
                const cA = new ethers.Contract(addrA, ABI, signer);
                const allA = await cA.allowance(userAddr, ROUTER);
                if(allA < valA) {
                    log("⚠️ Token A Approval Missing. Sim will fail.", "err");
                    await cA.approve(ROUTER, ethers.MaxUint256).then(t=>t.wait());
                    log("Approved A.");
                }
            }
            const cB = new ethers.Contract(addrB, ABI, signer);
            const allB = await cB.allowance(userAddr, ROUTER);
            if(allB < valB) {
                log("⚠️ Token B Approval Missing.", "err");
                await cB.approve(ROUTER, ethers.MaxUint256).then(t=>t.wait());
                log("Approved B.");
            }

            // 3. Construct Payload
            const deadline = Math.floor(Date.now()/1000) + 1200;
            let data;
            
            if(isNative) {
                data = IFACE.encodeFunctionData("addLiquidityETH", [
                    addrB, valB, 0, 0, userAddr, deadline
                ]);
                payload.value = valA;
            } else {
                data = IFACE.encodeFunctionData("addLiquidity", [
                    addrA, addrB, valA, valB, 0, 0, userAddr, deadline
                ]);
                payload.value = 0n;
            }
            payload.to = ROUTER;
            payload.data = data;

            // 4. CALL STATIC (The Magic)
            log("Running Virtual Transaction...");
            
            // This asks the node to run the code but not save it
            // If it fails, it returns the EXACT error string
            await signer.call({
                to: ROUTER,
                data: payload.data,
                value: payload.value
            });

            log("✅ SIMULATION PASSED!", "ok");
            log("The transaction is valid.");
            document.getElementById("sendBtn").classList.add("active");

        } catch(e) {
            console.error(e);
            // Decode the error
            let reason = e.reason || e.shortMessage || e.message;
            
            if(reason.includes("ds-math-sub-underflow")) reason = "MATH ERROR: Input ratio doesn't match pool reserves.";
            if(reason.includes("TRANSFER_FROM_FAILED")) reason = "TOKEN ERROR: Tax or Balance issue.";
            if(reason.includes("insufficient funds")) reason = "WALLET ERROR: Not enough Gas.";
            
            log("❌ REVERT REASON: " + reason, "err");
            log("Do not send. It will fail.", "err");
        }
    }

    async function executeReal() {
        if(!payload.data) return alert("Run Simulation First");
        try {
            const tx = await signer.sendTransaction({
                to: payload.to,
                data: payload.data,
                value: payload.value,
                gasLimit: 4000000
            });
            log("Sent! Hash: " + tx.hash, "ok");
        } catch(e) { log(e.message, "err"); }
    }

    setTimeout(init, 500);
</script>
</body>
</html>
