<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RicSwap | Add Liquidity</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
    <style>
        :root {
            --obsidian: #080808;
            --card-bg: #121212;
            --magma: linear-gradient(135deg, #ff4d00 0%, #ff8c00 100%);
            --gold: #ffd700;
        }
        body { background: var(--obsidian); color: white; font-family: system-ui, sans-serif; margin: 0; padding: 0; }
        .nav { padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,215,0,0.1); }
        .logo { color: var(--gold); font-size: 28px; font-weight: bold; letter-spacing: -1px; }
        .nav-links a { color: white; text-decoration: none; margin-left: 32px; font-weight: 500; }
        .nav-links a:hover { color: var(--gold); }
        .nav-links a.active { color: var(--gold); font-weight: 600; }
        .card { max-width: 520px; margin: 40px auto; background: var(--card-bg); border-radius: 24px; padding: 32px; box-shadow: 0 20px 40px rgba(0,0,0,0.8); border: 1px solid #222; }
        .input-group { background: #1a1a1a; border-radius: 16px; padding: 16px; margin-bottom: 16px; border: 1px solid #333; }
        .input-group:focus-within { border-color: var(--gold); }
        label { display: block; color: #888; font-size: 12px; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        input { background: transparent; border: none; color: white; font-size: 20px; width: 100%; outline: none; }
        button { background: var(--magma); color: white; border: none; padding: 18px; border-radius: 16px; font-weight: bold; width: 100%; font-size: 18px; cursor: pointer; margin-top: 10px; transition: 0.2s; }
        button:disabled { opacity: 0.5; filter: grayscale(1); }
        .quick-btn { background: #222; color: var(--gold); border: 1px solid #444; padding: 8px 16px; border-radius: 9999px; font-size: 13px; cursor: pointer; margin: 4px; }
        #connectBtn { width: auto !important; padding: 10px 24px !important; font-size: 15px !important; background: #222 !important; color: var(--gold) !important; border: 1px solid var(--gold) !important; }
        #status { text-align: center; margin-top: 20px; font-size: 14px; min-height: 24px; font-family: monospace; line-height: 1.6; }
    </style>
</head>
<body>

<div class="nav">
    <div class="logo">RicSwap</div>
    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="swap.html">Swap</a>
        <a href="pools.html">Pools</a>
        <a href="liquidity.html" class="active">Add Liquidity</a>
    </div>
    <button id="connectBtn">CONNECT WALLET</button>
</div>

<div class="card">
    <h3 style="text-align:center; margin:0;">Create Pair + Add LP</h3>
    <p style="text-align:center; color:#888; font-size:13px; margin: 12px 0 24px 0;">
        Pairs automatically deploy a <strong>RicBurner VIP</strong> deflation engine.
    </p>

    <div class="input-group">
        <label>Token A Address</label>
        <input id="tokenA" value="0xC76F4c819D820369Fb2d7C1531aB3Bb18e6fE8d8">
        <div style="margin-top:8px;">
            <button class="quick-btn" onclick="document.getElementById('tokenA').value='0xC76F4c819D820369Fb2d7C1531aB3Bb18e6fE8d8'">BONE</button>
        </div>
    </div>

    <div class="input-group">
        <label>Token B Address</label>
        <input id="tokenB" placeholder="Paste token contract address">
    </div>

    <button id="createPairBtn">INITIALIZE PAIR & BURNER</button>

    <div id="liquiditySection" style="display:none; margin-top:24px; border-top: 1px solid #333; pt: 24px;">
        <h4 style="text-align:center; color: var(--gold);">Supply Liquidity</h4>
        <div class="input-group">
            <label>Amount of Token A</label>
            <input id="amountA" type="number" placeholder="0.0">
        </div>
        <div class="input-group">
            <label>Amount of Token B</label>
            <input id="amountB" type="number" placeholder="0.0">
        </div>
        <button id="addBtn">ADD LIQUIDITY</button>
    </div>

    <div id="status"></div>
</div>

<script>
    const FACTORY_ADDRESS = "0xc2e80224D2f61FaE15CF9b7D089e327F06db1106";
    const ROUTER_ADDRESS = "0x9703f105f13F5Fd4C431EBAB8A1A6d7d36F7e7e0";
    const WBONE = "0xC76F4c819D820369Fb2d7C1531aB3Bb18e6fE8d8";
    const CHAIN_ID = 109;

    const FACTORY_ABI = [
        "function createPair(address tokenA, address tokenB) external returns (address pair)",
        "function getPair(address tokenA, address tokenB) external view returns (address pair)"
    ];
    const ROUTER_ABI = [
        "function addLiquidity(address tokenA, address tokenB, uint amountADesired, uint amountBDesired, uint amountAMin, uint amountBMin, address to, uint deadline) external returns (uint amountA, uint amountB, uint liquidity)",
        "function addLiquidityETH(address token, uint amountTokenDesired, uint amountTokenMin, uint amountETHMin, address to, uint deadline) external payable returns (uint amountToken, uint amountETH, uint liquidity)"
    ];
    const ERC20_ABI = [
        "function approve(address spender, uint256 amount) public returns (bool)",
        "function allowance(address owner, address spender) public view returns (uint256)"
    ];

    let provider, signer, userAddress;

    async function connectWallet() {
        if (!window.ethereum) return alert("Install MetaMask");
        try {
            provider = new ethers.BrowserProvider(window.ethereum);
            await provider.send("eth_requestAccounts", []);
            await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: '0x' + CHAIN_ID.toString(16) }] });
            signer = await provider.getSigner();
            userAddress = await signer.getAddress();
            document.getElementById("connectBtn").textContent = userAddress.slice(0,6) + "..." + userAddress.slice(-4);
        } catch (e) { console.error(e); }
    }

    async function createPair() {
        if (!signer) return connectWallet();
        const tA = document.getElementById("tokenA").value.trim();
        const tB = document.getElementById("tokenB").value.trim();
        const status = document.getElementById("status");

        if (!ethers.isAddress(tA) || !ethers.isAddress(tB)) return alert("Invalid Addresses");

        try {
            status.style.color = "orange";
            status.textContent = "Checking Factory...";
            const factory = new ethers.Contract(FACTORY_ADDRESS, FACTORY_ABI, signer);
            const pair = await factory.getPair(tA, tB);

            if (pair !== ethers.ZeroAddress) {
                status.style.color = "#0f0";
                status.textContent = "✅ Pair detected. Ready to add liquidity.";
                document.getElementById("liquiditySection").style.display = "block";
                return;
            }

            status.textContent = "Confirming Pair + Burner creation...";
            const tx = await factory.createPair(tA, tB, { gasLimit: 4000000 });
            await tx.wait();
            
            status.style.color = "#0f0";
            status.textContent = "✅ Pair Created & Burner Deployed!";
            document.getElementById("liquiditySection").style.display = "block";
        } catch (e) {
            status.style.color = "red";
            status.textContent = "Factory Error: " + (e.reason || "Action Rejected");
        }
    }

    async function addLiquidity() {
        const tA = document.getElementById("tokenA").value.trim();
        const tB = document.getElementById("tokenB").value.trim();
        const amtA = document.getElementById("amountA").value;
        const amtB = document.getElementById("amountB").value;
        const status = document.getElementById("status");

        try {
            status.style.color = "orange";
            status.textContent = "Checking Approvals...";
            const router = new ethers.Contract(ROUTER_ADDRESS, ROUTER_ABI, signer);
            const deadline = Math.floor(Date.now() / 1000) + 1200;

            const valA = ethers.parseEther(amtA);
            const valB = ethers.parseEther(amtB);

            // Handle Native BONE + Token
            const isNativeA = tA.toLowerCase() === WBONE.toLowerCase();
            const tokenAddr = isNativeA ? tB : tA;
            const tokenAmt = isNativeA ? valB : valA;
            const boneAmt = isNativeA ? valA : valB;

            const tokenContract = new ethers.Contract(tokenAddr, ERC20_ABI, signer);
            const allow = await tokenContract.allowance(userAddress, ROUTER_ADDRESS);
            if (allow < tokenAmt) {
                status.textContent = "Approving Token...";
                await (await tokenContract.approve(ROUTER_ADDRESS, ethers.MaxUint256)).wait();
            }

            status.textContent = "Supplying Liquidity...";
            const tx = await router.addLiquidityETH(
                tokenAddr, tokenAmt, 0, 0, userAddress, deadline, 
                { value: boneAmt, gasLimit: 1000000 }
            );
            await tx.wait();

            status.style.color = "#0f0";
            status.textContent = "✅ Liquidity Added Successfully!";
        } catch (e) {
            status.style.color = "red";
            status.textContent = "Router Error: " + (e.reason || "Check Balance");
        }
    }

    document.getElementById("createPairBtn").onclick = createPair;
    document.getElementById("addBtn").onclick = addLiquidity;
    document.getElementById("connectBtn").onclick = connectWallet;
</script>
</body>
</html>
