<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RicSwap | Secure LP Vault</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        :root {
            --obsidian: #080808;
            --card-bg: #121212;
            --magma: linear-gradient(135deg, #ff4d00 0%, #ff8c00 100%);
            --gold: #ffd700;
            --error: #ff3b30;
            --success: #34c759;
        }
        body {
            background: var(--obsidian);
            color: white;
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .nav {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,215,0,0.1);
        }
        .card {
            max-width: 480px;
            width: 90%;
            margin: 40px auto;
            background: var(--card-bg);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            border: 1px solid #222;
        }
        .input-group {
            background: #1a1a1a;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid #333;
        }
        .input-group:focus-within { border-color: var(--gold); }
        label {
            display: block;
            color: #888;
            font-size: 11px;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        input {
            background: transparent;
            border: none;
            color: white;
            font-size: 20px;
            width: 100%;
            outline: none;
            margin-top: 4px;
        }
        button {
            background: var(--magma);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 16px;
            font-weight: bold;
            width: 100%;
            font-size: 18px;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
        }
        button:disabled { opacity: 0.5; cursor: not-allowed; filter: grayscale(1); }
        #connectBtn {
            width: auto;
            padding: 8px 20px;
            font-size: 14px;
            background: transparent;
            color: var(--gold);
            border: 1px solid var(--gold);
        }
        .quick-btn {
            background: #222;
            color: var(--gold);
            border: 1px solid #444;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            margin-right: 8px;
            cursor: pointer;
            display: inline-block;
        }
        #status {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            min-height: 24px;
            padding: 10px;
            border-radius: 8px;
            background: rgba(255,255,255,0.05);
            font-family: monospace;
        }
        .divider {
            text-align: center;
            margin: -10px 0 10px 0;
            font-size: 24px;
            color: #444;
        }
    </style>
</head>
<body>

    <div class="nav">
        <h2 style="margin:0; font-size: 20px; color: var(--gold);">RicSwap • LP Vault</h2>
        <button id="connectBtn">CONNECT WALLET</button>
    </div>

    <div class="card">
        <h3 style="text-align:center; margin-bottom: 24px;">Add Secure Liquidity</h3>
        
        <!-- Token A -->
        <div class="input-group">
            <label>Token A (Address)</label>
            <input id="tokenA" value="0xC76F4c819D820369Fb2d7C1531aB3Bb18e6fE8d8">
            <div style="margin-top:8px;">
                <button class="quick-btn" onclick="setTokenA()">BONE</button>
            </div>
            <input id="amountA" type="number" placeholder="0.0" step="any" style="margin-top:12px; font-size: 24px;">
            <div id="balanceA" style="font-size:12px; color:#666; margin-top:4px;">Balance: --</div>
        </div>

        <div class="divider">+</div>

        <!-- Token B -->
        <div class="input-group">
            <label>Token B (Address)</label>
            <input id="tokenB" value="0x12C94d3A30daa09f81Ea6c037004E6e99A4A3dfc">
            <div style="margin-top:8px;">
                <button class="quick-btn" onclick="setTokenB()">RIC</button>
            </div>
            <input id="amountB" type="number" placeholder="0.0" step="any" style="margin-top:12px; font-size: 24px;">
            <div id="balanceB" style="font-size:12px; color:#666; margin-top:4px;">Balance: --</div>
        </div>

        <button id="mainBtn">CONNECT WALLET</button>
        <div id="status">Ready to connect.</div>
    </div>

<script>
    // --- CONFIGURATION ---
    const ROUTER_ADDRESS = "0xdddb42C0094C00d38c72d49998Feabd57D5a10c4"; 
    const WBONE = "0xC76F4c819D820369Fb2d7C1531aB3Bb18e6fE8d8";
    const RIC = "0x12C94d3A30daa09f81Ea6c037004E6e99A4A3dfc";
    const CHAIN_ID = 109; // Shibarium

    // --- ABI (Standard + Custom Fallback) ---
    const ERC20_ABI = [
        "function approve(address spender, uint256 amount) public returns (bool)",
        "function allowance(address owner, address spender) public view returns (uint256)",
        "function balanceOf(address account) public view returns (uint256)"
    ];
    const ROUTER_ABI = [
        "function addLiquidity(address tokenA, address tokenB, uint256 amountADesired, uint256 amountBDesired, uint256 amountAMin, uint256 amountBMin, address to, uint256 deadline) external returns (uint256, uint256, uint256)",
        "function addLiquidityETH(address token, uint256 amountTokenDesired, uint256 amountTokenMin, uint256 amountETHMin, address to, uint256 deadline) external payable returns (uint256, uint256, uint256)",
        "function addLiquidityBONE(address token, uint256 amountTokenDesired, uint256 amountTokenMin, uint256 amountBONEMin, address to, uint256 deadline) external payable returns (uint256, uint256, uint256)"
    ];

    // --- STATE ---
    let provider, signer, userAddress;

    // --- UI ELEMENTS ---
    const mainBtn = document.getElementById("mainBtn");
    const connectBtn = document.getElementById("connectBtn");
    const statusEl = document.getElementById("status");

    // --- LOGGING HELPER ---
    function log(msg, type = 'info') {
        console.log(`[RicSwap] ${msg}`);
        statusEl.textContent = msg;
        statusEl.style.color = type === 'error' ? '#ff3b30' : (type === 'success' ? '#34c759' : '#fff');
    }

    // --- CONNECTION LOGIC ---
    async function connect() {
        // 1. Check Ethers Library
        if (typeof ethers === 'undefined') {
            return log("Error: Ethers.js library failed to load. Check internet/VPN.", "error");
        }
        // 2. Check Wallet Extension
        if (!window.ethereum) {
            alert("MetaMask not detected. Please install it.");
            return log("Wallet not found.", "error");
        }

        try {
            log("Requesting wallet connection...");
            connectBtn.disabled = true;
            mainBtn.disabled = true;
            connectBtn.textContent = "Connecting...";

            // 3. Initialize Provider
            provider = new ethers.BrowserProvider(window.ethereum);
            
            // 4. Force Request Accounts (Standard Web3)
            await provider.send("eth_requestAccounts", []);
            
            // 5. Switch Network (Shibarium)
            try {
                await window.ethereum.request({
                    method: 'wallet_switchEthereumChain',
                    params: [{ chainId: '0x' + CHAIN_ID.toString(16) }],
                });
            } catch (switchError) {
                // This error code indicates that the chain has not been added to MetaMask.
                if (switchError.code === 4902) {
                    log("Adding Shibarium Network...");
                    await window.ethereum.request({
                        method: 'wallet_addEthereumChain',
                        params: [{
                            chainId: '0x' + CHAIN_ID.toString(16),
                            chainName: 'Shibarium',
                            nativeCurrency: { name: 'BONE', symbol: 'BONE', decimals: 18 },
                            rpcUrls: ['https://rpc.shibarium.shib.io'], 
                            blockExplorerUrls: ['https://shibariumscan.io']
                        }]
                    });
                } else {
                    throw switchError;
                }
            }

            // 6. Get Signer
            signer = await provider.getSigner();
            userAddress = await signer.getAddress();
            
            // 7. Update UI
            connectBtn.textContent = userAddress.slice(0,6) + "..." + userAddress.slice(-4);
            mainBtn.textContent = "ADD LIQUIDITY";
            log("✅ Wallet Connected!", "success");
            
            // 8. Load Data
            updateBalances();

        } catch (e) {
            console.error(e);
            log("Connection Failed: " + (e.reason || e.message || "User rejected"), "error");
            connectBtn.textContent = "CONNECT WALLET";
        } finally {
            connectBtn.disabled = false;
            mainBtn.disabled = false;
        }
    }

    // --- BALANCE FETCHING ---
    async function fetchBal(tokenAddr, elementId) {
        try {
            let bal;
            if (tokenAddr.toLowerCase() === WBONE.toLowerCase()) {
                bal = await provider.getBalance(userAddress);
            } else {
                const contract = new ethers.Contract(tokenAddr, ERC20_ABI, provider);
                bal = await contract.balanceOf(userAddress);
            }
            document.getElementById(elementId).textContent = `Balance: ${Number(ethers.formatEther(bal)).toFixed(4)}`;
        } catch (e) {
            console.warn("Fetch balance error", e);
            document.getElementById(elementId).textContent = "Balance: 0.00";
        }
    }

    async function updateBalances() {
        if (!userAddress) return;
        const addrA = document.getElementById("tokenA").value;
        const addrB = document.getElementById("tokenB").value;
        if (ethers.isAddress(addrA)) fetchBal(addrA, "balanceA");
        if (ethers.isAddress(addrB)) fetchBal(addrB, "balanceB");
    }

    // --- ACTION HANDLER (SECURE) ---
    async function handleAction() {
        if (!userAddress) return connect();
        
        const tA = document.getElementById("tokenA").value.trim();
        const tB = document.getElementById("tokenB").value.trim();
        const amtA = document.getElementById("amountA").value;
        const amtB = document.getElementById("amountB").value;

        if (!amtA || !amtB) return alert("Enter amounts for both tokens");
        if (!ethers.isAddress(tA) || !ethers.isAddress(tB)) return alert("Invalid address");

        try {
            mainBtn.disabled = true;
            log("Preparing Transaction...", "info");

            const router = new ethers.Contract(ROUTER_ADDRESS, ROUTER_ABI, signer);
            const deadline = Math.floor(Date.now() / 1000) + 1200;

            const amountAWei = ethers.parseUnits(amtA, 18);
            const amountBWei = ethers.parseUnits(amtB, 18);

            // Slippage Protection (5%)
            const minA = (amountAWei * 95n) / 100n;
            const minB = (amountBWei * 95n) / 100n;

            // Manual Gas Limit to bypass estimation errors
            const overrides = { gasLimit: 3000000 };

            const isNativeA = tA.toLowerCase() === WBONE.toLowerCase();
            const isNativeB = tB.toLowerCase() === WBONE.toLowerCase();

            if (isNativeA || isNativeB) {
                const tokenAddr = isNativeA ? tB : tA;
                const tokenAmt = isNativeA ? amountBWei : amountAWei;
                const boneAmt = isNativeA ? amountAWei : amountBWei;
                const tokenMin = isNativeA ? minB : minA;
                const boneMin = isNativeA ? minA : minB;
                
                overrides.value = boneAmt;

                const tokenContract = new ethers.Contract(tokenAddr, ERC20_ABI, signer);
                log("Checking Allowance...", "info");
                const allowance = await tokenContract.allowance(userAddress, ROUTER_ADDRESS);
                
                if (allowance < tokenAmt) {
                    log("Approving Token...", "info");
                    const txApp = await tokenContract.approve(ROUTER_ADDRESS, ethers.MaxUint256);
                    await txApp.wait();
                }

                log("Sending Transaction...", "info");
                // Try standard ETH, fallback to BONE
                try {
                    const tx = await router.addLiquidityETH(tokenAddr, tokenAmt, tokenMin, boneMin, userAddress, deadline, overrides);
                    await tx.wait();
                } catch (err) {
                    console.warn("ETH method failed, trying BONE...", err);
                    const tx = await router.addLiquidityBONE(tokenAddr, tokenAmt, tokenMin, boneMin, userAddress, deadline, overrides);
                    await tx.wait();
                }
            } else {
                // Token-Token
                for (let data of [{a: tA, v: amountAWei}, {a: tB, v: amountBWei}]) {
                    const contract = new ethers.Contract(data.a, ERC20_ABI, signer);
                    const allow = await contract.allowance(userAddress, ROUTER_ADDRESS);
                    if (allow < data.v) {
                        log(`Approving ${data.a.slice(0,6)}...`, "info");
                        await (await contract.approve(ROUTER_ADDRESS, ethers.MaxUint256)).wait();
                    }
                }
                log("Sending Transaction...", "info");
                const tx = await router.addLiquidity(tA, tB, amountAWei, amountBWei, minA, minB, userAddress, deadline, overrides);
                await tx.wait();
            }

            log("✅ Liquidity Added Successfully!", "success");
            updateBalances();
        } catch (e) {
            console.error(e);
            if (e.message.includes("rejected")) {
                log("Transaction rejected by user.", "error");
            } else {
                log("Error: " + (e.shortMessage || "Transaction failed"), "error");
            }
        } finally {
            mainBtn.disabled = false;
        }
    }

    // --- EVENT LISTENERS ---
    function setTokenA() { document.getElementById("tokenA").value = WBONE; updateBalances(); }
    function setTokenB() { document.getElementById("tokenB").value = RIC; updateBalances(); }

    // Attach listeners when DOM is ready
    window.onload = () => {
        console.log("RicSwap Loaded");
        mainBtn.onclick = handleAction;
        connectBtn.onclick = connect;
        document.getElementById("tokenA").oninput = updateBalances;
        document.getElementById("tokenB").oninput = updateBalances;

        if (window.ethereum) {
            window.ethereum.on('accountsChanged', () => window.location.reload());
            window.ethereum.on('chainChanged', () => window.location.reload());
        } else {
            log("MetaMask not detected", "error");
        }
    };
</script>
</body>
</html>
