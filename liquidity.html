<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RicSwap | Universal Pool Creator</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
    <style>
        body { background: #050505; color: #e0e0e0; font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .card { width: 100%; max-width: 500px; background: #0f0f0f; padding: 32px; border-radius: 24px; border: 1px solid #222; }
        h2 { color: #ff4d00; text-align: center; margin-bottom: 25px; }
        .input-group { margin-bottom: 16px; background: #161616; padding: 16px; border-radius: 12px; border: 1px solid #222; }
        label { font-size: 11px; color: #888; display: block; margin-bottom: 6px; }
        input { width: 100%; background: transparent; border: none; color: white; font-size: 15px; font-family: monospace; outline: none; }
        button { width: 100%; padding: 18px; background: #ff4d00; color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        #status { margin-top: 20px; padding: 15px; border-radius: 8px; background: #1a1a1a; font-size: 13px; text-align: center; min-height: 28px; }
    </style>
</head>
<body>
<div class="card">
    <h2>Universal Pool Creator</h2>
    
    <div class="input-group">
        <label>Token A Address</label>
        <input id="tokenA" value="0x12C94d3A30daa09f81Ea6c037004E6e99A4A3dfc">
        <input id="amountA" type="number" value="100" style="margin-top:8px;">
    </div>
    <div style="text-align:center; font-size:24px; color:#444;">+</div>
    <div class="input-group">
        <label>Token B Address</label>
        <input id="tokenB" placeholder="Paste 0x...">
        <input id="amountB" type="number" value="100" style="margin-top:8px;">
    </div>

    <button onclick="createPool()">CREATE POOL + ADD LIQUIDITY</button>
    <div id="status">Ready</div>
</div>

<script>
    const ROUTER = "0xcfBF0917F2fCDC4F5170aC991fa26F2Bc3da9Fd4";
    const FACTORY = "0x78ae5cCD2f13D10aE3fF47F8418A79D99B4569d0";
    const RPC = "https://rpc.shibarium.shib.io";

    async function createPool() {
        const status = document.getElementById("status");
        const tokenA = document.getElementById("tokenA").value.trim();
        const tokenB = document.getElementById("tokenB").value.trim();
        const amtA = document.getElementById("amountA").value;
        const amtB = document.getElementById("amountB").value;

        if (!ethers.isAddress(tokenA) || !ethers.isAddress(tokenB)) {
            return status.innerHTML = "❌ Invalid token address";
        }

        status.innerText = "Connecting...";

        try {
            const provider = new ethers.JsonRpcProvider(RPC);
            const walletProvider = new ethers.BrowserProvider(window.ethereum);
            const signer = await walletProvider.getSigner();
            const user = await signer.getAddress();

            // Check if pair already exists
            const factory = new ethers.Contract(FACTORY, ["function getPair(address,address) view returns (address)"], provider);
            const pair = await factory.getPair(tokenA, tokenB);
            if (pair !== "0x0000000000000000000000000000000000000000") {
                return status.innerHTML = "⚠️ Pair already exists. Use existing pool or choose different tokens.";
            }

            status.innerText = "Approving Token A...";
            await new ethers.Contract(tokenA, ["function approve(address,uint256)"], signer)
                .approve(ROUTER, ethers.MaxUint256).then(tx => tx.wait());

            status.innerText = "Approving Token B...";
            await new ethers.Contract(tokenB, ["function approve(address,uint256)"], signer)
                .approve(ROUTER, ethers.MaxUint256).then(tx => tx.wait());

            status.innerText = "Creating Pool...";

            const router = new ethers.Contract(ROUTER, [
                "function addLiquidity(address tokenA, address tokenB, uint amountADesired, uint amountBDesired, uint amountAMin, uint amountBMin, address to, uint deadline) returns (uint,uint,uint)"
            ], signer);

            const tx = await router.addLiquidity(
                tokenA,
                tokenB,
                ethers.parseUnits(amtA, 18),
                ethers.parseUnits(amtB, 18),
                0,
                0,
                user,
                Math.floor(Date.now()/1000) + 1800,
                { gasLimit: 2500000 }
            );

            status.innerHTML = `Tx Sent → <a href="https://shibariumscan.io/tx/${tx.hash}" target="_blank">View</a>`;
            await tx.wait();
            status.innerHTML = `<span style="color:#00ff88">✅ SUCCESS! New Pool Created.</span>`;

        } catch (e) {
            console.error(e);
            status.innerHTML = `<span style="color:#ff6666">Error: ${e.reason || e.message || "Transaction Reverted"}</span>`;
        }
    }
</script>
</body>
</html>
