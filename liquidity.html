<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RicSwap | Add Liquidity</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
    <style>
        :root { --obsidian: #080808; --card-bg: #121212; --magma: linear-gradient(135deg, #ff4d00 0%, #ff8c00 100%); --gold: #ffd700; }
        body { background: var(--obsidian); color: white; font-family: system-ui, sans-serif; margin: 0; padding: 0; }
        .nav { padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,215,0,0.1); }
        .card { max-width: 500px; margin: 60px auto; background: var(--card-bg); border-radius: 24px; padding: 32px; box-shadow: 0 20px 40px rgba(0,0,0,0.8); }
        .input-group { background: #1a1a1a; border-radius: 16px; padding: 16px; margin-bottom: 16px; border: 1px solid #333; }
        .input-group:focus-within { border-color: var(--gold); }
        label { display: block; color: #888; font-size: 12px; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        input { background: transparent; border: none; color: white; font-size: 20px; width: 100%; outline: none; }
        button { background: var(--magma); color: white; border: none; padding: 18px; border-radius: 16px; font-weight: bold; width: 100%; font-size: 18px; cursor: pointer; margin-top: 10px; }
        #connectBtn { width: auto !important; min-width: 140px !important; padding: 10px 24px !important; font-size: 15px !important; background: #222 !important; color: var(--gold) !important; border: 1px solid var(--gold) !important; }
        #status { text-align: center; margin-top: 20px; font-size: 14px; font-weight: 600; min-height: 24px; }
    </style>
</head>
<body>
    <div class="nav">
        <h2>RicSwap • LP Vault</h2>
        <button id="connectBtn">CONNECT WALLET</button>
    </div>

    <div class="card">
        <h3 style="text-align:center;">Add Liquidity (RIC/BONE Pair)</h3>

        <!-- Token A (BONE) -->
        <div class="input-group">
            <label>Token A (WBONE)</label>
            <input id="tokenA" value="0xC76F4c819D820369Fb2d7C1531aB3Bb18e6fE8d8" readonly>
            <input id="amountA" type="number" placeholder="Amount of BONE" style="font-size:24px; margin-top:12px;">
            <div id="balanceA" style="font-size:12px; color:#888; margin-top:4px;">Balance: -- BONE</div>
        </div>

        <div style="text-align:center; margin:10px 0; font-size:28px;">+</div>

        <!-- Token B (RIC) -->
        <div class="input-group">
            <label>Token B (RIC)</label>
            <input id="tokenB" value="0x12C94d3A30daa09f81Ea6c037004E6e99A4A3dfc" readonly>
            <input id="amountB" type="number" placeholder="Amount of RIC" style="font-size:24px; margin-top:12px;">
            <div id="balanceB" style="font-size:12px; color:#888; margin-top:4px;">Balance: -- RIC</div>
        </div>

        <button id="addBtn">ADD LIQUIDITY</button>
        <div id="status"></div>
    </div>

    <script>
        const ROUTER_ADDRESS = "0x9703f105f13F5Fd4C431EBAB8A1A6d7d36F7e7e0";   // ← YOUR NEW ROUTER
        const WBONE = "0xC76F4c819D820369Fb2d7C1531aB3Bb18e6fE8d8";
        const RIC = "0x12C94d3A30daa09f81Ea6c037004E6e99A4A3dfc";
        const SHIBARIUM_CHAIN_ID = 109;

        const ROUTER_ABI = [
            "function addLiquidityBONE(address token, uint256 amountTokenDesired, uint256 amountTokenMin, uint256 amountBONEMin, address to, uint256 deadline) external payable returns (uint256, uint256, uint256)"
        ];
        const ERC20_ABI = [
            "function approve(address spender, uint256 amount) public returns (bool)",
            "function allowance(address owner, address spender) public view returns (uint256)",
            "function balanceOf(address account) public view returns (uint256)"
        ];

        let provider, signer, userAddress;

        const connectBtn = document.getElementById("connectBtn");
        const addBtn = document.getElementById("addBtn");
        const statusEl = document.getElementById("status");

        async function switchToShibarium() {
            try {
                await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: '0x' + SHIBARIUM_CHAIN_ID.toString(16) }] });
            } catch (e) {
                if (e.code === 4902) {
                    await window.ethereum.request({ method: 'wallet_addEthereumChain', params: [{ chainId: '0x' + SHIBARIUM_CHAIN_ID.toString(16), chainName: 'Shibarium', nativeCurrency: { name: 'BONE', symbol: 'BONE', decimals: 18 }, rpcUrls: ['https://rpc.shibarium.shib.io'], blockExplorerUrls: ['https://shibariumscan.io'] }] });
                }
            }
        }

        async function connectWallet() {
            if (!window.ethereum) return alert("Install MetaMask");
            try {
                connectBtn.disabled = true;
                connectBtn.textContent = "CONNECTING...";
                await switchToShibarium();
                provider = new ethers.BrowserProvider(window.ethereum);
                signer = await provider.getSigner();
                userAddress = await signer.getAddress();
                connectBtn.textContent = userAddress.slice(0,6) + "..." + userAddress.slice(-4);
                await loadBalances();
            } catch (e) { alert("Connection failed"); }
            finally { connectBtn.disabled = false; }
        }

        async function loadBalances() {
            if (!userAddress) return;
            await getBalance(WBONE, "balanceA");
            await getBalance(RIC, "balanceB");
        }

        async function getBalance(token, elementId) {
            try {
                if (token === WBONE) {
                    const bal = await provider.getBalance(userAddress);
                    document.getElementById(elementId).textContent = `Balance: ${ethers.formatEther(bal)} BONE`;
                } else {
                    const tokenContract = new ethers.Contract(token, ERC20_ABI, provider);
                    const bal = await tokenContract.balanceOf(userAddress);
                    document.getElementById(elementId).textContent = `Balance: ${ethers.formatEther(bal)}`;
                }
            } catch (e) {
                document.getElementById(elementId).textContent = "Balance: --";
            }
        }

        async function addLiquidity() {
            if (!signer) return connectWallet();

            const amountBONE = document.getElementById("amountA").value;
            const amountRIC = document.getElementById("amountB").value;

            if (!amountBONE || !amountRIC) return alert("Enter both amounts");

            try {
                addBtn.disabled = true;
                statusEl.textContent = "Adding liquidity...";

                const router = new ethers.Contract(ROUTER_ADDRESS, ROUTER_ABI, signer);
                const deadline = Math.floor(Date.now() / 1000) + 1200;
                const amountBONEWei = ethers.parseEther(amountBONE);
                const amountRICWei = ethers.parseEther(amountRIC);

                // Approve RIC if needed
                const ricContract = new ethers.Contract(RIC, ERC20_ABI, signer);
                const allowance = await ricContract.allowance(userAddress, ROUTER_ADDRESS);
                if (allowance < amountRICWei) {
                    await (await ricContract.approve(ROUTER_ADDRESS, ethers.MaxUint256)).wait();
                }

                const tx = await router.addLiquidityBONE(
                    RIC,
                    amountRICWei,
                    (amountRICWei * 995n) / 1000n,
                    (amountBONEWei * 995n) / 1000n,
                    userAddress,
                    deadline,
                    { value: amountBONEWei }
                );

                await tx.wait();

                statusEl.style.color = "#0f0";
                statusEl.textContent = "✅ Liquidity added successfully!";
                loadBalances();
            } catch (e) {
                console.error(e);
                statusEl.style.color = "#f00";
                statusEl.textContent = "Error: " + (e.reason || e.message || "Check console (F12)");
            } finally {
                addBtn.disabled = false;
            }
        }

        document.getElementById("connectBtn").addEventListener("click", connectWallet);
        document.getElementById("addBtn").addEventListener("click", addLiquidity);
    </script>
</body>
</html>
