<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RicSwap | Add Liquidity</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
    <style>
        :root {
            --obsidian: #080808;
            --card-bg: #121212;
            --magma: linear-gradient(135deg, #ff4d00 0%, #ff8c00 100%);
            --gold: #ffd700;
        }
        body { background: var(--obsidian); color: white; font-family: system-ui, sans-serif; margin: 0; padding: 0; }
        .nav { padding: 20px 40px; display: flex; align-items: center; border-bottom: 1px solid rgba(255,215,0,0.1); }
        .logo { font-size: 28px; font-weight: bold; color: var(--gold); }
        .nav-links { display: flex; gap: 30px; margin-left: 40px; }
        .nav-links a { color: white; text-decoration: none; font-weight: 500; }
        .nav-links a:hover, .nav-links a.active { color: var(--gold); }
        .connect-btn { 
            background: #222; color: white; border: 1px solid #444; padding: 6px 18px; 
            border-radius: 9999px; font-size: 14px; font-weight: 500; cursor: pointer; 
            white-space: nowrap; margin-left: auto; flex-shrink: 0; 
        }
        .connect-btn:hover { background: #333; border-color: var(--gold); }
        .card { max-width: 520px; margin: 40px auto; background: var(--card-bg); border-radius: 24px; padding: 32px; box-shadow: 0 20px 40px rgba(0,0,0,0.8); border: 1px solid #222; }
        .input-group { background: #1a1a1a; border-radius: 16px; padding: 16px; margin-bottom: 16px; border: 1px solid #333; }
        .input-group:focus-within { border-color: var(--gold); }
        label { display: block; color: #888; font-size: 12px; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        input { background: transparent; border: none; color: white; font-size: 24px; width: 100%; outline: none; }
        button { background: var(--magma); color: white; border: none; padding: 18px; border-radius: 16px; font-weight: bold; width: 100%; font-size: 18px; cursor: pointer; margin-top: 10px; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .status { margin-top: 15px; text-align: center; font-size: 14px; min-height: 24px; }
        .tx-link { color: var(--gold); text-decoration: underline; font-size: 13px; }
        .token-info { font-size: 13px; color: #888; margin-top: 4px; }
    </style>
</head>
<body>
    <div class="nav">
        <div class="logo">RicSwap</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="swap.html">Swap</a>
            <a href="pools.html">Pools</a>
            <a href="liquidity.html" class="active">Add Liquidity</a>
        </div>
        <button id="connectBtn" class="connect-btn">Connect Wallet</button>
    </div>

    <div class="card">
        <h2 style="text-align:center; margin-bottom:24px;">Add Liquidity (BONE + Any Token)</h2>
        
        <div class="input-group">
            <label>You add BONE</label>
            <input type="number" id="amountBONE" placeholder="0.0" value="1">
            <div style="text-align:right; font-size:12px; color:#888;" id="boneBalance">Balance: --</div>
        </div>

        <div class="input-group">
            <label>Token Address</label>
            <input type="text" id="tokenAddress" placeholder="0x... (e.g. Zen, RIC, or any ERC20)" style="font-size:16px;">
            <div id="tokenInfo" class="token-info"></div>
        </div>

        <div class="input-group">
            <label>Token Amount <span id="tokenSymbolDisplay"></span></label>
            <input type="number" id="amountToken" placeholder="0.0">
        </div>

        <button id="addBtn">Add Liquidity</button>
        <div class="status" id="status"></div>
    </div>

    <script>
        const FACTORY_ADDRESS = "0x78ae5cCD2f13D10aE3fF47F8418A79D99B4569d0";
        const ROUTER_ADDRESS = "0xF81FDAfa8f00f9B7e19d7a8eD3D7b18E5752D199";
        const WBONE = "0xC76F4c819D820369Fb2d7C1531aB3Bb18e6fE8d8";

        let provider, signer, userAddress;

        const FACTORY_ABI = ["function createPair(address tokenA, address tokenB) external returns (address pair)"];
        const ROUTER_ABI = ["function addLiquidityBONE(address token, uint amountTokenDesired, uint amountTokenMin, uint amountBONEMin, address to, uint deadline) external payable returns (uint amountToken, uint amountBONE, uint liquidity)"];
        const ERC20_ABI = [
            "function symbol() external view returns (string)",
            "function balanceOf(address account) external view returns (uint256)",
            "function approve(address spender, uint256 amount) external returns (bool)",
            "function allowance(address owner, address spender) external view returns (uint256)"
        ];

        async function connectWallet() {
            if (!window.ethereum) return alert("Please install MetaMask");
            provider = new ethers.BrowserProvider(window.ethereum);
            await provider.send("eth_requestAccounts", []);
            signer = await provider.getSigner();
            userAddress = await signer.getAddress();
            document.getElementById("connectBtn").textContent = userAddress.slice(0,6) + "..." + userAddress.slice(-4);
        }

        // Auto-fetch token symbol + balance when address is entered
        async function updateTokenInfo() {
            const tokenAddr = document.getElementById("tokenAddress").value.trim();
            const infoEl = document.getElementById("tokenInfo");
            const symbolDisplay = document.getElementById("tokenSymbolDisplay");

            if (!tokenAddr || !signer) {
                infoEl.textContent = "";
                symbolDisplay.textContent = "";
                return;
            }

            try {
                const tokenContract = new ethers.Contract(tokenAddr, ERC20_ABI, provider);
                const symbol = await tokenContract.symbol();
                const balance = await tokenContract.balanceOf(userAddress);

                infoEl.innerHTML = `Token: <strong>${symbol}</strong>`;
                symbolDisplay.textContent = `(${symbol})`;
                document.getElementById("amountToken").placeholder = `0.0 ${symbol}`;
            } catch (e) {
                infoEl.textContent = "Invalid token or no symbol";
                symbolDisplay.textContent = "";
            }
        }

        async function addLiquidity() {
            if (!signer) return alert("Connect wallet first");
            const status = document.getElementById("status");
            const amountBONE = document.getElementById("amountBONE").value;
            const tokenAddr = document.getElementById("tokenAddress").value.trim();
            const amountToken = document.getElementById("amountToken").value;

            if (!tokenAddr || !amountBONE || !amountToken) return status.textContent = "❌ Fill all fields";

            try {
                status.style.color = "#ff0";
                status.textContent = "Creating pair + adding liquidity...";

                const factory = new ethers.Contract(FACTORY_ADDRESS, FACTORY_ABI, signer);
                await factory.createPair(WBONE, tokenAddr);

                const router = new ethers.Contract(ROUTER_ADDRESS, ROUTER_ABI, signer);
                const amountTokenWei = ethers.parseEther(amountToken);
                const amountBONEWei = ethers.parseEther(amountBONE);
                const deadline = Math.floor(Date.now() / 1000) + 1200;

                const tx = await router.addLiquidityBONE(tokenAddr, amountTokenWei, 0, 0, userAddress, deadline, { value: amountBONEWei });
                await tx.wait();

                status.style.color = "#0f0";
                status.innerHTML = `✅ Liquidity added permanently!<br><a href="https://shibariumscan.io/tx/${tx.hash}" target="_blank" class="tx-link">View Transaction</a>`;
            } catch (e) {
                console.error(e);
                status.style.color = "#f00";
                status.textContent = "Error: " + (e.reason || e.message);
            }
        }

        document.getElementById("connectBtn").addEventListener("click", connectWallet);
        document.getElementById("addBtn").addEventListener("click", addLiquidity);
        document.getElementById("tokenAddress").addEventListener("input", updateTokenInfo);
    </script>
</body>
</html>
