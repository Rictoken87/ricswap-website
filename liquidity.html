<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RicSwap | Universal Pool Creator</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
    <style>
        body { background: #050505; color: #e0e0e0; font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .card { width: 100%; max-width: 480px; background: #0f0f0f; padding: 32px; border-radius: 24px; border: 1px solid #222; box-shadow: 0 0 60px rgba(255, 77, 0, 0.1); }
        h2 { color: #ff4d00; margin: 0 0 20px 0; text-align: center; text-transform: uppercase; letter-spacing: 1px; font-size: 20px; }
        .input-group { margin-bottom: 15px; background: #161616; padding: 15px; border-radius: 12px; border: 1px solid #222; }
        label { font-size: 11px; color: #888; text-transform: uppercase; font-weight: bold; display: block; margin-bottom: 8px; }
        input { width: 100%; background: transparent; border: none; color: white; font-size: 14px; font-family: monospace; outline: none; box-sizing: border-box; }
        input.amount { font-size: 20px; font-weight: bold; color: #ff4d00; margin-top: 5px; }
        button { width: 100%; padding: 18px; background: #ff4d00; color: white; font-weight: 800; border: none; border-radius: 12px; font-size: 16px; cursor: pointer; transition: 0.2s; text-transform: uppercase; }
        button:hover:not(:disabled) { background: #ff6600; box-shadow: 0 0 25px rgba(255, 77, 0, 0.4); }
        button:disabled { background: #333; color: #666; cursor: not-allowed; }
        #status { margin-top: 20px; padding: 15px; border-radius: 8px; background: #000; border: 1px solid #333; font-size: 13px; text-align: center; color: #888; font-family: monospace; min-height: 20px; }
    </style>
</head>
<body>
<div class="card">
    <h2>⚡ Universal Pool Creator</h2>
   
    <div class="input-group">
        <label>Token A Contract</label>
        <input id="tokenA" placeholder="Paste 0x..." value="0x12C94d3A30daa09f81Ea6c037004E6e99A4A3dfc">
        <input id="amountA" class="amount" type="number" placeholder="0.0" value="100">
    </div>
    <div style="text-align:center; font-size:20px; color:#444; margin:-10px 0 10px 0;">+</div>
    <div class="input-group">
        <label>Token B Contract</label>
        <input id="tokenB" placeholder="Paste 0x...">
        <input id="amountB" class="amount" type="number" placeholder="0.0" value="100">
    </div>
    <button id="btn" onclick="startProcess()">CREATE POOL + ADD LIQUIDITY</button>
    <div id="status">Ready to create liquidity pair.</div>
</div>
<script>
    const ROUTER = "0xcfBF0917F2fCDC4F5170aC991fa26F2Bc3da9Fd4";
    const RPC = "https://rpc.shibarium.shib.io";   // ← Your correct RPC

    const ABI = [
        "function approve(address spender, uint256 amount) returns (bool)",
        "function decimals() view returns (uint8)",
        "function allowance(address owner, address spender) view returns (uint256)",
        "function addLiquidity(address tokenA, address tokenB, uint amountADesired, uint amountBDesired, uint amountAMin, uint amountBMin, address to, uint deadline) returns (uint,uint,uint)"
    ];

    async function startProcess() {
        const btn = document.getElementById("btn");
        const status = document.getElementById("status");
       
        const addrA = document.getElementById("tokenA").value.trim();
        const addrB = document.getElementById("tokenB").value.trim();
        const rawAmtA = document.getElementById("amountA").value;
        const rawAmtB = document.getElementById("amountB").value;

        if(!ethers.isAddress(addrA) || !ethers.isAddress(addrB)) return alert("Invalid Addresses");
        if(!rawAmtA || !rawAmtB) return alert("Enter Amounts");

        try {
            btn.disabled = true;
            status.innerText = "Connecting to Shibarium...";

            const provider = new ethers.JsonRpcProvider(RPC);
            const walletProvider = new ethers.BrowserProvider(window.ethereum);
            const signer = await walletProvider.getSigner();
            const userAddr = await signer.getAddress();

            // Force switch network
            await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: '0x6d' }] }).catch(() => {});

            status.innerText = "Reading Token Decimals...";

            const contractA = new ethers.Contract(addrA, ABI, provider);
            const contractB = new ethers.Contract(addrB, ABI, provider);

            const decA = await contractA.decimals().catch(() => 18);
            const decB = await contractB.decimals().catch(() => 18);

            const valA = ethers.parseUnits(rawAmtA, decA);
            const valB = ethers.parseUnits(rawAmtB, decB);

            // Approvals
            status.innerText = "Approving Token A...";
            const allowA = await contractA.allowance(userAddr, ROUTER);
            if (allowA < valA) {
                const txA = await new ethers.Contract(addrA, ABI, signer).approve(ROUTER, ethers.MaxUint256);
                await txA.wait();
            }

            status.innerText = "Approving Token B...";
            const allowB = await contractB.allowance(userAddr, ROUTER);
            if (allowB < valB) {
                const txB = await new ethers.Contract(addrB, ABI, signer).approve(ROUTER, ethers.MaxUint256);
                await txB.wait();
            }

            // Add Liquidity
            status.innerText = "Creating Pool...";
            const router = new ethers.Contract(ROUTER, ABI, signer);
            const deadline = Math.floor(Date.now()/1000) + 1200;

            const tx = await router.addLiquidity(
                addrA, addrB,
                valA, valB,
                0, 0,
                userAddr,
                deadline,
                { gasLimit: 1500000 }
            );

            status.innerHTML = `Tx Sent! <a href="https://shibariumscan.io/tx/${tx.hash}" target="_blank">View Tx</a>`;
            await tx.wait();
            status.innerHTML = `<b style="color:#00ff88">✅ SUCCESS! New Pool Created.</b>`;
            btn.innerText = "DONE";

        } catch(e) {
            console.error(e);
            status.innerHTML = `<span style="color:#ff4444">Error: ${e.reason || e.message}</span>`;
            btn.disabled = false;
            btn.innerText = "TRY AGAIN";
        }
    }
</script>
</body>
</html>
