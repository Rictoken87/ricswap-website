<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RicSwap | Master Burner</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
    <style>
        body { 
            background: #050505; 
            color: #e0e0e0; 
            font-family: 'Inter', system-ui, -apple-system, sans-serif; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0; 
        }
        .container {
            width: 100%;
            max-width: 480px;
            padding: 20px;
        }
        .header { margin-bottom: 30px; text-align: center; }
        h1 { color: #ff4444; margin: 0 0 10px 0; font-size: 26px; letter-spacing: -0.5px; }
        .sub { color: #888; font-size: 14px; }
        
        /* Wallet Status */
        .wallet-box {
            background: #111;
            border: 1px solid #333;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 24px;
            text-align: center;
            font-family: monospace;
            font-size: 12px;
            color: #666;
        }
        .wallet-box.active { border-color: #00ff88; color: #00ff88; background: rgba(0,255,136,0.05); }

        /* Pool Card */
        .card {
            background: #0f0f0f; 
            border: 1px solid #222; 
            border-radius: 16px; 
            padding: 20px; 
            margin-bottom: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .pool-name { font-weight: 700; color: #fff; }
        .pool-addr { font-family: monospace; font-size: 11px; color: #555; background: #1a1a1a; padding: 4px 8px; border-radius: 6px; }
        
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 13px; color: #aaa; }
        .bal-val { color: #fff; font-weight: 600; font-family: monospace; }

        /* Buttons */
        .burn-btn { 
            background: #ff4444; 
            color: white; 
            border: none; 
            padding: 14px; 
            font-size: 15px; 
            font-weight: 800; 
            border-radius: 10px; 
            cursor: pointer; 
            width: 100%; 
            transition: 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .burn-btn:hover:not(:disabled) { background: #ff0000; box-shadow: 0 0 25px rgba(255,0,0,0.4); transform: scale(1.02); }
        .burn-btn:disabled { background: #222; color: #555; cursor: not-allowed; box-shadow: none; transform: none; }

        #connectBtn {
            position: fixed; bottom: 30px;
            background: #fff; color: #000;
            padding: 14px 32px; border-radius: 99px;
            font-weight: 700; border: none;
            cursor: pointer; box-shadow: 0 0 30px rgba(255,255,255,0.2);
            transition: 0.2s;
        }
        #connectBtn:hover { transform: scale(1.05); }

        .msg { text-align: center; font-size: 12px; margin-top: 10px; min-height: 18px; }
        a { color: #888; text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🔥 Liquidity Incinerator</h1>
        <div class="sub">Permanently lock your pools by burning LP tokens.</div>
    </div>

    <div id="walletStatus" class="wallet-box">Not Connected</div>

    <div id="poolList"></div>
</div>

<button id="connectBtn" onclick="connect()">Connect Wallet (0x5E5...)</button>

<script>
    // --- CONFIG ---
    const POOLS = [
        { name: "Pool 1 (Original)", address: "0x941abcb1A4278Ff33B50F6Cf9F5A4C8a0888BdeE" },
        { name: "Pool 2 (New)",      address: "0xA2D4194a094D4663850E6D1Cb1A5c77f63e03118" }
    ];
    const DEAD = "0x000000000000000000000000000000000000dEaD";
    const SHIBARIUM_CHAIN_ID = "0x6d"; // 109

    const ERC20_ABI = [
        "function balanceOf(address) view returns (uint256)",
        "function transfer(address to, uint256 amount) returns (bool)",
        "function decimals() view returns (uint8)"
    ];

    let provider, signer, userAddr;

    async function connect() {
        if (!window.ethereum) return alert("Install Rabby or MetaMask");
        
        provider = new ethers.BrowserProvider(window.ethereum);
        
        // 1. Force Network Switch
        try {
            await window.ethereum.request({
                method: 'wallet_switchEthereumChain',
                params: [{ chainId: SHIBARIUM_CHAIN_ID }],
            });
            provider = new ethers.BrowserProvider(window.ethereum); // Refresh provider
        } catch (e) {
            return alert("Please switch network to Shibarium.");
        }

        // 2. Get Account
        signer = await provider.getSigner();
        userAddr = await signer.getAddress();

        // 3. Update UI
        const wBox = document.getElementById("walletStatus");
        wBox.innerText = "Connected: " + userAddr;
        wBox.classList.add("active");
        document.getElementById("connectBtn").style.display = "none";

        renderPools();
    }

    async function renderPools() {
        const container = document.getElementById("poolList");
        container.innerHTML = "";

        for (let i = 0; i < POOLS.length; i++) {
            const pool = POOLS[i];
            
            // Create Card Structure
            const div = document.createElement("div");
            div.className = "card";
            div.innerHTML = `
                <div class="card-top">
                    <span class="pool-name">${pool.name}</span>
                    <span class="pool-addr">${pool.address.slice(0,6)}...${pool.address.slice(-4)}</span>
                </div>
                <div class="stat-row">
                    <span>Your Balance:</span>
                    <span class="bal-val" id="bal-${i}">Loading...</span>
                </div>
                <button id="btn-${i}" class="burn-btn" disabled>Scanning...</button>
                <div id="msg-${i}" class="msg"></div>
            `;
            container.appendChild(div);

            // Fetch Data
            checkPool(i, pool.address);
        }
    }

    async function checkPool(index, address) {
        const balEl = document.getElementById(`bal-${index}`);
        const btn = document.getElementById(`btn-${index}`);
        
        try {
            const contract = new ethers.Contract(address, ERC20_ABI, provider);
            const rawBal = await contract.balanceOf(userAddr);
            const decimals = await contract.decimals();
            const fmtBal = parseFloat(ethers.formatUnits(rawBal, decimals)).toFixed(4);

            if (rawBal > 0n) {
                balEl.innerText = fmtBal + " LP";
                balEl.style.color = "#ff4444"; // Highlight valid balance
                btn.innerText = "🔥 BURN FOREVER";
                btn.disabled = false;
                btn.onclick = () => burn(index, address, rawBal);
            } else {
                balEl.innerText = "0.0000 LP";
                btn.innerText = "No Assets Found";
                btn.style.border = "1px solid #333";
                btn.style.background = "transparent";
            }
        } catch (e) {
            console.error(e);
            balEl.innerText = "Error";
            btn.innerText = "Read Error";
        }
    }

    async function burn(index, address, amount) {
        if(!confirm("⚠️ FINAL WARNING\n\nYou are about to permanently destroy this liquidity.\nThis action cannot be undone.\n\nClick OK to Burn.")) return;

        const btn = document.getElementById(`btn-${index}`);
        const msg = document.getElementById(`msg-${index}`);
        
        try {
            btn.disabled = true;
            btn.innerText = "Sign in Wallet...";
            
            const contract = new ethers.Contract(address, ERC20_ABI, signer);
            const tx = await contract.transfer(DEAD, amount);
            
            msg.innerHTML = `Burning... <a href="https://shibariumscan.io/tx/${tx.hash}" target="_blank">View TX</a>`;
            
            await tx.wait();
            
            msg.innerHTML = `<span style="color:#00ff88">✅ SUCCESS: Liquidity Locked!</span>`;
            btn.innerText = "🔥 BURNED";
            document.getElementById(`bal-${index}`).innerText = "0.00 LP";

        } catch(e) {
            console.error(e);
            msg.innerText = "Failed: " + (e.reason || "Rejected");
            btn.disabled = false;
            btn.innerText = "🔥 Try Again";
        }
    }
</script>
</body>
</html>
