<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RicSwap | Safe Burner</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
    <style>
        body { background: #050505; color: #e0e0e0; font-family: 'Inter', monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .card { background: #111; border: 1px solid #333; padding: 30px; border-radius: 20px; max-width: 480px; width: 100%; }
        h1 { color: #ffcc00; margin: 0 0 10px 0; text-align: center; font-size: 22px; }
        .label { font-size: 11px; color: #888; font-weight: bold; display: block; margin-bottom: 5px; text-transform: uppercase; }
        select { width: 100%; padding: 14px; background: #000; border: 1px solid #444; color: white; border-radius: 8px; margin-bottom: 20px; }
        
        button { width: 100%; padding: 16px; border: none; font-weight: 800; font-size: 14px; border-radius: 10px; cursor: pointer; margin-top: 10px; transition: 0.2s; }
        
        .btn-test { background: #333; color: #fff; }
        .btn-test:hover { background: #444; }
        
        .btn-burn { background: #ff4444; color: white; }
        .btn-burn:hover { background: #ff0000; }

        .status { margin-top: 20px; font-size: 12px; color: #888; text-align: center; font-family: monospace; min-height: 40px; word-break: break-all; }
    </style>
</head>
<body>

<div class="card">
    <h1>🛡️ The 99% Burner</h1>
    <p style="text-align:center; font-size:13px; color:#666;">Avoids "Dust Errors" by leaving 1% behind.</p>

    <div class="label">Select Target Pool</div>
    <select id="poolSelect">
        <option value="0x941abcb1A4278Ff33B50F6Cf9F5A4C8a0888BdeE">Pool 1 (Original)</option>
        <option value="0xA2D4194a094D4663850E6D1Cb1A5c77f63e03118">Pool 2 (New)</option>
    </select>

    <button class="btn-test" onclick="runAction('self')">1. TEST: Send 0.001 to Myself</button>
    <button class="btn-burn" onclick="runAction('burn')">2. EXECUTE: Burn 99% (Safe)</button>
    
    <div id="status" class="status">Ready.</div>
</div>

<script>
    const DEAD = "0x000000000000000000000000000000000000dEaD";
    const SHIBARIUM_ID = "0x6d";

    async function runAction(mode) {
        const status = document.getElementById("status");
        const poolAddr = document.getElementById("poolSelect").value;
        
        try {
            if(!window.ethereum) return alert("No Wallet");
            const provider = new ethers.BrowserProvider(window.ethereum);
            
            // 1. Network Force
            try {
                await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: SHIBARIUM_ID }] });
            } catch(e) { console.log("Net Skipped"); }

            const signer = await provider.getSigner();
            const userAddr = await signer.getAddress();

            status.innerText = "Reading Balance...";
            
            const contract = new ethers.Contract(poolAddr, [
                "function balanceOf(address) view returns (uint256)",
                "function transfer(address to, uint256 amount) returns (bool)"
            ], signer);

            const rawBal = await contract.balanceOf(userAddr);
            
            if(rawBal === 0n) throw new Error("Balance is 0. Wrong Wallet?");

            let targetAddr, amount, msg;

            if(mode === 'self') {
                targetAddr = userAddr;
                amount = 100000000000000n; // Tiny amount (0.0001)
                msg = "Test Transfer";
            } else {
                targetAddr = DEAD;
                // Calculate 99% to be safe
                amount = (rawBal * 99n) / 100n; 
                msg = "BURNING 99%";
            }

            status.innerText = `Sign ${msg}...`;
            
            const tx = await contract.transfer(targetAddr, amount, {
                gasLimit: 300000 // Force High Gas
            });

            status.innerHTML = `Sent! <a href="https://shibariumscan.io/tx/${tx.hash}" target="_blank" style="color:#fff">View TX</a>`;
            await tx.wait();
            
            status.innerHTML = `<span style="color:#00ff88">✅ SUCCESS: ${msg} Complete</span>`;

        } catch(e) {
            console.error(e);
            status.innerHTML = `<span style="color:#ff4444">Error: ${e.shortMessage || e.message}</span>`;
        }
    }
</script>
</body>
</html>
