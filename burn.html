<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RicSwap | Universal Burner</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
    <style>
        body { background: #050505; color: #e0e0e0; font-family: 'Inter', monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .card { background: #0f0f0f; border: 1px solid #333; padding: 30px; border-radius: 20px; max-width: 480px; width: 100%; box-shadow: 0 0 60px rgba(255, 68, 68, 0.15); }
        
        h1 { color: #ff4444; margin: 0 0 10px 0; font-size: 24px; text-transform: uppercase; letter-spacing: 1px; text-align: center; }
        p { color: #666; font-size: 12px; text-align: center; margin-bottom: 25px; }
        
        .input-group { margin-bottom: 15px; }
        label { font-size: 11px; color: #888; font-weight: bold; text-transform: uppercase; display: block; margin-bottom: 6px; }
        
        input { width: 100%; background: #1a1a1a; border: 1px solid #333; color: white; padding: 14px; border-radius: 8px; font-family: monospace; box-sizing: border-box; font-size: 14px; transition: 0.2s; }
        input:focus { border-color: #ff4444; outline: none; background: #222; }

        button { width: 100%; padding: 18px; background: #ff4444; color: white; border: none; font-weight: 800; font-size: 16px; border-radius: 10px; cursor: pointer; text-transform: uppercase; transition: 0.2s; margin-top: 10px; }
        button:hover:not(:disabled) { background: #ff2222; box-shadow: 0 0 25px rgba(255,0,0,0.4); }
        button:disabled { background: #333; color: #555; cursor: not-allowed; }

        .status { margin-top: 20px; font-size: 12px; text-align: center; font-family: monospace; word-break: break-all; min-height: 20px; }
        a { color: #ff8888; }
        .bal-display { text-align: right; font-size: 11px; color: #00ff88; margin-top: 5px; height: 15px; }
    </style>
</head>
<body>

<div class="card">
    <h1>🔥 Universal Manual Burner</h1>
    <p>Uses Official RPC: rpc.shibarium.shib.io</p>
    
    <div class="input-group">
        <label>1. LP Token Address</label>
        <input type="text" id="lpAddress" value="0x941abcb1A4278Ff33B50F6Cf9F5A4C8a0888BdeE" onchange="checkBalance()">
        <div id="balText" class="bal-display"></div>
    </div>

    <div class="input-group">
        <label>2. Amount to Burn (Integers Preferred)</label>
        <input type="text" id="amount" placeholder="e.g. 108">
    </div>

    <button id="btn" onclick="executeManualBurn()">🔥 BURN NOW</button>
    <div id="status" class="status" style="color:#666">Ready.</div>
</div>

<script>
    const DEAD_ADDRESS = "0x000000000000000000000000000000000000dEaD";
    const SHIBARIUM_ID = "0x6d"; // Chain ID 109
    const OFFICIAL_RPC = "https://rpc.shibarium.shib.io";

    // Helper: Check balance using the Official RPC (Bypassing Wallet Cache)
    async function checkBalance() {
        const lpAddr = document.getElementById("lpAddress").value.trim();
        const balText = document.getElementById("balText");
        
        if(!window.ethereum || !ethers.isAddress(lpAddr)) return;

        try {
            const provider = new ethers.BrowserProvider(window.ethereum);
            const signer = await provider.getSigner();
            const userAddr = await signer.getAddress();

            // Use JsonRpcProvider to query the node directly
            const rpcProvider = new ethers.JsonRpcProvider(OFFICIAL_RPC);
            const contract = new ethers.Contract(lpAddr, ["function balanceOf(address) view returns (uint256)", "function decimals() view returns (uint8)"], rpcProvider);
            
            const bal = await contract.balanceOf(userAddr);
            const decimals = await contract.decimals().catch(() => 18);
            const fmt = ethers.formatUnits(bal, decimals);
            
            balText.innerText = `Blockchain Balance: ${parseFloat(fmt).toFixed(4)} LP`;
            
            if(bal === 0n) {
                balText.style.color = "#ff4444";
                balText.innerText += " (Zero! Check Staking)";
            } else {
                balText.style.color = "#00ff88";
            }
        } catch(e) { console.log("Balance check silent fail"); }
    }

    async function executeManualBurn() {
        const btn = document.getElementById("btn");
        const status = document.getElementById("status");
        
        // 1. Get Inputs
        const lpAddr = document.getElementById("lpAddress").value.trim();
        const amtVal = document.getElementById("amount").value.trim();

        if (!ethers.isAddress(lpAddr)) return alert("Invalid LP Address");
        if (!amtVal || isNaN(amtVal)) return alert("Invalid Amount");

        try {
            if (!window.ethereum) return alert("No Wallet Found");
            
            btn.disabled = true;
            btn.innerText = "Encoding...";
            
            // 2. Force Network Switch
            try {
                await window.ethereum.request({
                    method: 'wallet_switchEthereumChain',
                    params: [{ chainId: SHIBARIUM_ID }]
                });
            } catch(e) { console.log("Switch skipped"); }

            const provider = new ethers.BrowserProvider(window.ethereum);
            const signer = await provider.getSigner();

            // 3. MANUAL DATA ENCODING (Fixes "Empty Data" Error)
            status.innerText = "Constructing Payload...";
            
            // We use Interface to generate the binary data locally
            const iface = new ethers.Interface(["function transfer(address to, uint256 amount)"]);
            
            // Parse Amount (Assume 18 decimals standard for LP)
            const amountWei = ethers.parseUnits(amtVal, 18);
            
            // Generate the Hex String manually
            const dataPayload = iface.encodeFunctionData("transfer", [DEAD_ADDRESS, amountWei]);

            // 4. SEND TRANSACTION WITH GAS OVERRIDE
            status.innerText = "Please Sign (Gas Limit: 250k)...";
            
            const tx = await signer.sendTransaction({
                to: lpAddr,
                data: dataPayload, // <--- Explicitly sets data (0xa9059cbb...)
                gasLimit: 250000   // <--- Explicitly sets gas (Fixes estimation error)
            });

            status.innerHTML = `Sent! <a href="https://shibariumscan.io/tx/${tx.hash}" target="_blank">View TX</a>`;
            btn.innerText = "BURNING...";
            
            await tx.wait();
            
            status.innerHTML = `<span style="color:#00ff88; font-weight:bold">✅ SUCCESS: ${amtVal} LP BURNED</span>`;
            btn.innerText = "BURN COMPLETE";
            checkBalance(); // Refresh balance

        } catch (e) {
            console.error(e);
            status.innerHTML = `<span style="color:#ff4444">Error: ${e.shortMessage || e.message}</span>`;
            btn.innerText = "RETRY";
            btn.disabled = false;
        }
    }
    
    // Auto-check on load
    setTimeout(checkBalance, 1000);
</script>
</body>
</html>
