<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RicSwap | Ultimate Burner</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
    <style>
        body { 
            background: #050505; 
            color: #e0e0e0; 
            font-family: 'Inter', system-ui, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0; 
        }
        .container { width: 100%; max-width: 500px; padding: 20px; }
        
        /* Header */
        .header { text-align: center; margin-bottom: 30px; }
        h1 { color: #ff4444; margin: 0 0 10px 0; font-size: 28px; letter-spacing: -1px; }
        .sub { color: #888; font-size: 14px; }

        /* Wallet Status */
        .status-bar {
            background: #111;
            border: 1px solid #333;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-family: monospace;
            text-align: center;
            font-size: 12px;
            color: #666;
        }
        .status-bar.connected { color: #00ff88; border-color: #00ff88; background: rgba(0,255,136,0.05); }

        /* Pool Card */
        .card {
            background: #0f0f0f;
            border: 1px solid #222;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            position: relative;
            overflow: hidden;
        }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .pool-title { font-weight: 700; color: white; }
        .pool-addr { font-family: monospace; font-size: 11px; background: #222; padding: 4px 8px; border-radius: 4px; color: #888; }

        .data-row { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 14px; }
        .data-val { font-family: monospace; font-weight: 600; color: #fff; }
        .highlight { color: #ff4444; }

        /* Action Button */
        .burn-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 10px;
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
            background: #222;
            color: #555;
        }
        .burn-btn.active {
            background: #ff4444;
            color: white;
            box-shadow: 0 0 20px rgba(255, 68, 68, 0.4);
        }
        .burn-btn.active:hover { background: #ff0000; transform: scale(1.02); }

        /* Logs */
        .logs { margin-top: 8px; font-size: 11px; color: #666; text-align: center; min-height: 16px; }

        /* Main Connect */
        #connectBtn {
            position: fixed; bottom: 30px;
            background: white; color: black;
            border: none; padding: 14px 30px;
            border-radius: 50px; font-weight: 700;
            cursor: pointer; box-shadow: 0 0 30px rgba(255,255,255,0.15);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🔥 Ultimate Burner</h1>
        <div class="sub">Direct RPC Connection Mode</div>
    </div>

    <div id="walletStatus" class="status-bar">Wallet Not Connected</div>

    <div id="poolContainer"></div>
</div>

<button id="connectBtn" onclick="init()">Connect Wallet</button>

<script>
    // --- CONFIGURATION ---
    const POOLS = [
        { name: "Pool 1 (Original)", address: "0x941abcb1A4278Ff33B50F6Cf9F5A4C8a0888BdeE" },
        { name: "Pool 2 (New)",      address: "0xA2D4194a094D4663850E6D1Cb1A5c77f63e03118" }
    ];
    const DEAD = "0x000000000000000000000000000000000000dEaD";
    const RPC_URL = "https://rpc.shibarium.shib.io"; // Public Node
    const CHAIN_ID_HEX = "0x6d"; // 109

    const ABI = [
        "function balanceOf(address) view returns (uint256)",
        "function transfer(address to, uint256 amount) returns (bool)",
        "function decimals() view returns (uint8)"
    ];

    let userAddress = null;
    let browserProvider = null;

    // 1. Connect Wallet
    async function init() {
        if (!window.ethereum) return alert("No Wallet Found");
        
        try {
            browserProvider = new ethers.BrowserProvider(window.ethereum);
            const signer = await browserProvider.getSigner();
            userAddress = await signer.getAddress();
            
            const statusEl = document.getElementById("walletStatus");
            statusEl.innerText = "Target: " + userAddress;
            statusEl.classList.add("connected");
            document.getElementById("connectBtn").style.display = "none";

            renderCards();
        } catch (e) {
            alert("Connection Failed: " + e.message);
        }
    }

    // 2. Render Interface
    function renderCards() {
        const container = document.getElementById("poolContainer");
        container.innerHTML = "";

        POOLS.forEach((pool, idx) => {
            const html = `
            <div class="card">
                <div class="card-header">
                    <span class="pool-title">${pool.name}</span>
                    <span class="pool-addr">${pool.address.slice(0,6)}...${pool.address.slice(-4)}</span>
                </div>
                <div class="data-row">
                    <span>Balance:</span>
                    <span class="data-val" id="bal-${idx}">Loading...</span>
                </div>
                <button id="btn-${idx}" class="burn-btn" disabled>Scanning RPC...</button>
                <div id="log-${idx}" class="logs"></div>
            </div>`;
            container.insertAdjacentHTML('beforeend', html);
            
            // Trigger Fetch immediately
            fetchBalance(idx, pool.address);
        });
    }

    // 3. Fetch Data using PUBLIC RPC (Bypasses Wallet Errors)
    async function fetchBalance(idx, address) {
        const balEl = document.getElementById(`bal-${idx}`);
        const btn = document.getElementById(`btn-${idx}`);
        const log = document.getElementById(`log-${idx}`);

        try {
            // Create a Read-Only Provider specifically for data fetching
            const readProvider = new ethers.JsonRpcProvider(RPC_URL);
            const contract = new ethers.Contract(address, ABI, readProvider);
            
            const rawBal = await contract.balanceOf(userAddress);
            const decimals = await contract.decimals();
            const fmt = parseFloat(ethers.formatUnits(rawBal, decimals)).toFixed(4);

            if (rawBal > 0n) {
                balEl.innerText = fmt + " LP";
                balEl.classList.add("highlight");
                
                btn.innerText = "🔥 BURN FOREVER";
                btn.classList.add("active");
                btn.disabled = false;
                btn.onclick = () => executeBurn(idx, address, rawBal);
                
                log.innerText = "Liquidity Found";
            } else {
                balEl.innerText = "0.0000 LP";
                btn.innerText = "Empty / Burned";
                log.innerText = "Safe";
            }

        } catch (e) {
            console.error(e);
            balEl.innerText = "RPC Error";
            log.innerText = "Could not fetch data from Shibarium RPC";
            // Retry logic?
            setTimeout(() => fetchBalance(idx, address), 3000);
        }
    }

    // 4. Execute Burn (Switches back to Wallet)
    async function executeBurn(idx, address, amount) {
        const btn = document.getElementById(`btn-${idx}`);
        const log = document.getElementById(`log-${idx}`);

        if(!confirm("⚠️ FINAL CONFIRMATION\n\nSending LP tokens to Dead Address.\nThis is irreversible.\n\nProceed?")) return;

        try {
            btn.disabled = true;
            btn.innerText = "Check Wallet...";
            
            // Force Network Switch
            const net = await browserProvider.getNetwork();
            if(Number(net.chainId) !== 109) {
                await window.ethereum.request({
                    method: 'wallet_switchEthereumChain',
                    params: [{ chainId: CHAIN_ID_HEX }],
                });
            }

            const signer = await browserProvider.getSigner();
            const contract = new ethers.Contract(address, ABI, signer);
            
            const tx = await contract.transfer(DEAD, amount);
            
            log.innerHTML = `Tx Sent: <a href="https://shibariumscan.io/tx/${tx.hash}" target="_blank" style="color:#fff">View</a>`;
            btn.innerText = "Burning...";

            await tx.wait();
            
            btn.innerText = "🔥 BURNED SUCCESS";
            btn.classList.remove("active");
            document.getElementById(`bal-${idx}`).innerText = "0.00 LP";
            log.innerText = "Liquidity Permanently Locked";

        } catch (e) {
            console.error(e);
            log.innerText = "Error: " + (e.reason || e.message);
            btn.disabled = false;
            btn.innerText = "🔥 Retry Burn";
        }
    }
</script>
</body>
</html>
