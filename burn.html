<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RicSwap | Trigger Burn</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
    <style>
        body { background: #050505; color: white; font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: #0f0f0f; padding: 40px; border-radius: 24px; border: 1px solid #222; text-align: center; max-width: 460px; box-shadow: 0 0 60px rgba(255,68,68,0.3); }
        h1 { color: #ff4444; margin: 0 0 10px 0; font-size: 28px; }
        .info { font-size: 14px; color: #aaa; margin: 20px 0; }
        button { background: #ff4444; color: white; border: none; padding: 18px 32px; font-size: 18px; font-weight: bold; border-radius: 12px; cursor: pointer; width: 100%; margin-top: 15px; }
        button:hover:not(:disabled) { background: #ff2222; }
        button:disabled { background: #333; color: #666; cursor: not-allowed; }
        #status { margin-top: 20px; font-size: 14px; min-height: 28px; }
        .success { color: #00ff88; }
    </style>
</head>
<body>
<div class="card">
    <h1>🔥 Trigger Burn</h1>
    <div class="info">
        Burner Contract:<br>
        <small>0x485c2fbCD26b154504D34F7725E70Cb1925a59fa</small>
    </div>

    <button id="burnBtn" onclick="connectAndTrigger()">Connect Wallet & Trigger Burn</button>
    <div id="status"></div>
</div>

<script>
    const BURNER_ADDRESS = "0x485c2fbCD26b154504D34F7725E70Cb1925a59fa";

    const BURNER_ABI = [
        "function triggerMilestoneBurn()",
        "function getStatus() view returns (uint256 currentLP, bool isMilestoneReached, bool isBurned)"
    ];

    let signer;

    async function connectAndTrigger() {
        if (!window.ethereum) return alert("Please install MetaMask or Rabby");

        const provider = new ethers.BrowserProvider(window.ethereum);
        signer = await provider.getSigner();

        document.getElementById("burnBtn").innerText = "Triggering Burn...";
        triggerBurn();
    }

    async function triggerBurn() {
        const statusEl = document.getElementById("status");
        const btn = document.getElementById("burnBtn");

        try {
            const burner = new ethers.Contract(BURNER_ADDRESS, BURNER_ABI, signer);
            const tx = await burner.triggerMilestoneBurn();

            statusEl.innerHTML = `Transaction Sent!<br><a href="https://shibariumscan.io/tx/${tx.hash}" target="_blank" style="color:#ff8888">View on Explorer</a>`;

            await tx.wait();

            statusEl.innerHTML = `<span class="success">✅ Liquidity Permanently Burned!</span>`;
            btn.innerText = "BURN COMPLETE";
            btn.disabled = true;
        } catch (e) {
            console.error(e);
            statusEl.innerHTML = `<span style="color:#ff6666">❌ Failed: ${e.reason || e.message}</span>`;
            btn.innerText = "Try Again";
            btn.disabled = false;
        }
    }
</script>
</body>
</html>
