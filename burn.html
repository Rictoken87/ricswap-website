<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RicSwap | God Mode Burner</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
    <style>
        body { background: #050505; color: white; font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: #0f0f0f; padding: 40px; border-radius: 24px; border: 1px solid #222; text-align: center; max-width: 480px; box-shadow: 0 0 60px rgba(255,68,68,0.25); }
        h1 { color: #ff4444; margin: 0 0 10px 0; font-size: 28px; }
        .contract { font-size: 13px; color: #888; word-break: break-all; margin: 15px 0; }
        .stat { background: #1a1a1a; padding: 20px; border-radius: 16px; margin: 20px 0; border: 1px solid #333; }
        .val { font-size: 26px; font-weight: bold; color: #fff; }
        input { width: 100%; background: #1a1a1a; border: 1px solid #333; color: white; padding: 14px; border-radius: 10px; font-family: monospace; margin: 10px 0; }
        button { background: #ff4444; color: white; border: none; padding: 16px 32px; font-size: 17px; font-weight: bold; border-radius: 12px; cursor: pointer; width: 100%; margin-top: 10px; transition: 0.2s; }
        button:hover:not(:disabled) { background: #ff2222; }
        button:disabled { background: #333; color: #666; cursor: not-allowed; }
        #status { margin-top: 20px; font-size: 14px; min-height: 24px; color: #ff8888; }
        .success { color: #00ff88; }
    </style>
</head>
<body>
<div class="card">
    <h1>🔥 God Mode Burner</h1>
    <p>Enter any LP Pair Address</p>
    
    <input type="text" id="lpAddress" placeholder="0x..." value="0x941abcb1A4278Ff33B50F6Cf9F5A4C8a0888BdeE">
    
    <div class="stat">
        <span>Your LP Balance</span>
        <span class="val" id="lpBal">---</span>
    </div>

    <button id="burnBtn" onclick="connectAndBurn()">Connect Wallet</button>
    <div id="status"></div>
</div>

<script>
    const DEAD_ADDRESS = "0x000000000000000000000000000000000000dEaD";
    const ERC20_ABI = [
        "function balanceOf(address) view returns (uint256)",
        "function transfer(address to, uint256 amount) returns (bool)",
        "function decimals() view returns (uint8)"
    ];

    let provider, signer, userAddr;

    async function connectAndBurn() {
        if (!window.ethereum) return alert("Please install MetaMask or Rabby Wallet");

        provider = new ethers.BrowserProvider(window.ethereum);
        signer = await provider.getSigner();
        userAddr = await signer.getAddress();

        document.getElementById("burnBtn").innerText = "Checking...";
        checkBalance();
    }

    async function checkBalance() {
        const lpAddress = document.getElementById("lpAddress").value.trim();
        const status = document.getElementById("status");
        const balDisplay = document.getElementById("lpBal");

        if (!ethers.isAddress(lpAddress)) {
            status.innerText = "❌ Invalid Address";
            return;
        }

        try {
            const contract = new ethers.Contract(lpAddress, ERC20_ABI, provider);
            
            const bal = await contract.balanceOf(userAddr);
            let decimals = 18;
            try {
                decimals = await contract.decimals();
            } catch(e) {}

            const formatted = parseFloat(ethers.formatUnits(bal, decimals)).toFixed(6);
            balDisplay.innerText = formatted + " LP";

            const btn = document.getElementById("burnBtn");
            if (bal > 0n) {
                btn.innerText = "🔥 BURN THIS LP FOREVER";
                btn.onclick = () => burnLP(lpAddress, bal, decimals);
            } else {
                btn.innerText = "No Balance";
                btn.disabled = true;
            }
            status.innerText = "";
        } catch (e) {
            console.error(e);
            status.innerText = "❌ Error reading LP contract. Check address or network.";
        }
    }

    async function burnLP(lpAddress, amount, decimals) {
        if (!confirm("⚠️ FINAL WARNING\n\nYou are about to permanently BURN this LP.\n\nThis cannot be undone.\n\nContinue?")) return;

        const btn = document.getElementById("burnBtn");
        const status = document.getElementById("status");

        try {
            btn.disabled = true;
            btn.innerText = "Burning...";

            const contract = new ethers.Contract(lpAddress, ERC20_ABI, signer);
            const tx = await contract.transfer(DEAD_ADDRESS, amount);

            status.innerHTML = `Burning... <br><a href="https://shibariumscan.io/tx/${tx.hash}" target="_blank" style="color:#ff8888">View Tx</a>`;

            await tx.wait();

            status.innerHTML = `<span class="success">✅ Successfully Burned Forever!</span>`;
            btn.innerText = "BURN COMPLETE";
            document.getElementById("lpBal").innerText = "0.000000 LP";
        } catch (e) {
            console.error(e);
            status.innerText = "❌ " + (e.reason || "Burn Failed");
            btn.disabled = false;
            btn.innerText = "Try Again";
        }
    }
</script>
</body>
</html>
