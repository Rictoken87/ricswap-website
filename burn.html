<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RicSwap | Final Burn</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
    <style>
        body { 
            background: #050505; 
            color: white; 
            font-family: 'Inter', system-ui, sans-serif; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0; 
        }
        .card { 
            background: #0f0f0f; 
            padding: 30px; 
            border-radius: 24px; 
            border: 1px solid #222; 
            text-align: center; 
            width: 100%;
            max-width: 460px; 
            box-shadow: 0 0 80px rgba(255, 68, 68, 0.15);
        }
        h1 { color: #ff4444; margin: 0 0 5px 0; font-size: 24px; letter-spacing: -0.5px; }
        p { color: #666; font-size: 14px; margin-bottom: 25px; }

        /* Pool List Styles */
        .pool-item {
            background: #161616;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            text-align: left;
            transition: 0.2s;
        }
        .pool-header { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; }
        .pool-name { font-weight: 700; color: #fff; }
        .pool-addr { font-family: monospace; color: #666; font-size: 11px; }
        
        .pool-bal { font-size: 20px; font-weight: 700; color: #fff; font-family: monospace; }

        /* Action Button */
        .action-btn { 
            background: #ff4444; color: white; border: none; 
            padding: 12px; width: 100%; margin-top: 10px;
            font-size: 14px; font-weight: 800; border-radius: 8px; 
            cursor: pointer; text-transform: uppercase; transition: 0.2s;
        }
        .action-btn:hover:not(:disabled) { background: #ff0000; box-shadow: 0 0 20px rgba(255,0,0,0.4); }
        .action-btn:disabled { background: #222; color: #555; cursor: not-allowed; }

        .main-btn {
            background: #fff; color: #000; border: none;
            padding: 16px; width: 100%; font-size: 16px; font-weight: 700;
            border-radius: 12px; cursor: pointer; margin-top: 10px;
        }
        
        .status { font-size: 12px; color: #888; margin-top: 8px; min-height: 18px; }
        a { color: #ff8888; }
    </style>
</head>
<body>

<div class="card">
    <h1>🔥 Multi-Pool Burner</h1>
    <p>Permanently lock liquidity for both pools.</p>
    
    <div id="poolsContainer">
        <!-- Pools load here -->
    </div>

    <button id="connectBtn" class="main-btn" onclick="connect()">Connect Wallet</button>
    <div id="globalStatus" class="status" style="margin-top:15px;">Waiting for connection...</div>
</div>

<script>
    // --- DATA ---
    const POOLS = [
        { name: "Pool 1 (Original)", address: "0x941abcb1A4278Ff33B50F6Cf9F5A4C8a0888BdeE" },
        { name: "Pool 2 (New)",      address: "0xA2D4194a094D4663850E6D1Cb1A5c77f63e03118" }
    ];
    const DEAD = "0x000000000000000000000000000000000000dEaD";
    const SHIBARIUM_ID = "0x6d"; // 109

    const ABI = [
        "function balanceOf(address) view returns (uint256)",
        "function transfer(address to, uint256 amount) returns (bool)",
        "function decimals() view returns (uint8)"
    ];

    let provider, signer, userAddr;

    // --- INITIALIZE UI ---
    function init() {
        const container = document.getElementById("poolsContainer");
        container.innerHTML = "";
        
        POOLS.forEach((pool, i) => {
            container.innerHTML += `
            <div class="pool-item">
                <div class="pool-header">
                    <span class="pool-name">${pool.name}</span>
                    <span class="pool-addr">${pool.address.slice(0,6)}...${pool.address.slice(-4)}</span>
                </div>
                <div class="pool-bal" id="bal-${i}">---</div>
                <button id="btn-${i}" class="action-btn" disabled onclick="burn(${i})">Waiting...</button>
                <div id="msg-${i}" class="status"></div>
            </div>`;
        });
    }

    async function connect() {
        if (!window.ethereum) return alert("Install Rabby or MetaMask");
        
        provider = new ethers.BrowserProvider(window.ethereum);

        // 1. FORCE NETWORK (Crucial Fix)
        try {
            await window.ethereum.request({
                method: 'wallet_switchEthereumChain',
                params: [{ chainId: SHIBARIUM_ID }],
            });
            provider = new ethers.BrowserProvider(window.ethereum); // Refresh provider
        } catch (e) {
            document.getElementById("globalStatus").innerText = "Please switch network to Shibarium manually.";
            return;
        }

        signer = await provider.getSigner();
        userAddr = await signer.getAddress();
        
        document.getElementById("connectBtn").style.display = "none";
        document.getElementById("globalStatus").innerText = "Connected: " + userAddr.slice(0,6) + "...";
        
        scanPools();
    }

    async function scanPools() {
        for (let i = 0; i < POOLS.length; i++) {
            const pool = POOLS[i];
            const balEl = document.getElementById(`bal-${i}`);
            const btn = document.getElementById(`btn-${i}`);

            try {
                const contract = new ethers.Contract(pool.address, ABI, provider);
                const bal = await contract.balanceOf(userAddr);
                const decimals = await contract.decimals();
                const fmt = parseFloat(ethers.formatUnits(bal, decimals)).toFixed(4);

                if (bal > 0n) {
                    balEl.innerText = fmt + " LP";
                    balEl.style.color = "#ff4444";
                    btn.innerText = "🔥 BURN FOREVER";
                    btn.disabled = false;
                    btn.dataset.raw = bal; // Store exact amount
                } else {
                    balEl.innerText = "0.00 LP";
                    balEl.style.color = "#666";
                    btn.innerText = "Empty / Burned";
                    btn.style.background = "#222";
                    btn.style.color = "#555";
                }
            } catch (e) {
                console.error(e);
                balEl.innerText = "Error";
            }
        }
    }

    async function burn(index) {
        const pool = POOLS[index];
        const btn = document.getElementById(`btn-${index}`);
        const msg = document.getElementById(`msg-${index}`);
        const amount = btn.dataset.raw;

        if (!confirm(`⚠️ FINAL WARNING\n\nBurning liquidity for:\n${pool.name}\n\nThis cannot be undone. Proceed?`)) return;

        try {
            btn.disabled = true;
            btn.innerText = "Sign in Wallet...";
            
            const contract = new ethers.Contract(pool.address, ABI, signer);
            const tx = await contract.transfer(DEAD, amount);
            
            msg.innerHTML = `Sending... <a href="https://shibariumscan.io/tx/${tx.hash}" target="_blank">View TX</a>`;
            
            await tx.wait();
            
            msg.innerHTML = `<span style="color:#00ff88">✅ LOCKED FOREVER</span>`;
            btn.innerText = "BURN COMPLETE";
            document.getElementById(`bal-${index}`).innerText = "0.00 LP";

        } catch(e) {
            msg.innerText = "Failed: " + (e.reason || "Rejected");
            btn.disabled = false;
            btn.innerText = "🔥 Try Again";
        }
    }

    init();
</script>
</body>
</html>
