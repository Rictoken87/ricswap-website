<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RicSwap | Blind Burner</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
    <style>
        body { background: #050505; color: #e0e0e0; font-family: 'Inter', system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .container { width: 100%; max-width: 480px; padding: 20px; }
        
        h1 { color: #ff4444; margin: 0 0 5px 0; text-align: center; font-size: 28px; }
        .sub { color: #888; font-size: 13px; text-align: center; margin-bottom: 30px; }

        /* Card */
        .card { background: #0f0f0f; border: 1px solid #222; border-radius: 16px; padding: 24px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        .label { display: block; font-size: 11px; color: #888; margin-bottom: 6px; text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px; }
        
        /* Select & Input */
        select, input { width: 100%; background: #161616; border: 1px solid #333; color: #fff; padding: 14px; border-radius: 8px; font-family: monospace; font-size: 13px; outline: none; box-sizing: border-box; margin-bottom: 20px; transition: 0.2s; }
        select:focus, input:focus { border-color: #ff4444; }

        /* Button */
        .btn { width: 100%; border: none; padding: 16px; font-size: 16px; font-weight: 800; border-radius: 10px; cursor: pointer; transition: 0.2s; text-transform: uppercase; }
        .btn-burn { background: #ff4444; color: white; margin-top: 10px; }
        .btn-burn:hover:not(:disabled) { background: #ff0000; box-shadow: 0 0 25px rgba(255,0,0,0.4); }
        .btn-burn:disabled { background: #222; color: #555; cursor: not-allowed; }

        .status { margin-top: 20px; font-size: 13px; text-align: center; color: #888; min-height: 20px; line-height: 1.4; }
        a { color: #ff8888; }
        
        .info-box { background: rgba(255, 68, 68, 0.05); border: 1px solid #330000; padding: 12px; font-size: 12px; color: #ff8888; border-radius: 8px; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🔥 Blind Burner</h1>
    <div class="sub">Force Transaction Mode (Skips Loading)</div>

    <button id="connectBtn" class="btn" style="background:#fff; color:#000; margin-bottom:20px;" onclick="connect()">Connect Wallet</button>

    <div id="burnPanel" style="display:none;">
        <div class="card">
            <div class="info-box">
                <b>INSTRUCTIONS:</b><br>
                1. Select the Pool below.<br>
                2. Go to ShibariumScan. Copy your "Balance".<br>
                3. Paste the number (e.g. 108890.123) into the Amount box.<br>
                4. Click Burn.
            </div>

            <span class="label">Target Pool</span>
            <select id="poolSelect">
                <option value="0x941abcb1A4278Ff33B50F6Cf9F5A4C8a0888BdeE">Pool 1 (Original) - 0x941...BdeE</option>
                <option value="0xA2D4194a094D4663850E6D1Cb1A5c77f63e03118">Pool 2 (New) - 0xA2D...3118</option>
            </select>

            <span class="label">Amount to Burn (Paste Exact Balance)</span>
            <input type="text" id="amountInput" placeholder="e.g. 108890.9254">

            <button id="burnBtn" class="btn btn-burn" onclick="blindBurn()">🔥 EXECUTE BURN</button>
            <div id="status" class="status">Ready.</div>
        </div>
    </div>
</div>

<script>
    const DEAD = "0x000000000000000000000000000000000000dEaD";
    const ABI = ["function transfer(address to, uint256 amount) returns (bool)", "function decimals() view returns (uint8)"];
    
    let provider, signer;

    async function connect() {
        if (!window.ethereum) return alert("Wallet not found");
        
        try {
            await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: '0x6d' }] });
        } catch(e) { console.log("Network switch ignored"); }

        provider = new ethers.BrowserProvider(window.ethereum);
        signer = await provider.getSigner();
        
        const addr = await signer.getAddress();
        document.getElementById("connectBtn").style.display = "none";
        document.getElementById("burnPanel").style.display = "block";
        document.getElementById("status").innerText = "Connected: " + addr;
    }

    async function blindBurn() {
        const poolAddr = document.getElementById("poolSelect").value;
        const amtStr = document.getElementById("amountInput").value;
        const status = document.getElementById("status");
        const btn = document.getElementById("burnBtn");

        if(!amtStr || parseFloat(amtStr) === 0) return alert("Please enter an amount to burn.");

        if(!confirm(`⚠️ FORCE BURN CONFIRMATION\n\nPool: ${poolAddr.slice(0,10)}...\nAmount: ${amtStr}\n\nYou are blindly sending this amount to the Dead Address.\nProceed?`)) return;

        try {
            btn.disabled = true;
            status.innerText = "Initializing...";

            const contract = new ethers.Contract(poolAddr, ABI, signer);
            
            // Get decimals to parse correctly (usually 18)
            status.innerText = "Reading Decimals...";
            let decimals = 18;
            try { decimals = await contract.decimals(); } catch(e) { console.log("Defaulting to 18 dec"); }
            
            const amountWei = ethers.parseUnits(amtStr, decimals);

            status.innerText = "Please Sign Transaction...";
            const tx = await contract.transfer(DEAD, amountWei);
            
            status.innerHTML = `Sent! <a href="https://shibariumscan.io/tx/${tx.hash}" target="_blank">View TX</a>`;
            
            await tx.wait();
            
            status.innerHTML = `<span style="color:#00ff88">✅ BURN SUCCESSFUL</span>`;
            btn.innerText = "BURNED";

        } catch(e) {
            console.error(e);
            status.innerText = "Error: " + (e.reason || e.message);
            btn.disabled = false;
        }
    }
</script>
</body>
</html>
