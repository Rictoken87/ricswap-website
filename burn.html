<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RicSwap | Burn LP</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
    <style>
        body { 
            background: #050505; 
            color: white; 
            font-family: 'Inter', sans-serif; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
        }
        .card { 
            background: #0f0f0f; 
            padding: 40px; 
            border-radius: 24px; 
            border: 1px solid #222; 
            text-align: center; 
            max-width: 420px; 
            box-shadow: 0 0 60px rgba(255, 68, 68, 0.2);
        }
        h1 { color: #ff4444; margin: 0 0 10px 0; font-size: 28px; }
        p { color: #888; margin-bottom: 24px; }
        .stat { 
            background: #1a1a1a; 
            padding: 20px; 
            border-radius: 16px; 
            margin: 20px 0; 
            border: 1px solid #333; 
        }
        .val { font-size: 26px; font-weight: bold; color: #fff; }
        button { 
            background: #ff4444; 
            color: white; 
            border: none; 
            padding: 16px 32px; 
            font-size: 17px; 
            font-weight: bold; 
            border-radius: 12px; 
            cursor: pointer; 
            width: 100%; 
            margin-top: 10px;
        }
        button:hover:not(:disabled) { background: #ff2222; }
        button:disabled { background: #333; color: #666; cursor: not-allowed; }
        #status { margin-top: 20px; font-size: 14px; min-height: 24px; }
        .success { color: #00ff88; }
    </style>
</head>
<body>
<div class="card">
    <h1>🔥 Burn This LP</h1>
    <p>Contract: <small>0x485c2fbCD26b154504D34F7725E70Cb1925a59fa</small></p>
    
    <div class="stat">
        <span>Your LP Balance</span>
        <span class="val" id="lpBal">Loading...</span>
    </div>

    <button id="burnBtn" onclick="connectAndBurn()">Connect & Burn</button>
    <div id="status"></div>
</div>

<script>
    const LP_ADDRESS = "0x485c2fbCD26b154504D34F7725E70Cb1925a59fa";
    const DEAD_ADDRESS = "0x000000000000000000000000000000000000dEaD";

    const ERC20_ABI = [
        "function balanceOf(address) view returns (uint256)",
        "function transfer(address to, uint256 amount) returns (bool)",
        "function decimals() view returns (uint8)"
    ];

    let provider, signer, userAddr;

    async function connectAndBurn() {
        if (!window.ethereum) return alert("Please install MetaMask or Rabby");

        provider = new ethers.BrowserProvider(window.ethereum);
        signer = await provider.getSigner();
        userAddr = await signer.getAddress();

        const btn = document.getElementById("burnBtn");
        btn.innerText = "Checking Balance...";

        checkBalance();
    }

    async function checkBalance() {
        try {
            const contract = new ethers.Contract(LP_ADDRESS, ERC20_ABI, provider);
            const bal = await contract.balanceOf(userAddr);
            const decimals = await contract.decimals();

            const formatted = parseFloat(ethers.formatUnits(bal, decimals)).toFixed(6);
            document.getElementById("lpBal").innerText = formatted + " LP";

            const btn = document.getElementById("burnBtn");
            if (bal > 0n) {
                btn.innerText = "🔥 BURN THIS LP FOREVER";
                btn.onclick = () => burnLP(bal);
            } else {
                btn.innerText = "No Balance in this LP";
                btn.disabled = true;
            }
        } catch (e) {
            console.error(e);
            document.getElementById("status").innerText = "Error reading contract";
        }
    }

    async function burnLP(amount) {
        if (!confirm("⚠️ FINAL WARNING\n\nYou are about to send ALL your LP tokens from this pool to the dead address.\n\nThis action is IRREVERSIBLE.\n\nContinue?")) return;

        const btn = document.getElementById("burnBtn");
        const status = document.getElementById("status");

        try {
            btn.disabled = true;
            btn.innerText = "Burning...";

            const contract = new ethers.Contract(LP_ADDRESS, ERC20_ABI, signer);
            const tx = await contract.transfer(DEAD_ADDRESS, amount);

            status.innerHTML = `Burning... <a href="https://shibariumscan.io/tx/${tx.hash}" target="_blank" style="color:#ff8888">View Tx</a>`;

            await tx.wait();

            status.innerHTML = `<span class="success">✅ LP Permanently Burned!</span>`;
            btn.innerText = "BURN COMPLETE";
            document.getElementById("lpBal").innerText = "0.000000 LP";
        } catch (e) {
            console.error(e);
            status.innerText = "❌ Burn Failed";
            btn.disabled = false;
            btn.innerText = "🔥 Try Again";
        }
    }
</script>
</body>
</html>
