<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RicSwap | Multi-Burner</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
    <style>
        body { 
            background: #050505; 
            color: white; 
            font-family: 'Inter', system-ui, sans-serif; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0; 
        }
        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 { color: #ff4444; margin: 0 0 8px 0; font-size: 28px; letter-spacing: -1px; }
        p { color: #888; font-size: 14px; margin: 0; }

        /* Pool Cards */
        .pool-card {
            background: #0f0f0f; 
            border: 1px solid #222;
            border-radius: 16px; 
            padding: 20px;
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: 0.2s;
        }
        .pool-card:hover { border-color: #333; }

        .pool-header { display: flex; justify-content: space-between; align-items: center; }
        .pool-label { font-weight: 700; color: #fff; font-size: 16px; }
        .pool-addr { font-family: monospace; color: #666; font-size: 12px; background: #1a1a1a; padding: 4px 8px; border-radius: 6px; }
        
        .pool-stat { display: flex; justify-content: space-between; align-items: center; background: #161616; padding: 12px; border-radius: 10px; }
        .stat-label { font-size: 13px; color: #888; }
        .stat-val { font-family: monospace; font-size: 16px; color: #fff; font-weight: 600; }

        /* Buttons */
        .action-btn { 
            background: #ff4444; 
            color: white; 
            border: none; 
            padding: 14px; 
            font-size: 15px; 
            font-weight: bold; 
            border-radius: 10px; 
            cursor: pointer; 
            width: 100%; 
            transition: all 0.2s;
        }
        .action-btn:hover:not(:disabled) { background: #ff2222; box-shadow: 0 0 20px rgba(255,68,68,0.4); }
        .action-btn:disabled { background: #222; color: #555; cursor: not-allowed; border: 1px solid #333; }
        
        /* Main Connect */
        #connectBtn {
            position: fixed;
            bottom: 30px;
            background: #fff;
            color: #000;
            border-radius: 99px;
            padding: 12px 30px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            box-shadow: 0 0 20px rgba(255,255,255,0.1);
        }

        .status-text { font-size: 12px; text-align: center; margin-top: 8px; color: #666; min-height: 18px; }
        a { color: #ff8888; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🔥 Multi-Burner</h1>
        <p>Permanently lock liquidity for multiple pools.</p>
    </div>

    <div id="poolList">
        <!-- Pools will be injected here -->
    </div>
</div>

<button id="connectBtn" onclick="connectWallet()">Connect Wallet</button>

<script>
    // --- TARGET CONFIGURATION ---
    const POOLS = [
        { name: "Pool 1 (Original)", address: "0x941abcb1A4278Ff33B50F6Cf9F5A4C8a0888BdeE" },
        { name: "Pool 2 (New)",      address: "0xA2D4194a094D4663850E6D1Cb1A5c77f63e03118" }
    ];

    const DEAD_ADDRESS = "0x000000000000000000000000000000000000dEaD";
    const SHIBARIUM_ID = 109;
    const SHIBARIUM_HEX = "0x6d";

    const ERC20_ABI = [
        "function balanceOf(address) view returns (uint256)",
        "function transfer(address to, uint256 amount) returns (bool)",
        "function decimals() view returns (uint8)"
    ];

    let provider, signer, userAddr;

    // --- UI GENERATOR ---
    function initUI() {
        const container = document.getElementById("poolList");
        container.innerHTML = "";
        
        POOLS.forEach((pool, index) => {
            const html = `
            <div class="pool-card">
                <div class="pool-header">
                    <span class="pool-label">${pool.name}</span>
                    <span class="pool-addr">${pool.address.slice(0,6)}...${pool.address.slice(-4)}</span>
                </div>
                <div class="pool-stat">
                    <span class="stat-label">Your LP Balance</span>
                    <span class="stat-val" id="bal-${index}">Connect Wallet</span>
                </div>
                <button id="btn-${index}" class="action-btn" disabled onclick="burnPool(${index})">Waiting...</button>
                <div id="status-${index}" class="status-text"></div>
            </div>`;
            container.insertAdjacentHTML('beforeend', html);
        });
    }

    async function connectWallet() {
        if (!window.ethereum) return alert("Install MetaMask/Rabby");
        
        provider = new ethers.BrowserProvider(window.ethereum);

        // Network Check
        try {
            const net = await provider.getNetwork();
            if (Number(net.chainId) !== SHIBARIUM_ID) {
                await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: SHIBARIUM_HEX }] });
                provider = new ethers.BrowserProvider(window.ethereum);
            }
        } catch (e) { return alert("Switch to Shibarium manually"); }

        signer = await provider.getSigner();
        userAddr = await signer.getAddress();
        
        document.getElementById("connectBtn").innerText = "Connected: " + userAddr.slice(0,6)+"...";
        document.getElementById("connectBtn").disabled = true;
        
        scanPools();
    }

    async function scanPools() {
        for (let i = 0; i < POOLS.length; i++) {
            const pool = POOLS[i];
            const balEl = document.getElementById(`bal-${i}`);
            const btnEl = document.getElementById(`btn-${i}`);

            try {
                const contract = new ethers.Contract(pool.address, ERC20_ABI, provider);
                const bal = await contract.balanceOf(userAddr);
                const decimals = await contract.decimals();
                const fmt = parseFloat(ethers.formatUnits(bal, decimals)).toFixed(6);

                balEl.innerText = fmt + " LP";
                
                if (bal > 0n) {
                    btnEl.innerText = "🔥 BURN FOREVER";
                    btnEl.disabled = false;
                    btnEl.dataset.rawBal = bal.toString(); // Store raw bigInt
                } else {
                    btnEl.innerText = "Zero Balance (Safe or Empty)";
                    btnEl.style.background = "#222";
                    btnEl.style.color = "#888";
                    btnEl.style.border = "1px solid #333";
                    btnEl.disabled = true;
                }
            } catch (e) {
                balEl.innerText = "Error";
                console.error(e);
            }
        }
    }

    async function burnPool(index) {
        const pool = POOLS[index];
        const btn = document.getElementById(`btn-${index}`);
        const status = document.getElementById(`status-${index}`);
        const amount = btn.dataset.rawBal;

        if (!confirm(`⚠️ DANGER: You are about to burn liquidity for:\n\n${pool.name}\n\nThis cannot be undone. Confirm?`)) return;

        try {
            btn.disabled = true;
            btn.innerText = "Signing...";
            
            const contract = new ethers.Contract(pool.address, ERC20_ABI, signer);
            const tx = await contract.transfer(DEAD_ADDRESS, amount);
            
            status.innerHTML = `Burning... <a href="https://shibariumscan.io/tx/${tx.hash}" target="_blank">View Tx</a>`;
            
            await tx.wait();
            
            status.innerHTML = `<span style="color:#00ff88">✅ LOCKED FOREVER</span>`;
            btn.innerText = "BURNED";
            document.getElementById(`bal-${index}`).innerText = "0.00 LP";

        } catch (e) {
            status.innerText = "Failed: " + (e.reason || "Rejected");
            btn.disabled = false;
            btn.innerText = "🔥 BURN FOREVER";
        }
    }

    // Init
    initUI();
</script>
</body>
</html>
