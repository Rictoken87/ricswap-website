<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RicSwap | Precision Burner</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
    <style>
        body { background: #050505; color: #e0e0e0; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .card { background: #0f0f0f; border: 1px solid #222; padding: 30px; border-radius: 20px; max-width: 500px; width: 100%; box-shadow: 0 0 60px rgba(255,0,0,0.1); }
        
        h1 { color: #00ff88; margin: 0 0 10px 0; text-align: center; text-transform: uppercase; font-size: 22px; letter-spacing: 1px; }
        .sub { font-size: 13px; color: #666; text-align: center; margin-bottom: 30px; }
        
        .label { font-size: 11px; color: #888; font-weight: bold; display: block; margin-bottom: 5px; text-transform: uppercase; }
        select, input { width: 100%; padding: 14px; background: #1a1a1a; border: 1px solid #333; color: white; border-radius: 8px; font-family: monospace; margin-bottom: 20px; box-sizing: border-box; font-size: 14px; }
        
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        button { padding: 16px; border: none; font-weight: 800; font-size: 14px; border-radius: 10px; cursor: pointer; text-transform: uppercase; transition: 0.2s; flex: 1; }
        
        .btn-test { background: #333; color: #fff; border: 1px solid #444; }
        .btn-test:hover { background: #444; border-color: #fff; }

        .btn-burn { background: #ff4444; color: white; }
        .btn-burn:hover { background: #ff0000; box-shadow: 0 0 25px rgba(255,0,0,0.4); }

        .status { margin-top: 20px; font-size: 12px; color: #888; text-align: center; font-family: monospace; min-height: 20px; line-height: 1.5; }
        a { color: #00ff88; text-decoration: none; border-bottom: 1px dotted #00ff88; }
    </style>
</head>
<body>

<div class="card">
    <h1>✅ Precision Burner</h1>
    <div class="sub">Uses Safe-Encoding + Margin to prevent errors.</div>

    <div class="label">1. Select Pool</div>
    <select id="poolSelect">
        <option value="0x941abcb1A4278Ff33B50F6Cf9F5A4C8a0888BdeE">Pool 1 (Original)</option>
        <option value="0xA2D4194a094D4663850E6D1Cb1A5c77f63e03118">Pool 2 (New)</option>
    </select>

    <div class="label">2. Enter Safe Amount (e.g. 108)</div>
    <input type="text" id="amount" placeholder="Enter Integer (e.g. 100)">

    <div class="btn-group">
        <button class="btn-test" onclick="executeBurn(true)">🧪 Test (Burn 1 LP)</button>
        <button class="btn-burn" onclick="executeBurn(false)">🔥 Burn Amount</button>
    </div>
    
    <div id="status" class="status">Ready to Burn.</div>
</div>

<script>
    const DEAD = "0x000000000000000000000000000000000000dEaD";
    const SHIBARIUM_ID = "0x6d";

    async function executeBurn(isTest) {
        const status = document.getElementById("status");
        const poolAddr = document.getElementById("poolSelect").value;
        let amtInput = document.getElementById("amount").value;

        // Safety: If Test Mode, force amount to 1.0
        if (isTest) amtInput = "1.0";
        
        if (!amtInput || parseFloat(amtInput) <= 0) return alert("Enter a valid amount");

        try {
            if (!window.ethereum) return alert("No Wallet");
            const provider = new ethers.BrowserProvider(window.ethereum);

            // 1. Network Check
            try {
                await window.ethereum.request({
                    method: 'wallet_switchEthereumChain',
                    params: [{ chainId: SHIBARIUM_ID }],
                });
            } catch(e) { console.log("Network OK/Skipped"); }

            const signer = await provider.getSigner();
            status.innerText = "Encoding Transaction...";

            // 2. ENCODING FIX: Use Interface to guarantee clean data
            // We do not trust manual string concatenation. We let Ethers do the math.
            const iface = new ethers.Interface(["function transfer(address to, uint256 amount) returns (bool)"]);
            
            // Parse Tokens (18 Decimals)
            const amountWei = ethers.parseUnits(amtInput, 18);
            
            // Create Payload
            const data = iface.encodeFunctionData("transfer", [DEAD, amountWei]);

            // 3. EXECUTE
            status.innerText = isTest ? "Please Sign Test Transaction..." : "Please Sign BURN Transaction...";
            
            const tx = await signer.sendTransaction({
                to: poolAddr,
                data: data,
                gasLimit: 200000 // Safe limit
            });

            status.innerHTML = `Sent! <a href="https://shibariumscan.io/tx/${tx.hash}" target="_blank">View TX</a>`;
            
            await tx.wait();
            
            status.innerHTML = `<span style="color:#00ff88">✅ SUCCESS: ${amtInput} LP Burned!</span>`;
            if(isTest) alert("Test Passed! Now enter the rest (e.g. 107) and click BURN AMOUNT.");

        } catch(e) {
            console.error(e);
            status.innerHTML = `<span style="color:#ff4444">Failed: ${e.shortMessage || e.message}</span>`;
        }
    }
</script>
</body>
</html>
