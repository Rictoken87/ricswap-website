<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RicSwap | Bulletproof Burner</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
    <style>
        body { background: #050505; color: #e0e0e0; font-family: 'Inter', monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .card { background: #111; border: 1px solid #333; padding: 30px; border-radius: 20px; max-width: 480px; width: 100%; box-shadow: 0 0 50px rgba(255,0,0,0.1); }
        
        h1 { color: #ff4444; margin: 0 0 10px 0; text-align: center; text-transform: uppercase; font-size: 22px; letter-spacing: 1px; }
        p { font-size: 13px; color: #666; text-align: center; margin-bottom: 25px; }
        
        .label { font-size: 11px; color: #888; font-weight: bold; display: block; margin-bottom: 5px; text-transform: uppercase; }
        
        select, input { width: 100%; padding: 14px; background: #000; border: 1px solid #444; color: white; border-radius: 8px; font-family: monospace; margin-bottom: 20px; box-sizing: border-box; }
        select:focus, input:focus { border-color: #ff4444; outline: none; }
        
        button { width: 100%; padding: 16px; background: #ff4444; color: white; border: none; font-weight: 800; font-size: 16px; border-radius: 10px; cursor: pointer; text-transform: uppercase; transition: 0.2s; }
        button:hover { background: #ff2222; box-shadow: 0 0 20px rgba(255, 0, 0, 0.4); }
        
        .status { margin-top: 20px; font-size: 12px; color: #888; text-align: center; font-family: monospace; line-height: 1.5; }
        a { color: #ff8888; }
    </style>
</head>
<body>

<div class="card">
    <h1>🔥 Bulletproof Burner</h1>
    <p>Forces transaction with manual Gas Limit.<br>Bypasses "Missing Revert Data" errors.</p>

    <div class="label">1. Select Target Pool</div>
    <select id="poolSelect">
        <option value="0x941abcb1A4278Ff33B50F6Cf9F5A4C8a0888BdeE">Pool 1 (Original)</option>
        <option value="0xA2D4194a094D4663850E6D1Cb1A5c77f63e03118">Pool 2 (New)</option>
    </select>

    <div class="label">2. Enter LP Amount (Check ShibariumScan)</div>
    <input type="text" id="amount" placeholder="e.g. 108.890925">

    <button id="btn" onclick="forceBurn()">🔥 BURN NOW</button>
    <div id="status" class="status">Waiting for user...</div>
</div>

<script>
    const DEAD = "0x000000000000000000000000000000000000dEaD";
    const SHIBARIUM_RPC = "https://rpc.shibarium.shib.io";
    const CHAIN_ID = "0x6d"; // 109

    async function forceBurn() {
        const btn = document.getElementById("btn");
        const status = document.getElementById("status");
        const poolAddr = document.getElementById("poolSelect").value;
        const amtVal = document.getElementById("amount").value;

        if(!amtVal) return alert("Please enter the amount to burn.");

        try {
            if(!window.ethereum) return alert("Wallet not found");
            
            status.innerText = "Connecting Wallet...";
            const provider = new ethers.BrowserProvider(window.ethereum);

            // 1. Switch Network
            try {
                await window.ethereum.request({
                    method: 'wallet_switchEthereumChain',
                    params: [{ chainId: CHAIN_ID }],
                });
            } catch(e) { console.log("Network switch skipped/failed"); }

            const signer = await provider.getSigner();
            
            // 2. Prepare Contract
            // We do NOT use the public RPC for the contract object. 
            // We use the WALLET'S provider to ensure we can sign.
            const contract = new ethers.Contract(poolAddr, [
                "function transfer(address to, uint256 amount) returns (bool)",
                "function decimals() view returns (uint8)"
            ], signer);

            // 3. Parse Amount (Default to 18 decimals if RPC fails to read)
            let decimals = 18;
            try { 
                // Try to read decimals, but don't crash if it fails
                decimals = await contract.decimals(); 
            } catch(e) { 
                console.log("Could not read decimals, assuming 18"); 
            }
            
            const amountWei = ethers.parseUnits(amtVal, decimals);

            // 4. EXECUTE WITH MANUAL GAS LIMIT
            status.innerText = "Please Sign... (Gas Limit set to 150k)";
            btn.disabled = true;

            const tx = await contract.transfer(DEAD, amountWei, {
                gasLimit: 150000 // <--- THIS FIXES THE ERROR
            });
            
            status.innerHTML = `Transaction Sent!<br><a href="https://shibariumscan.io/tx/${tx.hash}" target="_blank">View on Explorer</a>`;
            btn.innerText = "SENDING...";
            
            await tx.wait();
            
            status.innerHTML = `<b style="color:#00ff88">✅ BURN CONFIRMED</b>`;
            btn.innerText = "BURN COMPLETE";

        } catch(e) {
            console.error(e);
            status.innerHTML = `<span style="color:#ff4444">Error: ${e.reason || e.message || "Transaction Rejected"}</span>`;
            btn.disabled = false;
            btn.innerText = "🔥 TRY AGAIN";
        }
    }
</script>
</body>
</html>
