<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RicSwap | Raw Hex Burner</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
    <style>
        body { background: #050505; color: #e0e0e0; font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .container { background: #111; border: 1px solid #333; padding: 40px; border-radius: 16px; max-width: 500px; width: 100%; box-shadow: 0 0 50px rgba(255,0,0,0.1); }
        
        h1 { color: #ff4444; margin: 0 0 20px 0; font-size: 20px; text-align: center; text-transform: uppercase; letter-spacing: 2px; }
        
        .data-box { background: #000; border: 1px solid #444; padding: 15px; font-size: 12px; color: #00ff88; word-break: break-all; margin-bottom: 20px; border-radius: 8px; display: none; }
        
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 14px; border-bottom: 1px solid #222; padding-bottom: 10px; }
        .val { font-weight: bold; color: #fff; }
        
        button { width: 100%; padding: 18px; font-weight: bold; font-size: 16px; cursor: pointer; border-radius: 8px; border: none; margin-top: 10px; text-transform: uppercase; }
        
        #scanBtn { background: #333; color: #fff; }
        #scanBtn:hover { background: #444; }
        
        #burnBtn { background: #ff4444; color: #fff; display: none; }
        #burnBtn:hover { background: #ff0000; box-shadow: 0 0 20px rgba(255,0,0,0.4); }

        .status { margin-top: 20px; text-align: center; font-size: 12px; color: #888; }
        a { color: #ff8888; }
    </style>
</head>
<body>

<div class="container">
    <h1>☢️ Raw Hex Burner</h1>
    
    <div class="stat-row">
        <span>Target Pool</span>
        <span class="val">0x941...BdeE</span>
    </div>
    <div class="stat-row">
        <span>Wallet Balance</span>
        <span class="val" id="balDisp">---</span>
    </div>

    <div id="payloadDisplay" class="data-box"></div>

    <button id="scanBtn" onclick="init()">1. Connect & Scan</button>
    <button id="burnBtn" onclick="executeRaw()">2. TRANSMIT BURN DATA</button>
    
    <div id="status" class="status">Waiting...</div>
</div>

<script>
    const POOL = "0x941abcb1A4278Ff33B50F6Cf9F5A4C8a0888BdeE";
    const DEAD = "000000000000000000000000000000000000dEaD"; // No 0x prefix for raw construct
    const SHIBARIUM_ID = "0x6d";

    let provider, signer, userAddr, rawBalance, decimals;

    async function init() {
        const btn = document.getElementById("scanBtn");
        const status = document.getElementById("status");
        
        if(!window.ethereum) return alert("No Wallet");

        try {
            btn.innerText = "Scanning...";
            await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: SHIBARIUM_ID }] }).catch(e=>console.log("Net Skipped"));
            
            provider = new ethers.BrowserProvider(window.ethereum);
            signer = await provider.getSigner();
            userAddr = await signer.getAddress();
            
            // Manual Call for Balance
            const contract = new ethers.Contract(POOL, ["function balanceOf(address) view returns (uint256)", "function decimals() view returns (uint8)"], provider);
            
            rawBalance = await contract.balanceOf(userAddr);
            try { decimals = await contract.decimals(); } catch { decimals = 18; }

            if(rawBalance > 0n) {
                const fmt = ethers.formatUnits(rawBalance, decimals);
                document.getElementById("balDisp").innerText = parseFloat(fmt).toFixed(4) + " LP";
                document.getElementById("balDisp").style.color = "#00ff88";
                
                // Calculate SAFE Burn Amount (Balance - 0.0001)
                // This prevents "Insufficient Funds" if there is dust
                const safetyMargin = ethers.parseUnits("0.0001", decimals);
                let burnAmount = rawBalance - safetyMargin;
                if(burnAmount < 0n) burnAmount = rawBalance; // If very small balance, burn all

                preparePayload(burnAmount);
            } else {
                document.getElementById("balDisp").innerText = "0.0000";
                status.innerText = "Wallet is Empty. (Did you Unstake?)";
            }

        } catch(e) {
            status.innerText = "Error: " + e.message;
        }
    }

    let FINAL_PAYLOAD = "";

    function preparePayload(amountWei) {
        // 1. Function Selector for transfer(address,uint256)
        const selector = "0xa9059cbb";
        
        // 2. Pad Address (32 bytes)
        const paddedAddress = "000000000000000000000000" + DEAD;
        
        // 3. Pad Amount (32 bytes)
        let amtHex = amountWei.toString(16);
        while(amtHex.length < 64) amtHex = "0" + amtHex;
        
        // 4. Combine
        FINAL_PAYLOAD = selector + paddedAddress + amtHex;

        document.getElementById("payloadDisplay").style.display = "block";
        document.getElementById("payloadDisplay").innerText = "Raw Data Prepared:\n" + FINAL_PAYLOAD.slice(0, 40) + "...";
        
        const btn = document.getElementById("burnBtn");
        document.getElementById("scanBtn").style.display = "none";
        btn.style.display = "block";
        document.getElementById("status").innerText = "Ready to Transmit.";
    }

    async function executeRaw() {
        const btn = document.getElementById("burnBtn");
        const status = document.getElementById("status");
        
        try {
            btn.disabled = true;
            btn.innerText = "Sending Raw Data...";
            
            // 5. SEND RAW TRANSACTION
            // We bypass the Contract Object entirely
            const tx = await signer.sendTransaction({
                to: POOL,
                data: FINAL_PAYLOAD,
                gasLimit: 200000 // Force Gas
            });
            
            status.innerHTML = `TX Sent! <a href="https://shibariumscan.io/tx/${tx.hash}" target="_blank">View</a>`;
            await tx.wait();
            status.innerHTML = "<b style='color:#00ff88'>SUCCESS: BURN CONFIRMED</b>";
            btn.innerText = "DONE";

        } catch(e) {
            console.error(e);
            status.innerText = "Failed: " + (e.reason || e.message);
            btn.disabled = false;
            btn.innerText = "RETRY";
        }
    }
</script>
</body>
</html>
