// ==================== FIXED CONNECT WALLET (Most Reliable) ====================
const CONFIG = {
  ROUTER: "0x652875c0F607CB392C0F9E5FB957A7055c2deD2e",
  FACTORY: "0xD8fFEECfDE1698a70A26a094afBE917bA58E2F70",
  WBONE: "0xc76f4c819d820369fb2d7c1531ab3bb18e6fe8d8",
  CHAIN_ID: 109,
  RPC: "https://rpc.shibarium.shib.io"
};

let prov, sign, uAddr;

async function connWallet() {
  if (!window.ethereum) return alert("Please install MetaMask or Rabby Wallet");
  const btn = document.getElementById("wBtn");
  btn.style.opacity = "0.6";

  try {
    // Step 1: Request accounts (works on all wallets)
    await window.ethereum.request({ method: "eth_requestAccounts" });

    prov = new ethers.BrowserProvider(window.ethereum);
    sign = await prov.getSigner();
    uAddr = await sign.getAddress();

    // Step 2: Switch network (isolated, doesn't break connect)
    const net = await prov.getNetwork();
    if (net.chainId !== BigInt(CONFIG.CHAIN_ID)) {
      await window.ethereum.request({
        method: "wallet_switchEthereumChain",
        params: [{ chainId: "0x6d" }]
      });
      prov = new ethers.BrowserProvider(window.ethereum);
      sign = await prov.getSigner();
      uAddr = await sign.getAddress();
    }

    // Success
    btn.classList.add("con");
    document.getElementById("wLbl").textContent = uAddr.slice(0,6) + "..." + uAddr.slice(-4);

    setSt("", "○", "Wallet connected — loading positions...");
    await loadPositions();

  } catch (e) {
    console.error(e);
    if (e.code === 4001 || e.code === "ACTION_REJECTED") {
      setSt("error", "✕", "Connection rejected by user");
    } else {
      setSt("error", "✕", "Failed to connect: " + (e.shortMessage || e.message));
    }
  } finally {
    btn.style.opacity = "1";
  }
}

  const { bal, totalSupply, amt0, amt1, t0, t1, addr, pair } = selPos;
  if (totalSupply === 0n) {

  const pctBig = BigInt(rmPct);
  const lpBurn = bal * pctBig / 100n;
  if (lpBurn === 0n) {
    setSt("error","✕","Amount too small");
    btn.disabled = false; return;
  }

  const exp0 = amt0 * pctBig / 100n;
  const exp1 = amt1 * pctBig / 100n;
  const min0 = exp0 * 9950n / 10000n; // 0.5% slippage
  const min1 = exp1 * 9950n / 10000n;

  try {
    setSt("loading", null, "Approving LP tokens...");
    const lpContract = new ethers.Contract(addr, ERC20, sign);
    const allowance = await lpContract.allowance(uAddr, CONFIG.ROUTER);
    if (allowance < lpBurn) {
      const approveTx = await lpContract.approve(CONFIG.ROUTER, lpBurn);
      await approveTx.wait();
    }

    setSt("loading", null, "Confirm in wallet...");
    const router = new ethers.Contract(CONFIG.ROUTER, RABI, sign);
    const deadline = BigInt(Math.floor(Date.now() / 1000) + 600);

    const tx = await router.removeLiquidity(
      t0.address, t1.address,
      lpBurn,
      min0, min1,
      uAddr,
      deadline
    );

    setSt("loading", null, `Transaction sent → <a href="https://shibariumscan.io/tx/${tx.hash}" target="_blank">View</a>`);
    await tx.wait();

    setSt("success", "✅", "Liquidity removed successfully!");
    document.getElementById("rmPanel").classList.remove("show");
    await loadPositions();

  } catch(e) {
    setSt("error", "✕", decErr(e));
  } finally {
    btn.disabled = false;
    btn.textContent = "Remove Liquidity";
  }
