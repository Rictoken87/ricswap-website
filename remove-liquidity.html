<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RicSwap | Remove Liquidity</title>
<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* ── Design tokens ─────────────────────────────────────── */
:root{
  --bg:#04050f;--su:#0b0d1f;--s2:#111328;--s3:#0d0f24;
  --bd:#1e2040;--b2:#2a2d55;
  --ac:#ff4d00;--ac2:#ff8c00;--gr:#00ffb2;--rd:#ff3366;--yw:#ffd84a;--bl:#3b6bff;
  --tx:#d8daf5;--t2:#8385a8;--mu:#555880;
  --mo:'Space Mono',monospace;--sa:'Syne',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:var(--sa);min-height:100vh;
  display:flex;align-items:flex-start;justify-content:center;padding:32px 24px}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(rgba(255,77,0,.025)1px,transparent 1px),
    linear-gradient(90deg,rgba(255,77,0,.025)1px,transparent 1px);
  background-size:40px 40px}

/* ── Card ───────────────────────────────────────────────── */
.card{position:relative;z-index:1;width:100%;max-width:540px;background:var(--su);
  border:1px solid var(--bd);border-radius:20px;padding:28px;
  box-shadow:0 32px 64px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.04)}

/* ── Animations ─────────────────────────────────────────── */
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{0%,100%{opacity:.35}50%{opacity:.7}}
.fade-up{animation:fadeUp .35s ease both}

/* ── Header ─────────────────────────────────────────────── */
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.logo{font-weight:800;font-size:20px;letter-spacing:-.5px}.logo span{color:var(--ac)}
.logo a{color:inherit;text-decoration:none}
.net-pill{display:flex;align-items:center;gap:6px;background:rgba(0,255,178,.07);
  border:1px solid rgba(0,255,178,.18);border-radius:20px;padding:4px 10px;
  font-family:var(--mo);font-size:10px;color:var(--gr)}
.dot{width:5px;height:5px;border-radius:50%;background:var(--gr);animation:pulse 2s infinite}

/* ── Nav back ───────────────────────────────────────────── */
.nav-back{display:inline-flex;align-items:center;gap:6px;font-family:var(--mo);font-size:11px;
  color:var(--t2);text-decoration:none;padding:6px 12px;background:var(--s2);
  border:1px solid var(--bd);border-radius:8px;margin-bottom:16px;transition:all .15s}
.nav-back:hover{border-color:var(--b2);color:var(--tx)}

/* ── Wallet ──────────────────────────────────────────────── */
.w-btn{width:100%;padding:11px;background:transparent;border:1px solid var(--b2);
  border-radius:10px;color:var(--t2);font-family:var(--mo);font-size:12px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;
  margin-bottom:18px;transition:all .2s}
.w-btn:hover{border-color:var(--ac);color:var(--tx);background:rgba(255,77,0,.05)}
.w-btn.con{border-color:var(--gr);color:var(--gr);background:rgba(0,255,178,.05)}

/* ── Section label ───────────────────────────────────────── */
.sec-lbl{font-family:var(--mo);font-size:10px;color:var(--mu);text-transform:uppercase;
  letter-spacing:1.5px;margin-bottom:10px;display:flex;align-items:center;
  justify-content:space-between}
.refresh-btn{font-family:var(--mo);font-size:10px;color:var(--mu);background:transparent;
  border:none;cursor:pointer;padding:2px 6px;border-radius:4px;transition:color .15s}
.refresh-btn:hover{color:var(--tx)}
.pos-count{font-family:var(--mo);font-size:10px;color:var(--gr);
  background:rgba(0,255,178,.08);border:1px solid rgba(0,255,178,.2);
  border-radius:10px;padding:1px 8px}

/* ── Position cards ──────────────────────────────────────── */
.pos-list{margin-bottom:8px}
.pos-card{background:var(--s2);border:1px solid var(--bd);border-radius:14px;
  padding:16px;margin-bottom:10px;cursor:pointer;transition:border-color .2s,background .2s;
  animation:fadeUp .35s ease both}
.pos-card:hover{border-color:var(--b2)}
.pos-card.selected{border-color:var(--ac);background:rgba(255,77,0,.025)}
.pos-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.pos-pair{display:flex;align-items:center;gap:10px}
.pair-avs{display:flex;align-items:center}
.av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-family:var(--mo);font-size:10px;font-weight:700;
  overflow:hidden;border:2px solid var(--su);flex-shrink:0}
.av img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.av:not(:first-child){margin-left:-8px}
.pair-name{font-weight:700;font-size:16px}
.share-badge{font-family:var(--mo);font-size:10px;color:var(--gr);
  background:rgba(0,255,178,.08);border:1px solid rgba(0,255,178,.2);
  border-radius:4px;padding:2px 8px}
.pos-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.pos-cell{background:var(--s3);border:1px solid var(--bd);border-radius:9px;padding:10px 12px}
.pc-lbl{font-family:var(--mo);font-size:10px;color:var(--mu);margin-bottom:4px}
.pc-val{font-family:var(--mo);font-size:13px;font-weight:700;color:var(--tx)}
.pc-usd{font-family:var(--mo);font-size:10px;color:var(--mu);margin-top:2px}
.lp-row{font-family:var(--mo);font-size:11px;color:var(--t2);text-align:center;
  padding:8px;background:var(--s3);border:1px solid var(--bd);border-radius:8px;
  margin-bottom:10px}
.lp-row span{color:var(--tx);font-weight:700}
.sel-btn{width:100%;padding:9px;background:transparent;border:1px solid var(--b2);
  border-radius:9px;color:var(--t2);font-family:var(--mo);font-size:11px;cursor:pointer;
  transition:all .15s}
.sel-btn:hover{border-color:var(--ac);color:var(--tx)}
.pos-card.selected .sel-btn{background:rgba(255,77,0,.1);border-color:var(--ac);color:var(--ac)}

/* ── Skeleton loader ─────────────────────────────────────── */
.skel{background:var(--s2);border:1px solid var(--bd);border-radius:14px;
  padding:16px;margin-bottom:10px;animation:shimmer 1.5s ease infinite}
.skel-line{background:var(--bd);border-radius:4px;margin-bottom:8px}

/* ── Empty / manual ──────────────────────────────────────── */
.pos-empty{text-align:center;padding:36px 20px;font-family:var(--mo);font-size:12px;color:var(--mu)}
.pos-empty .icon{font-size:32px;margin-bottom:10px}
.manual-wrap{margin-top:12px;padding:14px 16px;background:var(--s2);border:1px solid var(--bd);
  border-radius:12px}
.manual-lbl{font-family:var(--mo);font-size:10px;color:var(--mu);text-transform:uppercase;
  letter-spacing:1px;margin-bottom:8px}
.manual-inp{width:100%;background:var(--s3);border:1px solid var(--b2);border-radius:8px;
  color:var(--tx);padding:9px 12px;font-family:var(--mo);font-size:12px;outline:none}
.manual-inp:focus{border-color:var(--ac)}
.manual-inp::placeholder{color:var(--mu)}

/* ── Remove panel ────────────────────────────────────────── */
.rm-panel{display:none;background:var(--s2);border:1px solid var(--bd);
  border-radius:14px;padding:18px;margin-top:6px;animation:fadeUp .3s ease both}
.rm-panel.show{display:block}
.rm-hdr{display:flex;align-items:center;gap:10px;padding-bottom:14px;
  border-bottom:1px solid var(--bd);margin-bottom:16px}
.rm-name{font-weight:700;font-size:15px}
.rm-sub{font-family:var(--mo);font-size:10px;color:var(--mu)}
.pct-lbl{font-family:var(--mo);font-size:10px;color:var(--mu);text-transform:uppercase;
  letter-spacing:1px;margin-bottom:10px}
.pct-btns{display:flex;gap:6px;margin-bottom:12px}
.pct-btn{flex:1;padding:8px;background:transparent;border:1px solid var(--b2);
  border-radius:8px;font-family:var(--mo);font-size:11px;color:var(--mu);cursor:pointer;
  text-align:center;transition:all .15s}
.pct-btn:hover{border-color:var(--ac);color:var(--tx)}
.pct-btn.active{background:rgba(255,77,0,.12);border-color:var(--ac);color:var(--ac);font-weight:700}
.pct-disp{text-align:center;font-family:var(--mo);font-size:36px;font-weight:700;
  color:var(--tx);margin:6px 0}
.pct-slider{width:100%;margin:4px 0 16px;accent-color:var(--ac);cursor:pointer}
.recv-lbl{font-family:var(--mo);font-size:10px;color:var(--mu);text-transform:uppercase;
  letter-spacing:1px;margin-bottom:8px}
.recv-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.recv-card{background:var(--s3);border:1px solid var(--bd);border-radius:10px;padding:12px}
.rc-sym{display:flex;align-items:center;gap:6px;font-family:var(--mo);font-size:10px;
  color:var(--mu);margin-bottom:6px}
.rc-av{width:16px;height:16px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-family:var(--mo);font-size:7px;font-weight:700;
  overflow:hidden;flex-shrink:0}
.rc-av img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.rc-amt{font-family:var(--mo);font-size:15px;font-weight:700;color:var(--gr)}
.rc-usd{font-family:var(--mo);font-size:10px;color:var(--mu);margin-top:2px}
.lp-burn{display:flex;justify-content:space-between;align-items:center;
  padding:8px 12px;background:var(--s3);border:1px solid var(--bd);border-radius:8px;
  margin-bottom:14px;font-family:var(--mo);font-size:11px}
.lp-burn-k{color:var(--mu)}.lp-burn-v{color:var(--tx);font-weight:700}
.slip-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.slip-lbl{font-family:var(--mo);font-size:10px;color:var(--mu);text-transform:uppercase;letter-spacing:1px}
.sl-btns{display:flex;gap:4px}
.sl-btn{font-family:var(--mo);font-size:10px;padding:4px 10px;background:transparent;
  border:1px solid var(--b2);border-radius:6px;color:var(--mu);cursor:pointer;transition:all .15s}
.sl-btn:hover{border-color:var(--ac);color:var(--tx)}
.sl-btn.active{background:rgba(255,77,0,.12);border-color:var(--ac);color:var(--ac)}

/* ── Remove button ───────────────────────────────────────── */
.rm-btn{width:100%;padding:16px;border:none;border-radius:12px;
  font-family:var(--sa);font-size:16px;font-weight:800;cursor:pointer;
  transition:all .2s;position:relative;overflow:hidden;
  background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff}
.rm-btn::before{content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.1),transparent);
  opacity:0;transition:opacity .2s}
.rm-btn:hover:not(:disabled)::before{opacity:1}
.rm-btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 8px 24px rgba(255,77,0,.35)}
.rm-btn:disabled{background:var(--s2);color:var(--mu);cursor:not-allowed;transform:none;box-shadow:none}

/* ── Status ──────────────────────────────────────────────── */
.st-box{margin-top:12px;padding:12px 14px;background:var(--s2);border:1px solid var(--bd);
  border-radius:10px;font-family:var(--mo);font-size:11px;color:var(--t2);
  display:flex;align-items:center;gap:8px;min-height:40px;transition:border-color .3s,color .3s}
.st-box.success{border-color:var(--gr);color:var(--gr)}
.st-box.error{border-color:var(--rd);color:var(--rd)}
.st-box.loading{border-color:var(--ac);color:var(--ac)}
.st-box a{color:inherit;text-decoration:underline}
.spinner{width:12px;height:12px;border:2px solid rgba(255,77,0,.2);
  border-top-color:var(--ac);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}

/* ── Success card ────────────────────────────────────────── */
.sc{display:none;background:rgba(0,255,178,.05);border:1px solid rgba(0,255,178,.2);
  border-radius:12px;padding:18px;margin-top:12px;animation:fadeUp .3s ease both}
.sc.show{display:block}
.sc-ttl{font-family:var(--mo);font-size:10px;color:var(--mu);text-transform:uppercase;
  letter-spacing:1px;margin-bottom:10px}
.sc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sc-cell{background:rgba(0,255,178,.05);border:1px solid rgba(0,255,178,.15);
  border-radius:8px;padding:10px}
.sc-lbl{font-family:var(--mo);font-size:10px;color:var(--mu);margin-bottom:3px}
.sc-val{font-family:var(--mo);font-size:14px;font-weight:700;color:var(--gr)}
</style>
</head>
<body>
<div class="card">

  <div class="header">
    <div class="logo"><a href="index.html">Ric<span>Swap</span></a></div>
    <div class="net-pill"><div class="dot"></div>Shibarium</div>
  </div>

  <a class="nav-back" href="liquidity.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" width="12" height="12">
      <polyline points="15 18 9 12 15 6"/>
    </svg>
    Add Liquidity
  </a>

  <button class="w-btn" id="wBtn" onclick="connWallet()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         width="14" height="14">
      <rect x="2" y="7" width="20" height="14" rx="2"/>
      <path d="M16 3H8a2 2 0 00-2 2v2h12V5a2 2 0 00-2-2z"/>
      <circle cx="17" cy="14" r="1.5" fill="currentColor" stroke="none"/>
    </svg>
    <span id="wLbl">Connect Wallet</span>
  </button>

  <!-- Positions -->
  <div class="sec-lbl">
    <span>Your Positions <span class="pos-count" id="posCount" style="display:none"></span></span>
    <button class="refresh-btn" onclick="loadPositions()" title="Refresh">↺ refresh</button>
  </div>
  <div class="pos-list" id="posList">
    <div class="pos-empty" id="posEmpty">
      <div class="icon">💧</div>
      Connect wallet to view your positions
    </div>
  </div>

  <!-- Manual LP input fallback -->
  <div class="manual-wrap" id="manualWrap" style="display:none">
    <div class="manual-lbl">Or enter LP address manually</div>
    <input class="manual-inp" id="manualLP"
           placeholder="0x... Pair contract address"
           oninput="onManualLP()">
  </div>

  <!-- Remove panel -->
  <div class="rm-panel" id="rmPanel">
    <div class="rm-hdr">
      <div class="pair-avs" id="rmAvs"></div>
      <div>
        <div class="rm-name" id="rmName">— / —</div>
        <div class="rm-sub" id="rmSub">LP balance: —</div>
      </div>
    </div>

    <div class="pct-lbl">Amount to Remove</div>
    <div class="pct-btns">
      <button class="pct-btn" onclick="setPct(25,this)">25%</button>
      <button class="pct-btn" onclick="setPct(50,this)">50%</button>
      <button class="pct-btn" onclick="setPct(75,this)">75%</button>
      <button class="pct-btn active" onclick="setPct(100,this)">MAX</button>
    </div>
    <div class="pct-disp" id="pctDisp">100%</div>
    <input type="range" class="pct-slider" id="pctSlider"
           min="1" max="100" value="100" oninput="onSlider()">

    <div class="recv-lbl">You Will Receive</div>
    <div class="recv-grid">
      <div class="recv-card">
        <div class="rc-sym"><div class="rc-av" id="rcAv0"></div><span id="rcSym0">—</span></div>
        <div class="rc-amt" id="rcAmt0">—</div>
        <div class="rc-usd" id="rcUsd0"></div>
      </div>
      <div class="recv-card">
        <div class="rc-sym"><div class="rc-av" id="rcAv1"></div><span id="rcSym1">—</span></div>
        <div class="rc-amt" id="rcAmt1">—</div>
        <div class="rc-usd" id="rcUsd1"></div>
      </div>
    </div>
    <div class="lp-burn">
      <span class="lp-burn-k">LP tokens burned</span>
      <span class="lp-burn-v" id="lpBurnVal">—</span>
    </div>

    <div class="slip-row">
      <span class="slip-lbl">Slippage</span>
      <div class="sl-btns">
        <button class="sl-btn" onclick="setSlip(1,this)">1%</button>
        <button class="sl-btn active" onclick="setSlip(5,this)">5%</button>
        <button class="sl-btn" onclick="setSlip(10,this)">10%</button>
      </div>
    </div>

    <button class="rm-btn" id="rmBtn" onclick="doRemove()">Remove Liquidity</button>
  </div>

  <div class="st-box" id="stBox"><span>○</span><span id="stTxt">Connect wallet to begin</span></div>

  <!-- Success card -->
  <div class="sc" id="scCard">
    <div class="sc-ttl">Removed Successfully ✓</div>
    <div class="sc-grid">
      <div class="sc-cell"><div class="sc-lbl" id="scLbl0">—</div><div class="sc-val" id="scVal0">—</div></div>
      <div class="sc-cell"><div class="sc-lbl" id="scLbl1">—</div><div class="sc-val" id="scVal1">—</div></div>
    </div>
  </div>

</div><!-- /card -->
<script>
// ═══════════════════════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════════════════════
const ROUTER   = "0x652875c0F607CB392C0F9E5FB957A7055c2deD2e";
const FACTORY  = "0xD8fFEECfDE1698a70A26a094afBE917bA58E2F70";
const WBONE    = "0xc76f4c819d820369fb2d7c1531ab3bb18e6fe8d8";
const CHAIN_ID = 109n;
const EXPLORER = "https://shibariumscan.io";
const LOGO_CDN = "https://raw.githubusercontent.com/trustwallet/assets/master/blockchains/shibarium/assets";
const MAX_U112 = 2n ** 112n - 1n;   // overflow guard for uint112

// Known token pairs to check first — avoids scanning all pairs
const KNOWN_TOKENS = [
  { symbol:"BONE",  address:WBONE,  decimals:18, isNative:true,  color:"#ff4d00" },
  { symbol:"WBONE", address:WBONE,  decimals:18, isNative:false, color:"#ff8800" },
  { symbol:"RIC",   address:"0x12C94d3A30daa09f81Ea6c037004E6e99A4A3dfc", decimals:18, isNative:false, color:"#ff4d00" },
  { symbol:"SHIB",  address:"0x495eea66b0f8b636d441dc6a98d8f5c3d455c4c0", decimals:18, isNative:false, color:"#ff6b6b" },
  { symbol:"LEASH", address:"0x53cd0b4b8d92e0c58d5aae2a95e5eeae9cd2c10d", decimals:18, isNative:false, color:"#9b59b6" },
  { symbol:"TREAT", address:"0x3f1ede1feb0fe88b7e30f74a73e3d36ccacd21b2", decimals:18, isNative:false, color:"#e67e22" },
];

// ABIs — minimal, only what's needed
const ERC20   = ["function balanceOf(address) view returns (uint256)","function decimals() view returns (uint8)","function symbol() view returns (string)","function name() view returns (string)","function allowance(address,address) view returns (uint256)","function approve(address,uint256) returns (bool)"];
const PAIR_ABI= ["function token0() view returns (address)","function token1() view returns (address)","function getReserves() view returns (uint112,uint112,uint32)","function totalSupply() view returns (uint256)","function balanceOf(address) view returns (uint256)","function allowance(address,address) view returns (uint256)","function approve(address,uint256) returns (bool)"];
const FAC_ABI = ["function getPair(address,address) view returns (address)","function allPairs(uint256) view returns (address)","function allPairsLength() view returns (uint256)"];
const RABI    = ["function removeLiquidity(address,address,uint256,uint256,uint256,address,uint256) returns (uint256,uint256)","function removeLiquidityETH(address,uint256,uint256,uint256,address,uint256) returns (uint256,uint256)"];

// ═══════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════
let prov, sign, uAddr;
let positions = [];
let selPos    = null;
let rmPct     = 100;
let slipBps   = 500n;       // 5%

// Simple in-memory cache for token info (avoids repeated RPC calls)
const tokenCache = {};

// ═══════════════════════════════════════════════════════════
// FIX 1 — RELIABLE WALLET CONNECT
// Uses eth_requestAccounts first (most reliable cross-wallet pattern)
// Network switch is isolated — wallet connect still succeeds even if switch fails
// ═══════════════════════════════════════════════════════════
async function connWallet() {
  if (!window.ethereum) return alert("Please install MetaMask or Rabby Wallet");
  const btn = document.getElementById("wBtn");
  btn.style.opacity = "0.6";

  try {
    // Step 1: Request accounts — works on all wallets (MetaMask, Rabby, WalletConnect)
    await window.ethereum.request({ method: "eth_requestAccounts" });

    // Step 2: Create provider after accounts confirmed
    prov = new ethers.BrowserProvider(window.ethereum);
    sign = await prov.getSigner();
    uAddr = await sign.getAddress();

    // Step 3: Check network — isolated, does not break connect if fails
    const net = await prov.getNetwork();
    if (net.chainId !== CHAIN_ID) {
      setSt("loading", null, "Switching to Shibarium...");
      try {
        await window.ethereum.request({
          method: "wallet_switchEthereumChain",
          params: [{ chainId: "0x6d" }]
        });
        // Rebuild provider after network switch
        prov = new ethers.BrowserProvider(window.ethereum);
        sign = await prov.getSigner();
        uAddr = await sign.getAddress();
      } catch(switchErr) {
        // Network switch failed — still show as connected but warn
        setSt("warning", "⚠", "Connected but wrong network. Please switch to Shibarium (Chain ID 109).");
        btn.style.opacity = "1";
        return;
      }
    }

    // Step 4: Update UI
    btn.classList.add("con");
    document.getElementById("wLbl").textContent = uAddr.slice(0,6) + "..." + uAddr.slice(-4);

    // Step 5: Event listeners
    window.ethereum.on("accountsChanged", () => location.reload());
    window.ethereum.on("chainChanged",    () => location.reload());

    setSt("", "○", "Wallet connected — loading positions...");
    await loadPositions();

  } catch(e) {
    // User rejected or error
    if (e.code === 4001 || e.code === "ACTION_REJECTED") {
      setSt("error", "✕", "Connection rejected — please approve in your wallet");
    } else {
      setSt("error", "✕", decErr(e));
    }
  } finally {
    btn.style.opacity = "1";
  }
}

// ═══════════════════════════════════════════════════════════
// FIX 2 — FAST POSITION DISCOVERY
// Strategy: check known token pairs first (5-6 calls) before
// falling back to allPairs loop. 10x faster on average.
// ═══════════════════════════════════════════════════════════
async function loadPositions() {
  if (!uAddr || !prov) return;

  showSkeletons();
  document.getElementById("scCard").classList.remove("show");
  document.getElementById("rmPanel").classList.remove("show");
  selPos = null;
  positions = [];

  try {
    const factory = new ethers.Contract(FACTORY, FAC_ABI, prov);
    const found   = [];

    // ── Pass 1: Check all combinations of known tokens (fast, ~15 calls) ──
    const knownAddrs = [...new Set(KNOWN_TOKENS.map(t => t.address.toLowerCase()))];
    const pairChecks = [];
    for (let i = 0; i < knownAddrs.length; i++) {
      for (let j = i + 1; j < knownAddrs.length; j++) {
        pairChecks.push(
          factory.getPair(knownAddrs[i], knownAddrs[j]).catch(() => null)
        );
      }
    }
    const knownPairs = await Promise.all(pairChecks);
    const activePairs = knownPairs.filter(
      a => a && a !== "0x0000000000000000000000000000000000000000"
    );

    // ── Pass 2: Check allPairs for any remaining (capped at 100) ──
    let total = 0;
    try { total = Number(await factory.allPairsLength()); } catch(_) {}
    const cap = Math.min(total, 100);

    const allPairAddrs = await Promise.all(
      Array.from({ length: cap }, (_, i) => factory.allPairs(i).catch(() => null))
    );
    const allValid = allPairAddrs.filter(Boolean);

    // Merge, deduplicate
    const seen = new Set(activePairs.map(a => a.toLowerCase()));
    for (const a of allValid) {
      if (!seen.has(a.toLowerCase())) { activePairs.push(a); seen.add(a.toLowerCase()); }
    }

    // ── Check LP balance for each pair in parallel ──
    const results = await Promise.allSettled(
      activePairs.map(addr => checkPosition(addr))
    );
    positions = results
      .filter(r => r.status === "fulfilled" && r.value)
      .map(r => r.value);

    renderPositions();

    if (total > 100) {
      setSt("warning","⚠",`Showing first 100 pairs. ${total-100} pairs not scanned. Use manual input below if your position is missing.`);
      document.getElementById("manualWrap").style.display = "block";
    } else if (!positions.length) {
      setSt("","○","No positions found. Add liquidity first or enter LP address manually.");
      document.getElementById("manualWrap").style.display = "block";
    } else {
      setSt("","○",`${positions.length} position${positions.length>1?"s":""} found`);
    }

  } catch(e) {
    clearSkeletons();
    setSt("error","✕","Error loading positions: " + decErr(e));
    document.getElementById("manualWrap").style.display = "block";
  }
}

async function checkPosition(addr) {
  if (!addr) return null;
  try {
    const pair = new ethers.Contract(addr, PAIR_ABI, prov);
    const bal  = await pair.balanceOf(uAddr);
    if (bal === 0n) return null;

    // Batch all reads in one Promise.all
    const [t0a, t1a, res, ts] = await Promise.all([
      pair.token0(),
      pair.token1(),
      pair.getReserves(),
      pair.totalSupply(),
    ]);

    if (ts === 0n) return null; // empty pool guard

    const [t0, t1] = await Promise.all([
      getTokenInfo(t0a),
      getTokenInfo(t1a),
    ]);

    // ── FIX 3: Overflow-safe share calculation ──
    // Use mulDiv pattern: (bal * res) / ts — but guard against uint112 overflow
    const safeR0 = res[0] > MAX_U112 ? MAX_U112 : res[0];
    const safeR1 = res[1] > MAX_U112 ? MAX_U112 : res[1];

    const amt0     = ts > 0n ? safeR0 * bal / ts : 0n;
    const amt1     = ts > 0n ? safeR1 * bal / ts : 0n;
    const sharePct = ts > 0n ? Number(bal * 10000n / ts) / 100 : 0;

    return { addr, pair, t0, t1, bal, totalSupply:ts, amt0, amt1, reserves:res, sharePct };
  } catch(_) { return null; }
}

// ═══════════════════════════════════════════════════════════
// TOKEN INFO — cached to avoid repeated RPC calls
// ═══════════════════════════════════════════════════════════
async function getTokenInfo(addr) {
  const key = addr.toLowerCase();
  if (tokenCache[key]) return tokenCache[key];

  // Check known list first
  const known = KNOWN_TOKENS.find(t => t.address.toLowerCase() === key);
  if (known) { tokenCache[key] = known; return known; }

  // WBONE → show as BONE
  if (key === WBONE.toLowerCase()) {
    const t = { symbol:"BONE", address:addr, decimals:18, isNative:true, color:"#ff4d00" };
    tokenCache[key] = t; return t;
  }

  try {
    const c = new ethers.Contract(addr, ERC20, prov);
    const [dec, sym] = await Promise.all([
      c.decimals().catch(()=>18),
      c.symbol().catch(async()=>{ try{return await c.name()}catch{return addr.slice(0,6)+"..."} }),
    ]);
    const t = { symbol:sym, address:addr, decimals:dec, isNative:false, color:"#555880" };
    tokenCache[key] = t;
    return t;
  } catch(_) {
    return { symbol:addr.slice(0,6)+"...", address:addr, decimals:18, isNative:false, color:"#555880" };
  }
}

// ═══════════════════════════════════════════════════════════
// REMOVE LIQUIDITY
// ═══════════════════════════════════════════════════════════
async function doRemove() {
  if (!selPos) return;
  const btn = document.getElementById("rmBtn");
  btn.disabled = true;
  document.getElementById("scCard").classList.remove("show");

  const { bal, totalSupply, amt0, amt1, t0, t1, addr, pair } = selPos;

  // ── FIX 3: Pre-compute amounts with overflow guards ──
  if (totalSupply === 0n) {
    setSt("error","✕","Pool total supply is zero");
    btn.disabled = false; return;
  }

  const pctBig   = BigInt(rmPct);
  const lpBurn   = bal * pctBig / 100n;

  // Validate lpBurn does not exceed balance
  if (lpBurn === 0n) {
    setSt("error","✕","Amount too small — increase percentage");
    btn.disabled = false; return;
  }
  if (lpBurn > bal) {
    setSt("error","✕","LP burn exceeds balance");
    btn.disabled = false; return;
  }

  // Expected token amounts from reserves
  const exp0 = amt0 * pctBig / 100n;
  const exp1 = amt1 * pctBig / 100n;

  // Apply slippage to get minimums
  const min0 = exp0 * (10000n - slipBps) / 10000n;
  const min1 = exp1 * (10000n - slipBps) / 10000n;

  const router   = new ethers.Contract(ROUTER, RABI, sign);
  const deadline = BigInt(Math.floor(Date.now() / 1000) + 300); // 5 min
  const t0addr   = t0.address;
  const t1addr   = t1.address;
  const t0isETH  = t0addr.toLowerCase() === WBONE.toLowerCase();
  const t1isETH  = t1addr.toLowerCase() === WBONE.toLowerCase();
  const hasETH   = t0isETH || t1isETH;

  try {
    // Step 1: Approve LP
    setSt("loading", null, "Approving LP tokens...");
    const allow = await pair.allowance(uAddr, ROUTER);
    if (allow < lpBurn) {
      const appTx = await new ethers.Contract(addr, ERC20, sign).approve(ROUTER, lpBurn);
      setSt("loading", null, "Waiting for approval...");
      await appTx.wait();
    }

    // Step 2: Simulate — catches revert before spending gas
    setSt("loading", null, "Simulating...");
    try {
      if (hasETH) {
        const tokAddr = t0isETH ? t1addr : t0addr;
        const tokMin  = t0isETH ? min1   : min0;
        const ethMin  = t0isETH ? min0   : min1;
        await router.removeLiquidityETH.staticCall(
          tokAddr, lpBurn, tokMin, ethMin, uAddr, deadline
        );
      } else {
        await router.removeLiquidity.staticCall(
          t0addr, t1addr, lpBurn, min0, min1, uAddr, deadline
        );
      }
    } catch(simErr) {
      throw new Error("Simulation failed: " + decErr(simErr));
    }

    // Step 3: Send
    setSt("loading", null, "Confirm in wallet...");
    btn.textContent = "Confirming...";
    let tx;
    if (hasETH) {
      const tokAddr = t0isETH ? t1addr : t0addr;
      const tokMin  = t0isETH ? min1   : min0;
      const ethMin  = t0isETH ? min0   : min1;
      tx = await router.removeLiquidityETH(tokAddr, lpBurn, tokMin, ethMin, uAddr, deadline);
    } else {
      tx = await router.removeLiquidity(t0addr, t1addr, lpBurn, min0, min1, uAddr, deadline);
    }

    setSt("loading", null, "Confirming on chain...");
    const receipt = await tx.wait();

    // Parse actual received amounts from Transfer events
    let rcv0final = exp0, rcv1final = exp1;
    try {
      const topic = ethers.id("Transfer(address,address,uint256)");
      const toHex = uAddr.toLowerCase();
      for (const log of receipt.logs) {
        if (log.topics[0] === topic && log.topics.length === 3) {
          const to = "0x" + log.topics[2].slice(26);
          if (to.toLowerCase() === toHex) {
            const addr_  = log.address.toLowerCase();
            const amount = BigInt(log.data);
            if (addr_ === t0addr.toLowerCase()) rcv0final = amount;
            if (addr_ === t1addr.toLowerCase()) rcv1final = amount;
          }
        }
      }
    } catch(_) {}

    // Show success
    document.getElementById("scLbl0").textContent = t0.symbol + " received";
    document.getElementById("scVal0").textContent = formatAmt(rcv0final, t0.decimals);
    document.getElementById("scLbl1").textContent = t1.symbol + " received";
    document.getElementById("scVal1").textContent = formatAmt(rcv1final, t1.decimals);
    document.getElementById("scCard").classList.add("show");

    setSt("success","✓",
      `Removed! ${formatAmt(rcv0final,t0.decimals)} ${t0.symbol} + ${formatAmt(rcv1final,t1.decimals)} ${t1.symbol}` +
      ` <a href="${EXPLORER}/tx/${tx.hash}" target="_blank">View ↗</a>`
    );

    // Reload positions
    selPos = null;
    document.getElementById("rmPanel").classList.remove("show");
    await loadPositions();

  } catch(e) {
    setSt("error","✕", decErr(e));
  } finally {
    btn.disabled = false;
    btn.textContent = "Remove Liquidity";
  }
}

// ═══════════════════════════════════════════════════════════
// FIX 4 — FULL ERROR DECODER
// Handles hex revert data, panic codes (including overflow=17),
// user rejection, and missing revert data from Shibarium RPC
// ═══════════════════════════════════════════════════════════
function decErr(e) {
  if (!e) return "Unknown error";
  if (e.reason)        return e.reason;
  if (e.shortMessage)  return e.shortMessage;
  if (e.error?.reason) return e.error.reason;

  const data = e?.data || e?.error?.data || e?.error?.error?.data || e?.info?.error?.data;

  // Error(string) — 0x08c379a0
  if (typeof data === "string" && data.startsWith("0x08c379a0")) {
    try { return ethers.AbiCoder.defaultAbiCoder().decode(["string"],"0x"+data.slice(10))[0]; }
    catch(_) {}
  }

  // Panic codes — 0x4e487b71
  if (typeof data === "string" && data.startsWith("0x4e487b71")) {
    try {
      const code = Number(ethers.AbiCoder.defaultAbiCoder().decode(["uint256"],"0x"+data.slice(10))[0]);
      const msgs = {
        1:"Assertion failed", 11:"Arithmetic overflow — try a smaller amount or increase slippage",
        12:"Division by zero — pool may be empty", 17:"Enum conversion error",
        22:"Array index out of bounds", 32:"Zero-initialised variable"
      };
      return "Contract error: " + (msgs[code] || "Panic code " + code);
    } catch(_) {}
  }

  if (e.code === 4001 || e.code === "ACTION_REJECTED") return "Transaction rejected by user";

  const raw = e.message || String(e);
  const m1  = raw.match(/reason="([^"]+)"/);
  if (m1) return m1[1];
  const m2  = raw.match(/reverted with reason string '([^']+)'/);
  if (m2) return m2[1];

  // Arithmetic overflow in raw message
  if (raw.includes("overflow") || raw.includes("OVERFLOW"))
    return "Arithmetic overflow — try removing a smaller amount";

  return raw
    .replace("missing revert data", "Transaction reverted — try increasing slippage or reducing amount")
    .slice(0, 200);
}

// ═══════════════════════════════════════════════════════════
// FIX 5 — CLEAN HELPERS (single responsibility, no duplication)
// ═══════════════════════════════════════════════════════════

// Precision-safe formatter — stays in BigInt until final display
function formatAmt(value, decimals) {
  if (value === undefined || value === null) return "—";
  const s = ethers.formatUnits(value, decimals);
  const n = parseFloat(s);
  if (n === 0)       return "0";
  if (n < 0.000001)  return "< 0.000001";
  if (n < 0.001)     return n.toFixed(8);
  if (n < 1)         return n.toFixed(6);
  if (n < 10000)     return n.toFixed(4);
  return n.toLocaleString(undefined, { maximumFractionDigits: 2 });
}

// Status box — textContent for errors (XSS safe), innerHTML only for success links
function setSt(type, icon, msg) {
  const box  = document.getElementById("stBox");
  const text = document.getElementById("stTxt");
  box.className = "st-box" + (type ? " " + type : "");
  const old = box.querySelector(".sp-ic,.spinner");
  if (old) old.remove();
  const el = document.createElement(type === "loading" ? "div" : "span");
  el.className = type === "loading" ? "spinner" : "sp-ic";
  if (type !== "loading" && icon) el.textContent = icon;
  box.insertBefore(el, text);
  if (type === "success") text.innerHTML  = msg;
  else                    text.textContent = msg;
}

// ═══════════════════════════════════════════════════════════
// AUTO-RECONNECT ON PAGE LOAD (silent, no prompt)
// ═══════════════════════════════════════════════════════════
(async () => {
  if (window.ethereum) {
    try {
      const accs = await window.ethereum.request({ method: "eth_accounts" });
      if (accs.length > 0) connWallet();
    } catch(_) {}
  }
})();
</script>
