<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RicSwap | Remove Liquidity</title>
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#04050f;--su:#0b0d1f;--s2:#111328;--bd:#1e2040;--b2:#2a2d55;
      --ac:#ff4d00;--ac2:#ff8c00;--gr:#00ffb2;--rd:#ff3366;--yw:#ffd84a;
      --tx:#d8daf5;--t2:#8385a8;--mu:#555880;--mo:'Space Mono',monospace;--sa:'Syne',sans-serif
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--tx);font-family:var(--sa);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(255,77,0,.025)1px,transparent 1px),linear-gradient(90deg,rgba(255,77,0,.025)1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0}
    .card{position:relative;z-index:1;width:100%;max-width:560px;background:var(--su);border:1px solid var(--bd);border-radius:20px;padding:32px;box-shadow:0 32px 64px rgba(0,0,0,.6)}
    .header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
    .logo{font-weight:800;font-size:22px;letter-spacing:-0.5px}.logo span{color:var(--ac)}
    .net-pill{display:flex;align-items:center;gap:6px;background:rgba(0,255,178,.07);border:1px solid rgba(0,255,178,.18);border-radius:20px;padding:5px 12px;font-family:var(--mo);font-size:11px;color:var(--gr)}
    .dot{width:6px;height:6px;background:var(--gr);border-radius:50%;animation:pulse 2s infinite}
    @keyframes pulse{50%{opacity:0.3}}
    .wallet-btn{width:100%;padding:13px;background:transparent;border:1px solid var(--b2);border-radius:12px;color:var(--t2);font-family:var(--mo);font-size:13px;display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:24px;transition:all .2s}
    .wallet-btn:hover{border-color:var(--ac);color:var(--tx)}
    .wallet-btn.con{border-color:var(--gr);color:var(--gr);background:rgba(0,255,178,.05)}
    .tabs{display:flex;background:var(--s2);border-radius:12px;padding:4px;margin-bottom:24px}
    .tab{flex:1;padding:11px;text-align:center;border-radius:10px;cursor:pointer;font-family:var(--mo);font-size:13px}
    .tab.active{background:var(--su);color:var(--tx);font-weight:700}
    .lp-card{background:var(--s2);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:20px}
    .percent-btns{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap}
    .pct-btn{padding:8px 18px;background:transparent;border:1px solid var(--b2);border-radius:8px;font-family:var(--mo);font-size:13px;cursor:pointer;transition:all .2s}
    .pct-btn.active{background:rgba(255,77,0,.15);border-color:var(--ac);color:var(--ac)}
    .receive-box{background:var(--s2);border:1px solid var(--bd);border-radius:12px;padding:16px;margin:20px 0}
    .receive-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--bd)}
    .receive-row:last-child{border:none}
    .remove-btn{width:100%;padding:18px;background:linear-gradient(135deg,#ff3366,#ff6b6b);border:none;border-radius:12px;color:#fff;font-size:17px;font-weight:800;cursor:pointer;transition:all .2s}
    .remove-btn:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(255,51,102,.5)}
    .status-box{margin-top:20px;padding:14px 16px;background:var(--s2);border:1px solid var(--bd);border-radius:10px;font-family:var(--mo);font-size:12px;min-height:52px;display:flex;align-items:center;gap:10px}
    .status-box.success{border-color:var(--gr);color:var(--gr)}
    .status-box.error{border-color:var(--rd);color:var(--rd)}
    .status-box.loading{border-color:var(--ac);color:var(--ac)}
    .spinner{width:16px;height:16px;border:2px solid rgba(255,77,0,.2);border-top-color:var(--ac);border-radius:50%;animation:spin .7s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="logo">Ric<span>Swap</span></div>
    <div class="net-pill"><div class="dot"></div>Shibarium</div>
  </div>

  <button class="wallet-btn" id="walletBtn" onclick="connectWallet()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 3H8a2 2 0 00-2 2v2h12V5a2 2 0 00-2-2z"/></svg>
    <span id="walletLabel">Connect Wallet</span>
  </button>

  <div class="tabs">
    <div class="tab active" onclick="switchTab(0)">Remove Liquidity</div>
    <div class="tab" onclick="switchTab(1)">My Positions</div>
  </div>

  <div id="tab0">
    <div class="lp-card">
      <div class="section-title">LP Token Address</div>
      <input class="addr-input" id="lpAddress" placeholder="0x... LP Token Address" oninput="loadLPInfo()">
      
      <input class="amount-input" id="lpAmount" type="number" placeholder="0.0" oninput="updatePreview()">
      
      <div class="percent-btns">
        <button class="pct-btn" onclick="setPercent(25)">25%</button>
        <button class="pct-btn" onclick="setPercent(50)">50%</button>
        <button class="pct-btn" onclick="setPercent(75)">75%</button>
        <button class="pct-btn active" onclick="setPercent(100)">MAX</button>
      </div>
      <div id="lpBalance" style="margin-top:8px;font-size:12px;color:var(--t2)">Balance: —</div>
    </div>

    <div class="section-title">You Will Receive</div>
    <div class="receive-box" id="receiveBox">
      <div class="receive-row"><span id="tokenAName">Token A</span><span id="amtA">0.0000</span></div>
      <div class="receive-row"><span id="tokenBName">Token B</span><span id="amtB">0.0000</span></div>
    </div>

    <button class="remove-btn" id="removeBtn" onclick="removeLiquidity()">REMOVE LIQUIDITY</button>
  </div>

  <div id="tab1" style="display:none">
    <div class="section-title">Your Liquidity Positions</div>
    <div id="positionsList">Connect wallet to load positions</div>
  </div>

  <div class="status-box" id="statusBox">
    <span id="statusIcon">○</span>
    <span id="statusText">Ready</span>
  </div>
</div>

<script>
const CONFIG = {
  ROUTER: "0x652875c0F607CB392C0F9E5FB957A7055c2deD2e",
  FACTORY: "0xD8fFEECfDE1698a70A26a094afBE917bA58E2F70",
  CHAIN_ID: 109,
  RPC: "https://rpc.shibarium.shib.io"
};

let provider, signer, userAddress;
let currentLP = null;

async function connectWallet() {
  if (!window.ethereum) return alert("Please install MetaMask or Rabby Wallet");

  try {
    provider = new ethers.BrowserProvider(window.ethereum);
    signer = await provider.getSigner();

    const network = await provider.getNetwork();
    
    if (network.chainId !== BigInt(CONFIG.CHAIN_ID)) {
      setStatus("loading", "Switching to Shibarium...");
      await window.ethereum.request({
        method: "wallet_switchEthereumChain",
        params: [{ chainId: "0x6d" }]
      });
      // Refresh provider after switch
      provider = new ethers.BrowserProvider(window.ethereum);
      signer = await provider.getSigner();
    }

    userAddress = await signer.getAddress();
    
    document.getElementById("walletBtn").classList.add("con");
    document.getElementById("walletLabel").textContent = userAddress.slice(0,6) + "..." + userAddress.slice(-4);
    
    setStatus("", "Wallet connected successfully");
    
  } catch (e) {
    console.error(e);
    setStatus("error", "Failed to connect wallet. Please try again.");
  }
}

function switchTab(n) {
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', i===n));
  document.getElementById('tab0').style.display = n===0 ? 'block' : 'none';
  document.getElementById('tab1').style.display = n===1 ? 'block' : 'none';
}

// ... (rest of the functions remain the same as previous version)
async function loadLPInfo() { /* same as before */ }
function setPercent(pct) { /* same */ }
function updatePreview() { /* same */ }

async function removeLiquidity() {
  if (!currentLP) return setStatus("error", "Enter valid LP address");
  const amountStr = document.getElementById("lpAmount").value.trim();
  if (!amountStr || parseFloat(amountStr) <= 0) return setStatus("error", "Enter amount");

  setStatus("loading", "Removing Liquidity...");

  try {
    const router = new ethers.Contract(CONFIG.ROUTER, [
      "function removeLiquidity(address tokenA,address tokenB,uint256 liquidity,uint256 amountAMin,uint256 amountBMin,address to,uint256 deadline) external returns (uint256,uint256)"
    ], signer);

    const liquidity = ethers.parseUnits(amountStr, 18);
    const deadline = BigInt(Math.floor(Date.now() / 1000) + 600);
    const minAmount = liquidity / 1000n;   // Safe minimum

    const tx = await router.removeLiquidity(
      currentLP.token0,
      currentLP.token1,
      liquidity,
      minAmount,
      minAmount,
      userAddress,
      deadline
    );

    setStatus("loading", `Waiting... ${tx.hash.slice(0,10)}...`);
    await tx.wait();

    setStatus("success", `✅ Successfully removed!<br><a href="https://shibariumscan.io/tx/${tx.hash}" target="_blank" style="color:var(--gr)">View Tx ↗</a>`);
  } catch(e) {
    console.error(e);
    let msg = e.reason || e.message || "Transaction failed";
    if (msg.includes("OVERFLOW") || msg.includes("panic")) {
      msg = "Overflow — try a much smaller amount";
    }
    setStatus("error", msg);
  }
}

function setStatus(type, msg) {
  const box = document.getElementById("statusBox");
  box.className = "status-box" + (type ? " " + type : "");
  document.getElementById("statusText").innerHTML = msg;
}
</script>
</body>
</html>
