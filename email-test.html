<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmailJS Test</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>
<body>
    <h1>EmailJS Pure Test</h1>
    <button onclick="testEmail()" style="padding:20px 40px; font-size:18px;">Send Test Email</button>

    <script>
        emailjs.init("Y5GsSScYku74Bt0LH");

        function testEmail() {
            const email = prompt("Enter your email:");
            if (!email) return;

            console.log("Sending to:", email);

            emailjs.send("service_577894p", "template_zga1woa", {
                to_email: email,
                product_name: "Test Hoodie",
                amount_ric: "2500",
                shipping_address: "Test Address",
                tx_hash: "0xTest123456"
            })
            .then(() => alert("✅ Sent! Check inbox & spam"))
            .catch(err => {
                console.error("Full Error:", err);
                alert("Failed - Check console (F12)");
            });
        }
    </script>
</body>
</html>
