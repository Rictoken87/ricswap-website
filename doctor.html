<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Router Doctor</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
    <style>
        body { background: #111; color: #eee; font-family: monospace; padding: 40px; text-align: center; }
        .box { background: #222; padding: 20px; border: 1px solid #444; max-width: 500px; margin: 0 auto; border-radius: 10px; }
        button { padding: 15px; background: #ff4d00; color: white; border: none; font-weight: bold; cursor: pointer; width: 100%; margin-top: 20px; }
        .val { color: #00ff88; font-size: 14px; word-break: break-all; margin-top: 5px; display: block; }
        .err { color: #ff4444; }
    </style>
</head>
<body>
    <div class="box">
        <h2>🩺 Router Diagnostic</h2>
        <p>Target: 0xcfBF0917F2fCDC4F5170aC991fa26F2Bc3da9Fd4</p>
        
        <div style="text-align:left; margin-top:20px;">
            <p>1. FACTORY Variable: <span id="fact" class="val">Waiting...</span></p>
            <p>2. WETH/WBONE Variable: <span id="weth" class="val">Waiting...</span></p>
            <p>3. Code Check: <span id="code" class="val">Waiting...</span></p>
        </div>

        <button onclick="diagnose()">RUN DIAGNOSIS</button>
        <div id="status" style="margin-top:15px;"></div>
    </div>

<script>
    const ROUTER = "0xcfBF0917F2fCDC4F5170aC991fa26F2Bc3da9Fd4";
    const RPC = "https://rpc.shibarium.shib.io";

    const ABI = [
        "function factory() view returns (address)",
        "function WETH() view returns (address)",
        "function weth() view returns (address)" // Try lowercase too
    ];

    async function diagnose() {
        const status = document.getElementById("status");
        status.innerText = "Connecting to Shibarium...";
        
        try {
            const provider = new ethers.JsonRpcProvider(RPC);
            
            // 1. Check if contract exists
            const code = await provider.getCode(ROUTER);
            if(code === "0x") {
                document.getElementById("code").innerText = "❌ NO CONTRACT FOUND (EOA)";
                document.getElementById("code").className = "val err";
                return status.innerText = "CRITICAL: This address is empty.";
            } else {
                document.getElementById("code").innerText = "✅ Contract Exists (" + code.length + " bytes)";
            }

            // 2. Read Variables
            const router = new ethers.Contract(ROUTER, ABI, provider);
            
            try {
                const f = await router.factory();
                document.getElementById("fact").innerText = f;
                if(f === "0x0000000000000000000000000000000000000000") {
                     document.getElementById("fact").className = "val err";
                     status.innerHTML = "<b style='color:red'>FATAL: Factory is Zero Address. Router needs Redeploy.</b>";
                }
            } catch(e) {
                document.getElementById("fact").innerText = "❌ REVERT (Function missing?)";
                document.getElementById("fact").className = "val err";
            }

            try {
                const w = await router.WETH().catch(() => router.weth()); // Try both cases
                document.getElementById("weth").innerText = w;
            } catch(e) {
                document.getElementById("weth").innerText = "❌ REVERT";
                document.getElementById("weth").className = "val err";
            }

            if(status.innerText.includes("FATAL")) return;
            status.innerText = "Diagnosis Complete.";

        } catch(e) {
            status.innerText = "Network Error: " + e.message;
        }
    }
</script>
</body>
</html>
