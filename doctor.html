<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RicSwap • Pair Detective</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
    <style>
        body { background: #111; color: #fff; font-family: monospace; padding: 40px; }
        input { background: #222; border: 1px solid #444; color: #0f0; padding: 10px; width: 400px; }
        button { padding: 10px 20px; cursor: pointer; font-weight: bold; }
        .box { border: 1px solid #333; padding: 20px; margin-top: 20px; border-radius: 8px; }
        .label { color: #888; font-size: 12px; }
        .val { font-size: 16px; color: #ffd700; margin-bottom: 10px; display: block; }
        .error { color: #ff4444; }
        .success { color: #00ff88; }
    </style>
</head>
<body>

    <h2>🕵️ Pair Detective</h2>
    <p>Paste the "Invisible" LP Address below to trace its origin.</p>
    
    <input id="pairInput" value="0x5f2dDDB082cC8f5BE3A1279F1B0DD8870e81FA56" placeholder="0x...">
    <button onclick="investigate()">Investigate</button>

    <div id="report" class="box" style="display:none">
        <span class="label">PAIR ADDRESS</span>
        <span class="val" id="pAddr"></span>

        <span class="label">TOKEN 0</span>
        <span class="val" id="t0"></span>

        <span class="label">TOKEN 1</span>
        <span class="val" id="t1"></span>

        <hr style="border-color:#333">

        <span class="label">PARENT FACTORY (The Creator)</span>
        <span class="val" id="creator"></span>

        <div id="verdict" style="margin-top:20px; font-weight:bold;"></div>
    </div>

    <script>
        // YOUR FACTORIES (Copy from pools.html)
        const MY_FACTORIES = [
            "0x78ae5cCD2f13D10aE3fF47F8418A79D99B4569d0", 
            "0xD8fFEECfDE1698a70A26a094afBE917bA58E2F70"
        ].map(x => x.toLowerCase());

        const PAIR_ABI = [
            "function factory() view returns (address)",
            "function token0() view returns (address)",
            "function token1() view returns (address)"
        ];

        async function investigate() {
            const addr = document.getElementById("pairInput").value.trim();
            const report = document.getElementById("report");
            const verdict = document.getElementById("verdict");
            
            report.style.display = "block";
            verdict.innerHTML = "Scanning...";

            if (!window.ethereum) return alert("No Wallet Found");
            const provider = new ethers.BrowserProvider(window.ethereum);

            try {
                const pair = new ethers.Contract(addr, PAIR_ABI, provider);
                
                // 1. Trace the Factory
                const factoryAddr = await pair.factory();
                const t0 = await pair.token0();
                const t1 = await pair.token1();

                document.getElementById("pAddr").innerText = addr;
                document.getElementById("t0").innerText = t0;
                document.getElementById("t1").innerText = t1;
                document.getElementById("creator").innerText = factoryAddr;

                // 2. Compare with YOUR list
                if (MY_FACTORIES.includes(factoryAddr.toLowerCase())) {
                    verdict.innerHTML = `<span class="success">✅ GOOD NEWS: This pair IS managed by your factories.<br>Reason for missing: Check if your loop limit is too small or RPC is lagging.</span>`;
                } else {
                    verdict.innerHTML = `<span class="error">❌ CASE SOLVED: This pair belongs to a different Factory.<br>Your Pools page scans Factory ending in ...${MY_FACTORIES[0].slice(-4)} and ...${MY_FACTORIES[1].slice(-4)}.<br>But this pair belongs to: ${factoryAddr}.<br><br>Solution: Add ${factoryAddr} to your FACTORY_ADDRESSES list in pools.html.</span>`;
                }

            } catch (e) {
                console.error(e);
                verdict.innerHTML = `<span class="error">💀 DEAD END: This address is NOT a Uniswap V2 Pair.<br>It might be a wallet, a token, or a V3 pool.<br>Error: ${e.message}</span>`;
            }
        }
    </script>
</body>
</html>
