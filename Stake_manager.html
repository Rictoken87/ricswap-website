<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RicPaymaster Stake Manager</title>
<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
<style>
:root{--bg:#04050f;--su:#0b0d1f;--s2:#111328;--bd:#1e2040;--b2:#2a2d55;
  --ac:#ff4d00;--gr:#00ffb2;--rd:#ff3366;--yw:#ffd84a;
  --tx:#d8daf5;--t2:#8385a8;--mu:#555880;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:'Segoe UI',sans-serif;
  min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:32px 20px}
.card{width:100%;max-width:520px;background:var(--su);border:1px solid var(--bd);
  border-radius:16px;padding:28px;box-shadow:0 32px 64px rgba(0,0,0,.6)}
h1{font-size:20px;font-weight:700;margin-bottom:4px}
h1 span{color:var(--ac)}
.sub{font-size:12px;color:var(--t2);margin-bottom:20px}
.addr{font-family:monospace;font-size:11px;color:var(--gr);background:var(--s2);
  border:1px solid var(--bd);border-radius:8px;padding:8px 12px;
  word-break:break-all;margin-bottom:8px}
hr{border:none;border-top:1px solid var(--bd);margin:16px 0}
.btn{width:100%;padding:14px;border:none;border-radius:10px;cursor:pointer;
  font-size:14px;font-weight:700;margin-bottom:8px;transition:all .2s}
.btn:disabled{background:var(--s2);color:var(--mu);cursor:not-allowed}
.btn-connect{background:transparent;border:1px solid var(--b2);color:var(--t2)}
.btn-connect:hover:not(:disabled){border-color:var(--ac);color:var(--tx)}
.btn-auto{background:linear-gradient(135deg,#9b59b6,#6c3483);color:#fff}
.btn-auto:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 8px 24px rgba(155,89,182,.4)}
.btn-manual{background:linear-gradient(135deg,#ff4d00,#ff8c00);color:#fff;margin-top:4px}
.btn-manual:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 8px 24px rgba(255,77,0,.4)}
.field{margin-bottom:12px}
label{display:block;font-size:10px;font-family:monospace;color:var(--mu);
  text-transform:uppercase;letter-spacing:1px;margin-bottom:5px}
.row{display:flex;gap:8px}
input[type=number]{flex:1;background:var(--s2);border:1px solid var(--b2);
  border-radius:8px;color:var(--tx);padding:10px 12px;font-family:monospace;font-size:14px;outline:none}
input[type=number]:focus{border-color:var(--ac)}
.unit{background:var(--s2);border:1px solid var(--b2);border-radius:8px;
  padding:10px 12px;font-family:monospace;font-size:12px;color:var(--t2);white-space:nowrap}
.st{margin-top:12px;padding:12px 14px;background:var(--s2);border:1px solid var(--bd);
  border-radius:10px;font-family:monospace;font-size:11px;color:var(--t2);
  min-height:44px;line-height:1.7;word-break:break-all}
.st.ok{border-color:var(--gr);color:var(--gr)}
.st.err{border-color:var(--rd);color:var(--rd)}
.st.warn{border-color:var(--yw);color:var(--yw)}
.st.loading{border-color:var(--ac);color:var(--ac)}
.log{margin-top:10px;background:var(--s2);border:1px solid var(--bd);border-radius:8px;
  padding:10px 12px;font-family:monospace;font-size:10px;color:var(--mu);
  max-height:180px;overflow-y:auto;display:none;line-height:1.8}
.log.show{display:block}
.log-line{padding:1px 0}
.log-line.ok{color:var(--gr)}
.log-line.err{color:var(--rd)}
.log-line.info{color:var(--t2)}
</style>
</head>
<body>
<div class="card">
  <h1>Ric<span>Paymaster</span> Stake</h1>
  <p class="sub">Auto-finds correct delay by simulation. No RPC reads needed.</p>

  <div class="addr">RicPaymaster: 0xeBb6F86CBc6841D074E72d317b8C5ad922ec35c4</div>
  <div class="addr">EntryPoint:   0x5FF137D4b0FDCD49DcA30c7CF57E578a026d2789</div>

  <hr>
  <button class="btn btn-connect" id="connectBtn" onclick="connectWallet()">Connect MetaMask</button>
  <hr>

  <div class="field">
    <label>BONE Amount to Stake</label>
    <div class="row">
      <input type="number" id="stakeAmt" value="5" min="0.1" step="0.1">
      <div class="unit">BONE</div>
    </div>
  </div>

  <!-- AUTO: tries delays 86400, 172800, 604800, 31536000 -->
  <button class="btn btn-auto" id="autoBtn" onclick="autoStake()" disabled>
    Auto-Stake (finds correct delay automatically)
  </button>

  <!-- MANUAL: if you know the delay -->
  <div class="field" style="margin-top:8px">
    <label>Manual Delay Override (seconds)</label>
    <div class="row">
      <input type="number" id="manualDelay" value="86400">
      <div class="unit">sec</div>
    </div>
  </div>
  <button class="btn btn-manual" id="manualBtn" onclick="manualStake()" disabled>
    Manual Stake with Above Delay
  </button>

  <div class="st" id="st">Connect wallet to begin</div>

  <div class="log" id="log"></div>
</div>

<script>
var RICPAYMASTER = "0xeBb6F86CBc6841D074E72d317b8C5ad922ec35c4";
var CHAIN_HEX    = "0x6d";
var CHAIN_ID_NUM = 109;

// Delays to try in order -- covers any existing delay up to 1 year
var DELAYS = [86400, 172800, 259200, 604800, 2592000, 31536000];

var PAYMASTER_ABI = [
  "function addStakeToEntryPoint(uint32 unstakeDelaySec) external payable",
  "function owner() external view returns (address)",
];

var signer, userAddr;

// --- Connect ---
async function connectWallet() {
  if (!window.ethereum) return setSt("err", "MetaMask not found.");
  setSt("loading", "Connecting...");
  try {
    await window.ethereum.request({ method: "eth_requestAccounts" });
    var chainHex = await window.ethereum.request({ method: "eth_chainId" });
    if (parseInt(chainHex, 16) !== CHAIN_ID_NUM) {
      setSt("loading", "Switching to Shibarium...");
      try {
        await window.ethereum.request({
          method: "wallet_switchEthereumChain",
          params: [{ chainId: CHAIN_HEX }],
        });
      } catch(e) {
        return setSt("err", "Switch to Shibarium (Chain ID 109) in MetaMask.");
      }
    }
    var accounts = await window.ethereum.request({ method: "eth_accounts" });
    userAddr = accounts[0];
    var provider = new ethers.BrowserProvider(window.ethereum);
    signer = await provider.getSigner();

    // Check owner
    var pm    = new ethers.Contract(RICPAYMASTER, PAYMASTER_ABI, provider);
    var owner = await pm.owner();
    var isOwner = owner.toLowerCase() === userAddr.toLowerCase();

    var cb = document.getElementById("connectBtn");
    cb.textContent = userAddr.slice(0,6) + "..." + userAddr.slice(-4) + " connected";
    cb.style.borderColor = "var(--gr)";
    cb.style.color = "var(--gr)";

    if (!isOwner) {
      return setSt("err",
        "NOT owner. You: " + userAddr.slice(0,10) +
        " Owner: " + owner.slice(0,10)
      );
    }

    document.getElementById("autoBtn").disabled   = false;
    document.getElementById("manualBtn").disabled = false;
    setSt("ok", "Connected as owner. Click Auto-Stake to begin.");

    window.ethereum.on("accountsChanged", function() { location.reload(); });
    window.ethereum.on("chainChanged",    function() { location.reload(); });
  } catch(e) {
    setSt("err", "Connect failed: " + decErr(e));
  }
}

// --- Auto Stake: simulate with increasing delays until one works ---
async function autoStake() {
  if (!signer) return setSt("err", "Connect wallet first.");

  var amtStr   = document.getElementById("stakeAmt").value.trim();
  var stakeWei = ethers.parseEther(amtStr);
  var pm       = new ethers.Contract(RICPAYMASTER, PAYMASTER_ABI, signer);
  var logEl    = document.getElementById("log");

  logEl.innerHTML = "";
  logEl.classList.add("show");
  document.getElementById("autoBtn").disabled   = true;
  document.getElementById("manualBtn").disabled = true;

  addLog("info", "Starting auto-stake with " + amtStr + " BONE...");
  addLog("info", "Testing " + DELAYS.length + " delay values via simulation...");
  setSt("loading", "Finding correct delay by simulation...");

  var workingDelay = null;

  for (var i = 0; i < DELAYS.length; i++) {
    var delay = DELAYS[i];
    addLog("info", "Testing delay = " + delay + "s (" + (delay/86400).toFixed(1) + " days)...");

    try {
      await pm.addStakeToEntryPoint.staticCall(delay, { value: stakeWei });
      // Simulation passed
      workingDelay = delay;
      addLog("ok", "Simulation PASSED with delay = " + delay + "s");
      break;
    } catch(simErr) {
      var reason = decErr(simErr);
      addLog("err", "delay=" + delay + "s FAILED: " + reason);

      // If reason is NOT "cannot decrease" then something else is wrong
      if (reason.indexOf("cannot decrease") === -1 &&
          reason.indexOf("decrease unstake") === -1) {
        setSt("err", "Unexpected revert (not a delay issue): " + reason);
        document.getElementById("autoBtn").disabled   = false;
        document.getElementById("manualBtn").disabled = false;
        return;
      }
    }
  }

  if (workingDelay === null) {
    addLog("err", "No delay worked. Max tried: " + DELAYS[DELAYS.length-1] + "s");
    setSt("err",
      "All delays failed. The existing delay in EntryPoint is > " +
      DELAYS[DELAYS.length-1] + "s (> 1 year). This is abnormal. " +
      "Contact support."
    );
    document.getElementById("autoBtn").disabled   = false;
    document.getElementById("manualBtn").disabled = false;
    return;
  }

  // Send with the working delay
  addLog("info", "Sending transaction with delay = " + workingDelay + "s...");
  setSt("loading", "Confirm " + amtStr + " BONE in MetaMask (delay=" + workingDelay + "s)...");

  try {
    var gasLimit;
    try {
      var est  = await pm.addStakeToEntryPoint.estimateGas(workingDelay, { value: stakeWei });
      gasLimit = est * 130n / 100n;
    } catch(_) {
      gasLimit = 300000n;
    }

    var tx = await pm.addStakeToEntryPoint(workingDelay, {
      value:    stakeWei,
      gasLimit: gasLimit,
    });

    addLog("info", "Tx sent: " + tx.hash);
    setSt("loading", "Waiting for confirmation...");
    var receipt = await tx.wait();

    addLog("ok", "CONFIRMED. Gas used: " + receipt.gasUsed.toString());
    setSt("ok",
      "SUCCESS. Staked " + amtStr + " BONE with delay=" + workingDelay + "s. " +
      "Tx: " + tx.hash.slice(0,14) + "..."
    );

    alert(
      "Stake successful!\n\n" +
      "Amount: " + amtStr + " BONE\n" +
      "Delay:  " + workingDelay + " seconds\n" +
      "Tx:     " + tx.hash
    );

  } catch(e) {
    addLog("err", "Transaction failed: " + decErr(e));
    setSt("err", "Failed: " + decErr(e));
  }

  document.getElementById("autoBtn").disabled   = false;
  document.getElementById("manualBtn").disabled = false;
}

// --- Manual stake with specific delay ---
async function manualStake() {
  if (!signer) return setSt("err", "Connect wallet first.");

  var amtStr = document.getElementById("stakeAmt").value.trim();
  var delay  = parseInt(document.getElementById("manualDelay").value);

  if (!amtStr || parseFloat(amtStr) <= 0) return setSt("err", "Enter BONE amount.");
  if (!delay  || delay < 1)               return setSt("err", "Enter delay in seconds.");

  var stakeWei = ethers.parseEther(amtStr);
  var pm       = new ethers.Contract(RICPAYMASTER, PAYMASTER_ABI, signer);
  var logEl    = document.getElementById("log");

  logEl.innerHTML = "";
  logEl.classList.add("show");
  document.getElementById("autoBtn").disabled   = true;
  document.getElementById("manualBtn").disabled = true;

  addLog("info", "Manual stake: " + amtStr + " BONE, delay=" + delay + "s");

  // Simulate
  addLog("info", "Simulating...");
  setSt("loading", "Simulating...");
  try {
    await pm.addStakeToEntryPoint.staticCall(delay, { value: stakeWei });
    addLog("ok", "Simulation passed.");
  } catch(simErr) {
    var r = decErr(simErr);
    addLog("err", "Simulation failed: " + r);
    setSt("err", "Will revert: " + r);
    document.getElementById("autoBtn").disabled   = false;
    document.getElementById("manualBtn").disabled = false;
    return;
  }

  setSt("loading", "Confirm " + amtStr + " BONE in MetaMask...");
  try {
    var gasLimit;
    try {
      var est  = await pm.addStakeToEntryPoint.estimateGas(delay, { value: stakeWei });
      gasLimit = est * 130n / 100n;
    } catch(_) {
      gasLimit = 300000n;
    }

    var tx = await pm.addStakeToEntryPoint(delay, {
      value:    stakeWei,
      gasLimit: gasLimit,
    });

    addLog("info", "Tx: " + tx.hash);
    setSt("loading", "Waiting...");
    var receipt = await tx.wait();
    addLog("ok", "CONFIRMED. Gas: " + receipt.gasUsed.toString());
    setSt("ok",
      "SUCCESS. Staked " + amtStr + " BONE, delay=" + delay + "s. " +
      "Tx: " + tx.hash.slice(0,14) + "..."
    );
    alert(
      "Stake successful!\n\n" +
      "Amount: " + amtStr + " BONE\n" +
      "Delay:  " + delay + " seconds\n" +
      "Tx:     " + tx.hash
    );
  } catch(e) {
    addLog("err", "Failed: " + decErr(e));
    setSt("err", "Failed: " + decErr(e));
  }

  document.getElementById("autoBtn").disabled   = false;
  document.getElementById("manualBtn").disabled = false;
}

// --- Helpers ---
function addLog(type, msg) {
  var el  = document.getElementById("log");
  var div = document.createElement("div");
  div.className = "log-line " + type;
  div.textContent = msg;
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
}

function setSt(type, msg) {
  var el = document.getElementById("st");
  el.className = "st" + (type ? " " + type : "");
  el.textContent = msg;
}

function decErr(e) {
  if (!e) return "Unknown";
  if (e.reason) return e.reason;
  if (e.shortMessage) return e.shortMessage;
  if (e.error && e.error.reason) return e.error.reason;
  var data = e.data || (e.error && e.error.data);
  if (typeof data === "string" && data.length > 2) {
    if (data.startsWith("0x08c379a0")) {
      try {
        return ethers.AbiCoder.defaultAbiCoder()
          .decode(["string"], "0x" + data.slice(10))[0];
      } catch(_) {}
    }
    return "Revert data: " + data.slice(0, 60);
  }
  if (e.code === 4001 || e.code === "ACTION_REJECTED") return "Rejected in MetaMask";
  var raw = e.message || String(e);
  var m = raw.match(/reason="([^"]+)"/);
  if (m) return m[1];
  m = raw.match(/reverted with reason string '([^']+)'/);
  if (m) return m[1];
  return raw.slice(0, 160);
}

(function() {
  if (window.ethereum) {
    window.ethereum.request({ method: "eth_accounts" })
      .then(function(a) { if (a && a.length) connectWallet(); })
      .catch(function() {});
  }
})();
</script>
</body>
</html>
