<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RicSwap | Obsidian Tier DEX</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
    <style>
        :root {
            --obsidian: #080808;
            --card-bg: #121212;
            --magma: linear-gradient(135deg, #ff4d00 0%, #ff8c00 100%);
            --gold: #ffd700;
        }
        body {
            background: var(--obsidian);
            color: white;
            font-family: system-ui, sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        .hero {
            height: 100vh;
            background: radial-gradient(circle at center, #1a0f00 0%, var(--obsidian) 70%);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
        }
        .hero-content {
            max-width: 800px;
            z-index: 2;
        }
        .hero h1 {
            font-size: 4.5rem;
            font-weight: 800;
            margin-bottom: 20px;
            background: linear-gradient(90deg, var(--gold), #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero p {
            font-size: 1.4rem;
            color: #ccc;
            margin-bottom: 40px;
        }
        .cta-btn {
            background: var(--magma);
            color: white;
            padding: 18px 48px;
            font-size: 1.3rem;
            font-weight: bold;
            border: none;
            border-radius: 9999px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .cta-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255, 77, 0, 0.6);
        }
        .features {
            padding: 100px 40px;
            background: #0f0f0f;
        }
        .stats {
            display: flex;
            justify-content: center;
            gap: 80px;
            margin: 60px 0;
            flex-wrap: wrap;
        }
        .stat {
            text-align: center;
        }
        .stat-number {
            font-size: 3rem;
            font-weight: 700;
            color: var(--gold);
        }
        .footer {
            padding: 60px 40px;
            text-align: center;
            border-top: 1px solid #222;
            color: #666;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <div class="nav">
        <div class="logo">RicSwap</div>
        <div class="nav-links">
            <a href="swap.html">Swap</a>
            <a href="pools.html">Pools</a>
            <a href="liquidity.html">Add Liquidity</a>
        </div>
        <button onclick="window.location.href='swap.html'" class="cta-btn">Launch App</button>
    </div>

    <!-- Hero -->
    <div class="hero">
        <div class="hero-content">
            <h1>The Obsidian Tier DEX</h1>
            <p>Permanent Liquidity • No Rugs • Built for Shibarium</p>
            <button onclick="window.location.href='swap.html'" class="cta-btn">Start Swapping Now</button>
        </div>
    </div>

    <!-- Features / Stats -->
    <div class="features">
        <div class="stats">
            <div class="stat">
                <div class="stat-number">100%</div>
                <div>LP Burned Forever</div>
            </div>
            <div class="stat">
                <div class="stat-number">0.3%</div>
                <div>Low Trading Fee</div>
            </div>
            <div class="stat">
                <div class="stat-number">∞</div>
                <div>Permissionless Pairs</div>
            </div>
        </div>
    </div>

    <div class="footer">
        RicSwap © 2026 • Permanently Locked Liquidity on Shibarium
    </div>
</body>
</html>
