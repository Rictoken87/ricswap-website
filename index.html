<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RicSwap | Obsidian Tier DEX</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.15.0/ethers.umd.min.js"></script>
    <style>
        /* Your existing styles (unchanged) */
        :root {
            --obsidian: #0D0D0D;
            --magma: linear-gradient(135deg, #FF4D00 0%, #FF8C00 100%);
            --diamond: #00E5FF;
            --gold: #FFD700;
        }
        body {
            background-color: var(--obsidian);
            color: #FFFFFF;
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .nav { width: 100%; padding: 20px; display: flex; justify-content: space-between; align-items: center; box-sizing: border-box; }
        .logo { font-size: 24px; font-weight: 900; color: var(--gold); letter-spacing: 2px; }
        .hero { text-align: center; margin-top: 10vh; }
        .hero h1 { font-size: 4rem; margin: 0; background: var(--magma); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .card {
            background: #1A1A1A;
            border: 1px solid #333;
            border-radius: 15px;
            padding: 30px;
            margin-top: 50px;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .btn-connect {
            background: var(--magma);
            border: none;
            padding: 15px 40px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s;
            box-shadow: 0 0 20px rgba(255, 77, 0, 0.3);
        }
        .btn-connect:hover { transform: scale(1.05); }
        .vip-status { color: var(--gold); font-size: 14px; margin-top: 20px; font-weight: bold; }
        .hall-of-flame { margin-top: 50px; color: #666; font-size: 12px; letter-spacing: 1px; }

        /* SWAP STYLES (your existing ones) */
        .swap-card { background: #121212; border: 1px solid #222; border-radius: 24px; padding: 20px; width: 100%; max-width: 420px; box-shadow: 0 20px 40px rgba(0,0,0,0.8); margin: 40px auto; }
        /* ... rest of your swap styles ... */
    </style>
</head>
<body>
    <div class="nav">
        <div class="logo"><img src="riclogo.png" alt="RicSwap Logo" style="height: 50px;"></div>
        <button id="connectBtn" class="btn-connect">CONNECT WALLET</button>
    </div>

    <div class="hero">
        <h1>UN-RUGGABLE</h1>
        <p style="color: #888;">100% LP Burn | 10/10 Secure | Shibarium Network</p>
    </div>

    <div class="card">
        <div style="font-size: 12px; color: #666; margin-bottom: 10px;">FOUNDER DASHBOARD</div>
        <h2 style="margin: 0;">Diamond Tier Burn</h2>

        <!-- HALL OF FLAME (your existing code) -->
        <div class="hall-of-flame-container" style="margin-top: 80px; width: 100%; max-width: 1000px;">
            <!-- ... your existing Hall of Flame content ... -->
        </div>

        <div id="vipStatus" class="vip-status">● VIP FOUNDER: <span style="color: white;">PENDING CONNECT</span></div>
        <p style="color: #888; font-size: 14px;">Hold 1,000 $RIC for FREE milestone burns.</p>
        <div style="height: 10px; background: #333; border-radius: 5px; margin-top: 20px; overflow: hidden;">
            <div style="width: 35%; height: 100%; background: var(--magma);"></div>
        </div>
        <div style="font-size: 12px; color: #555; margin-top: 5px;">35% Progress to Burn</div>
    </div>

    <!-- SWAP INTERFACE -->
    <div class="swap-card">
        <!-- ... your existing swap HTML ... -->
        <button id="swapConnectBtn" class="main-swap-btn">CONNECT WALLET TO SWAP</button>
    </div>

    <div class="hall-of-flame">HALL OF FLAME ● 2026 DEPLOYED</div>

    <script>
        let provider, signer, userAddress;
        const RIC_TOKEN = "0x12C94d3A30daa09f81Ea6c037004E6e99A4A3dfc";
        const SHIBARIUM_CHAIN_ID = 109;

        const connectBtn = document.getElementById("connectBtn");
        const swapConnectBtn = document.getElementById("swapConnectBtn");
        const vipStatus = document.getElementById("vipStatus");

        async function connectWallet() {
            if (typeof window.ethereum === "undefined") {
                alert("Please install MetaMask!");
                return;
            }

            try {
                await window.ethereum.request({ method: "eth_requestAccounts" });
                provider = new ethers.BrowserProvider(window.ethereum);
                signer = await provider.getSigner();
                userAddress = await signer.getAddress();

                // Switch to Shibarium if needed
                const network = await provider.getNetwork();
                if (network.chainId !== BigInt(SHIBARIUM_CHAIN_ID)) {
                    try {
                        await window.ethereum.request({
                            method: "wallet_switchEthereumChain",
                            params: [{ chainId: "0x6d" }]
                        });
                    } catch (switchError) {
                        // Add Shibarium network if it doesn't exist
                        await window.ethereum.request({
                            method: "wallet_addEthereumChain",
                            params: [{
                                chainId: "0x6d",
                                chainName: "Shibarium",
                                rpcUrls: ["https://rpc.shibarium.shib.io"],
                                nativeCurrency: { name: "BONE", symbol: "BONE", decimals: 18 },
                                blockExplorerUrls: ["https://www.shibariumscan.io"]
                            }]
                        });
                    }
                }

                // Update UI
                const shortAddress = userAddress.substring(0, 6) + "..." + userAddress.substring(38);
                connectBtn.textContent = shortAddress;
                connectBtn.style.background = "linear-gradient(135deg, #00E5FF, #FFD700)";
                swapConnectBtn.textContent = "SWAP NOW";

                // Check VIP status
                await checkVIPStatus();

                console.log("✅ Connected:", userAddress);
            } catch (error) {
                console.error(error);
                alert("Failed to connect wallet");
            }
        }

        async function checkVIPStatus() {
            if (!provider || !userAddress) return;
            
            const ricContract = new ethers.Contract(
                RIC_TOKEN,
                ["function balanceOf(address) view returns (uint256)"],
                provider
            );
            
            const balance = await ricContract.balanceOf(userAddress);
            const balanceNum = Number(ethers.formatUnits(balance, 18));

            if (balanceNum >= 1000) {
                vipStatus.innerHTML = `● VIP FOUNDER: <span style="color: #00E5FF;">VERIFIED (${balanceNum.toFixed(0)} $RIC)</span>`;
            } else {
                vipStatus.innerHTML = `● VIP FOUNDER: <span style="color: #FFD700;">${balanceNum.toFixed(0)} / 1,000 $RIC</span>`;
            }
        }

        // Event listeners
        connectBtn.addEventListener("click", connectWallet);
        swapConnectBtn.addEventListener("click", connectWallet);

        // Auto-connect if already connected
        window.addEventListener("load", async () => {
            if (typeof window.ethereum !== "undefined") {
                const accounts = await window.ethereum.request({ method: "eth_accounts" });
                if (accounts.length > 0) {
                    connectWallet();
                }
            }
        });
    </script>
</body>
</html>
