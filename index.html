<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RicSwap | Obsidian Tier DEX</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.15.0/ethers.umd.min.js"></script>
    <style>
        :root {
            --obsidian: #0D0D0D;
            --magma: linear-gradient(135deg, #FF4D00 0%, #FF8C00 100%);
            --gold: #FFD700;
            --diamond: #00E5FF;
        }
        body { background-color: var(--obsidian); color: #FFFFFF; font-family: 'Inter', sans-serif; margin: 0; }
        .nav { width: 100%; padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 24px; font-weight: 900; color: var(--gold); }
        .btn-connect { background: var(--magma); border: none; padding: 15px 40px; color: white; font-size: 18px; font-weight: bold; border-radius: 50px; cursor: pointer; }
        .card, .register-card, .progress-card {
            background: #1A1A1A; border: 1px solid #333; border-radius: 20px;
            padding: 35px; margin: 40px auto; width: 90%; max-width: 560px;
        }
        .register-card, .progress-card { border: 2px solid var(--gold); }
        label { display: block; margin: 18px 0 6px; font-weight: 600; color: #ddd; }
        input { width: 100%; padding: 14px; background: #222; border: 1px solid #444; color: white; border-radius: 12px; font-size: 16px; }
        .helper-text { font-size: 13px; color: #888; margin-top: 4px; }
        .progress-container { margin: 25px 0; }
        .progress-bar-bg { height: 24px; background: #333; border-radius: 9999px; overflow: hidden; }
        .progress-bar { height: 100%; background: linear-gradient(90deg, #FF4D00, #FFD700); transition: width 0.6s ease; }
        .progress-text { text-align: center; margin-top: 8px; font-weight: bold; color: var(--gold); }
        .register-btn, .check-btn { width: 100%; margin-top: 25px; padding: 18px; font-weight: bold; font-size: 18px; border: none; border-radius: 16px; cursor: pointer; }
        .register-btn { background: var(--gold); color: black; }
        .check-btn { background: var(--diamond); color: black; }
        .status { margin-top: 20px; padding: 14px; border-radius: 12px; text-align: center; font-size: 15px; }
    </style>
</head>
<body>
    <div class="nav">
        <div class="logo"><img src="riclogo.png" alt="RicSwap Logo" style="height: 50px;"></div>
        <button id="connectBtn" class="btn-connect">CONNECT WALLET</button>
    </div>

    <div style="text-align:center; margin-top:8vh;">
        <h1>UN-RUGGABLE</h1>
        <p style="color:#888;">100% LP Burn • Forced by Smart Contract</p>
    </div>

    <!-- REGISTER PAIR -->
    <div class="register-card">
        <h2 style="color:var(--gold); text-align:center;">🔥 Register Pair for Hall of Flame</h2>
        <!-- (same clean form as before) -->
        <label>LP Token Address</label>
        <input id="lpAddress" type="text" placeholder="0x...">
        <div class="helper-text">Your liquidity pair contract</div>

        <label>Target Burn Amount</label>
        <input id="targetBalance" type="text" placeholder="1000000">
        <div class="helper-text">LP tokens needed for full burn</div>

        <label>Service Fee in $RIC</label>
        <input id="serviceFee" type="text" value="0">
        <div class="helper-text">0 = free for everyone</div>

        <button id="registerBtn" class="register-btn">REGISTER PAIR &amp; AUTO-DEPLOY BURNER</button>
        <div id="registerStatus" class="status"></div>
    </div>

    <!-- NEW: TRACK BURN PROGRESS -->
    <div class="progress-card">
        <h2 style="color:var(--gold); text-align:center;">📊 Track Burn Progress</h2>
        <p style="text-align:center; color:#aaa;">See how close your project is to the full LP burn</p>

        <label>Enter Your LP Token Address</label>
        <input id="trackLpAddress" type="text" placeholder="0x9a6cca5ddbdc075ddef75cba52aadbdac67d9d23">

        <button id="checkProgressBtn" class="check-btn">CHECK PROGRESS</button>

        <div id="progressResult" style="display:none; margin-top:25px;">
            <div class="progress-container">
                <div style="display:flex; justify-content:space-between; font-size:14px; margin-bottom:6px;">
                    <span>Current LP in Burner</span>
                    <span id="currentLPText">0 / 0</span>
                </div>
                <div class="progress-bar-bg">
                    <div id="progressBar" class="progress-bar" style="width:0%"></div>
                </div>
                <div id="progressText" class="progress-text">0%</div>
            </div>

            <button id="burnNowBtn" style="display:none; width:100%; background:#FF4D00; color:white; padding:16px; border:none; border-radius:12px; font-weight:bold; margin-top:15px;">
                🔥 BURN NOW (100% LP to DEAD)
            </button>
        </div>
    </div>

    <script>
        let provider, signer, userAddress;
        const FACTORY_ADDRESS = "0x42caD60c2869f7D7e7001418918550F7840f5FCe";
        const SHIBARIUM_CHAIN_ID = 109;

        // ... (connectWallet function remains the same as last version) ...

        async function checkProgress() {
            const lpAddress = document.getElementById("trackLpAddress").value.trim();
            if (!lpAddress) return alert("Please enter LP address");

            const resultDiv = document.getElementById("progressResult");
            resultDiv.style.display = "block";

            try {
                // 1. Get burner address from Factory
                const factoryABI = ["function getBurner(address) view returns (address)"];
                const factory = new ethers.Contract(FACTORY_ADDRESS, factoryABI, provider || new ethers.BrowserProvider(window.ethereum));
                const burnerAddress = await factory.getBurner(lpAddress);

                if (burnerAddress === "0x0000000000000000000000000000000000000000") {
                    return alert("No burner found for this LP. Register the pair first.");
                }

                // 2. Call getStatus() on burner
                const burnerABI = [
                    "function getStatus() view returns (uint256 currentLP, bool isMilestoneReached, bool isBurned, uint256 currentVipThreshold, uint256 currentServiceFee)"
                ];
                const burner = new ethers.Contract(burnerAddress, burnerABI, provider || new ethers.BrowserProvider(window.ethereum));
                const [currentLP, isReached, isBurned] = await burner.getStatus();

                const current = Number(ethers.formatUnits(currentLP, 18));
                const target = Number(ethers.formatUnits(/* you can hardcode target or fetch it */ currentLP, 18)); // we'll improve this later
                // Note: For full accuracy we should also fetch targetBalance from burner contract

                const progress = target > 0 ? Math.min(Math.floor((current / target) * 100), 100) : 0;

                document.getElementById("currentLPText").textContent = `${current.toFixed(0)} / ${target.toFixed(0)}`;
                document.getElementById("progressBar").style.width = `${progress}%`;
                document.getElementById("progressText").textContent = `${progress}%`;

                if (isReached && !isBurned) {
                    document.getElementById("burnNowBtn").style.display = "block";
                }
            } catch (err) {
                console.error(err);
                alert("Could not fetch progress. Make sure the pair is registered.");
            }
        }

        // Event listeners
        document.getElementById("checkProgressBtn").addEventListener("click", checkProgress);
        // ... connectWallet and registerPair listeners ...
    </script>
</body>
</html>
