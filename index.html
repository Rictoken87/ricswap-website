<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RicSwap | Obsidian Tier DEX</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
    <style>
        :root {
            --obsidian: #080808;
            --card-bg: #121212;
            --magma: linear-gradient(135deg, #ff4d00 0%, #ff8c00 100%);
            --gold: #ffd700;
        }
        body {
            background-color: var(--obsidian);
            background-image: radial-gradient(circle at 50% -20%, #301800 0%, var(--obsidian) 80%);
            color: white;
            font-family: system-ui, sans-serif;
            margin: 0;
            padding: 0;
        }
        .nav {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,215,0,0.1);
        }
        .logo { color: var(--gold); font-size: 28px; font-weight: bold; letter-spacing: -1px; }
        .nav-links a {
            color: white;
            text-decoration: none;
            margin-left: 32px;
            font-weight: 500;
            transition: 0.2s;
        }
        .nav-links a:hover { color: var(--gold); }
        .card {
            background: var(--card-bg);
            border: 1px solid #222;
            border-radius: 24px;
            padding: 24px;
            width: 100%;
            max-width: 420px;
            margin: 60px auto;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }
        .swap-input-group { background: #1a1a1a; border-radius: 16px; padding: 16px; margin-bottom: 8px; border: 1px solid #333; }
        .swap-input-group:focus-within { border-color: var(--gold); }
        .swap-label { font-size: 12px; color: #888; margin-bottom: 8px; }
        .swap-row { display: flex; justify-content: space-between; align-items: center; }
        .swap-input { background: transparent; border: none; color: white; font-size: 24px; width: 60%; outline: none; }
        .token-selector { background: #2A2A2A; border: 1px solid #444; color: white; padding: 8px 12px; border-radius: 12px; font-weight: bold; cursor: pointer; }
        .main-swap-btn { background: var(--magma); color: white; border: none; padding: 18px; border-radius: 16px; font-weight: bold; width: 100%; font-size: 18px; cursor: pointer; margin-top: 10px; }
        .hall-of-flame { text-align: center; margin: 60px 0; color: #ffd700; font-size: 14px; letter-spacing: 3px; }
        #connectBtn { width: auto !important; padding: 10px 24px !important; font-size: 15px !important; background: #222 !important; color: var(--gold) !important; border: 1px solid var(--gold) !important; }
    </style>
</head>
<body>
    <div class="nav">
        <div class="logo">RicSwap</div>
        <div class="nav-links">
            <a href="swap.html">Swap</a>
            <a href="pools.html" style="color:var(--gold); font-weight:600;">View Pools</a>
            <a href="liquidity.html">Add Liquidity</a>
        </div>
        <button id="connectBtn">CONNECT WALLET</button>
    </div>

    <div style="text-align:center; padding:60px 20px 20px;">
        <h1 style="font-size:52px; margin:0; line-height:1.1;">The Un-Ruggable DEX</h1>
        <p style="color:#aaa; font-size:20px; margin:16px 0 40px;">100% LP Burn • Transparent • Built on Shibarium</p>
    </div>

    <!-- Main Swap Card -->
    <div class="card">
        <div style="display:flex; justify-content:space-between; margin-bottom:15px; align-items:center;">
            <span style="font-weight:bold; letter-spacing:1px;">QUICK SWAP</span>
            <span style="color:#666; cursor:pointer; font-size:18px;">⚙️</span>
        </div>
        <div class="swap-input-group">
            <div class="swap-label">You Pay</div>
            <div class="swap-row">
                <input type="number" class="swap-input" placeholder="0.0" id="fromAmount">
                <button class="token-selector">BONE ⬇</button>
            </div>
        </div>
        <div style="text-align:center; margin:-8px 0; font-size:28px; color:#444;">↓</div>
        <div class="swap-input-group">
            <div class="swap-label">You Receive</div>
            <div class="swap-row">
                <input type="number" class="swap-input" placeholder="0.0" id="toAmount" readonly>
                <button class="token-selector" style="background:var(--magma); border:none;">RIC ⬇</button>
            </div>
        </div>
        <button onclick="window.location.href='swap.html'" class="main-swap-btn">GO TO FULL SWAP PAGE</button>
    </div>

    <div class="hall-of-flame">
        HALL OF FLAME ● 2026 DEPLOYED
    </div>

    <script>
        // Simple connect wallet button
        document.getElementById("connectBtn").addEventListener("click", () => {
            alert("Connect wallet logic can be added here or use the same connect function from other pages.");
        });
    </script>
</body>
</html>
