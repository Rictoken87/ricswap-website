<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RicSwap | Obsidian Tier DEX</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
    <style>
        :root {
            --obsidian: #080808;
            --card-bg: #121212;
            --magma: linear-gradient(135deg, #ff4d00 0%, #ff8c00 100%);
            --gold: #ffd700;
        }
        body {
            background: var(--obsidian);
            color: white;
            font-family: system-ui, sans-serif;
            margin: 0;
        }
        .nav {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,215,0,0.1);
        }
        .logo { color: var(--gold); font-size: 28px; font-weight: bold; }
        .nav-links a {
            color: white;
            text-decoration: none;
            margin-left: 30px;
            font-weight: 500;
            transition: color 0.3s;
        }
        .nav-links a:hover { color: var(--gold); }
        #connectBtn {
            width: auto !important;
            min-width: 140px !important;
            padding: 10px 24px !important;
            font-size: 15px !important;
            background: #222 !important;
            color: var(--gold) !important;
            border: 1px solid var(--gold) !important;
            border-radius: 9999px !important;
        }
        .hero, .section { padding: 60px 40px; }
        .card { background: var(--card-bg); border-radius: 24px; padding: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.8); }
        button.main-btn {
            background: var(--magma);
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 9999px;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>
    <!-- NAVIGATION -->
    <div class="nav">
        <div class="logo">RicSwap</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="swap.html">Swap</a>
            <a href="liquidity.html">Add Liquidity</a>
            <a href="#hall-of-flame">Hall of Flame</a>
        </div>
        <button id="connectBtn">CONNECT WALLET</button>
    </div>

    <!-- HERO / EXISTING CONTENT (keep your previous sections here) -->
    <div class="hero" style="text-align:center;">
        <h1 style="font-size:64px; margin:0;">UN-RUGGABLE DEX</h1>
        <p style="font-size:24px; color:#888;">100% LP Burn • Diamond Tier Security • Shibarium</p>
        <a href="liquidity.html" style="display:inline-block; margin-top:30px;">
            <button class="main-btn" style="width:auto; padding:18px 40px;">ADD LIQUIDITY NOW</button>
        </a>
    </div>

    <!-- YOUR EXISTING SECTIONS (Hall of Flame, Register Pair, Track Burn Progress, etc.) -->
    <!-- Paste all your previous content here (the diamond tier burn card, hall of flame, register form, progress bar, etc.) -->

    <div id="hall-of-flame" class="section">
        <h2 style="text-align:center;">HALL OF FLAME</h2>
        <!-- Your hall of flame content here -->
    </div>

    <!-- ... rest of your original index.html content ... -->

    <script>
        // Connect wallet (same logic as before)
        document.getElementById("connectBtn").addEventListener("click", async () => {
            if (!window.ethereum) return alert("Please install MetaMask");
            try {
                const provider = new ethers.BrowserProvider(window.ethereum);
                await provider.send("eth_requestAccounts", []);
                const signer = await provider.getSigner();
                const address = await signer.getAddress();
                document.getElementById("connectBtn").textContent = address.slice(0,6) + "..." + address.slice(-4);
            } catch (e) {
                alert("Connection failed");
            }
        });
    </script>
</body>
</html>
