<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RicSwap | Obsidian Tier DEX</title>
    <style>
        :root {
            --obsidian: #080808;
            --card-bg: #121212;
            --magma: linear-gradient(135deg, #ff4d00 0%, #ff8c00 100%);
            --gold: #ffd700;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--obsidian);
            color: white;
            font-family: system-ui, sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
        }
        .nav {
            padding: 18px 40px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid rgba(255,215,0,0.1);
            background: rgba(8,8,8,0.95);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
        }
        .logo { font-size: 26px; font-weight: 800; color: var(--gold); letter-spacing: -1px; }
        .nav-links { display: flex; gap: 32px; margin-left: 50px; }
        .nav-links a { color: #ddd; text-decoration: none; font-weight: 500; transition: color 0.3s; }
        .nav-links a:hover { color: var(--gold); }
        .launch-btn {
            margin-left: auto;
            background: var(--magma);
            color: white;
            border: none;
            padding: 12px 32px;
            border-radius: 9999px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .launch-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(255,77,0,0.4);
        }
        .hero {
            height: 100vh;
            background: radial-gradient(circle at 50% 30%, #2a1500 0%, var(--obsidian) 60%);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
        }
        .hero-content h1 {
            font-size: clamp(3rem, 8vw, 5.5rem);
            font-weight: 900;
            margin-bottom: 20px;
            background: linear-gradient(90deg, var(--gold), #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero-content p {
            font-size: 1.35rem;
            color: #ccc;
            max-width: 600px;
            margin: 0 auto 40px;
        }
        .cta-large {
            background: var(--magma);
            color: white;
            padding: 20px 52px;
            font-size: 1.3rem;
            font-weight: 700;
            border: none;
            border-radius: 9999px;
            cursor: pointer;
            transition: all 0.4s;
        }
        .cta-large:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(255,77,0,0.6);
        }
        .features {
            padding: 120px 40px;
            background: #0a0a0a;
            text-align: center;
        }
        .stats {
            display: flex;
            justify-content: center;
            gap: 80px;
            flex-wrap: wrap;
            margin-top: 60px;
        }
        .stat {
            min-width: 160px;
        }
        .stat-number {
            font-size: 3.2rem;
            font-weight: 800;
            color: var(--gold);
        }
        .stat-label {
            color: #777;
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 2px;
            margin-top: 8px;
        }
        .footer {
            padding: 60px 40px;
            text-align: center;
            color: #555;
            border-top: 1px solid #1a1a1a;
        }
    </style>
</head>
<body>
    <nav class="nav">
        <div class="logo">RicSwap</div>
        <div class="nav-links">
            <a href="swap.html">Swap</a>
            <a href="pools.html">Pools</a>
            <a href="liquidity.html">Add Liquidity</a>
            <a href="reward.html">Rewards </a>
            <a href="launch.html">Fair Launch & Burn LP </a>
        </div>
        <button onclick="window.location.href='swap.html'" class="launch-btn">Launch App</button>
    </nav>

    <section class="hero">
        <div class="hero-content">
            <h1>The Obsidian Tier DEX</h1>
            <p>Permanent Liquidity • No Rugs • Built for Shibarium</p>
            <button onclick="window.location.href='swap.html'" class="cta-large">Start Swapping Now</button>
        </div>
    </section>

    <section class="features">
        <h2 style="font-size:2.2rem; margin-bottom:60px;">Why Traders Choose RicSwap</h2>
        <div class="stats">
            <div class="stat">
                <div class="stat-number">100%</div>
                <div class="stat-label">LP Burned Forever</div>
            </div>
            <div class="stat">
                <div class="stat-number">0.3%</div>
                <div class="stat-label">Trading Fee</div>
            </div>
            <div class="stat">
                <div class="stat-number">∞</div>
                <div class="stat-label">Permissionless Pairs</div>
            </div>
        </div>
    </section>

    <footer class="footer">
        RicSwap © 2026 • Permanently Locked Liquidity on Shibarium
    </footer>
</body>
</html>
