<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RicSwap | Obsidian Tier DEX</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
    <style>
        :root {
            --obsidian: #080808;
            --card-bg: #121212;
            --magma: linear-gradient(135deg, #ff4d00 0%, #ff8c00 100%);
            --gold: #ffd700;
        }
        body {
            background: var(--obsidian);
            color: white;
            font-family: system-ui, sans-serif;
            margin: 0;
        }
        .nav {
            padding: 24px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,215,0,0.1);
        }
        .logo { color: var(--gold); font-size: 28px; font-weight: bold; }
        .nav-links a {
            color: white;
            text-decoration: none;
            margin-left: 30px;
            font-weight: 500;
        }
        .nav-links a:hover { color: var(--gold); }
        #connectBtn {
            width: auto !important;
            min-width: 140px !important;
            padding: 10px 24px !important;
            font-size: 15px !important;
            background: #222 !important;
            color: var(--gold) !important;
            border: 1px solid var(--gold) !important;
            border-radius: 9999px !important;
        }
        .hero { text-align: center; padding: 80px 40px; }
        .swap-card {
            background: #121212;
            border: 1px solid #222;
            border-radius: 24px;
            padding: 20px;
            width: 100%;
            max-width: 420px;
            margin: 40px auto;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }
        .swap-input-group {
            background: #1A1A1A;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 8px;
        }
        .swap-input {
            background: transparent;
            border: none;
            color: white;
            font-size: 24px;
            width: 100%;
            outline: none;
        }
        button.main-btn {
            background: var(--magma);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 9999px;
            font-weight: bold;
            width: 100%;
            font-size: 18px;
            margin-top: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- NAVIGATION -->
    <div class="nav">
        <div class="logo">RicSwap</div>
        <div class="nav-links">
            <a href="swap.html">Swap</a>
            <a href="liquidity.html" style="color:#ffd700;">Add Liquidity</a>
        </div>
        <button id="connectBtn">CONNECT WALLET</button>
    </div>

    <!-- HERO -->
    <div class="hero">
        <h1 style="font-size:64px; margin:0;">UN-RUGGABLE DEX</h1>
        <p style="font-size:24px; color:#888;">100% LP Burn • Diamond Tier Security • Shibarium</p>
    </div>

    <!-- SWAP CARD (your original) -->
    <div class="swap-card">
        <div style="display:flex; justify-content:space-between; margin-bottom:15px; align-items:center;">
            <span style="font-weight:bold; letter-spacing:1px;">SWAP</span>
            <span style="color:#666; cursor:pointer; font-size:18px;">⚙️</span>
        </div>
        <!-- FROM -->
        <div class="swap-input-group">
            <div class="swap-label">You Pay</div>
            <div class="swap-row">
                <input type="number" class="swap-input" placeholder="0.0" value="1">
                <button class="token-selector">BONE ⬇</button>
            </div>
        </div>
        <!-- ARROW -->
        <div style="text-align:center; margin:10px 0; font-size:24px;">↓</div>
        <!-- TO -->
        <div class="swap-input-group">
            <div class="swap-label">You Receive</div>
            <div class="swap-row">
                <input type="number" class="swap-input" placeholder="0.0" readonly>
                <button class="token-selector" style="background:var(--magma);">RIC ⬇</button>
            </div>
        </div>
        <button class="main-btn" onclick="window.location.href='swap.html'">CONNECT WALLET TO SWAP</button>
    </div>

    <!-- HALL OF FLAME -->
    <div class="hall-of-flame" style="text-align:center; padding:40px; background:#111;">
        <h2>HALL OF FLAME ● 2026 DEPLOYED</h2>
        <!-- Add your Hall of Flame projects here -->
    </div>

    <!-- YOUR ORIGINAL SECTIONS (Diamond Tier Burn, Register Pair, Track Burn Progress, etc.) -->
    <!-- Paste your existing sections here if you want them restored exactly as before -->

    <script>
        // Simple connect wallet (keeps button small)
        document.getElementById("connectBtn").addEventListener("click", async () => {
            if (!window.ethereum) return alert("Please install MetaMask");
            try {
                const provider = new ethers.BrowserProvider(window.ethereum);
                await provider.send("eth_requestAccounts", []);
                const signer = await provider.getSigner();
                const address = await signer.getAddress();
                document.getElementById("connectBtn").textContent = address.slice(0,6) + "..." + address.slice(-4);
            } catch (e) {
                console.error(e);
            }
        });
    </script>
</body>
</html>
