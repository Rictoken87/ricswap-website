<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RicSwap | Router Deployer</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
    <style>
        body { background: #111; color: #e0e0e0; font-family: 'Inter', sans-serif; display: flex; justify-content: center; padding-top: 50px; }
        .card { background: #1a1a1a; padding: 30px; border-radius: 20px; border: 1px solid #333; width: 500px; box-shadow: 0 0 50px rgba(0,255,136,0.1); }
        h2 { text-align: center; color: #00ff88; margin-top: 0; }
        label { font-size: 12px; color: #888; display: block; margin-bottom: 5px; margin-top: 15px; }
        input { width: 100%; background: #222; border: 1px solid #444; color: #fff; padding: 10px; border-radius: 8px; font-family: monospace; }
        button { width: 100%; padding: 15px; background: #00ff88; color: #000; border: none; font-weight: bold; border-radius: 10px; margin-top: 25px; cursor: pointer; font-size: 14px; }
        button:hover { background: #00cc6a; }
        #status { margin-top: 20px; padding: 15px; background: #000; border-radius: 8px; font-family: monospace; font-size: 12px; color: #888; word-break: break-all; }
    </style>
</head>
<body>

<div class="card">
    <h2>🚀 Deploy Router</h2>
    <p style="font-size:12px; color:#666; text-align:center;">Create a fresh, working V2 Router for RicSwap</p>

    <label>1. Factory Address (Your Logic)</label>
    <input id="factory" value="0x78ae5cCD2f13D10aE3fF47F8418A79D99B4569d0">

    <label>2. WBONE Address (System Wrapped Token)</label>
    <input id="weth" value="0xC76F4c819D820369Fb2d7C1531aB3Bb18e6fE8d8">

    <button onclick="deploy()">DEPLOY NOW</button>
    <div id="status">Ready to deploy.</div>
</div>

<script>
    // Official Uniswap V2 Router 02 Bytecode
    const BYTECODE = "";
    
    // Router ABI (Constructor only needed really)
    const ABI = [ "constructor(address _factory, address _WETH)" ];

    async function deploy() {
        const status = document.getElementById("status");
        const factory = document.getElementById("factory").value;
        const weth = document.getElementById("weth").value;

        if(!ethers.isAddress(factory) || !ethers.isAddress(weth)) return alert("Invalid Addresses");

        try {
            if(!window.ethereum) throw new Error("No Wallet");
            await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: "0x6d" }] }); // Shibarium
            
            const provider = new ethers.BrowserProvider(window.ethereum);
            const signer = await provider.getSigner();

            status.innerText = "⏳ Deploying... Please confirm in wallet.";
            
            const factoryObj = new ethers.ContractFactory(ABI, BYTECODE, signer);
            const contract = await factoryObj.deploy(factory, weth);
            
            status.innerHTML = `🚀 <b>Deployment Sent!</b><br>Hash: <a href="https://shibariumscan.io/tx/${contract.deploymentTransaction().hash}" target="_blank" style="color:#00ff88">View TX</a><br><br>Waiting for confirmation...`;
            
            await contract.waitForDeployment();
            const newAddr = await contract.getAddress();
            
            status.innerHTML = `✅ <b>SUCCESS!</b><br>New Router Address:<br><b style="color:#00ff88; font-size:14px;">${newAddr}</b><br><br>👉 COPY THIS ADDRESS and update your LP Tool!`;

        } catch(e) {
            console.error(e);
            status.innerText = "Error: " + (e.reason || e.message);
        }
    }
</script>
</body>
</html>
