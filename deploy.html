<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RicSwap | Universal Deployer</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
    <style>
        body { background: #050505; color: #e0e0e0; font-family: monospace; display: flex; justify-content: center; padding-top: 30px; }
        .card { background: #111; padding: 25px; border: 1px solid #333; width: 550px; border-radius: 12px; }
        h2 { color: #00ff88; text-align: center; margin-top: 0; }
        
        .tabs { display: flex; border-bottom: 1px solid #333; margin-bottom: 20px; }
        .tab { flex: 1; padding: 10px; text-align: center; cursor: pointer; color: #666; background: #000; }
        .tab.active { color: #fff; background: #222; border-top: 2px solid #00ff88; }
        
        input, textarea { width: 100%; background: #1a1a1a; border: 1px solid #444; color: #fff; padding: 10px; border-radius: 6px; box-sizing: border-box; margin-bottom: 10px; }
        
        button { width: 100%; padding: 15px; background: #333; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button.deploy { background: #00ff88; color: #000; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        #status { margin-top: 20px; padding: 15px; background: #000; border: 1px solid #222; color: #888; word-break: break-all; font-size: 11px; }
        .success { color: #00ff88; }
        .err { color: #ff4444; }
    </style>
</head>
<body>

<div class="card">
    <h2>🚀 Universal Deployer</h2>
    
    <label>1. Factory Address</label>
    <input id="factory" value="0x78ae5cCD2f13D10aE3fF47F8418A79D99B4569d0">
    
    <label>2. WBONE Address</label>
    <input id="wbone" value="0xC76F4c819D820369Fb2d7C1531aB3Bb18e6fE8d8">

    <div class="tabs">
        <div class="tab active" onclick="switchTab('auto')" id="tab-auto">Method A: Auto-Load</div>
        <div class="tab" onclick="switchTab('manual')" id="tab-manual">Method B: Manual Paste</div>
    </div>

    <!-- METHOD A: AUTO -->
    <div id="view-auto">
        <p style="font-size:12px; color:#888;">Attempts to download verified code from JSDelivr CDN.</p>
        <button onclick="autoLoad()">⬇️ DOWNLOAD CODE</button>
    </div>

    <!-- METHOD B: MANUAL -->
    <div id="view-manual" style="display:none;">
        <p style="font-size:12px; color:#888;">
            1. <a href="https://cdn.jsdelivr.net/npm/@uniswap/v2-periphery@1.1.0/build/UniswapV2Router02.json" target="_blank" style="color:#00ff88">CLICK THIS LINK</a> (Opens JSON).<br>
            2. Select ALL text (Ctrl+A) and Copy (Ctrl+C).<br>
            3. Paste it below:
        </p>
        <textarea id="pasteBox" style="height:100px;" placeholder='Paste full JSON here...' oninput="manualParse()"></textarea>
    </div>

    <hr style="border:0; border-top:1px solid #333; margin:20px 0;">
    
    <button id="deployBtn" class="deploy" onclick="deploy()" disabled>DEPLOY ROUTER 🚀</button>
    <div id="status">Waiting for code...</div>
</div>

<script>
    let bytecode = null, abi = null;

    function switchTab(mode) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById('tab-'+mode).classList.add('active');
        document.getElementById('view-auto').style.display = mode==='auto'?'block':'none';
        document.getElementById('view-manual').style.display = mode==='manual'?'block':'none';
    }

    async function autoLoad() {
        const status = document.getElementById("status");
        status.innerText = " downloading from JSDelivr...";
        try {
            const r = await fetch("https://cdn.jsdelivr.net/npm/@uniswap/v2-periphery@1.1.0/build/UniswapV2Router02.json");
            if(!r.ok) throw new Error("Blocked");
            const json = await r.json();
            activate(json);
        } catch(e) {
            status.innerHTML = "<b class='err'>❌ Auto-Load Failed.</b><br>Please switch to 'Method B: Manual Paste' tab above.";
            switchTab('manual');
        }
    }

    function manualParse() {
        try {
            const txt = document.getElementById("pasteBox").value;
            const json = JSON.parse(txt);
            activate(json);
        } catch(e) {
            document.getElementById("status").innerText = "Invalid JSON...";
        }
    }

    function activate(json) {
        if(!json.bytecode || !json.abi) return;
        bytecode = json.bytecode;
        abi = json.abi;
        document.getElementById("status").innerHTML = `<b class="success">✅ Code Loaded! (${bytecode.length} chars)</b>`;
        document.getElementById("deployBtn").disabled = false;
    }

    async function deploy() {
        const status = document.getElementById("status");
        const f = document.getElementById("factory").value;
        const w = document.getElementById("wbone").value;

        try {
            status.innerText = "Connecting...";
            if(!window.ethereum) throw new Error("No Wallet");
            await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: "0x6d" }] });
            
            const p = new ethers.BrowserProvider(window.ethereum);
            const s = await p.getSigner();

            status.innerText = "Confirm Deployment...";
            const fact = new ethers.ContractFactory(abi, bytecode, s);
            const c = await fact.deploy(f, w);
            
            status.innerHTML = `🚀 <b>Sent!</b> <a href="https://shibariumscan.io/tx/${c.deploymentTransaction().hash}" target="_blank" style="color:#fff">View TX</a>`;
            await c.waitForDeployment();
            const addr = await c.getAddress();
            
            status.innerHTML = `<div style="background:#002211; padding:10px; border:1px solid #00ff88; border-radius:6px;">
                <b style="color:#00ff88">✅ SUCCESS!</b><br><br>
                NEW ROUTER:<br>
                <span style="color:#fff; background:#000; padding:3px;">${addr}</span>
                <br><br>👉 Copy this to the Liquidity Tool.
            </div>`;

        } catch(e) {
            console.error(e);
            status.innerHTML = `<span class="err">Error: ${e.reason || e.message}</span>`;
        }
    }
</script>
</body>
</html>
