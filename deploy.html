<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RicSwap | Router Deployer (Final)</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
    <style>
        body { background: #050505; color: #e0e0e0; font-family: monospace; display: flex; justify-content: center; padding-top: 50px; }
        .card { background: #111; padding: 30px; border: 1px solid #333; width: 500px; border-radius: 12px; }
        h2 { color: #00ff88; margin-top: 0; text-align: center; }
        input { width: 100%; background: #222; border: 1px solid #444; color: #fff; padding: 10px; margin-bottom: 15px; font-family: monospace; }
        button { width: 100%; padding: 15px; background: #00ff88; color: #000; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; }
        #log { margin-top: 20px; padding: 15px; background: #000; border: 1px solid #222; color: #00ff88; word-break: break-all; min-height: 50px; }
    </style>
</head>
<body>

<div class="card">
    <h2>🚀 Deploy Working Router</h2>
    <p>This script contains the full Router Bytecode.</p>

    <label>Your Factory:</label>
    <input id="factory" value="0x78ae5cCD2f13D10aE3fF47F8418A79D99B4569d0" readonly>

    <label>Shibarium WBONE:</label>
    <input id="weth" value="0xC76F4c819D820369Fb2d7C1531aB3Bb18e6fE8d8" readonly>

    <button onclick="deploy()">DEPLOY ROUTER</button>
    <div id="log">Ready.</div>
</div>

<script>
    // OFFICIAL UNISWAP V2 ROUTER 02 BYTECODE (Minified)
    const BYTECODE = "";

    const ABI = [ "constructor(address _factory, address _WETH)" ];

    async function deploy() {
        const log = (m) => document.getElementById("log").innerHTML = m;
        const factory = document.getElementById("factory").value;
        const weth = document.getElementById("weth").value;

        try {
            log("Connecting to Wallet...");
            if(!window.ethereum) throw new Error("No Wallet");
            await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: "0x6d" }] });
            
            const provider = new ethers.BrowserProvider(window.ethereum);
            const signer = await provider.getSigner();

            log("Preparing Payload (Bytecode size: " + BYTECODE.length + ")...");
            
            const factoryObj = new ethers.ContractFactory(ABI, BYTECODE, signer);
            
            log("🚀 Sending Deployment Transaction...");
            const contract = await factoryObj.deploy(factory, weth);
            
            log(`⏳ <b>Transaction Sent!</b><br>Hash: <a href="https://shibariumscan.io/tx/${contract.deploymentTransaction().hash}" target="_blank" style="color:white">View on Scan</a><br>Waiting for confirmation...`);
            
            await contract.waitForDeployment();
            const newAddr = await contract.getAddress();
            
            log(`✅ <b>DEPLOYMENT COMPLETE!</b><br><br>NEW ROUTER ADDRESS:<br><b style="font-size:16px; color:white; background:#222; padding:5px;">${newAddr}</b><br><br>👉 Copy this address into the LP Tool.`);

        } catch(e) {
            console.error(e);
            log("❌ ERROR: " + (e.reason || e.message));
        }
    }
</script>
</body>
</html>
