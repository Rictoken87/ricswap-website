    const ROUTER_ABI = [ /* full ABI here - shortened for readability */ ];

    async function deploy() {
        const status = document.getElementById("status");
        const factoryAddr = document.getElementById("factory").value.trim();
        const wboneAddr = document.getElementById("wbone").value.trim();

        if (!ethers.isAddress(factoryAddr) || !ethers.isAddress(wboneAddr)) {
            return status.innerText = "❌ Invalid Factory or WBONE address";
        }

        try {
            status.innerText = "Connecting wallet...";
            if (!window.ethereum) throw new Error("No wallet detected");

            await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: "0x6d" }] });

            const provider = new ethers.BrowserProvider(window.ethereum);
            const signer = await provider.getSigner();

            status.innerText = "Deploying Router... Please confirm";

            const factory = new ethers.ContractFactory(ROUTER_ABI, ROUTER_BYTECODE, signer);
            const contract = await factory.deploy(factoryAddr, wboneAddr);

            const txHash = contract.deploymentTransaction().hash;
            status.innerHTML = `🚀 Deployment sent!<br>Tx: <a href="https://shibariumscan.io/tx/${txHash}" target="_blank">View</a><br>Waiting...`;

            await contract.waitForDeployment();
            const newRouter = await contract.getAddress();

            status.innerHTML = `
                <span class="success">✅ SUCCESS!</span><br><br>
                <b>New Router:</b><br>
                <span style="color:#00ff88; font-size:15px;">${newRouter}</span><br><br>
                Copy this address and use it everywhere.
            `;

        } catch(e) {
            console.error(e);
            status.innerText = "❌ Failed: " + (e.reason || e.message);
