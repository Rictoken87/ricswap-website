<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RicSwap • Liquidity Pools</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
    <style>
        :root {
            --obsidian: #080808;
            --card-bg: #121212;
            --magma: linear-gradient(135deg, #ff4d00 0%, #ff8c00 100%);
            --gold: #ffd700;
        }
        body { background: var(--obsidian); color: white; font-family: system-ui, sans-serif; margin: 0; padding: 0; }
        .nav { padding: 20px 40px; display: flex; align-items: center; border-bottom: 1px solid rgba(255,215,0,0.1); }
        .logo { font-size: 28px; font-weight: bold; color: var(--gold); }
        .nav-links { display: flex; gap: 30px; margin-left: 40px; }
        .nav-links a { color: white; text-decoration: none; font-weight: 500; }
        .nav-links a:hover, .nav-links a.active { color: var(--gold); }
        .connect-btn { 
            background: #222; color: white; border: 1px solid #444; padding: 6px 18px; 
            border-radius: 9999px; font-size: 14px; font-weight: 500; cursor: pointer; 
            white-space: nowrap; margin-left: auto; flex-shrink: 0; 
        }
        .connect-btn:hover { background: #333; border-color: var(--gold); }
        .card { max-width: 1000px; margin: 40px auto; background: var(--card-bg); border-radius: 24px; padding: 32px; box-shadow: 0 20px 40px rgba(0,0,0,0.8); border: 1px solid #222; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 16px; text-align: left; border-bottom: 1px solid #333; }
        th { color: var(--gold); font-weight: 600; text-transform: uppercase; font-size: 13px; }
        tr:hover { background: #1a1a1a; }
        .pool-name { font-weight: bold; font-size: 18px; }
        .action-btn { background: #222; color: white; padding: 6px 12px; border-radius: 8px; text-decoration: none; font-size: 13px; margin-right: 6px; }
        .status { text-align: center; margin-top: 20px; font-size: 14px; }
        .lock-note { color: #ff4d00; font-size: 13px; text-align: center; margin-top: 10px; }
        .no-liquidity { color: #ffaa00; font-style: italic; }
    </style>
</head>
<body>
    <div class="nav">
        <div class="logo">RicSwap</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="swap.html">Swap</a>
            <a href="pools.html" class="active">Pools</a>
            <a href="liquidity.html">Add Liquidity</a>
            <a href="reward.html">Rewards </a>
            <a href="launch.html">Fair Launch & Burn LP </a>

        </div>
        <button id="connectBtn" class="connect-btn">Connect Wallet</button>
    </div>

    <div class="card">
        <h2 style="text-align:center; margin-bottom:8px;">All Liquidity Pools</h2>
        <p class="lock-note">🔒 Liquidity is permanently locked — no withdrawal possible</p>
        <table>
            <thead>
                <tr>
                    <th>Pool</th>
                    <th>Reserves</th>
                    <th>Your Position</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="poolsTable"></tbody>
        </table>
        <div class="status" id="status"></div>
    </div>

    <script>
        const FACTORY_ADDRESS = "0x78ae5cCD2f13D10aE3fF47F8418A79D99B4569d0";
        const WBONE = "0xC76F4c819D820369Fb2d7C1531aB3Bb18e6fE8d8";

        let provider, signer, userAddress;

        const FACTORY_ABI = [
            "function allPairs(uint256) external view returns (address)",
            "function allPairsLength() external view returns (uint256)",
            "function getBurner(address lpToken) external view returns (address)"
        ];

        const PAIR_ABI = [
            "function getReserves() external view returns (uint112 reserve0, uint112 reserve1, uint32 blockTimestampLast)",
            "function totalSupply() external view returns (uint256)",
            "function balanceOf(address account) external view returns (uint256)",
            "function token0() external view returns (address)",
            "function token1() external view returns (address)"
        ];

        const ERC20_ABI = ["function symbol() external view returns (string)"];

        async function connectWallet() {
            if (!window.ethereum) return alert("Please install MetaMask");
            provider = new ethers.BrowserProvider(window.ethereum);
            await provider.send("eth_requestAccounts", []);
            signer = await provider.getSigner();
            userAddress = await signer.getAddress();
            document.getElementById("connectBtn").textContent = userAddress.slice(0,6) + "..." + userAddress.slice(-4);
            loadAllPools();
        }

        async function loadAllPools() {
            const tableBody = document.getElementById("poolsTable");
            const status = document.getElementById("status");
            status.textContent = "Loading pools...";
            tableBody.innerHTML = "";

            try {
                const factory = new ethers.Contract(FACTORY_ADDRESS, FACTORY_ABI, provider);
                const length = await factory.allPairsLength();

                if (length === 0) {
                    status.innerHTML = `<span style="color:#ffaa00">No pairs created yet. Go to Add Liquidity page first.</span>`;
                    return;
                }

                for (let i = 0; i < length; i++) {
                    const pairAddress = await factory.allPairs(i);
                    const pairContract = new ethers.Contract(pairAddress, PAIR_ABI, provider);

                    const [reserves, totalSupply, userLP, token0Addr, token1Addr, burner] = await Promise.all([
                        pairContract.getReserves(),
                        pairContract.totalSupply(),
                        signer ? pairContract.balanceOf(userAddress) : Promise.resolve(0),
                        pairContract.token0(),
                        pairContract.token1(),
                        factory.getBurner(pairAddress)
                    ]);

                    const isBoneFirst = token0Addr.toLowerCase() === WBONE.toLowerCase();
                    const boneRes = isBoneFirst ? reserves[0] : reserves[1];
                    const otherRes = isBoneFirst ? reserves[1] : reserves[0];
                    const otherTokenAddr = isBoneFirst ? token1Addr : token0Addr;

                    let tokenSymbol = "Unknown";
                    try {
                        const tokenContract = new ethers.Contract(otherTokenAddr, ERC20_ABI, provider);
                        tokenSymbol = await tokenContract.symbol();
                    } catch (e) {}

                    const share = totalSupply > 0n ? (userLP * 1000000000000n / totalSupply) / 10000000000n : 0n;

                    tableBody.innerHTML += `
                        <tr>
                            <td class="pool-name">BONE / ${tokenSymbol}</td>
                            <td>
                                <div>${ethers.formatEther(boneRes)} BONE</div>
                                <div>${ethers.formatEther(otherRes)} ${tokenSymbol}</div>
                            </td>
                            <td>
                                <div style="font-weight:bold; color:var(--gold);">${ethers.formatEther(userLP)} LP</div>
                                <div style="font-size:13px; color:#888;">≈ ${(Number(share)/100).toFixed(2)}% of pool</div>
                            </td>
                            <td>
                                <a href="https://shibariumscan.io/address/${pairAddress}" target="_blank" class="action-btn">Pair</a>
                                ${burner && burner !== "0x0000000000000000000000000000000000000000" ? `<a href="https://shibariumscan.io/address/${burner}" target="_blank" class="action-btn">Burner</a>` : ''}
                            </td>
                        </tr>
                    `;
                }

                status.innerHTML = `<span style="color:#0f0">✅ Loaded ${length} permanently locked pool(s)</span>`;
            } catch (e) {
                console.error(e);
                status.style.color = "#f00";
                status.textContent = "Error loading pools. Check console.";
            }
        }

        document.getElementById("connectBtn").addEventListener("click", connectWallet);

        window.addEventListener("load", () => {
            if (window.ethereum) {
                window.ethereum.request({ method: 'eth_accounts' }).then(accounts => {
                    if (accounts.length > 0) connectWallet();
                });
            }
        });
    </script>
</body>
</html>
