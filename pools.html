<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RicSwap • Pools</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
    <style>
        :root { --bg: #050505; --card: #111; --border: #222; --gold: #ffd700; --green: #00ff88; }
        body { background: var(--bg); color: white; font-family: 'Inter', sans-serif; margin: 0; padding: 20px; }
        
        .nav { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background: #161616; border-radius: 12px; margin-bottom: 20px; }
        .logo { font-weight: 800; color: var(--gold); text-decoration: none; font-size: 20px; }
        
        .container { max-width: 900px; margin: 0 auto; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { text-align: left; color: #666; font-size: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
        td { padding: 15px 0; border-bottom: 1px solid #1a1a1a; vertical-align: middle; }
        
        .pair-name { font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 8px; }
        .tag { background: #222; color: #888; font-size: 10px; padding: 2px 6px; border-radius: 4px; }
        
        .reserves { font-size: 13px; color: #aaa; margin-top: 4px; }
        .user-share { font-weight: bold; color: var(--green); }
        
        .btn { background: #222; color: white; text-decoration: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; border: 1px solid #333; }
        .btn:hover { border-color: var(--gold); color: var(--gold); }
        
        .status-box { background: #1a1a1a; padding: 10px; border-radius: 8px; font-family: monospace; font-size: 12px; color: var(--gold); margin-bottom: 20px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="nav">
        <a href="#" class="logo">RicSwap</a>
        <button id="connectBtn" class="btn" style="background:white; color:black; border:none; font-weight:700" onclick="connect()">Connect Wallet</button>
    </div>

    <div id="console" class="status-box"></div>

    <div class="card">
        <h2 style="margin-top:0">Liquidity Pools</h2>
        <table>
            <thead>
                <tr>
                    <th width="40%">Pair</th>
                    <th width="30%">Liquidity</th>
                    <th width="30%">Actions</th>
                </tr>
            </thead>
            <tbody id="list"></tbody>
        </table>
        <div id="empty" style="text-align:center; padding:40px; color:#444;">Connect wallet to load.</div>
    </div>
</div>

<script>
    // --- CONFIGURATION ---
    // We scan both factories to ensure we find everything
    const FACTORIES = [
        "0x78ae5cCD2f13D10aE3fF47F8418A79D99B4569d0", // Old Factory
        "0xD8fFEECfDE1698a70A26a094afBE917bA58E2F70"  // New Factory (Owner of your invisible pair)
    ];
    const WBONE = "0xC76F4c819D820369Fb2d7C1531aB3Bb18e6fE8d8";

    // --- ABIS ---
    const ABIS = {
        FACTORY: ["function allPairsLength() view returns (uint)", "function allPairs(uint) view returns (address)"],
        PAIR: ["function token0() view returns (address)", "function token1() view returns (address)", "function getReserves() view returns (uint112,uint112,uint32)", "function balanceOf(address) view returns (uint)", "function totalSupply() view returns (uint)"],
        ERC20: ["function symbol() view returns (string)", "function decimals() view returns (uint8)"]
    };

    let provider, signer, userAddr;
    const logBox = document.getElementById("console");

    function log(msg) {
        logBox.style.display = "block";
        logBox.innerHTML += `> ${msg}<br>`;
        console.log(msg);
    }

    async function connect() {
        if (!window.ethereum) return alert("MetaMask needed");
        provider = new ethers.BrowserProvider(window.ethereum);
        signer = await provider.getSigner();
        userAddr = await signer.getAddress();
        document.getElementById("connectBtn").innerText = "Connected";
        document.getElementById("list").innerHTML = "";
        document.getElementById("empty").style.display = "none";
        
        loadPools();
    }

    async function loadPools() {
        log("Scanning factories...");
        
        for (let i = 0; i < FACTORIES.length; i++) {
            const factoryAddr = FACTORIES[i];
            try {
                const factory = new ethers.Contract(factoryAddr, ABIS.FACTORY, provider);
                const len = await factory.allPairsLength();
                log(`Factory ${i+1} (${factoryAddr.slice(0,6)}...): Found ${len} pairs.`);
                
                // Loop backwards (newest first)
                for (let j = Number(len) - 1; j >= 0; j--) {
                    const pairAddr = await factory.allPairs(j);
                    await loadSinglePair(pairAddr);
                    // RPC DELAY (Prevents congestion errors)
                    await new Promise(r => setTimeout(r, 200)); 
                }
            } catch (e) {
                log(`Error reading Factory ${i+1}: ${e.message}`);
            }
        }
        log("Scan complete.");
    }

    async function loadSinglePair(pairAddr) {
        try {
            const pair = new ethers.Contract(pairAddr, ABIS.PAIR, provider);
            
            // 1. Get Token Addresses
            const [t0, t1] = await Promise.all([pair.token0(), pair.token1()]);
            
            // 2. Identify BONE vs Token
            const isBone0 = t0.toLowerCase() === WBONE.toLowerCase();
            const tokenAddr = isBone0 ? t1 : t0;
            
            // 3. Get Token Details
            const token = new ethers.Contract(tokenAddr, ABIS.ERC20, provider);
            let symbol = "???", decimals = 18;
            try {
                [symbol, decimals] = await Promise.all([token.symbol(), token.decimals()]);
            } catch(e) {} // Continue even if symbol fails

            // 4. Get Reserves & Balance
            const [reserves, balance, totalSupply] = await Promise.all([
                pair.getReserves(),
                pair.balanceOf(userAddr),
                pair.totalSupply()
            ]);

            const resBone = isBone0 ? reserves[0] : reserves[1];
            const resToken = isBone0 ? reserves[1] : reserves[0];

            // 5. Render
            const html = `
                <tr>
                    <td>
                        <div class="pair-name">
                            <span style="color:gold">BONE</span> / ${symbol}
                            <span class="tag">${pairAddr.slice(0,6)}...</span>
                        </div>
                    </td>
                    <td>
                        <div class="reserves">${parseFloat(ethers.formatEther(resBone)).toFixed(2)} BONE</div>
                        <div class="reserves">${parseFloat(ethers.formatUnits(resToken, decimals)).toFixed(2)} ${symbol}</div>
                    </td>
                    <td>
                        <div class="user-share">${parseFloat(ethers.formatEther(balance)).toFixed(4)} LP</div>
                        <a href="liquidity.html?pair=${pairAddr}" class="btn">Manage</a>
                        <a href="https://shibariumscan.io/address/${pairAddr}" target="_blank" class="btn" style="background:#333; border:none">Scan</a>
                    </td>
                </tr>
            `;
            document.getElementById("list").innerHTML += html;

        } catch (e) {
            log(`Skipped pair ${pairAddr}: ${e.shortMessage || "RPC Error"}`);
        }
    }
</script>

</body>
</html>
