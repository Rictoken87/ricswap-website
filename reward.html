<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RicSwap | Rewards Store</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <style>
        :root { --obsidian: #080808; --card-bg: #121212; --magma: linear-gradient(135deg, #ff4d00 0%, #ff8c00 100%); --gold: #ffd700; }
        body { background: var(--obsidian); color: white; font-family: system-ui, sans-serif; margin: 0; padding: 0; }
        .nav { padding: 20px 40px; display: flex; align-items: center; border-bottom: 1px solid rgba(255,215,0,0.1); }
        .logo { font-size: 28px; font-weight: bold; color: var(--gold); }
        .nav-links { display: flex; gap: 30px; margin-left: 40px; }
        .nav-links a { color: white; text-decoration: none; font-weight: 500; }
        .nav-links a:hover, .nav-links a.active { color: var(--gold); }
        .connect-btn { background: #222; color: white; border: 1px solid #444; padding: 8px 18px; border-radius: 9999px; margin-left: auto; cursor: pointer; }
        
        .rewards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; padding: 40px; max-width: 1400px; margin: 0 auto; }
        .reward-card { background: var(--card-bg); border-radius: 20px; overflow: hidden; border: 1px solid #333; }
        .reward-card img { width: 100%; height: 220px; object-fit: cover; }
        .reward-info { padding: 24px; }
        .price-tag { color: var(--gold); font-size: 1.6rem; font-weight: 800; margin: 15px 0; }
        .redeem-btn { background: var(--magma); color: white; border: none; padding: 14px; width: 100%; border-radius: 12px; font-weight: bold; cursor: pointer; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 2000; align-items: center; justify-content: center; }
        .modal-content { background: #1a1a1a; padding: 30px; border-radius: 24px; max-width: 500px; width: 90%; border: 1px solid #444; }
        .modal-content input, .modal-content textarea { width: 100%; padding: 14px; margin: 10px 0; background: #222; color: white; border: 1px solid #444; border-radius: 12px; }
    </style>
</head>
<body>
    <div class="nav">
        <div class="logo">RicSwap</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="swap.html">Swap</a>
            <a href="pools.html">Pools</a>
            <a href="liquidity.html">Add Liquidity</a>
            <a href="reward.html" class="active">Rewards</a>
        </div>
        <button id="connectBtn" class="connect-btn">Connect Wallet</button>
        <button onclick="sendTestEmail()" style="background:#333;margin-left:10px;">📧 Test Email</button>
    </div>

    <div style="padding:80px 40px; text-align:center; background:radial-gradient(#1a0f00,var(--obsidian));">
        <h1>RIC Rewards Store</h1>
        <p>Verified Shibarium Redemptions</p>
    </div>

    <main class="rewards-grid" id="rewardsGrid"></main>

    <div id="redeemModal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle"></h2>
            <div id="modalPrice" style="color:var(--gold); font-size:1.4rem; margin:15px 0;"></div>
            
            <label>Your Email</label>
            <input type="email" id="customerEmail" placeholder="you@example.com">
            
            <label>Shipping Address</label>
            <textarea id="shippingAddress" rows="4" placeholder="Full Name, Street, City, Country, Phone"></textarea>
            
            <button onclick="confirmRedemption()" style="background:var(--gold); color:black; width:100%; padding:16px; border:none; border-radius:12px; font-weight:bold; margin-top:15px;">Pay with $RIC</button>
            <button onclick="closeModal()" style="background:transparent; color:#888; width:100%; border:none; margin-top:10px;">Cancel</button>
        </div>
    </div>

    <script>
        let products = JSON.parse(localStorage.getItem('ricProducts')) || [
            { id: 1, name: "RicSwap Hoodie", price: 5000, image: "https://picsum.photos/600/400?random=1", desc: "Limited Edition" }
        ];
        let userAddress = null;
        const RIC_ADDRESS = "0x12C94d3A30daa09f81Ea6c037004E6e99A4A3dfc";
        const MASTER_OWNER = "0x5E5aE526D45d69991039901a29148029a4889102";

        emailjs.init("Y5GsSScYku74Bt0LH");

        async function connectWallet() {
            if (!window.ethereum) return alert("Please install MetaMask");
            try {
                const provider = new ethers.BrowserProvider(window.ethereum);
                await provider.send("eth_requestAccounts", []);
                const signer = await provider.getSigner();
                userAddress = await signer.getAddress();
                document.getElementById("connectBtn").textContent = userAddress.slice(0,6) + "..." + userAddress.slice(-4);
            } catch (e) { console.error(e); }
        }

        function renderProducts() {
            const grid = document.getElementById('rewardsGrid');
            grid.innerHTML = products.map(p => `
                <div class="reward-card">
                    <img src="${p.image}">
                    <div class="reward-info">
                        <h3>${p.name}</h3>
                        <p>${p.desc}</p>
                        <div class="price-tag">${p.price} RIC</div>
                        <button class="redeem-btn" onclick="openModal(${p.id})">Redeem Now</button>
                    </div>
                </div>`).join('');
        }

        function openModal(id) {
            window.currentProduct = products.find(p => p.id === id);
            document.getElementById('modalTitle').textContent = window.currentProduct.name;
            document.getElementById('modalPrice').textContent = `${window.currentProduct.price} RIC`;
            document.getElementById('redeemModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('redeemModal').style.display = 'none';
        }

        async function confirmRedemption() {
            const email = document.getElementById('customerEmail').value.trim();
            const shipping = document.getElementById('shippingAddress').value.trim();

            if (!email || !shipping) return alert("Please fill email and shipping address");
            if (!userAddress) return alert("Please connect wallet first");

            try {
                const provider = new ethers.BrowserProvider(window.ethereum);
                const signer = await provider.getSigner();
                const ric = new ethers.Contract(RIC_ADDRESS, ["function transfer(address,uint256) returns (bool)"], signer);

                const tx = await ric.transfer(MASTER_OWNER, ethers.parseEther(window.currentProduct.price.toString()));
                await tx.wait();

                // Send Email
                await emailjs.send("service_577894p", "template_zga1woa", {
                    to_email: email,
                    product_name: window.currentProduct.name,
                    amount_ric: window.currentProduct.price,
                    shipping_address: shipping,
                    tx_hash: tx.hash
                });

                alert("✅ Order Successful! Receipt sent to your email.");
                closeModal();
            } catch (e) {
                console.error(e);
                alert("Error: " + (e.reason || e.message));
            }
        }

        function sendTestEmail() {
            const testEmail = prompt("Enter test email:");
            if (!testEmail) return;

            emailjs.send("service_577894p", "template_zga1woa", {
                to_email: testEmail,
                product_name: "Test Hoodie",
                amount_ric: "2500",
                shipping_address: "Test Address",
                tx_hash: "0xTest123456"
            }).then(() => alert("✅ Test email sent!")).catch(err => alert("Failed: " + err.text));
        }

        renderProducts();
        document.getElementById("connectBtn").addEventListener("click", connectWallet);
    </script>
</body>
</html>
