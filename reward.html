<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RicSwap | Rewards Store</title>
    <script src="https://jsdelivr.net"></script>
    <script type="text/javascript" src="https://jsdelivr.net"></script>
    <style>
        :root { --obsidian: #080808; --card-bg: #121212; --magma: linear-gradient(135deg, #ff4d00 0%, #ff8c00 100%); --gold: #ffd700; }
        body { background: var(--obsidian); color: white; font-family: system-ui, sans-serif; margin: 0; padding: 0; }
        .nav { padding: 15px 40px; display: flex; align-items: center; border-bottom: 1px solid rgba(255,215,0,0.1); background: rgba(8,8,8,0.95); position:sticky; top:0; z-index:100; }
        .logo { font-size: 24px; font-weight: bold; color: var(--gold); text-decoration: none; }
        .connect-btn { background: #1a1a1a; color: white; border: 1.5px solid #333; padding: 6px 16px; border-radius: 9999px; font-size: 13px; font-weight: 600; cursor: pointer; margin-left: auto; }
        .rewards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; padding: 40px; max-width: 1400px; margin: 0 auto; }
        .reward-card { background: var(--card-bg); border-radius: 20px; overflow: hidden; border: 1px solid #222; }
        .reward-card img { width: 100%; height: 220px; object-fit: cover; }
        .reward-info { padding: 24px; }
        .price-tag { color: var(--gold); font-size: 1.6rem; font-weight: 800; margin: 15px 0; }
        .redeem-btn { background: var(--magma); color: white; border: none; padding: 14px; width: 100%; border-radius: 12px; font-weight: bold; cursor: pointer; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 2000; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .modal-content { background: #151515; padding: 30px; border-radius: 24px; max-width: 500px; width: 90%; border: 1px solid #333; }
        .modal input, .modal textarea { width: 100%; padding: 14px; margin: 8px 0 20px 0; background: #0a0a0a; color: white; border: 1px solid #333; border-radius: 12px; box-sizing: border-box; }
    </style>
</head>
<body>

    <nav class="nav">
        <a href="index.html" class="logo">RicSwap</a>
        <button id="connectBtn" class="connect-btn">Connect Wallet</button>
    </nav>

    <div style="padding:80px 20px; text-align:center; background:radial-gradient(circle at center, #1a0f00 0%, var(--obsidian) 70%);">
        <h1>RIC Rewards Store</h1>
        <p>Verified Shibarium Redemptions</p>
    </div>

    <main class="rewards-grid" id="rewardsGrid"></main>

    <div id="redeemModal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle">Product</h2>
            <div id="modalPrice" style="color:var(--gold); font-weight:bold; margin-bottom:20px;"></div>
            
            <label style="font-size:12px; color:#888;">YOUR EMAIL</label>
            <input type="email" id="customerEmail" placeholder="you@example.com">

            <label style="font-size:12px; color:#888;">SHIPPING ADDRESS</label>
            <textarea id="shippingAddress" rows="4" placeholder="Full Name, Street, City, Country"></textarea>
            
            <button onclick="confirmRedemption()" id="confirmBtn" style="background:var(--gold); color:black; width:100%; padding:16px; border:none; border-radius:12px; font-weight:bold; cursor:pointer;">Pay & Order</button>
            <button onclick="closeModal()" style="background:transparent; color:#888; width:100%; border:none; margin-top:10px; cursor:pointer;">Cancel</button>
        </div>
    </div>

    <script>
        // 1. SET YOUR EMAIL HERE TO FIX THE ERROR
        const STAFF_RECEIVE_EMAIL = "your-actual-email@gmail.com"; 
        
        const RIC_ADDRESS = "0x12C94d3A30daa09f81Ea6c037004E6e99A4A3dfc";
        const MASTER_OWNER = "0x5E5aE526D45d69991039901a29148029a4889102";
        
        const EMAIL_SERVICE = "service_577894p";
        const EMAIL_TEMPLATE = "template_zga1woa";
        const EMAIL_PUBLIC_KEY = "Y5GsSScYku74Bt0LH";

        let products = JSON.parse(localStorage.getItem('ricProducts')) || [
            { id: 1, name: "RicSwap Hoodie", price: 5000, image: "https://unsplash.com", desc: "Gold embroidery." }
        ];
        let userAddress = null;
        let currentProduct = null;

        emailjs.init(EMAIL_PUBLIC_KEY);

        async function connectWallet() {
            if (!window.ethereum) return alert("Install MetaMask");
            const provider = new ethers.BrowserProvider(window.ethereum);
            const accounts = await provider.send("eth_requestAccounts", []);
            userAddress = accounts[0];
            document.getElementById("connectBtn").textContent = userAddress.slice(0,6) + "..." + userAddress.slice(-4);
        }

        function renderProducts() {
            const grid = document.getElementById('rewardsGrid');
            grid.innerHTML = products.map(p => `
                <div class="reward-card">
                    <img src="${p.image}">
                    <div class="reward-info">
                        <h3>${p.name}</h3>
                        <div class="price-tag">${p.price} RIC</div>
                        <button class="redeem-btn" onclick="openModal(${p.id})">Redeem</button>
                    </div>
                </div>`).join('');
        }

        function openModal(id) {
            currentProduct = products.find(p => p.id === id);
            document.getElementById('modalTitle').textContent = currentProduct.name;
            document.getElementById('modalPrice').textContent = `${currentProduct.price} RIC`;
            document.getElementById('redeemModal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('redeemModal').style.display = 'none'; }

        async function confirmRedemption() {
            if (!userAddress) return connectWallet();
            const email = document.getElementById('customerEmail').value;
            const address = document.getElementById('shippingAddress').value;
            const btn = document.getElementById('confirmBtn');

            if (!email || !address) return alert("Fill all fields");

            try {
                const provider = new ethers.BrowserProvider(window.ethereum);
                const signer = await provider.getSigner();
                const ric = new ethers.Contract(RIC_ADDRESS, ["function transfer(address,uint256) returns (bool)"], signer);
                
                btn.textContent = "Processing Payment...";
                btn.disabled = true;

                const tx = await ric.transfer(MASTER_OWNER, ethers.parseEther(currentProduct.price.toString()));
                await tx.wait();

                btn.textContent = "Sending Email...";

                // THIS FIXES THE "RECIPIENT ADDRESS IS EMPTY" ERROR
                const orderParams = {
                    to_email: STAFF_RECEIVE_EMAIL, // This goes to the recipient field in EmailJS
                    customer_email: email,        // The user's email
                    product_name: currentProduct.name,
                    amount_ric: currentProduct.price,
                    shipping_address: address,
                    tx_hash: tx.hash
                };

                await emailjs.send(EMAIL_SERVICE, EMAIL_TEMPLATE, orderParams);

                alert("✅ Success! Order placed.");
                closeModal();
            } catch (e) {
                alert("Error: " + (e.reason || "Check console"));
                console.error(e);
            } finally {
                btn.textContent = "Pay & Order";
                btn.disabled = false;
            }
        }

        renderProducts();
        document.getElementById("connectBtn").addEventListener("click", connectWallet);
    </script>
</body>
</html>
