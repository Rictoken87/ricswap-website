<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RicSwap | Rewards Store</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
    <style>
        :root {
            --obsidian: #080808;
            --card-bg: #121212;
            --magma: linear-gradient(135deg, #ff4d00 0%, #ff8c00 100%);
            --gold: #ffd700;
        }
        body { background: var(--obsidian); color: white; font-family: system-ui, sans-serif; margin: 0; padding: 0; }
        .nav { padding: 20px 40px; display: flex; align-items: center; border-bottom: 1px solid rgba(255,215,0,0.1); }
        .logo { font-size: 28px; font-weight: bold; color: var(--gold); }
        .nav-links { display: flex; gap: 30px; margin-left: 40px; }
        .nav-links a { color: white; text-decoration: none; font-weight: 500; }
        .nav-links a:hover, .nav-links a.active { color: var(--gold); }
        .connect-btn, .admin-btn { 
            background: #222; 
            color: white; 
            border: 1px solid #444; 
            padding: 8px 18px; 
            border-radius: 9999px; 
            margin-left: auto; 
            cursor: pointer; 
        }
        
        .rewards-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 25px; 
            padding: 40px; 
            max-width: 1400px; 
            margin: 0 auto; 
        }
        .reward-card { 
            background: var(--card-bg); 
            border-radius: 16px; 
            overflow: hidden; 
            border: 1px solid #333; 
        }
        .reward-card img { width: 100%; height: 200px; object-fit: cover; }
        .reward-info { padding: 20px; }
        .price { color: var(--gold); font-size: 1.4rem; font-weight: bold; }
        .redeem-btn { 
            background: var(--magma); 
            color: white; 
            border: none; 
            padding: 12px; 
            width: 100%; 
            border-radius: 8px; 
            margin-top: 10px; 
            cursor: pointer; 
        }
        
        .admin-panel { 
            display: none; 
            padding: 40px; 
            background: #111; 
            margin: 20px; 
            border-radius: 12px; 
        }
        input, textarea { 
            width: 100%; 
            padding: 12px; 
            margin: 8px 0; 
            background: #222; 
            color: white; 
            border: 1px solid #444; 
            border-radius: 8px; 
        }
        .staff-item { 
            padding: 12px; 
            background: #1f1f1f; 
            margin: 8px 0; 
            border-radius: 8px; 
            display: flex; 
            justify-content: space-between; 
        }
    </style>
</head>
<body>
    <div class="nav">
        <div class="logo">RicSwap</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="swap.html">Swap</a>
            <a href="pools.html">Pools</a>
            <a href="liquidity.html">Add Liquidity</a>
            <a href="reward.html" class="active">Rewards</a>
        </div>
        <button id="connectBtn" class="connect-btn">Connect Wallet</button>
        <button onclick="checkAdminAccess()" class="admin-btn" style="margin-left:10px;">Staff Admin</button>
    </div>

    <div style="padding:80px 40px; text-align:center; background:radial-gradient(#1a0f00,var(--obsidian));">
        <h1>Redeem $RIC for Real Products</h1>
        <p>Shipping cost paid by redeemer</p>
    </div>

    <div class="rewards-grid" id="rewardsGrid"></div>

    <!-- ADMIN PANEL -->
    <div id="adminPanel" class="admin-panel">
        <h2>Admin Console</h2>

        <!-- Master Owner Only -->
        <div id="masterSection" style="display:none;">
            <h3>Add Staff Wallet</h3>
            <input type="text" id="staffWalletInput" placeholder="0x... Staff Address">
            <button onclick="addStaff()" style="background:var(--gold); color:black; padding:10px 20px; border:none; border-radius:8px;">Add Staff</button>
            <div id="staffList" style="margin-top:15px;"></div>
        </div>

        <h3 style="margin-top:30px;">Add New Product</h3>
        <input type="text" id="pName" placeholder="Product Name">
        <input type="number" id="pPrice" placeholder="Price in $RIC">
        <input type="text" id="pImage" placeholder="Image URL">
        <textarea id="pDesc" placeholder="Description"></textarea>
        <button onclick="addProduct()" style="background:var(--magma); padding:12px 30px; border:none; color:white; border-radius:8px; width:100%; margin-top:10px;">Add Product</button>

        <h3 style="margin-top:30px;">Current Products</h3>
        <div id="productList"></div>
    </div>

    <script>
        let products = JSON.parse(localStorage.getItem('ricProducts')) || [];
        let staffWallets = JSON.parse(localStorage.getItem('ricStaff')) || [];
        let userAddress = null;
        const RIC_ADDRESS = "0x12C94d3A30daa09f81Ea6c037004E6e99A4A3dfc";
        const MASTER_OWNER = "0x5E5aE526D45d69991039901a29148029a4889102";

        async function connectWallet() {
            if (!window.ethereum) return alert("Please install MetaMask");
            try {
                const provider = new ethers.BrowserProvider(window.ethereum);
                await provider.send("eth_requestAccounts", []);
                const signer = await provider.getSigner();
                userAddress = await signer.getAddress();
                document.getElementById("connectBtn").textContent = userAddress.slice(0,6) + "..." + userAddress.slice(-4);
                renderProducts();
            } catch (e) { console.error(e); }
        }

        function isMaster() {
            return userAddress && userAddress.toLowerCase() === MASTER_OWNER.toLowerCase();
        }

        function isAuthorized() {
            if (!userAddress) return false;
            return isMaster() || staffWallets.some(s => s.toLowerCase() === userAddress.toLowerCase());
        }

        function checkAdminAccess() {
            if (!userAddress) return alert("Connect wallet first");
            if (isAuthorized()) {
                document.getElementById('adminPanel').style.display = 'block';
                if (isMaster()) document.getElementById('masterSection').style.display = 'block';
                renderAdminPanel();
            } else {
                alert("Access Denied");
            }
        }

        function renderAdminPanel() {
            renderStaffList();
            renderProductList();
        }

        function renderStaffList() {
            const list = document.getElementById('staffList');
            list.innerHTML = '';
            staffWallets.forEach((wallet, i) => {
                list.innerHTML += `
                    <div class="staff-item">
                        <span>${wallet}</span>
                        <button onclick="removeStaff(${i})" style="color:red;">Remove</button>
                    </div>`;
            });
        }

        function addStaff() {
            if (!isMaster()) return alert("Only Master Owner can add staff");
            const wallet = document.getElementById('staffWalletInput').value.trim();
            if (wallet && wallet.startsWith('0x')) {
                staffWallets.push(wallet);
                localStorage.setItem('ricStaff', JSON.stringify(staffWallets));
                renderStaffList();
            }
        }

        function removeStaff(i) {
            if (!isMaster()) return;
            if (confirm("Remove this staff?")) {
                staffWallets.splice(i, 1);
                localStorage.setItem('ricStaff', JSON.stringify(staffWallets));
                renderStaffList();
            }
        }

        function addProduct() {
            const name = document.getElementById('pName').value.trim();
            const price = parseInt(document.getElementById('pPrice').value);
            const image = document.getElementById('pImage').value || 'https://picsum.photos/600/400';
            const desc = document.getElementById('pDesc').value.trim();

            if (!name || !price) return alert("Name and price required");

            products.push({ id: Date.now(), name, price, image, desc });
            localStorage.setItem('ricProducts', JSON.stringify(products));
            renderProducts();
            renderProductList();
            alert("Product added!");
        }

        function renderProductList() {
            const list = document.getElementById('productList');
            list.innerHTML = '';
            products.forEach(p => {
                list.innerHTML += `
                    <div style="padding:12px; background:#1f1f1f; margin:5px 0; border-radius:8px; display:flex; justify-content:space-between;">
                        <span>${p.name} — ${p.price} RIC</span>
                        <button onclick="deleteProduct(${p.id})" style="color:red;">Delete</button>
                    </div>`;
            });
        }

        function deleteProduct(id) {
            if (confirm("Delete this product?")) {
                products = products.filter(p => p.id !== id);
                localStorage.setItem('ricProducts', JSON.stringify(products));
                renderProducts();
                renderProductList();
            }
        }

        async function redeemProduct(id) {
            if (!userAddress) return alert("Connect wallet first");
            const p = products.find(x => x.id === id);
            if (!p) return;

            try {
                const provider = new ethers.BrowserProvider(window.ethereum);
                const signer = await provider.getSigner();
                const contract = new ethers.Contract(RIC_ADDRESS, [
                    "function balanceOf(address) view returns (uint256)",
                    "function transfer(address,uint256) returns (bool)"
                ], signer);

                const bal = await contract.balanceOf(userAddress);
                if (Number(ethers.formatEther(bal)) < p.price) {
                    return alert("Not enough $RIC");
                }

                if (!confirm(`Send ${p.price} $RIC for ${p.name}?`)) return;

                const tx = await contract.transfer(MASTER_OWNER, ethers.parseEther(p.price.toString()));
                await tx.wait();
                alert(`✅ Redeemed! Tx: ${tx.hash}`);
            } catch (e) {
                alert("Failed: " + (e.reason || e.message));
            }
        }

        function renderProducts() {
            const grid = document.getElementById('rewardsGrid');
            grid.innerHTML = '';
            products.forEach(p => {
                grid.innerHTML += `
                    <div class="reward-card">
                        <img src="${p.image}" alt="${p.name}">
                        <div class="reward-info">
                            <h3>${p.name}</h3>
                            <p>${p.desc}</p>
                            <div class="price">${p.price} $RIC</div>
                            <button class="redeem-btn" onclick="redeemProduct(${p.id})">Redeem</button>
                        </div>
                    </div>`;
            });
        }

        renderProducts();
        document.getElementById("connectBtn").addEventListener("click", connectWallet);
    </script>
</body>
</html>
