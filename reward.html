<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RicSwap | Rewards Store</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    
    <style>
        :root { --obsidian: #080808; --card: #121212; --gold: #ffd700; --magma: linear-gradient(135deg, #ff4d00, #ff8c00); }
        body { background: var(--obsidian); color: white; font-family: system-ui, sans-serif; margin:0; padding:0; }
        
        .nav { padding: 15px 40px; display: flex; align-items: center; border-bottom: 1px solid rgba(255,215,0,0.1); background: rgba(8,8,8,0.95); position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 24px; font-weight: 800; color: var(--gold); text-decoration: none; }
        .nav-links { display: flex; gap: 25px; margin-left: 40px; }
        .nav-links a { color: #888; text-decoration: none; font-weight: 500; }
        .nav-links a:hover, .nav-links a.active { color: var(--gold); }
        .connect-btn, .admin-btn { background: #1a1a1a; color: white; border: 1.5px solid #333; padding: 6px 16px; border-radius: 9999px; font-size: 13px; font-weight: 600; cursor: pointer; margin-left: auto; }
        .rewards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; padding: 40px; max-width: 1400px; margin: 0 auto; }
        .reward-card { background: var(--card); border-radius: 24px; overflow: hidden; border: 1px solid #222; transition: 0.3s; }
        .reward-card:hover { transform: translateY(-5px); border-color: var(--gold); }
        .reward-card img { width: 100%; height: 220px; object-fit: cover; }
        
        #adminOverlay, #receiptModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.96); z-index: 1000; padding: 40px; overflow: auto; }
        .modal-box { max-width: 700px; margin: auto; background: var(--card); padding: 35px; border-radius: 24px; border: 1px solid #333; }
        input, textarea { width: 100%; padding: 14px; margin: 10px 0; background: #080808; border: 1px solid #333; border-radius: 12px; color: white; }
        .btn-main { background: var(--magma); color: white; border: none; padding: 16px; border-radius: 14px; font-weight: 800; cursor: pointer; width: 100%; }
        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: #000; margin-top: 8px; border-radius: 10px; border: 1px solid #222; }
    </style>
</head>
<body>
    <div class="nav">
        <div class="logo">RicSwap</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="swap.html">Swap</a>
            <a href="pools.html">Pools</a>
            <a href="liquidity.html">Add Liquidity</a>
            <a href="reward.html" class="active">Rewards</a>
            <a href="launch.html">Fair Launch</a>
        </div>
        <button id="connectBtn" class="connect-btn" onclick="connectWallet()">Connect Wallet</button>
        <button onclick="openAdminPanel()" class="admin-btn" style="margin-left:10px;">Staff Admin</button>
    </div>

    <div style="padding:80px 20px; text-align:center; background: radial-gradient(circle at center, #1a0f00 0%, var(--obsidian) 70%);">
        <h1>Global Rewards Store</h1>
        <p>Live • Real-time Inventory</p>
    </div>

    <main class="rewards-grid" id="rewardsGrid"></main>

    <!-- ADMIN PANEL -->
    <div id="adminOverlay">
        <div class="modal-box">
            <button onclick="closeAdminPanel()" style="float:right; background:transparent; color:#666;">[ CLOSE ]</button>
            <h2 style="color:var(--gold);">Staff Admin Panel</h2>
            
            <div style="margin-bottom:30px;">
                <h3>👥 Appoint New Staff (Master Only)</h3>
                <input type="text" id="staffWallet" placeholder="0x... Staff Address">
                <button onclick="addStaff()" class="btn-main">Add Staff</button>
            </div>

            <div style="margin-bottom:30px;">
                <h3>Current Staff</h3>
                <div id="staffList"></div>
            </div>

            <div style="margin-bottom:30px;">
                <h3>➕ Add New Global Product</h3>
                <input type="text" id="pName" placeholder="Product Name">
                <input type="number" id="pPrice" placeholder="Price in RIC">
                <input type="text" id="pImage" placeholder="Image URL">
                <input type="number" id="pStock" placeholder="Stock" value="50">
                <button onclick="addProduct()" class="btn-main">Add Product</button>
            </div>

            <h3>📦 Current Products</h3>
            <div id="productList"></div>
        </div>
    </div>

    <!-- RECEIPT MODAL -->
    <div id="receiptModal">
        <div class="modal-box">
            <h2 style="color:var(--gold);">Order Confirmation</h2>
            <input type="email" id="customerEmail" placeholder="Your Email Address" required>
            <textarea id="shippingAddress" rows="4" placeholder="Full Shipping Address"></textarea>
            <button onclick="sendReceipt()" class="btn-main">Pay with $RIC & Confirm</button>
            <button onclick="closeReceiptModal()" style="margin-top:10px; background:#333;">Cancel</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDoBXIlLCd0AXKU0pPtueTOnxUENqF1lmU",
            authDomain: "ricswap-bdc61.firebaseapp.com",
            databaseURL: "https://ricswap-bdc61-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "ricswap-bdc61",
            storageBucket: "ricswap-bdc61.firebasestorage.app",
            messagingSenderId: "923007784555",
            appId: "1:923007784555:web:115c1a2d2871555918832e"
        };
       
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const MASTER_OWNER = "0x5e5ae526d45d69991039901a29148029a4889102".toLowerCase();
        const RIC_ADDRESS = "0x12C94d3A30daa09f81Ea6c037004E6e99A4A3dfc";
        let userAddress = "";
        let currentProduct = null;

        emailjs.init("Y5GsSScYku74Bt0LH");

        // Real-time Sync
        db.ref('products').on('value', (snapshot) => {
            const data = snapshot.val();
            const products = data ? Object.keys(data).map(key => ({ id: key, ...data[key] })) : [];
            renderProducts(products);
            renderAdminList(products);
        });

        db.ref('staff').on('value', () => renderStaffList());

        async function connectWallet() {
            if (!window.ethereum) return alert("Please install MetaMask or Rabby");
            const provider = new ethers.BrowserProvider(window.ethereum);
            const accounts = await provider.send("eth_requestAccounts", []);
            userAddress = accounts[0].toLowerCase();
            document.getElementById("connectBtn").textContent = userAddress.slice(0,6) + "...";
        }

        function isMaster() { return userAddress === MASTER_OWNER; }
        function isStaff() { 
            return isMaster() || (window.globalStaff && window.globalStaff.some(s => s.toLowerCase() === userAddress));
        }

        function renderProducts(products) {
            const grid = document.getElementById('rewardsGrid');
            grid.innerHTML = products.map(p => `
                <div class="reward-card">
                    <img src="${p.image || 'https://picsum.photos/300/200'}" alt="${p.name}">
                    <div style="padding:24px;">
                        <h3>${p.name}</h3>
                        <p style="color:var(--gold); font-size:1.6rem; font-weight:900;">${p.price} RIC</p>
                        <p style="color:${p.stock > 0 ? '#0f0' : '#ff4444'};">Stock: ${p.stock || 0}</p>
                        ${p.stock > 0 ? `<button onclick="startRedemption('${p.id}', ${p.price}, '${p.name}')" style="width:100%; padding:12px; background:var(--magma);">Redeem Now</button>` : `<button disabled style="width:100%; padding:12px; background:#444;">Out of Stock</button>`}
                    </div>
                </div>
            `).join('');
        }

        function startRedemption(id, price, name) {
            if (!userAddress) return alert("Please connect wallet first");
            currentProduct = { id, price, name };
            document.getElementById('receiptModal').style.display = 'block';
        }

        async function sendReceipt() {
            const email = document.getElementById('customerEmail').value.trim();
            const address = document.getElementById('shippingAddress').value.trim();

            if (!email || !address) return alert("Email and Shipping Address required");

            try {
                const provider = new ethers.BrowserProvider(window.ethereum);
                const signer = await provider.getSigner();
                const ric = new ethers.Contract(RIC_ADDRESS, ["function transfer(address,uint256) returns (bool)"], signer);
                
                const amountWei = ethers.parseUnits(currentProduct.price.toString(), 18);
                const tx = await ric.transfer(MASTER_OWNER, amountWei);
                await tx.wait();

                db.ref('products/' + currentProduct.id).update({ stock: firebase.database.ServerValue.increment(-1) });

                await emailjs.send("service_577894p", "template_zga1woa", {
                    to_email: email,
                    product_name: currentProduct.name,
                    amount_ric: currentProduct.price,
                    shipping_address: address,
                    tx_hash: tx.hash,
                    user_wallet: userAddress
                });

                alert("✅ Payment Successful! Receipt sent.");
                closeReceiptModal();
            } catch (e) {
                alert("Transaction failed: " + (e.reason || e.message));
            }
        }

        function closeReceiptModal() {
            document.getElementById('receiptModal').style.display = 'none';
        }

        function addProduct() {
            const name = document.getElementById('pName').value.trim();
            const price = parseInt(document.getElementById('pPrice').value);
            const image = document.getElementById('pImage').value.trim() || 'https://picsum.photos/300/200';
            const stock = parseInt(document.getElementById('pStock').value) || 50;
            
            if (!name || isNaN(price)) return alert("Name and Price are required.");
            
            db.ref('products').push({ name, price, image, stock });
            
            document.getElementById('pName').value = '';
            document.getElementById('pPrice').value = '';
            document.getElementById('pImage').value = '';
        }

        function deleteProduct(id) {
            if(confirm("Delete this product?")) {
                db.ref('products/' + id).remove();
            }
        }

        function renderAdminList(products) {
            const list = document.getElementById('productList');
            list.innerHTML = products.map(p => `
                <div class="list-item">
                    <span>${p.name} — ${p.price} RIC (Stock: ${p.stock || 0})</span>
                    <button onclick="deleteProduct('${p.id}')" style="color:#ff4d4d;">DELETE</button>
                </div>
            `).join('');
        }

        function renderStaffList() {
            const list = document.getElementById('staffList');
            list.innerHTML = window.globalStaff ? window.globalStaff.map(addr => `
                <div class="list-item">
                    <span>${addr}</span>
                    ${isMaster() ? `<button onclick="removeStaff('${addr}')" style="color:red;">Remove</button>` : ''}
                </div>
            `).join('') : "<p>No staff yet.</p>";
        }

        function openAdminPanel() {
            if (!userAddress) return alert("Please connect wallet first");
            if (!isStaff()) return alert("Access Denied.\nOnly Master or authorized Staff can access.");
            document.getElementById('adminOverlay').style.display = 'block';
            renderStaffList();
            renderAdminList([]);
        }

        function closeAdminPanel() { 
            document.getElementById('adminOverlay').style.display = 'none'; 
        }

        function addStaff() {
            if (!isMaster()) return alert("Only Master can appoint staff");
            const addr = document.getElementById('staffWallet').value.trim();
            if (!addr || !addr.startsWith('0x')) return alert("Invalid address");
            db.ref('staff').push(addr.toLowerCase());
            alert("✅ Staff added successfully!");
            document.getElementById('staffWallet').value = '';
        }

        function removeStaff(addr) {
            if (!isMaster()) return;
            if (confirm("Remove this staff?")) {
                db.ref('staff').once('value', snapshot => {
                    snapshot.forEach(child => {
                        if (child.val() === addr) child.ref.remove();
                    });
                });
            }
        }
    </script>
</body>
</html>
