<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RicSwap | Rewards Store</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <style>
        :root { --obsidian: #080808; --card-bg: #121212; --magma: linear-gradient(135deg, #ff4d00 0%, #ff8c00 100%); --gold: #ffd700; }
        body { background: var(--obsidian); color: white; font-family: system-ui, sans-serif; margin: 0; padding: 0; }
        .nav { padding: 20px 40px; display: flex; align-items: center; border-bottom: 1px solid rgba(255,215,0,0.1); }
        .logo { font-size: 28px; font-weight: bold; color: var(--gold); }
        .connect-btn, .test-btn { background: #222; color: white; border: 1px solid #444; padding: 8px 18px; border-radius: 9999px; margin-left: 10px; cursor: pointer; }
        .test-btn { background: #333; border-color: var(--gold); }
        .rewards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; padding: 40px; max-width: 1400px; margin: 0 auto; }
        .reward-card { background: var(--card-bg); border-radius: 20px; overflow: hidden; border: 1px solid #333; }
        .reward-card img { width: 100%; height: 220px; object-fit: cover; }
        .reward-info { padding: 24px; }
        .price-tag { color: var(--gold); font-size: 1.6rem; font-weight: bold; }
        .redeem-btn { background: var(--magma); color: white; border: none; padding: 14px; width: 100%; border-radius: 12px; cursor: pointer; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 2000; align-items: center; justify-content: center; }
        .modal-content { background: #1a1a1a; padding: 30px; border-radius: 24px; max-width: 500px; width: 90%; }
        .modal-content input, .modal-content textarea { width: 100%; padding: 14px; margin: 10px 0; background: #222; color: white; border: 1px solid #444; border-radius: 12px; }
    </style>
</head>
<body>
    <div class="nav">
        <div class="logo">RicSwap</div>
        <button id="connectBtn" class="connect-btn">Connect Wallet</button>
        <button onclick="sendTestEmail()" class="test-btn">📧 Test Email</button>
    </div>

    <div style="padding:80px 40px; text-align:center;">
        <h1>RIC Rewards Store</h1>
        <p>Click Test Email to debug</p>
    </div>

    <div class="rewards-grid" id="rewardsGrid"></div>

    <div id="redeemModal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle"></h2>
            <div id="modalPrice" style="color:var(--gold); font-size:1.4rem;"></div>
            <input type="email" id="customerEmail" placeholder="your@email.com">
            <textarea id="shippingAddress" rows="4" placeholder="Shipping Address"></textarea>
            <button onclick="confirmRedemption()" style="background:var(--gold); color:black; width:100%; padding:16px; border:none; border-radius:12px; margin-top:15px;">Pay with RIC</button>
            <button onclick="closeModal()" style="background:#333; color:white; width:100%; padding:12px; border:none; margin-top:10px;">Cancel</button>
        </div>
    </div>

    <script>
        emailjs.init("Y5GsSScYku74Bt0LH");

        function sendTestEmail() {
            const testEmail = prompt("Enter your email for testing:");
            if (!testEmail) return;

            console.log("=== EMAILJS TEST START ===");
            console.log("Service:", "service_577894p");
            console.log("Template:", "template_zga1woa");
            console.log("to_email value:", testEmail);

            const params = {
                to_email: testEmail,
                product_name: "Test Hoodie",
                amount_ric: "2500",
                shipping_address: "Test Address",
                tx_hash: "0xTest123"
            };

            console.log("Params being sent:", params);

            emailjs.send("service_577894p", "template_zga1woa", params)
                .then(response => {
                    console.log("✅ SUCCESS!", response);
                    alert("Test email sent! Check inbox & spam.");
                })
                .catch(error => {
                    console.error("❌ FAILED!", error);
                    alert("Failed. Check console (F12) for details.");
                });
        }

        // Initialize
        document.getElementById("connectBtn").addEventListener("click", () => alert("Wallet connect not needed for test"));
    </script>
</body>
</html>
