<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RicSwap | Rewards Store</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
    <style>
        :root { --obsidian: #080808; --card: #121212; --gold: #ffd700; --magma: linear-gradient(135deg, #ff4d00, #ff8c00); }
        body { background: var(--obsidian); color: white; font-family: system-ui, sans-serif; margin:0; padding:0; }
        
        .nav { 
            padding: 15px 40px; 
            display: flex; 
            align-items: center; 
            border-bottom: 1px solid rgba(255,215,0,0.1); 
            background: rgba(8,8,8,0.95); 
            position: sticky; 
            top: 0; 
            z-index: 100; 
        }
        .logo { font-size: 24px; font-weight: 800; color: var(--gold); text-decoration: none; }
        .nav-links { display: flex; gap: 25px; margin-left: 40px; }
        .nav-links a { color: #888; text-decoration: none; font-weight: 500; }
        .nav-links a:hover, .nav-links a.active { color: var(--gold); }
        .connect-btn, .admin-btn { 
            background: #1a1a1a; color: white; border: 1.5px solid #333; 
            padding: 6px 16px; border-radius: 9999px; font-size: 13px; 
            font-weight: 600; cursor: pointer; margin-left: auto; 
        }
        .rewards-grid { 
            display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
            gap: 25px; padding: 40px; max-width: 1400px; margin: 0 auto; 
        }
        .reward-card { background: var(--card); border-radius: 20px; overflow: hidden; border: 1px solid #222; }
        .reward-card img { width: 100%; height: 200px; object-fit: cover; }
    </style>
</head>
<body>
    <!-- STANDARD NAVIGATION -->
    <div class="nav">
        <div class="logo">RicSwap</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="swap.html">Swap</a>
            <a href="pools.html">Pools</a>
            <a href="liquidity.html">Add Liquidity</a>
            <a href="reward.html" class="active">Rewards</a>
            <a href="launch.html">Fair Launch</a>
        </div>
        <button id="connectBtn" class="connect-btn" onclick="connectWallet()">Connect Wallet</button>
        <button onclick="openAdminPanel()" class="admin-btn" style="margin-left:10px;">Staff Admin</button>
    </div>

    <div style="padding:60px 20px; text-align:center;">
        <h1>Rewards Store</h1>
        <p>Redeem $RIC for real products</p>
    </div>

    <div class="rewards-grid" id="rewardsGrid"></div>

    <!-- ADMIN OVERLAY -->
    <div id="adminOverlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:1000; padding:40px; overflow:auto;">
        <h2 style="color:var(--gold);">Staff Admin Panel</h2>
        <button onclick="closeAdminPanel()" style="float:right; background:red; color:white; border:none; padding:8px 16px; border-radius:8px;">Close</button>

        <h3>Appoint New Staff (Master Only)</h3>
        <input type="text" id="staffWallet" placeholder="0x... Staff Address" style="width:70%; padding:10px;">
        <button onclick="addStaff()">Add Staff</button>

        <h3>Current Staff</h3>
        <div id="staffList"></div>

        <h3>Add New Product</h3>
        <input type="text" id="pName" placeholder="Product Name">
        <input type="number" id="pPrice" placeholder="Price in RIC">
        <input type="text" id="pImage" placeholder="Image URL">
        <input type="number" id="pStock" placeholder="Stock" value="50">
        <button onclick="addProduct()">Add Product</button>

        <h3>Current Products</h3>
        <div id="productList"></div>
    </div>

    <script>
        const MASTER_OWNER = "0x5e5ae526d45d69991039901a29148029a4889102".toLowerCase();
        let userAddress = "";
        let products = [];
        let staffWallets = [];

        async function connectWallet() {
            if (!window.ethereum) return alert("Please install MetaMask or Rabby");
            const provider = new ethers.BrowserProvider(window.ethereum);
            const signer = await provider.getSigner();
            userAddress = (await signer.getAddress()).toLowerCase();
            document.getElementById("connectBtn").textContent = userAddress.slice(0,6) + "..." + userAddress.slice(-4);
            loadData();
        }

        function isMaster() { return userAddress === MASTER_OWNER; }
        function isStaff() { return isMaster() || staffWallets.some(s => s.toLowerCase() === userAddress); }

        function loadData() {
            products = JSON.parse(localStorage.getItem('ricGlobalProducts') || '[]');
            staffWallets = JSON.parse(localStorage.getItem('ricStaff') || '[]');
            renderProducts();
        }

        function renderProducts() {
            const grid = document.getElementById('rewardsGrid');
            if (products.length === 0) {
                grid.innerHTML = `<p style="text-align:center; color:#666; padding:80px;">No products available yet.</p>`;
                return;
            }
            grid.innerHTML = products.map(p => `
                <div class="reward-card">
                    <img src="${p.image}" alt="${p.name}">
                    <div style="padding:15px;">
                        <h3>${p.name}</h3>
                        <p><strong>${p.price} $RIC</strong> • Stock: ${p.stock}</p>
                        <button onclick="redeemProduct(${p.id})" style="width:100%; padding:12px; background:var(--magma); border:none; border-radius:10px; color:white;">Redeem Now</button>
                    </div>
                </div>
            `).join('');
        }

        function openAdminPanel() {
            if (!userAddress) return alert("Please connect wallet first");
            if (!isStaff()) return alert("Access Denied. Only Master or Staff allowed.");
            document.getElementById('adminOverlay').style.display = 'block';
            renderAdmin();
        }

        function closeAdminPanel() {
            document.getElementById('adminOverlay').style.display = 'none';
        }

        function renderAdmin() {
            // Staff List
            let sHtml = staffWallets.map((addr, i) => `
                <div style="padding:10px; background:#1a1a1a; margin:5px 0; border-radius:8px; display:flex; justify-content:space-between;">
                    ${addr}
                    ${isMaster() ? `<button onclick="removeStaff(${i})" style="color:red;">Remove</button>` : ''}
                </div>
            `).join('');
            document.getElementById('staffList').innerHTML = sHtml || "<p>No staff appointed yet.</p>";

            // Product List
            let pHtml = products.map((p, i) => `
                <div style="padding:10px; background:#1a1a1a; margin:5px 0; border-radius:8px; display:flex; justify-content:space-between;">
                    ${p.name} (${p.price} RIC) - Stock: ${p.stock}
                    <button onclick="deleteProduct(${i})" style="color:red;">Delete</button>
                </div>
            `).join('');
            document.getElementById('productList').innerHTML = pHtml || "<p>No products yet.</p>";
        }

        function addStaff() {
            if (!isMaster()) return alert("Only Master can appoint staff");
            const addr = document.getElementById('staffWallet').value.trim();
            if (addr && addr.startsWith('0x')) {
                staffWallets.push(addr);
                localStorage.setItem('ricStaff', JSON.stringify(staffWallets));
                renderAdmin();
                document.getElementById('staffWallet').value = '';
            }
        }

        function removeStaff(i) {
            if (!isMaster()) return;
            staffWallets.splice(i, 1);
            localStorage.setItem('ricStaff', JSON.stringify(staffWallets));
            renderAdmin();
        }

        function addProduct() {
            const name = document.getElementById('pName').value.trim();
            const price = parseInt(document.getElementById('pPrice').value);
            const image = document.getElementById('pImage').value || 'https://picsum.photos/300/200';
            const stock = parseInt(document.getElementById('pStock').value) || 50;

            if (!name || !price) return alert("Name and price are required");

            products.push({ id: Date.now(), name, price, image, stock });
            localStorage.setItem('ricGlobalProducts', JSON.stringify(products));

            renderProducts();
            renderAdmin();
            alert("✅ Product added to store!");
        }

        function deleteProduct(i) {
            if (confirm("Delete this product?")) {
                products.splice(i, 1);
                localStorage.setItem('ricGlobalProducts', JSON.stringify(products));
                renderProducts();
                renderAdmin();
            }
        }

        function redeemProduct(id) {
            alert("Redemption feature (on-chain payment) coming soon.");
        }

        // Initialize
        window.onload = loadData;
    </script>
</body>
</html>
