<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RicSwap | Rewards Store</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
    <style>
        :root { --obsidian: #080808; --card: #121212; --gold: #ffd700; --magma: linear-gradient(135deg, #ff4d00, #ff8c00); }
        body { background: var(--obsidian); color: white; font-family: system-ui, sans-serif; margin:0; padding:0; }
        .nav { padding: 15px 40px; display: flex; align-items: center; border-bottom: 1px solid rgba(255,215,0,0.1); background: rgba(8,8,8,0.95); position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 24px; font-weight: 800; color: var(--gold); text-decoration: none; }
        .nav-links { display: flex; gap: 25px; margin-left: 40px; }
        .nav-links a { color: #888; text-decoration: none; font-weight: 500; }
        .nav-links a:hover, .nav-links a.active { color: var(--gold); }
        .connect-btn, .admin-btn { background: #1a1a1a; color: white; border: 1.5px solid #333; padding: 6px 16px; border-radius: 9999px; font-size: 13px; font-weight: 600; cursor: pointer; margin-left: auto; }
        .rewards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; padding: 40px; max-width: 1400px; margin: 0 auto; }
        .reward-card { background: var(--card); border-radius: 20px; overflow: hidden; border: 1px solid #222; }

        /* Beautiful Admin Panel */
        #adminOverlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 1000; padding: 40px; overflow: auto;
        }
        .admin-panel {
            background: var(--card); border-radius: 24px; padding: 40px; max-width: 900px; margin: 0 auto;
            border: 1px solid #333; box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }
        .admin-section { margin-bottom: 40px; }
        .admin-section h3 { color: var(--gold); margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        input { width: 100%; padding: 14px; margin: 8px 0; background: #0a0a0a; border: 1px solid #444; border-radius: 12px; color: white; }
        button { padding: 12px 20px; border: none; border-radius: 12px; cursor: pointer; font-weight: 600; }
        .btn-gold { background: var(--gold); color: black; }
        .btn-red { background: #ff3333; color: white; }
        .list-item { 
            padding: 12px; background: #1a1a1a; margin: 8px 0; border-radius: 12px; 
            display: flex; justify-content: space-between; align-items: center; 
        }
    </style>
</head>
<body>
    <div class="nav">
        <div class="logo">RicSwap</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="swap.html">Swap</a>
            <a href="pools.html">Pools</a>
            <a href="liquidity.html">Add Liquidity</a>
            <a href="reward.html" class="active">Rewards</a>
            <a href="launch.html">Fair Launch</a>
        </div>
        <button id="connectBtn" class="connect-btn" onclick="connectWallet()">Connect Wallet</button>
        <button onclick="openAdminPanel()" class="admin-btn" style="margin-left:10px;">Staff Admin</button>
    </div>

    <div style="padding:60px 20px; text-align:center;">
        <h1>Rewards Store</h1>
        <p>Redeem $RIC for real products</p>
    </div>

    <div class="rewards-grid" id="rewardsGrid"></div>

    <!-- BEAUTIFUL ADMIN PANEL -->
    <div id="adminOverlay">
        <div class="admin-panel">
            <h2 style="color:var(--gold); text-align:center;">Staff Admin Panel</h2>
            <button onclick="closeAdminPanel()" style="float:right; background:#ff3333; color:white; padding:8px 16px; border-radius:12px;">Close</button>

            <div class="admin-section">
                <h3>👥 Appoint New Staff (Master Only)</h3>
                <input type="text" id="staffWallet" placeholder="0x... Staff Address">
                <button onclick="addStaff()" class="btn-gold">Add Staff</button>
            </div>

            <div class="admin-section">
                <h3>Current Staff</h3>
                <div id="staffList"></div>
            </div>

            <div class="admin-section">
                <h3>➕ Add New Product</h3>
                <input type="text" id="pName" placeholder="Product Name">
                <input type="number" id="pPrice" placeholder="Price in RIC">
                <input type="text" id="pImage" placeholder="Image URL">
                <input type="number" id="pStock" placeholder="Stock" value="50">
                <button onclick="addProduct()" class="btn-gold">Add Product</button>
            </div>

            <div class="admin-section">
                <h3>📦 Current Products</h3>
                <div id="productList"></div>
            </div>
        </div>
    </div>

    <script>
        const MASTER_OWNER = "0x5e5ae526d45d69991039901a29148029a4889102".toLowerCase();
        let userAddress = "";
        let products = [];
        let staffWallets = [];

        async function connectWallet() {
            if (!window.ethereum) return alert("Please install MetaMask or Rabby");
            const provider = new ethers.BrowserProvider(window.ethereum);
            const signer = await provider.getSigner();
            userAddress = (await signer.getAddress()).toLowerCase();
            document.getElementById("connectBtn").textContent = userAddress.slice(0,6) + "..." + userAddress.slice(-4);
            loadData();
        }

        function isMaster() { return userAddress === MASTER_OWNER; }
        function isStaff() { return isMaster() || staffWallets.some(s => s.toLowerCase() === userAddress); }

        function loadData() {
            products = JSON.parse(localStorage.getItem('ricGlobalProducts') || '[]');
            staffWallets = JSON.parse(localStorage.getItem('ricStaff') || '[]');
            renderProducts();
        }

        function renderProducts() {
            const grid = document.getElementById('rewardsGrid');
            if (products.length === 0) {
                grid.innerHTML = `<p style="text-align:center; color:#666; padding:80px;">No products available yet.</p>`;
                return;
            }
            grid.innerHTML = products.map(p => `
                <div class="reward-card">
                    <img src="${p.image}" alt="${p.name}">
                    <div style="padding:15px;">
                        <h3>${p.name}</h3>
                        <p><strong>${p.price} $RIC</strong> • Stock: ${p.stock}</p>
                        <button onclick="redeemProduct(${p.id})" style="width:100%; padding:12px; background:var(--magma);">Redeem Now</button>
                    </div>
                </div>
            `).join('');
        }

        function openAdminPanel() {
            if (!userAddress) return alert("Please connect wallet first");
            if (!isStaff()) return alert("Access Denied.\n\nOnly Master or authorized Staff can access.");
            document.getElementById('adminOverlay').style.display = 'block';
            renderAdmin();
        }

        function closeAdminPanel() {
            document.getElementById('adminOverlay').style.display = 'none';
        }

        function renderAdmin() {
            // Staff List
            let sHtml = staffWallets.map((addr, i) => `
                <div class="list-item">
                    ${addr}
                    ${isMaster() ? `<button onclick="removeStaff(${i})" class="btn-red">Remove</button>` : ''}
                </div>
            `).join('');
            document.getElementById('staffList').innerHTML = sHtml || "<p>No staff appointed yet.</p>";

            // Product List
            let pHtml = products.map((p, i) => `
                <div class="list-item">
                    <span>${p.name} — ${p.price} RIC (Stock: ${p.stock})</span>
                    <button onclick="deleteProduct(${i})" class="btn-red">Delete</button>
                </div>
            `).join('');
            document.getElementById('productList').innerHTML = pHtml || "<p>No products yet.</p>";
        }

        function addStaff() {
            if (!isMaster()) return alert("Only Master can appoint staff");
            const addr = document.getElementById('staffWallet').value.trim();
            if (!addr || !addr.startsWith('0x')) return alert("Invalid address");
            const lowerAddr = addr.toLowerCase();
            if (!staffWallets.includes(lowerAddr)) {
                staffWallets.push(lowerAddr);
                localStorage.setItem('ricStaff', JSON.stringify(staffWallets));
                alert("✅ Staff added successfully!");
                renderAdmin();
            }
            document.getElementById('staffWallet').value = '';
        }

        function removeStaff(i) {
            if (!isMaster()) return;
            staffWallets.splice(i, 1);
            localStorage.setItem('ricStaff', JSON.stringify(staffWallets));
            renderAdmin();
        }

        function addProduct() {
            const name = document.getElementById('pName').value.trim();
            const price = parseInt(document.getElementById('pPrice').value);
            const image = document.getElementById('pImage').value || 'https://picsum.photos/300/200';
            const stock = parseInt(document.getElementById('pStock').value) || 50;

            if (!name || isNaN(price)) return alert("Name and Price are required");

            products.push({ id: Date.now(), name, price, image, stock });
            localStorage.setItem('ricGlobalProducts', JSON.stringify(products));

            alert("✅ Product added successfully!");
            renderProducts();
            renderAdmin();

            document.getElementById('pName').value = '';
            document.getElementById('pPrice').value = '';
            document.getElementById('pImage').value = '';
        }

        function deleteProduct(i) {
            if (confirm("Delete this product?")) {
                products.splice(i, 1);
                localStorage.setItem('ricGlobalProducts', JSON.stringify(products));
                renderProducts();
                renderAdmin();
            }
        }

        function redeemProduct(id) {
            alert("Redemption feature coming soon.");
        }

        window.onload = loadData;
    </script>
</body>
</html>
